<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCOSTA — Recibos e Inquilinos</title>
<style>
:root{--az:#0a1628;--ou:#C9A84C;--bg:#eef1f5;--c:#fff;--t:#1b2430;--m:#6b7785;--b:#d9dfe7;--g:#198754;--r:#c0392b}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--az);color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--ou)}header b{font-size:16px;color:var(--ou);margin-right:auto}
a.bt,button{border:0;border-radius:7px;padding:8px 12px;background:var(--az);color:#fff;font:600 13px system-ui;cursor:pointer;text-decoration:none;display:inline-block}
header a.bt,header button{background:transparent;border:1.5px solid var(--ou);color:var(--ou)}button.g{background:var(--g)}button.r{background:var(--r)}button.o{background:var(--ou);color:var(--az)}
.w{display:grid;grid-template-columns:270px 1fr;gap:12px;max-width:1100px;margin:auto;padding:12px}@media(max-width:760px){.w{grid-template-columns:1fr}}
.cd{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}h3{margin:0 0 8px;font-size:15px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--b);border-radius:7px;font:inherit;background:#fff;color:var(--t)}label{font-size:11px;color:var(--m);display:block;margin:6px 0 2px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}.it{padding:9px;border:1px solid var(--b);border-radius:8px;margin-bottom:6px;cursor:pointer}.it.on{border-color:var(--ou);background:#fff8e6}.it small{color:var(--m);display:block}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--b);text-align:left}.tg{font-size:10px;background:#eee;border-radius:10px;padding:1px 7px;color:var(--m)}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#pv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);overflow:auto;z-index:9;padding:14px}#pv .bar{max-width:760px;margin:0 auto 10px;display:flex;gap:6px;flex-wrap:wrap}
.rb{max-width:760px;margin:auto;background:#fff;color:#000;border:3px double #000;padding:18px 22px;font:11pt/1.55 Arial,sans-serif}.rh{display:flex;gap:10px;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}.rh img{width:68px;height:68px;border-radius:50%;object-fit:cover}.rh .n{margin-left:auto;text-align:right;font-weight:700}
.vd{float:right;border:2.5px solid #000;padding:4px 14px;font-weight:700;font-size:15pt;background:#f5f5f5;margin-left:10px}.rb table td{border-bottom:1px dotted #bbb}.tot{background:var(--az);color:var(--ou);padding:6px 10px;font-weight:700;display:flex;justify-content:space-between;margin-top:6px}
.as{text-align:center;margin-top:34px}.as img{height:66px;display:block;margin:0 auto -14px}.cx{border:1.5px dashed #000;background:#faf6e8;padding:8px 12px;margin-top:10px;font-size:10pt;line-height:1.45}.as div{border-top:1.5px solid #000;width:60%;margin:auto;padding-top:4px;font-size:10pt}
@media print{body>*:not(#pv){display:none!important}#pv{position:static;background:#fff;padding:0}#pv .bar{display:none}.rb{max-width:none}}
</style></head><body>
