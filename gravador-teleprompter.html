<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravador com Teleprompter</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171c;--mut:#5d6672;--ac:#2563eb;--rec:#dc2626;--bd:#d9dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#eef1f5;--mut:#9aa4b2;--ac:#4f8cff;--bd:#2a313c}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#eef1f5;--mut:#9aa4b2;--ac:#4f8cff;--bd:#2a313c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px;display:grid;gap:12px}
h1{font-size:1.15rem;margin:4px 0}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:9/12;max-height:72vh;width:100%;margin:0 auto}
@media (min-width:700px){.stage{aspect-ratio:16/10}}
video#cam{width:100%;height:100%;object-fit:cover;display:block}
video#cam.mir{transform:scaleX(-1)}
#prompter{position:absolute;left:0;right:0;top:0;height:62%;overflow:hidden;background:rgba(0,0,0,var(--op,.55));color:#fff;pointer-events:none}
#prompter .in{padding:38% 7% 100% 7%;font-weight:600;line-height:1.35;white-space:pre-wrap;text-align:center;text-shadow:0 1px 3px #000}
#prompter.flip .in{transform:scaleX(-1)}
.line{position:absolute;left:0;right:0;top:38%;height:0;border-top:2px dashed rgba(255,255,255,.35);pointer-events:none}
.badge{position:absolute;top:8px;right:10px;background:var(--rec);color:#fff;font-weight:700;padding:3px 10px;border-radius:99px;font-size:.85rem;display:none;z-index:3}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:7rem;font-weight:800;color:#fff;background:rgba(0,0,0,.5);z-index:4}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#cbd2da;padding:20px;z-index:2}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:11px 16px;border-radius:10px;cursor:pointer;flex:1;min-width:110px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.r{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
label{display:flex;align-items:center;gap:10px;margin:8px 0;color:var(--mut);font-size:.92rem}
label input[type=range]{flex:1}
label span.v{min-width:42px;text-align:right;color:var(--tx)}
textarea{width:100%;min-height:150px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);padding:10px;font:inherit;resize:vertical}
.chk{display:inline-flex;margin-right:14px}
#out{display:none}
#out video{width:100%;border-radius:12px;background:#000;max-height:60vh}
.hint{color:var(--mut);font-size:.85rem}
</style>
</head>
<body>
<main>
<a href="index.html" style="color:var(--ac);text-decoration:none;font-size:.92rem">← Voltar ao painel</a>
<h1>🎬 Gravador com Teleprompter</h1>

<div class="stage" id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <div id="prompter"><div class="in" id="txt"></div></div>
  <div class="line" id="line"></div>
  <div class="badge" id="badge">● REC 00:00</div>
  <div id="count"></div>
  <div id="msg">Toque em “Ligar câmera” para começar.</div>
</div>

<div class="card row">
  <button id="bCam" class="p">Ligar câmera</button>
  <button id="bRec" class="r" disabled>Gravar</button>
  <button id="bScroll" disabled>Testar rolagem</button>
  <button id="bSwap" disabled>Trocar câmera</button>
</div>

<div class="card" id="out">
  <video id="play" controls playsinline></video>
  <div class="row" style="margin-top:8px">
    <button id="bSave" class="p">Baixar vídeo</button>
    <button id="bShare">Compartilhar</button>
  </div>
  <p class="hint" id="saveHint"></p>
</div>

<div class="card">
  <label>Velocidade <input type="range" id="spd" min="10" max="200" value="55"><span class="v" id="spdV"></span></label>
  <label>Tamanho do texto <input type="range" id="siz" min="18" max="64" value="32"><span class="v" id="sizV"></span></label>
  <label>Fundo do texto <input type="range" id="opa" min="0" max="90" value="55"><span class="v" id="opaV"></span></label>
  <div>
    <label class="chk"><input type="checkbox" id="mirV" checked> Espelhar prévia</label>
    <label class="chk"><input type="checkbox" id="mirT"> Espelhar texto</label>
    <label class="chk"><input type="checkbox" id="cnt" checked> Contagem 3s</label>
  </div>
  <p class="hint">O texto do teleprompter aparece só na tela: o vídeo gravado sai limpo. A prévia espelhada não afeta o arquivo.</p>
</div>

<div class="card">
  <strong>Roteiro</strong>
  <textarea id="script" placeholder="Cole ou escreva seu texto aqui…"></textarea>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const cam=$('cam'),pr=$('prompter'),txt=$('txt'),script=$('script');
let stream=null,rec=null,chunks=[],facing='user',scrolling=false,raf=0,last=0,acc=0,blob=null,t0=0,timer=0;

// roteiro salvo (opcional)
const DEF="Olá! Este é o seu roteiro. Cole aqui o texto que você quer ler enquanto grava.\n\nO texto rola devagar na parte de cima da tela, perto da câmera, para você manter o contato visual.\n\nAjuste a velocidade e o tamanho abaixo e toque em Gravar.";
try{script.value=localStorage.getItem('tp_script')||DEF}catch(e){script.value=DEF}
function sync(){txt.textContent=script.value;try{localStorage.setItem('tp_script',script.value)}catch(e){}}
script.addEventListener('input',sync);sync();

function ui(){
  txt.style.fontSize=$('siz').value+'px';$('sizV').textContent=$('siz').value+'px';
  $('spdV').textContent=$('spd').value;
  pr.style.setProperty('--op',$('opa').value/100);$('opaV').textContent=$('opa').value+'%';
  cam.classList.toggle('mir',$('mirV').checked&&facing==='user');
  pr.classList.toggle('flip',$('mirT').checked);
}
['spd','siz','opa','mirV','mirT'].forEach(i=>$(i).addEventListener('input',ui));ui();

async function startCam(){
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true}});
    cam.srcObject=stream;$('msg').style.display='none';
    $('bRec').disabled=false;$('bScroll').disabled=false;$('bSwap').disabled=false;$('bCam').textContent='Câmera ligada ✓';
    ui();
  }catch(e){
    $('msg').style.display='flex';
    $('msg').textContent='Não foi possível acessar a câmera/microfone ('+(e.name||'erro')+'). Permita o acesso no navegador e tente de novo. Se a página estiver incorporada e bloqueada, abra-a em tela cheia ou em nova aba.';
  }
}
$('bCam').onclick=startCam;
$('bSwap').onclick=()=>{facing=facing==='user'?'environment':'user';startCam()};

// rolagem
function tick(ts){
  if(!scrolling)return;
  const dt=(ts-last)/1000;last=ts;
  acc+=dt*$('spd').value;
  const px=Math.floor(acc);if(px){pr.scrollTop+=px;acc-=px}
  if(pr.scrollTop+pr.clientHeight>=pr.scrollHeight-2){scrolling=false;$('bScroll').textContent='Testar rolagem';return}
  raf=requestAnimationFrame(tick);
}
function startScroll(reset){
  if(reset)pr.scrollTop=0;
  scrolling=true;acc=0;last=performance.now();raf=requestAnimationFrame(tick);$('bScroll').textContent='Pausar rolagem';
}
function stopScroll(){scrolling=false;cancelAnimationFrame(raf);$('bScroll').textContent='Testar rolagem'}
$('bScroll').onclick=()=>scrolling?stopScroll():startScroll(pr.scrollTop===0?false:false);

// gravação
function pickMime(){
  const l=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return l.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
async function begin(){
  chunks=[];blob=null;$('out').style.display='none';
  const mt=pickMime();
  try{rec=new MediaRecorder(stream,mt?{mimeType:mt}:{})}catch(e){alert('Seu navegador não consegue gravar vídeo aqui.');return}
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{
    blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
    $('play').src=URL.createObjectURL(blob);$('out').style.display='block';
    $('out').scrollIntoView({behavior:'smooth'});
  };
  rec.start(1000);t0=Date.now();
  $('badge').style.display='block';$('badge').textContent='● REC 00:00';
  timer=setInterval(()=>$('badge').textContent='● REC '+fmt(Math.floor((Date.now()-t0)/1000)),500);
  $('bRec').textContent='Parar gravação';$('bRec').classList.remove('r');$('bRec').classList.add('p');
  pr.scrollTop=0;startScroll(false);
}
function end(){
  if(rec&&rec.state!=='inactive')rec.stop();
  clearInterval(timer);$('badge').style.display='none';stopScroll();
  $('bRec').textContent='Gravar';$('bRec').classList.add('r');$('bRec').classList.remove('p');
}
$('bRec').onclick=async()=>{
  if(rec&&rec.state==='recording'){end();return}
  stopScroll();pr.scrollTop=0;
  if($('cnt').checked){
    const c=$('count');c.style.display='flex';$('bRec').disabled=true;
    for(let n=3;n>0;n--){c.textContent=n;await new Promise(r=>setTimeout(r,1000))}
    c.style.display='none';$('bRec').disabled=false;
  }
  begin();
};

// salvar / compartilhar
function ext(){return blob&&blob.type.includes('mp4')?'mp4':'webm'}
$('bSave').onclick=async()=>{
  if(!blob)return;
  const name='gravacao-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.'+ext();
  try{
    const d=window.claude&&await claude.use('downloads');
    if(d){await d.save({filename:name,data:blob});$('saveHint').textContent='Arquivo enviado para salvar.';return}
  }catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  $('saveHint').textContent='Se o download não iniciar, segure/clique com o botão direito no vídeo acima e escolha “Salvar vídeo”.';
};
$('bShare').onclick=async()=>{
  if(!blob)return;
  const f=new File([blob],'gravacao.'+ext(),{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
  else $('saveHint').textContent='Compartilhamento não disponível neste navegador. Use “Baixar vídeo”.';
};
</script>
<!-- fc-voltar-painel -->
<style>#fc-voltar-painel{position:fixed!important;left:12px!important;bottom:calc(12px + env(safe-area-inset-bottom,0px))!important;z-index:2147483000!important;display:inline-flex!important;align-items:center!important;gap:8px!important;min-height:46px!important;padding:0 20px!important;border-radius:999px!important;background:#22d3ee!important;color:#06101c!important;border:2px solid #06101c!important;font:800 16px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;text-decoration:none!important;box-shadow:0 6px 20px rgba(0,0,0,.45)!important;-webkit-tap-highlight-color:transparent}#fc-voltar-painel:active{transform:scale(.96)}@media print{#fc-voltar-painel{display:none!important}}</style>
<a id="fc-voltar-painel" href="index.html" aria-label="Voltar para o painel">&#8592; Voltar ao painel</a>
<script>try{if(window.self!==window.top)document.getElementById('fc-voltar-painel').style.display='none'}catch(e){}</script>
<!-- /fc-voltar-painel -->
</body>
</html>
