<style>

<body>

<header>
  <div class="logo"><img src="sen_fundo_logo.png" alt="FCOSTA"></div>
  <div class="header-info">
    <h1>Assinatura Profissional</h1>
    <p>Pronta para copiar</p>
  </div>
  <a class="voltar" href="index.html"><i class="ti ti-arrow-left"></i>Painel</a>
</header>

<main>
  <section>
    <div class="painel aberto" id="painel-assinatura">
      <div class="linha">
        <div class="campo"><label>Nome completo</label><input type="text" id="assin-nome" placeholder="ex: Sergio Fernandes da Costa" value="FCOSTA" /></div>
        <div class="campo"><label>CRECI</label><input type="text" id="assin-creci" placeholder="ex: 29479-F" value="29479-F" /></div>
      </div>
      <div class="linha">
        <div class="campo"><label>Telefone / WhatsApp</label><input type="text" id="assin-telefone" placeholder="ex: (11) 98765-4321" value="(11) 993509109" /></div>
        <div class="campo"><label>Site ou Instagram</label><input type="text" id="assin-site" placeholder="ex: fcostacorretor.com" value="https://fcostacorretor.com" /></div>

        <button class="btn secundario" onclick="baixarCarimboAssinatura()"><i class="ti ti-download"></i>Baixar imagem</button>
      </div>
    </div>

<script>
/* ── MÁSCARA DE MOEDA (R$) — formata sozinho com ponto de milhar, vírgula e 2 casas ── */
function formatarMoedaInput(input) {
  let digitos = input.value.replace(/\D/g, '');
  if (!digitos) { input.value = ''; return; }
  digitos = digitos.replace(/^0+(?=\d)/, '');
  while (digitos.length < 3) digitos = '0' + digitos;
  const centavos = digitos.slice(-2);
  const inteiro = digitos.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  input.value = inteiro + ',' + centavos;
}
function moedaParaNumero(valor) {
  if (!valor) return 0;
  const limpo = String(valor).replace(/\./g, '').replace(',', '.');
  return parseFloat(limpo) || 0;
}

/* ── COPIAR ────────────────────────────────────── */
function copiar(texto, btnEl) {
  navigator.clipboard.writeText(texto).then(() => {
    const original = btnEl.innerHTML;
    btnEl.innerHTML = '<i class="ti ti-check"></i>Copiado';
    setTimeout(() => btnEl.innerHTML = original, 1500);
  });
}

/* ── ASSINATURA PROFISSIONAL ───────────────────── */
function gerarAssinatura() {
  const nome = document.getElementById('assin-nome').value.trim();
  const creci = document.getElementById('assin-creci').value.trim();
  const telefone = document.getElementById('assin-telefone').value.trim();
  const site = document.getElementById('assin-site').value.trim();

  if (!nome) { alert('Digite ao menos o nome.'); return; }

  let linhas = [nome];
  if (creci) linhas.push(`CRECI ${creci}`);
  if (telefone) linhas.push(`📱 ${telefone}`);
  if (site) linhas.push(`🌐 ${site}`);

  document.getElementById('resultado-assinatura-texto').textContent = linhas.join('\n');
  document.getElementById('resultado-assinatura').style.display = 'block';
  document.getElementById('acoes-assinatura').style.display = 'none';

  desenharCarimboAssinatura({ nome, creci, telefone, site });
}

/* ── CARIMBO DE ASSINATURA (imagem para copiar/baixar) ── */
function carregarImagemPromise(src) {
  return new Promise((resolve) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => resolve(null);
    im.src = src;
  });
}

async function desenharCarimboAssinatura({ nome, creci, telefone, site }) {
  const canvas = document.getElementById('carimbo-assinatura-canvas');
  const imgAssinatura = document.querySelector('#resultado-assinatura img');
  await document.fonts.ready;

  const escala = 2;
  const largura = 420;

  // Monta as linhas de identificação primeiro para calcular a altura do carimbo
  const linhasInfo = [];
  if (creci) linhasInfo.push(`CRECI ${creci}`);
  if (telefone) linhasInfo.push(`📱 ${telefone}`);
  if (site) linhasInfo.push(`🌐 ${site}`);

  const alturaAssin = 92;      // altura reservada para a assinatura manuscrita
  const alturaNome = 26;       // altura da linha do nome
  const alturaLinhaInfo = 20;  // altura de cada linha de dado
  const padTopo = 14, padBaixo = 16, gapAposAssin = 26, gapLinhaNome = 10, gapAposNome = 6;
  const altura = padTopo + alturaAssin + gapAposAssin + alturaNome + gapAposNome + (linhasInfo.length * alturaLinhaInfo) + padBaixo;

  canvas.width = largura * escala;
  canvas.height = altura * escala;
  const ctx = canvas.getContext('2d');
  ctx.scale(escala, escala);

  // Fundo transparente, sem bordas
  ctx.clearRect(0, 0, largura, altura);

  // Assinatura manuscrita (centralizada, no topo)
  let y = padTopo;
  const assinaturaImg = imgAssinatura ? await carregarImagemPromise(imgAssinatura.src) : null;
  if (assinaturaImg) {
    const larguraAssin = Math.min(largura - 48, alturaAssin * (assinaturaImg.width / assinaturaImg.height));
    const xAssin = (largura - larguraAssin) / 2;
    ctx.drawImage(assinaturaImg, xAssin, y, larguraAssin, alturaAssin);
  }
  y += alturaAssin + gapAposAssin;

  // Linha corrida logo acima do nome (com folga da assinatura, sem cortar nada)
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(28, y - gapLinhaNome);
  ctx.lineTo(largura - 28, y - gapLinhaNome);
  ctx.stroke();

  // Identificação (centralizada, abaixo da linha)
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#000000';
  ctx.font = '700 20px Sora, sans-serif';
  ctx.fillText(nome, largura / 2, y);
  y += alturaNome + gapAposNome;

  ctx.fillStyle = '#000000';
  ctx.font = '500 14px "DM Sans", sans-serif';
  for (const linha of linhasInfo) {
    ctx.fillText(linha, largura / 2, y);
    y += alturaLinhaInfo;
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  canvas.style.display = 'block';
  document.getElementById('acoes-assinatura').style.display = 'flex';
}

function obterBlobCarimbo() {
  const canvas = document.getElementById('carimbo-assinatura-canvas');
  return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
}

async function copiarImagemCarimbo(btn) {
  try {
    const blob = await obterBlobCarimbo();
    if (!blob) throw new Error('sem imagem');
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    const original = btn.innerHTML;
    btn.innerHTML = '<i class="ti ti-check"></i>Copiado';
    setTimeout(() => btn.innerHTML = original, 1500);
  } catch (e) {
    alert('Não foi possível copiar a imagem neste navegador. Use "Baixar imagem" e anexe o arquivo.');
  }
}

async function baixarCarimboAssinatura() {
  const blob = await obterBlobCarimbo();
  if (!blob) return;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'carimbo-assinatura.png';
  a.click();
  URL.revokeObjectURL(url);
}


document.addEventListener("DOMContentLoaded",function(){gerarAssinatura();});
</script>
