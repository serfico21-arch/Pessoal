<body>
<div class="folha">

  <div class="form">
    <h2>Gerador de Esboço de Sermão</h2>
    <label for="texto">Texto bíblico</label>
    <input id="texto" type="text" placeholder="Ex.: Neemias 1:1-11">
    <label for="tema">Tema (opcional)</label>
    <input id="tema" type="text" placeholder="Ex.: A dor do outro chegou na minha casa">
    <label for="tipo">Tipo de esboço</label>
    <select id="tipo">
      <option value="expositivo">Expositivo — segue o texto versículo por versículo</option>
      <option value="tematico">Temático — parte do tema, com versículos de apoio</option>
      <option value="textual">Textual — só as ideias principais do texto</option>
      <option value="limpo">Limpo e objetivo — 2 subtópicos por ponto</option>
      <option value="tonicas">Palavras tônicas — uma palavra por versículo</option>
      <option value="folha">Palavras tônicas em 1 folha — verbo + palavra forte (14 x 22 cm)</option>
    </select>
    <label for="traducao">Tradução bíblica (o texto dos versículos é buscado nela)</label>
    <select id="traducao"></select>
    <label for="passagem">Texto dos versículos (opcional: se ficar vazio, busco sozinho na tradução escolhida)</label>
    <textarea id="passagem" placeholder="Cole aqui os versículos da sua Bíblia, se quiser"></textarea>
    <div class="linha">
      <div>
        <label for="chave">Chave da API (Google AI Studio)</label>
        <input id="chave" type="password" placeholder="Cole sua chave aqui (fica salva neste aparelho)" autocomplete="off">
      </div>
      <div>
        <label for="modelo">Modelo</label>
        <input id="modelo" type="text">
      </div>
    </div>
    <div class="botoes">
      <button id="gerar">Gerar esboço</button>
    </div>
    <label style="font-weight:normal"><input id="vers" type="checkbox" style="width:auto"> Mostrar o versículo (na tradução escolhida) com a palavra tônica destacada</label>
    <label style="font-weight:normal"><input id="detalhes" type="checkbox" style="width:auto"> Mostrar detalhes (ilustração, passos práticos, ligações, oração)</label>
    <div id="msg" class="msg" role="status"></div>
    <div class="peq">Sem tema, a IA cria um. Sempre confira os versículos de apoio na sua Bíblia antes de pregar. Ao imprimir, o esboço sai em uma folha de 14 x 22 cm (escolha tamanho real, sem ajustar à página). Chave grátis em <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.</div>
  </div>

  <div id="saida"></div>

  <div class="rodape" id="rodape" style="display:none">
    <button class="sec" onclick="window.print()">Imprimir / Salvar PDF</button>
  </div>
</div>

<script>
/* ---------- Esboço de exemplo (também serve de modelo para a IA) ---------- */
const EXEMPLO = {
 tema: "a dor do outro chegou na minha casa",
 palavra_chave: "AVANÇAR",
 contraponto: "recuar",
 referencia: "Neemias 1:1-11",

    ] },
  { titulo: "A dor vai ao trono: quem recua se vira sozinho, quem AVANÇA olha para Deus", nota: "a ORAÇÃO de Neemias, Ne 1:5-11, “dia e noite”",
    topicos: [

/* ---------- Instruções para a IA ---------- */
const INSTRUCAO = `Você prepara esboços de pregação para um pastor evangélico brasileiro de 63 anos, que precisa de esboços SIMPLES e REDUZIDOS. Escreva em português do Brasil, direto, com palavras simples. Frases curtas, sem parágrafos: o pastor passa os olhos e prega. Na dúvida entre dizer mais ou dizer menos, diga menos. Meta: o esboço inteiro com cerca de 500 a 700 palavras.

PRINCÍPIOS OBRIGATÓRIOS

1. FIDELIDADE AO TEXTO. Se o pastor colou o texto dos versículos, ele é a única fonte. Se não colou, use a TRADUÇÃO BÍBLICA indicada no pedido (se não houver, Almeida Revista e Atualizada): as palavras tônicas (chave), os trechos de versículos e as palavras citadas devem ser exatamente as dessa tradução, pois as palavras mudam de uma tradução para outra. Só afirme o que você tem certeza que o texto diz nessa tradução. Quando o pedido trouxer o texto dos versículos, copie a palavra tônica (chave) exatamente como está escrita nele. Não invente fatos, nomes, números ou detalhes que o texto não traz. Siga o TIPO DE ESBOÇO pedido (veja TIPOS abaixo). Nunca force uma aplicação que o texto não sustenta.

2. TEMA E PALAVRA-CHAVE. Use o tema recebido, com as palavras do pastor (se o tema não combinar com o texto, ajuste o mínimo possível). Sem tema, crie um curto e forte, ligado à situação do texto. Crie uma PALAVRA-CHAVE: um verbo de ação no infinitivo, em maiúsculas, que RESPONDE ao tema (ex.: AVANÇAR), com um contraponto também verbo (ex.: recuar). O corpo todo se liga à palavra-chave e ela aponta de volta para o tema.

3. INTRODUÇÃO: 1 ou 2 frases: quem é a pessoa, onde está, qual a situação do texto. Sem quebra-gelo, sem humor.

4. GANCHO: 3 a 4 frases curtas, em afirmações, SEM perguntas, ligado ao tema, terminando na palavra-chave conjugada (ex.: "Ele AVANÇOU."). Marque essa palavra com ** assim: **AVANÇOU**.

5. ILUSTRAÇÃO (opcional): ilustracao_titulo curto (ex.: "a águia e a tempestade") e ilustracao com 2 linhas ligadas à palavra-chave. Use só imagem simples e verdadeira (natureza, cena do dia a dia). Não invente histórias "reais", estatísticas nem citações de pessoas. Se não encaixar bem, deixe os dois campos vazios.

6. ABERTURA_CORPO: uma frase que começa com "A partir do momento que..." ou "Quando...", põe o ouvinte na situação do tema e termina com dois pontos.

7. PARTES: 2 ou 3 partes. O titulo de cada parte contrasta os dois caminhos, usando o contraponto e a palavra-chave em maiúsculas (ex.: "quem recua se omite, quem AVANÇA age"). NÃO escreva "Parte 1" no título. O campo nota só se preenche quando a parte corresponde a uma oração, salmo ou discurso do próprio texto (ex.: "a ORAÇÃO de Neemias, Ne 1:5-11"); senão fica vazio.

8. CADA TÓPICO:
 (a) chave: UMA palavra tirada do próprio versículo, a mais marcante, em maiúsculas. Nenhuma chave se repete.
 (b) direcao: 3 a 9 palavras, no formato "<Palavra-chave> é ..." (ex.: "Avançar é sofrer com quem sofre").
 (c) ref: só a referência abreviada. NUNCA transcreva o versículo.
 (d) subs: exatamente 2. Cada um com titulo (2 a 6 palavras), texto (até 8 palavras) e ref de apoio.
 (e) pratica: um passo de aplicação em uma linha, no imperativo, só nos tópicos que pedem. Sem numeração, sem "1º" (o sistema numera).
 (f) ligacao: uma frase curta que termina apontando para a chave do próximo tópico. No último tópico fica vazia. Aqui pode haver pergunta. Cada tópico precisa nascer do anterior.

9. REFERÊNCIAS: use abreviaturas assim: Gn, Êx, Lv, Nm, Dt, Js, Jz, Rt, 1 Sm, 2 Sm, 1 Rs, 2 Rs, 1 Cr, 2 Cr, Ed, Ne, Et, Jó, Sl, Pv, Ec, Ct, Is, Jr, Lm, Ez, Dn, Os, Jl, Am, Ob, Jn, Mq, Na, Hc, Sf, Ag, Zc, Ml, Mt, Mc, Lc, Jo, At, Rm, 1 Co, 2 Co, Gl, Ef, Fp, Cl, 1 Ts, 2 Ts, 1 Tm, 2 Tm, Tt, Fm, Hb, Tg, 1 Pe, 2 Pe, 1 Jo, 2 Jo, 3 Jo, Jd, Ap. Só use referência que você conhece bem e que realmente diz o que o sub-tópico afirma. Se não tiver certeza, troque por outra que conheça. Nunca invente.

10. PRÁTICAS: no total 3 ou 4 passos, em sequência lógica, espalhados nos tópicos certos. Seus verbos formam o resumo_verbos.

11. ORAÇÃO: se o texto traz uma oração, preencha oracao com os pedidos em sequência, na ordem da oração do texto, separados por " · ", em linguagem de "nós". Preencha oracao_de com o nome de quem orou. Se não há oração no texto, deixe os dois vazios.

12. FECHAMENTO: fechamento é uma frase que RESPONDE ao tema com a palavra-chave marcada com ** (ex.: "Quando a dor do outro chegar na minha casa: **AVANÇAR**."). resumo_verbos: 3 ou 4 verbos no infinitivo, separados por " · ", terminando com ponto.

13. APOIO: de 4 a 6 referências para o sermão inteiro, cada uma com ideia de 2 a 4 palavras.

14. MARCAÇÃO: o sinal ** só pode aparecer no gancho e no fechamento, uma vez em cada, na palavra-chave. Em nenhum outro campo.

15. CAMPOS EXTRAS (só nos tipos PALAVRAS TÔNICAS e 1 FOLHA; nos outros tipos ficam vazios; o campo verbo só existe no tipo 1 FOLHA): curiosidade = um fato curto (até 12 palavras) sobre o versículo ou o cenário, ligado ao tema; só use fato que você sabe ter certeza (lugar, nome, significado, época, costume do texto); na dúvida, deixe vazio. apoio_ref = um versículo de apoio de outro trecho da Bíblia, que você conhece bem e que realmente reforça a ideia do tópico. apoio_palavras = um trecho CONTÍNUO de 3 a 6 palavras desse versículo de apoio, copiado exatamente como está na tradução indicada no pedido, só para lembrar o versículo, sem aspas; na dúvida, deixe vazio.

TIPOS DE ESBOÇO (o pedido informa qual usar; o formato do JSON é o mesmo para todos):
- EXPOSITIVO: cubra a passagem do começo ao fim, na ordem, juntando versículos vizinhos. 5 a 8 tópicos (máximo 9).
- TEMÁTICO: parta do tema; o texto principal é a base e versículos de outros livros dão apoio. 3 a 5 tópicos; o ref de cada tópico pode ser de outro livro. 1 ou 2 partes bastam.
- TEXTUAL: tire do texto só as ideias principais, na ordem. 3 a 4 tópicos. 1 ou 2 partes bastam.
- LIMPO E OBJETIVO, PALAVRAS TÔNICAS e 1 FOLHA: seguem exatamente o que o pedido descrever e SUBSTITUEM as regras acima onde forem diferentes (por exemplo, campos que o pedido manda deixar vazios ficam vazios).

NÃO FAÇA: tese; apelo (o apelo é do pastor); transcrição de versículos; parágrafos longos; perguntas no gancho; quebra-gelo, piadas ou humor; jargão teológico; texto em markdown.

/* Folha para a Bíblia: 14 cm x 22 cm (área útil 13 x 21 cm). Ao imprimir, ajusta o tamanho para caber em UMA folha. */
function caberNaFolha() {
  if (modoEditor) { caberEditor(); return; }
  const sd = $('saida');
  if (!sd || sd.style.display === 'none') return;
  const ref = document.createElement('div');
  ref.style.cssText = 'position:absolute;visibility:hidden;height:0;width:100mm';
  document.body.appendChild(ref);
  const pxmm = ref.getBoundingClientRect().width / 100;
  ref.remove();
  const L = 130, A = 210;
  let z = 1.4;
  for (; z >= 0.35; z -= 0.02) {
    sd.style.zoom = z;
    sd.style.width = (L / z) + 'mm';
    if (sd.getBoundingClientRect().height <= A * pxmm) break;
  }
}
function soltarFolha() { if (modoEditor) { soltarEditor(); return; } const sd = $('saida'); if (sd) { sd.style.zoom = ''; sd.style.width = ''; } }
window.addEventListener('beforeprint', caberNaFolha);
window.addEventListener('afterprint', soltarFolha);

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}
function add(pai, tag, cls, txt) { const e = el(tag, cls, txt); pai.appendChild(e); return e; }
function tx(pai, t) { pai.appendChild(document.createTextNode(t)); }

/* Escreve texto; trechos entre ** viram destaque amarelo. Se a IA esquecer o **,
   destaca sozinho a palavra parecida com a palavra-chave (qual: 'primeiro' ou 'ultimo'). */
function rico(pai, txt, kw, qual) {
  txt = txt || '';
  if (txt.indexOf('**') >= 0) {
    txt.split(/\*\*(.+?)\*\*/).forEach((p, i) => {
      p = p.replace(/\*\*/g, '');
      if (!p) return;
      if (i % 2) add(pai, 'span', 'hl', p); else tx(pai, p);
    });
    return;
  }
  if (kw && qual) {
    const radical = kw.trim().toUpperCase().slice(0, Math.max(4, kw.trim().length - 3));
    const ms = [...txt.matchAll(/[\p{L}]+/gu)].filter(m => radical.length >= 4 && m[0].toUpperCase().startsWith(radical));
    if (ms.length) {
      const m = qual === 'ultimo' ? ms[ms.length - 1] : ms[0];
      tx(pai, txt.slice(0, m.index));
      add(pai, 'span', 'hl', m[0]);
      tx(pai, txt.slice(m.index + m[0].length));
      return;
    }
  }
  tx(pai, txt);
}

/* ---------- Limpeza e validação do que a IA devolve ---------- */
function normalizar(d) {
  if (!d || typeof d !== 'object') throw new FormatoErro('vazio');
  const s = v => (v === undefined || v === null) ? '' : String(v).trim();
  const semMarca = v => s(v).replace(/^[➜↓→•\-–\s]+/, '').replace(/^\d+\s*[º°]\s*[·.:\-–]?\s*/, '');
  const r = {
    tema: s(d.tema), palavra_chave: s(d.palavra_chave).toUpperCase(), contraponto: s(d.contraponto).toLowerCase(),
    referencia: s(d.referencia), introducao: s(d.introducao), gancho: s(d.gancho),
    ilustracao_titulo: s(d.ilustracao_titulo), ilustracao: s(d.ilustracao), abertura_corpo: s(d.abertura_corpo),
    fechamento: s(d.fechamento), resumo_verbos: s(d.resumo_verbos), oracao_de: s(d.oracao_de), oracao: s(d.oracao),
    partes: [], apoio: []
  };
  if (!r.ilustracao) r.ilustracao_titulo = '';
  if (!r.oracao) r.oracao_de = '';
  (Array.isArray(d.partes) ? d.partes : []).forEach(p => {
    const topicos = [];
    (Array.isArray(p && p.topicos) ? p.topicos : []).forEach(t => {
      if (!t || !s(t.chave)) return;
      const subs = (Array.isArray(t.subs) ? t.subs : []).slice(0, 2)
        .map(b => ({ titulo: s(b && b.titulo), texto: s(b && b.texto), ref: s(b && b.ref) }))
        .filter(b => b.titulo || b.texto);
      topicos.push({
        chave: s(t.chave).toUpperCase(), direcao: s(t.direcao), ref: s(t.ref), subs,
        pratica: semMarca(t.pratica), ligacao: semMarca(t.ligacao), verbo: s(t.verbo).toUpperCase(),
        curiosidade: s(t.curiosidade), apoio_ref: s(t.apoio_ref), apoio_palavras: s(t.apoio_palavras).replace(/^["“”]+|["“”]+$/g, '')
      });
    });
    if (topicos.length) {
      r.partes.push({
        titulo: s(p.titulo).replace(/^parte\s*\d+\s*[·:.\-–]?\s*/i, ''),
        nota: s(p.nota).replace(/^\(|\)$/g, ''), topicos
      });
    }
  });
  if (!r.partes.length) throw new FormatoErro('sem tópicos');
  const ult = r.partes[r.partes.length - 1].topicos;
  ult[ult.length - 1].ligacao = '';
  (Array.isArray(d.apoio) ? d.apoio : []).forEach(a => { if (a && s(a.ref)) r.apoio.push({ ref: s(a.ref), ideia: s(a.ideia) }); });
  return r;
}

/* Troca a tradução: a IA reescreve as palavras tônicas e os versículos de apoio; frases e ligações ficam */
async function edMudarTraducao(sel) {
  const nova = sel.value, antiga = ED.traducao;
  if (nova === antiga) return;
  const nome = nomeTrad(nova);
  const chave = ($('chave').value || '').trim();
  const temTexto = ED.itens.some(it => it.palavra.trim() || it.vtxt.trim());
  const soEtiqueta = () => { ED.traducao = nova; edSalvar(); edEtiqueta(); edStatus(''); };
  if (!temTexto) { soEtiqueta(); return; }
  if (!confirm('Trocar para a tradução ' + nome + '?\n\nBusco o texto dos versículos na ' + nova + ' e escolho de novo cada palavra tônica nesse texto (as que você editou à mão também mudam), e confiro os versículos de apoio. As frases e as ligações são mantidas.' + (chave ? '' : '\n\n(Sem a chave da API, os versículos de apoio são trocados, mas as palavras que não existirem na nova tradução só são avisadas.)') + '\n\nSalve o arquivo antes, se quiser guardar a versão atual.')) { sel.value = antiga; return; }
  sel.disabled = true; edStatus('Buscando o texto da ' + nova + ' e conferindo as palavras...');
  try {
    const r = await edTrocarPalavras(nova);
    ED.traducao = nova; edSalvar(); edRender(); edEtiqueta();
    const sufixo = r.ia ? ' (A IA não respondeu, então só o que dava para trocar sem ela foi trocado.)' : '';
    edStatus((bibResumo(r, nova) || 'Nada precisou mudar.') + sufixo + ' Confira na sua Bíblia (' + nova + ').', r.pendentes.length > 0);
  } catch (e) {
    sel.value = antiga;
    let m = e.message || String(e);
    if (m === 'SEMBIBLIA') m = 'Não consegui buscar o texto da Bíblia agora (sem internet ou serviço fora do ar), ou os pontos estão sem o versículo (campo pequeno, ex.: Ne 1:2). Nada foi alterado.';
    edStatus(m, true);
  } finally { sel.disabled = false; }
}
async function edTrocarPalavras(sigla) {
  const chave = $('chave').value.trim();
  const modelo = ($('modelo').value || '').trim() || MODELOS[0];
  /* 1) texto real de cada ponto na tradução nova */
  const textos = await Promise.all(ED.itens.map(async it => {
    if (!(it.ref || '').trim()) return null;
    try { const v = await bibVersos(sigla, it.ref); return v ? v.map(x => x.texto).join(' ') : null; } catch (e) { return null; }
  }));
  const idx = []; textos.forEach((t, i) => { if (t && ED.itens[i].palavra.trim()) idx.push(i); });
  const antigas = ED.itens.map(it => it.palavra);
  let escolhidas = 0;
  /* 2) a palavra tônica é escolhida DE NOVO no texto da nova tradução */
  if (idx.length) {
    const picks = await escolherTonicas(idx.map(i => ({ ref: ED.itens[i].ref, texto: textos[i] })), sigla, ED.tema || '', chave, modelo);
    idx.forEach((i, k) => { if (picks[k]) { if (normPal(picks[k]) !== normPal(ED.itens[i].palavra)) escolhidas++; ED.itens[i].palavra = picks[k]; } });
    ajustarLigacoes(ED.itens, antigas, 'lig', 'palavra');
  }
  /* 3) versículos de apoio conferidos com o texto da nova tradução */
  const r = await bibConferir(ED.itens, sigla, chave, modelo);
  if (!r.algumTexto && !idx.length) throw new Error('SEMBIBLIA');
  r.escolhidas = escolhidas;
  if (idx.length) { r.ok = 0; r.corrigidas = escolhidas; }
  return r;
}

function edAbrirArquivo(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || !Array.isArray(o.itens)) throw 0;
      o.itens = o.itens.map(x => { const v = edVazio(); for (const k in v) v[k] = String((x && x[k]) || ''); return v; });
      if (!o.itens.length) o.itens.push(edVazio());
      ['titulo', 'ref', 'tema', 'fech', 'apelo'].forEach(k => { o[k] = String(o[k] || ''); });
      o.fs = Number(o.fs) || 10;
      o.traducao = tradValida(o.traducao);
      ED = o; edSalvar(); abrirEditor(ED);
    } catch (err) { alert('Este arquivo não é um esboço válido.'); }
  };
  r.readAsText(f); e.target.value = '';
}

const semAcento = t => String(t == null ? '' : t).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function chaveLivro(t) {
  t = String(t).toLowerCase().trim();
  t = t.replace(/^primeir[oa]\s+/, '1 ').replace(/^segund[oa]\s+/, '2 ').replace(/^terceir[oa]\s+/, '3 ');
  t = t.replace(/^(iii|ii|i)\s+/, (m, r) => ({ i: '1 ', ii: '2 ', iii: '3 ' })[r]);
  t = t.replace(/^([123])\s*[ºª°]\.?/, '$1');
  return t.replace(/[\s.]/g, '');
}
const BIB_MAPA_AC = {}, BIB_MAPA = {};
BIB_LIVROS.forEach(([cod, nomes]) => nomes.forEach(n => {
  const k = chaveLivro(n);

  if (!BIB_MAPA[semAcento(k)]) BIB_MAPA[semAcento(k)] = cod;
}));

const achaLivro = t => { const k = chaveLivro(t); return BIB_MAPA_AC[k] || BIB_MAPA[semAcento(k)] || null; };

/* "Ne 1:1-11", "Neemias 1.1-11", "Jo 3:16", "Salmo 23", "1 Co 13:4-7,13", "Fp 2:5-11; 3:1" */
function bibParse(ref) {
  const s = String(ref || '').trim();
  const m = s.match(/^((?:[123]\s*[ºª°]?\.?\s*|(?:iii|ii|i)\s+|(?:primeir|segund|terceir)[oa]\s+)?)([A-Za-zÀ-ÿ]+)\.?\s*(?:(d[eao]s?\s+[A-Za-zÀ-ÿ]+)\s*)?(.*)$/i);
  if (!m) return null;
  let cod = achaLivro(m[1] + m[2] + (m[3] ? ' ' + m[3] : ''));
  if (!cod && m[3]) cod = achaLivro(m[1] + m[2]);
  if (!cod) return null;
  let r = String(m[4] || '').replace(/[–—−]/g, '-').replace(/\s+/g, '').replace(/(\d)[a-z]+/gi, '$1');
  if (!r) return null;
  if (['OBA', 'PHM', '2JN', '3JN', 'JUD'].indexOf(cod) >= 0 && r.indexOf(':') < 0 && r.indexOf(';') < 0) r = '1:' + r;
  if (r.indexOf(':') < 0 && /^\d+[.,]\d/.test(r)) r = r.replace(/^(\d+)[.,]/, '$1:');
  const trechos = [];
  for (const seg of r.split(';')) {
    let mm;
    if ((mm = seg.match(/^(\d+):(\d+)-(\d+):(\d+)$/))) {
      trechos.push({ c1: +mm[1], v1: +mm[2], c2: +mm[3], v2: +mm[4] });
    } else if ((mm = seg.match(/^(\d+):(.+)$/))) {
      const cap = +mm[1];
      for (const p of mm[2].split(',')) {
        const q = p.match(/^(\d+)(?:-(\d+))?$/);
        if (!q) return null;
        trechos.push({ c1: cap, v1: +q[1], c2: cap, v2: +(q[2] || q[1]) });
      }
    } else if ((mm = seg.match(/^(\d+)(?:-(\d+))?$/))) {
      trechos.push({ c1: +mm[1], v1: null, c2: +(mm[2] || mm[1]), v2: null });
    } else return null;
  }
  return trechos.length ? { cod, trechos } : null;
}
function bibExtrair(livro, t) {
  const out = [], ab = livro.abbrev || livro.name || livro.code;
  for (let c = t.c1; c <= t.c2; c++) {
    const cap = livro.chapters.find(x => x.number === c);
    if (!cap) continue;
    const ult = cap.verses.reduce((mx, v) => Math.max(mx, v.number), 0);
    const ini = (c === t.c1 && t.v1 != null) ? t.v1 : 1;
    const fim = (c === t.c2 && t.v2 != null) ? t.v2 : ult;
    cap.verses.forEach(v => {
      if (v.number >= ini && v.number <= fim && v.text) out.push({ ref: ab + ' ' + c + ':' + v.number, c, v: v.number, texto: String(v.text).trim() });
    });
  }
  return out;
}
const BIB_CACHE = {};
async function bibLivro(sigla, cod) {
  const k = (BIB_COD[sigla] || 'ARA') + '/' + cod;
  if (!BIB_CACHE[k]) BIB_CACHE[k] = (async () => {
    let falha = new Error('REDE');
    for (const base of BIB_BASES) {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
      try {
        const r = await fetch(base + k + '.json', { signal: ctl.signal });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        if (!j || !Array.isArray(j.chapters)) throw new Error('formato');
        return j;
      } catch (e) { falha = e; } finally { clearTimeout(to); }
    }
    throw falha;
  })();
  try { return await BIB_CACHE[k]; } catch (e) { delete BIB_CACHE[k]; throw e; }
}
/* devolve a lista de versículos reais, ou null se a referência não for entendida / não existir; lança erro se faltar internet */
async function bibVersos(sigla, ref) {
  const p = bibParse(ref); if (!p) return null;
  const livro = await bibLivro(sigla, p.cod);
  const lista = [];
  p.trechos.forEach(t => lista.push(...bibExtrair(livro, t)));
  return lista.length ? lista : null;
}

const bibToks = t => semAcento(String(t || '').toLowerCase()).match(/[a-z0-9]+(?:-[a-z0-9]+)*/g) || [];
function achaPalavra(pal, texto) {
  const p = bibToks(pal).join('-').replace(/-/g, ''); if (!p) return false;
  return bibToks(texto).some(t => t.replace(/-/g, '') === p);
}
function apoioConfere(trecho, texto) {
  const a = bibToks(trecho); if (!a.length) return true;
  const set = new Set(); bibToks(texto).forEach(t => { set.add(t); t.split('-').forEach(x => set.add(x)); });
  return a.every(w => set.has(w) || w.split('-').every(x => set.has(x)));
}
function trechoContinuo(trecho, texto) {
  const a = bibToks(trecho).join(' '); if (!a) return false;
  return (' ' + bibToks(texto).join(' ') + ' ').indexOf(' ' + a + ' ') >= 0;

const primeirasPalavras = (texto, n) => String(texto).trim().split(/\s+/).slice(0, n).join(' ').replace(/[,;:.!?…]+$/, '');

/* Confere (e corrige) as palavras tônicas e os versículos de apoio de uma lista de itens

async function bibConferir(itens, sigla, chave, modelo) {
  const res = { ok: 0, corrigidas: 0, apoios: 0, semTexto: 0, pendentes: [], rede: false, ia: null, trocas: [], algumTexto: false };
  const busca = async ref => {
    if (!ref || !String(ref).trim()) return null;
    try { const v = await bibVersos(sigla, ref); return v ? v.map(x => x.texto).join(' ') : null; }
    catch (e) { res.rede = true; return null; }
  };
  const prep = await Promise.all(itens.map(async it => ({ it, tr: await busca(it.ref), tv: await busca(it.vref) })));
  prep.forEach(p => {
    const it = p.it;
    if (p.tr || p.tv) res.algumTexto = true;
    if (!p.tr && it.palavra) res.semTexto++;
    p.precisaP = !!(p.tr && it.palavra && !achaPalavra(it.palavra, p.tr));
    if (p.tr && it.palavra && !p.precisaP) res.ok++;
    p.precisaV = !!(p.tv && (it.vtxt ? !trechoContinuo(it.vtxt, p.tv) : true));
  });
  const fazer = prep.map((p, i) => ({ p, n: i + 1 })).filter(x => x.p.precisaP || x.p.precisaV);
  if (fazer.length && chave) {
    try {
      const lista = fazer.map(x => ({
        n: x.n,
        palavra_antiga: x.p.precisaP ? x.p.it.palavra : '',
        texto: x.p.precisaP ? x.p.tr : '',
        apoio_ref: x.p.precisaV ? x.p.it.vref : '',
        apoio: x.p.precisaV ? x.p.tv : ''
      }));
      const sistema = 'Você escolhe palavras de versículos bíblicos em português. Responda SOMENTE com JSON válido, sem explicações.\n' +
        'Regras:\n' +
        '1. palavra: UMA palavra COPIADA do campo "texto", exatamente como está escrita lá, em MAIÚSCULAS. Escolha a mais marcante e, se der, a que tem o mesmo sentido da palavra_antiga. Se "texto" vier vazio, devolva "".\n' +
        '2. apoio_texto: um trecho CONTÍNUO de 3 a 8 palavras, COPIADO letra por letra do campo "apoio", o mais marcante. Se "apoio" vier vazio, devolva "".\n' +
        '3. Nunca invente, não troque palavras, não corrija: só copie do texto recebido.\n' +
        'Formato: {"itens":[{"n":1,"palavra":"","apoio_texto":""}]}';
      const corpo = {
        systemInstruction: { parts: [{ text: sistema }] },
        contents: [{ role: 'user', parts: [{ text: 'Tradução: ' + nomeTrad(sigla) + '\nPontos:\n' + JSON.stringify(lista) }] }],
        generationConfig: { temperature: 0.1, responseMimeType: 'application/json', maxOutputTokens: 8192 }
      };
      const j = await chamar(chave, corpo, modelo);
      const dados = lerJSON(textoDaResposta(j));
      const arr = Array.isArray(dados.itens) ? dados.itens : (Array.isArray(dados) ? dados : []);
      const limpo = v => String(v == null ? '' : v).trim().replace(/^["“”'‘’]+|["“”'‘’]+$/g, '');
      arr.forEach(x => {
        const f = fazer.find(y => y.n === Number(x && x.n)); if (!f) return;
        const p = f.p, it = p.it;
        const pal = limpo(x.palavra).toUpperCase();
        if (p.precisaP && pal && !/\s/.test(pal) && achaPalavra(pal, p.tr)) {
          res.trocas.push([it.palavra, pal]); it.palavra = pal; res.corrigidas++; p.precisaP = false;
        }
        const ap = limpo(x.apoio_texto);
        if (p.precisaV && ap && trechoContinuo(ap, p.tv)) { it.vtxt = ap; res.apoios++; p.precisaV = false; }
      });
    } catch (e) { res.ia = e; }
  }
  prep.forEach(p => {
    if (p.precisaV) { p.it.vtxt = primeirasPalavras(p.tv, 8); res.apoios++; }   /* texto literal do versículo */
    if (p.precisaP) res.pendentes.push(p.it.palavra);
  });

  return res;
}
function bibResumo(r, sigla) {
  const p = [];

  if (r.apoios) p.push(r.apoios + ' versículo(s) de apoio ajustado(s)');
  let t = p.length ? 'Conferido com o texto da ' + sigla + ': ' + p.join(', ') + '.' : '';
  if (r.pendentes.length) t += ' Não achei no versículo da ' + sigla + ': ' + r.pendentes.join(', ') + ' (troque à mão ou confira na sua Bíblia).';
  if (r.semTexto) t += ' ' + r.semTexto + ' ponto(s) sem versículo para conferir.';

function tonicaLocal(texto, usadas) {
  const ps = String(texto).match(/[\p{L}]+(?:-[\p{L}]+)*/gu) || [];

  ps.forEach((p, i) => {

}
/* uma palavra tônica por versículo, tirada do texto REAL da tradução escolhida */
async function escolherTonicas(vs, sigla, tema, chave, modelo) {

        'Formato: {"itens":[{"n":1,"palavra":""}]}';

/* quando uma palavra tônica muda, a ligação do ponto anterior (que aponta para ela) acompanha.
   campo = nome do campo da ligação ('ligacao' no esboço, 'lig' no editor); chv = campo da palavra */
function ajustarLigacoes(tops, antigas, campo, chv) {
  campo = campo || 'ligacao'; chv = chv || 'chave';
  tops.forEach((t, i) => {
    if (i === tops.length - 1 || !t[campo]) return;
    const ant = antigas[i + 1], novo = tops[i + 1][chv];
    if (!ant || !novo || ant === novo) return;
    let lig = t[campo].split(ant).join(novo);
    if (lig === t[campo]) {
      const ms = [...lig.matchAll(/[A-ZÀ-Ý]{3,}(?:-[A-ZÀ-Ý]{2,})*/g)], m = ms[ms.length - 1];
      if (m) lig = lig.slice(0, m.index) + novo + lig.slice(m.index + m[0].length);
    }
    t[campo] = lig;
  });
}

function destacar(pai, texto, palavra) {

  if (alvo) {
    for (const m of texto.matchAll(/[\p{L}\p{N}]+(?:-[\p{L}\p{N}]+)*/gu)) {
      if (normPal(m[0]) === alvo) {
        tx(pai, texto.slice(0, m.index)); add(pai, 'span', 'hl', m[0]); ult = m.index + m[0].length; break;
      }
    }
  }
  tx(pai, texto.slice(ult));

/* Confere o esboço gerado pela IA com o texto real da tradução.
   o = { vs: versículos reais, picks: palavras tônicas já escolhidas (modos "um tópico por versículo") } */
async function conferirEsboco(d, sigla, chave, modelo, o) {
  o = o || {};
  const tops = []; d.partes.forEach(p => p.topicos.forEach(t => tops.push(t)));
  const antigas = tops.map(t => t.chave);
  const vs = o.vs && o.vs.length ? o.vs : null;
  if (vs) {
    const base = vs[0].ref.slice(0, vs[0].ref.lastIndexOf(' '));
    tops.forEach(t => {
      if (t.ref && !bibParse(t.ref)) {
        const m = String(t.ref).match(/(\d+)\s*(?:-\s*(\d+))?\s*$/);
        if (m) t.ref = base + ' ' + vs[0].c + ':' + m[1] + (m[2] ? '-' + m[2] : '');
      }
    });
  }
  let forcado = false;
  if (o.picks && vs) {
    tops.forEach((t, i) => {
      let k = -1;
      if (tops.length === vs.length) k = i;
      else {
        const p = bibParse(t.ref);
        if (p) { const a = p.trechos[0]; k = vs.findIndex(v => v.c === a.c1 && (a.v1 == null || v.v === a.v1)); }
      }
      if (k >= 0 && o.picks[k]) { t.chave = o.picks[k]; if (tops.length === vs.length) t.ref = vs[k].ref; forcado = true; }
    });
  }
  const itens = tops.map(t => ({ ref: t.ref, palavra: t.chave, vref: t.apoio_ref, vtxt: t.apoio_palavras }));
  let r;
  try { r = await bibConferir(itens, sigla, chave, modelo); }
  catch (e) { return { ok: 0, corrigidas: 0, apoios: 0, semTexto: tops.length, pendentes: [], rede: true, trocas: [], algumTexto: false, forcado }; }
  tops.forEach((t, i) => { t.chave = itens[i].palavra; t.apoio_palavras = itens[i].vtxt; });
  ajustarLigacoes(tops, antigas);
  await Promise.all(tops.map(async t => {
    try { const v = await bibVersos(sigla, t.ref); t.verso = v ? v.map(x => x.texto).join(' ') : ''; } catch (e) { t.verso = ''; }
  }));
  if (forcado) { r.ok = 0; r.corrigidas = 0; }
  r.forcado = forcado;
  return r;
}

/* ---------- Conversa com a IA ---------- */
function lerJSON(txt) {
  let t = (txt || '').trim().replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  try { return JSON.parse(t); }
  catch (e) { return JSON.parse(t.replace(/,\s*([}\]])/g, '$1')); }
}

function textoDaResposta(j) {
  if (j.promptFeedback && j.promptFeedback.blockReason) throw new FormatoErro('bloqueado');
  const cand = (j.candidates || [])[0] || {};
  const txt = (((cand.content || {}).parts) || []).map(p => p.text || '').join('');
  if (!txt) throw new FormatoErro('sem texto');
  if (cand.finishReason === 'MAX_TOKENS') throw new FormatoErro('cortado');
  return txt;
}

async function pedir(modelo, chave, corpo) {
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(modelo) + ':generateContent';
  let ultimo;
  for (let t = 0; t < 3; t++) {
    let r, j;
    try {
      r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': chave }, body: JSON.stringify(corpo) });
      j = await r.json().catch(() => ({}));
    } catch (e) { ultimo = new Error('REDE'); await esperar(1500 * (t + 1)); continue; }
    if (r.ok) return j;
    const err = new Error((j.error && j.error.message) || ('Erro ' + r.status));
    err.status = r.status;
    if ([500, 502, 503, 504].includes(r.status)) { ultimo = err; await esperar(2000 * (t + 1)); continue; }
    throw err;
  }
  throw ultimo;
}

/* tenta o modelo escolhido e, se ele não existir ou estourar o limite, os próximos */
async function chamar(chave, corpo, escolhido) {
  const lista = [escolhido, ...MODELOS].filter((m, i, a) => m && a.indexOf(m) === i);
  let falha;
  for (const m of lista) {
    try { return await pedir(m, chave, corpo); }
    catch (e) {
      if (e.status === 404 || e.status === 429 || /no longer available|new users|not found|not supported/i.test(e.message || '')) { falha = e; continue; }
      throw e;
    }
  }
  throw falha;
}

let ULTIMO = null, TEMA_FIXO = '';
/* depois de gerar, trocar a tradução oferece refazer o esboço nela */
function sugerirRefazer() {
  if (!ULTIMO || modoEditor || $('gerar').disabled || $('saida').style.display === 'none') return;
  const sig = tradValida($('traducao').value);
  if (sig === ULTIMO.sigla || ULTIMO.texto !== $('texto').value.trim() || ULTIMO.tipo !== $('tipo').value) return;
  if (confirm('Refazer o esboço agora na tradução ' + nomeTrad(sig) + '?\n\nAs palavras tônicas e os versículos serão escolhidos de novo no texto da ' + sig + '.' + (ULTIMO.tema ? '\nO tema "' + ULTIMO.tema + '" é mantido.' : ''))) {
    TEMA_FIXO = $('tema').value.trim() ? '' : ULTIMO.tema;
    $('gerar').click();
  }
}
$('gerar').addEventListener('click', async () => {
  const tema = $('tema').value.trim() || TEMA_FIXO; TEMA_FIXO = '';
  const texto = $('texto').value.trim();
  const passagem = $('passagem').value.trim();
  const chave = $('chave').value.trim();
  const modelo = $('modelo').value.trim() || MODELOS[0];
  const msg = $('msg');
  msg.className = 'msg'; msg.textContent = '';
  if (!texto) { msg.className = 'msg erro'; msg.textContent = 'Informe o texto bíblico.'; return; }
  if (!chave) { msg.className = 'msg erro'; msg.textContent = 'Cole a chave da API do Google AI Studio.'; return; }
  localStorage.setItem('esboco_api_key', chave);
  localStorage.setItem('esboco_modelo', modelo);

  const btn = $('gerar'); btn.disabled = true;
  const sigla = tradValida($('traducao').value);
  const tipoSel = $('tipo').value, modo = TIPOS[tipoSel].modo;
  const porVersiculo = modo === 'tonicas' || modo === 'folha';
  try {
    let fonte = '', aviso = '', vs = null, picks = null;
    if (passagem) {
      fonte = 'Texto dos versículos colado pelo pastor (use como única fonte):\n' + passagem;
    } else {
      msg.textContent = 'Buscando o texto na ' + sigla + '...';
      try {
        vs = await bibVersos(sigla, texto);
        if (vs) fonte = 'Texto dos versículos na ' + nomeTrad(sigla) + ' (texto oficial desta tradução; use como única fonte e copie dele as palavras tônicas, letra por letra):\n' + vs.slice(0, 200).map(v => '[' + v.ref + '] ' + v.texto).join('\n');
        else aviso = ' Não entendi a referência "' + texto + '" para buscar o texto da Bíblia; a IA escreveu de memória, então confira os versículos.';
      } catch (e) { aviso = ' Não consegui buscar o texto da ' + sigla + ' (sem internet ou serviço fora do ar); a IA escreveu de memória, então confira os versículos.'; }
    }
    if (porVersiculo && vs) {
      msg.textContent = 'Escolhendo as palavras tônicas no texto da ' + sigla + '...';
      picks = await escolherTonicas(vs, sigla, tema, chave, modelo);
    }
    msg.textContent = 'Gerando o esboço... (pode levar até 1 minuto)';
    const pedido = 'Texto bíblico: ' + texto +
      (fonte ? '\n' + fonte : '') +
      (picks ? '\nPALAVRAS TÔNICAS JÁ ESCOLHIDAS NO TEXTO DA ' + sigla + ' (obrigatório: use exatamente estas como chave de cada versículo, na ordem, um tópico por versículo; a ligacao de cada tópico termina apontando para a chave do próximo tópico):\n' + vs.map((v, i) => v.ref + ' → ' + picks[i]).join('\n') : '') +
      '\nTema: ' + (tema || '(crie um tema curto e forte)') +
      '\nTradução bíblica: ' + nomeTrad(sigla) + '. As palavras tônicas (chave) e os trechos de versículos devem ser exatamente desta tradução; se o texto dos versículos veio acima, ele manda. O exemplo do sistema serve só de formato (foi escrito em Neemias e em outra tradução): não reaproveite palavras dele.' +
      '\nTipo de esboço: ' + TIPOS[tipoSel].regra;
    const corpo = {
      systemInstruction: { parts: [{ text: INSTRUCAO }] },
      contents: [{ role: 'user', parts: [{ text: pedido }] }],
      generationConfig: { temperature: 0.7, responseMimeType: 'application/json', maxOutputTokens: 16384 }
    };
    let pronto = false, conf = null, temaFinal = '';
    for (let tentativa = 0; tentativa < 2 && !pronto; tentativa++) {
      const j = await chamar(chave, corpo, modelo);
      try {
        const dn = normalizar(lerJSON(textoDaResposta(j)));
        if (!passagem) {
          msg.textContent = 'Conferindo as palavras com o texto da ' + sigla + '...';
          conf = await conferirEsboco(dn, sigla, chave, modelo, { vs: porVersiculo ? vs : null, picks });
        }
        temaFinal = dn.tema;
        render(dn, TIPOS[tipoSel].nome, modo);
        pronto = true;
      } catch (e) {
        if (!(e instanceof FormatoErro || e instanceof SyntaxError)) throw e;
        if (tentativa === 1) throw e;
        msg.textContent = 'Ajustando o formato, tentando de novo...';
      }
    }
    ULTIMO = { texto, tema: temaFinal, tipo: tipoSel, sigla };
    const resumo = passagem ? ' Usei o texto que você colou.' : ((conf && conf.forcado) ? ' Palavras tônicas escolhidas no texto da ' + sigla + '.' : '') + (conf ? ' ' + bibResumo(conf, sigla) : '');
    msg.textContent = ('Esboço pronto (' + sigla + ').' + resumo + aviso + ' Confira os versículos de apoio na sua Bíblia.').replace(/\s+/g, ' ');
    if (aviso || (conf && (conf.pendentes.length || conf.rede))) msg.className = 'msg erro';
    $('saida').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    msg.className = 'msg erro';
    let m = e.message || String(e);
    if (m === 'REDE') m = 'Sem conexão com a internet. Confira o sinal e tente de novo.';
    else if (e instanceof FormatoErro && e.message === 'bloqueado') m = 'A IA recusou esse pedido. Tente reescrever o tema.';
    else if (e instanceof FormatoErro || e instanceof SyntaxError) m = 'A IA devolveu um formato inesperado. Clique em Gerar de novo.';
    else if (/API key not valid|API_KEY_INVALID|API key expired/i.test(m)) m = 'Chave da API inválida. Crie ou copie outra no Google AI Studio.';
    else if (e.status === 429 || /quota|RESOURCE_EXHAUSTED/i.test(m)) m = 'Limite de uso da chave atingido. Espere um pouco e tente de novo.';
    else if (e.status === 404 || /no longer available|new users|not found/i.test(m)) m = 'Esse modelo não está disponível. Troque o campo Modelo por gemini-3.8-flash.';
    else if ([500, 502, 503, 504].includes(e.status)) m = 'O servidor do Google está sobrecarregado. Tente de novo em um minuto.';
    msg.textContent = m;
  } finally {
    btn.disabled = false;
  }
});
