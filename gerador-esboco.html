<title>Gerador de Esboço de Sermão</title>
<style>

  #saida { display:none; }

#saida.ed.imp .ed-barra, #saida.ed.imp .ed-dica, #saida.ed.imp .ed-ctl { display:none !important; }

    #saida.ed .ed-barra, #saida.ed .ed-dica, #saida.ed .ed-ctl { display:none !important; }
    #saida.ed .ed-folha { box-shadow:none; border:0; margin:0; padding:0; max-width:none; background:#fff; }
    #saida.ed .ed-item { padding:0; margin-bottom:6pt; }
    #saida.ed .ed-hr { margin:5pt 0 8pt; }
    #saida.ed [contenteditable]:hover, #saida.ed [contenteditable]:focus { background:none; }

  @media print { .form, .rodape { display:none !important; } body { padding:0; } .folha { max-width:none; margin:0; } #saida { break-inside:avoid; page-break-inside:avoid; } }

<body>
<div class="folha">

  <div class="form">
    <h2>Gerador de Esboço de Sermão</h2>
    <label for="texto">Texto bíblico</label>
    <input id="texto" type="text" placeholder="Ex.: Neemias 1:1-11">
    <label for="tema">Tema (opcional)</label>
    <input id="tema" type="text" placeholder="Ex.: A dor do outro chegou na minha casa">
    <label for="tipo">Tipo de esboço</label>
    <select id="tipo">
      <option value="expositivo">Expositivo — segue o texto versículo por versículo</option>
      <option value="tematico">Temático — parte do tema, com versículos de apoio</option>
      <option value="textual">Textual — só as ideias principais do texto</option>
      <option value="limpo">Limpo e objetivo — 2 subtópicos por ponto</option>
      <option value="tonicas">Palavras tônicas — uma palavra por versículo</option>
      <option value="folha">Palavras tônicas em 1 folha — verbo + palavra forte (14 x 22 cm)</option>
    </select>
    <label for="passagem">Texto dos versículos (opcional, deixa o esboço mais fiel)</label>
    <textarea id="passagem" placeholder="Cole aqui os versículos da sua Bíblia, se quiser"></textarea>
    <div class="linha">
      <div>
        <label for="chave">Chave da API (Google AI Studio)</label>
        <input id="chave" type="password" placeholder="Cole sua chave aqui (fica salva neste aparelho)" autocomplete="off">
      </div>
      <div>
        <label for="modelo">Modelo</label>
        <input id="modelo" type="text">
      </div>
    </div>
    <div class="botoes">
      <button id="gerar">Gerar esboço</button>
    </div>
    <label style="font-weight:normal"><input id="detalhes" type="checkbox" style="width:auto"> Mostrar detalhes (ilustração, passos práticos, ligações, oração)</label>
    <div id="msg" class="msg" role="status"></div>
    <div class="peq">Sem tema, a IA cria um. Sempre confira os versículos de apoio na sua Bíblia antes de pregar. Ao imprimir, o esboço sai em uma folha de 14 x 22 cm (escolha tamanho real, sem ajustar à página). Chave grátis em <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.</div>
  </div>

  <div id="saida"></div>

  <div class="rodape" id="rodape" style="display:none">
    <button class="sec" onclick="window.print()">Imprimir / Salvar PDF</button>
  </div>
</div>

<script>
/* ---------- Esboço de exemplo (também serve de modelo para a IA) ---------- */
const EXEMPLO = {
 tema: "a dor do outro chegou na minha casa",
 palavra_chave: "AVANÇAR",
 contraponto: "recuar",
 referencia: "Neemias 1:1-11",
 introducao: "Neemias, copeiro do rei em Susã: homem de confiança, vida estável, perto do trono. Nome: \"o Senhor consola\".",
 gancho: "Neemias estava bem, no palácio. A dor era do outro, mas bateu na porta dele pedindo ajuda. Ele podia recuar. Ele **AVANÇOU**.",
 ilustracao_titulo: "a águia e a tempestade",
 ilustracao: "Diante da tempestade a águia não foge: abre as asas e deixa o vento levantá-la. Neemias fez igual: a dor do outro virou voo de oração, e o voo virou ação.",

  { titulo: "A dor bate na porta: quem recua fecha a porta, quem AVANÇA abre, escuta e sente", nota: "",
    topicos: [
     { chave:"PERGUNTEI", direcao:"Avançar é abrir a porta e perguntar para ajudar", ref:"Ne 1:1-2",
       subs:[{titulo:"A dor veio até ele",texto:"Hanani trouxe o pedido de ajuda",ref:"Ne 1:2"},{titulo:"Pergunta para ajudar",texto:"não por curiosidade",ref:"Fp 2:4 · Gl 6:2"}],
       pratica:"Procure detalhes da situação para ajudar, não para comentar.", ligacao:"Perguntou, e a resposta veio: miséria. Agora que sabe, não dá para ficar de fora." },
     { chave:"MISÉRIA", direcao:"Avançar é sofrer com quem sofre", ref:"Ne 1:3",
       subs:[{titulo:"Ele estava bem, mas soube",texto:"miséria e desprezo, muros derribados, portas queimadas",ref:"Ne 1:3"},{titulo:"A notícia vira dor real",texto:"se um sofre, todos sofrem",ref:"1 Co 12:26 · Hb 13:3"}],
       pratica:"", ligacao:"Reconhecida a dor, ela desce do ouvido para o coração: chorou." },
     { chave:"CHOREI", direcao:"Avançar é chorar com quem chora", ref:"Ne 1:4",
       subs:[{titulo:"Sentir a mesma dor",texto:"com sinceridade",ref:"Rm 12:15"},{titulo:"O choro vira oração",texto:"não morre em lágrima",ref:"Ne 1:4"}],
       pratica:"Sinta a dor com muita sinceridade.", ligacao:"Dor assim é pesada demais para carregar sozinho: ele a leva a Deus." }
    ] },
  { titulo: "A dor vai ao trono: quem recua se vira sozinho, quem AVANÇA olha para Deus", nota: "a ORAÇÃO de Neemias, Ne 1:5-11, “dia e noite”",
    topicos: [
     { chave:"GRANDE", direcao:"Avançar é confiar no Deus grande", ref:"Ne 1:5",
       subs:[{titulo:"O quadro é feio",texto:"mas Deus é maior e pode mudá-lo",ref:"Jr 32:17"},{titulo:"Peça direção",texto:"antes de agir",ref:"Tg 1:5"}],
       pratica:"Ore pedindo direção a Deus.", ligacao:"Diante do Deus grande, ele enxerga também as decisões fora da direção: confessa." },
     { chave:"CONFESSO", direcao:"Avançar é admitir a desobediência", ref:"Ne 1:6-7",
       subs:[{titulo:"O sofrimento tem causa",texto:"decisões fora da direção de Deus",ref:"Pv 28:13"},{titulo:"Não aponta o dedo",texto:"se inclui",ref:"Ne 1:6-7 · 1 Jo 1:9"}],
       pratica:"", ligacao:"Confessado o erro, ele pede com base no que Deus prometeu." },
     { chave:"LEMBRA-TE", direcao:"Avançar é lembrar: cair é nosso, levantar é de Deus", ref:"Ne 1:8-9",
       subs:[{titulo:"Cair é nosso",texto:"nossas escolhas",ref:"Pv 24:16"},{titulo:"Levantar é de Deus",texto:"ele prometeu",ref:"Sl 37:24"}],
       pratica:"", ligacao:"E o que garante que Deus levanta? Ele já nos resgatou." },
     { chave:"RESGATASTE", direcao:"Avançar é lembrar de onde Deus nos tirou", ref:"Ne 1:10",
       subs:[{titulo:"Resgatados da maior miséria",texto:"a vida de perdição",ref:"Ef 2:4-5"},{titulo:"Não ignore a miséria do outro",texto:"de graça recebemos, de graça damos",ref:"Mt 10:8"}],
       pratica:"", ligacao:"Resgatado e com a graça de Deus ao lado, não há mais por que recuar: ele age." }
    ] },
  { titulo: "A casa vira ponte: quem recua se omite, quem AVANÇA age", nota: "",
    topicos: [
     { chave:"PROSPERAR", direcao:"Avançar é agir com a graça de Deus", ref:"Ne 1:11",
       subs:[{titulo:"Orar não dispensa agir",texto:"é dever pôr-se em pé e ajudar",ref:"Tg 4:17"},{titulo:"Graça para agir",texto:"a oração termina em ação: pede para falar com o rei",ref:"Ne 1:11 · Gl 6:10"}],

    ] }

 fechamento: "Quando a dor do outro chegar na minha casa: **AVANÇAR**.",
 resumo_verbos: "Perguntar · Sentir · Orar · Agir.",
 oracao_de: "Neemias",
 oracao: "Deus, tu és grande · confessamos · lembra-te da tua promessa · somos teu povo resgatado · dá-nos graça para agir.",
 apoio: [{ref:"Mt 22:39",ideia:"amar o próximo"},{ref:"Gl 6:2",ideia:"levar as cargas"},{ref:"Rm 12:15",ideia:"chorar com quem chora"},{ref:"Tg 4:17",ideia:"saber o bem e não fazer"},{ref:"1 Jo 3:17-18",ideia:"amar de fato"},{ref:"Ne 2:18",ideia:"levantar-se e agir"}]
};

/* ---------- Instruções para a IA ---------- */
const INSTRUCAO = `Você prepara esboços de pregação para um pastor evangélico brasileiro de 63 anos, que precisa de esboços SIMPLES e REDUZIDOS. Escreva em português do Brasil, direto, com palavras simples. Frases curtas, sem parágrafos: o pastor passa os olhos e prega. Na dúvida entre dizer mais ou dizer menos, diga menos. Meta: o esboço inteiro com cerca de 500 a 700 palavras.

PRINCÍPIOS OBRIGATÓRIOS

1. FIDELIDADE AO TEXTO. Se o pastor colou o texto dos versículos, ele é a única fonte. Se não colou, use a tradução Almeida e só afirme o que você tem certeza que o texto diz. Não invente fatos, nomes, números ou detalhes que o texto não traz. Siga o TIPO DE ESBOÇO pedido (veja TIPOS abaixo). Nunca force uma aplicação que o texto não sustenta.

2. TEMA E PALAVRA-CHAVE. Use o tema recebido, com as palavras do pastor (se o tema não combinar com o texto, ajuste o mínimo possível). Sem tema, crie um curto e forte, ligado à situação do texto. Crie uma PALAVRA-CHAVE: um verbo de ação no infinitivo, em maiúsculas, que RESPONDE ao tema (ex.: AVANÇAR), com um contraponto também verbo (ex.: recuar). O corpo todo se liga à palavra-chave e ela aponta de volta para o tema.

3. INTRODUÇÃO: 1 ou 2 frases: quem é a pessoa, onde está, qual a situação do texto. Sem quebra-gelo, sem humor.

4. GANCHO: 3 a 4 frases curtas, em afirmações, SEM perguntas, ligado ao tema, terminando na palavra-chave conjugada (ex.: "Ele AVANÇOU."). Marque essa palavra com ** assim: **AVANÇOU**.

5. ILUSTRAÇÃO (opcional): ilustracao_titulo curto (ex.: "a águia e a tempestade") e ilustracao com 2 linhas ligadas à palavra-chave. Use só imagem simples e verdadeira (natureza, cena do dia a dia). Não invente histórias "reais", estatísticas nem citações de pessoas. Se não encaixar bem, deixe os dois campos vazios.

6. ABERTURA_CORPO: uma frase que começa com "A partir do momento que..." ou "Quando...", põe o ouvinte na situação do tema e termina com dois pontos.

7. PARTES: 2 ou 3 partes. O titulo de cada parte contrasta os dois caminhos, usando o contraponto e a palavra-chave em maiúsculas (ex.: "quem recua se omite, quem AVANÇA age"). NÃO escreva "Parte 1" no título. O campo nota só se preenche quando a parte corresponde a uma oração, salmo ou discurso do próprio texto (ex.: "a ORAÇÃO de Neemias, Ne 1:5-11"); senão fica vazio.

8. CADA TÓPICO:
 (a) chave: UMA palavra tirada do próprio versículo, a mais marcante, em maiúsculas. Nenhuma chave se repete.
 (b) direcao: 3 a 9 palavras, no formato "<Palavra-chave> é ..." (ex.: "Avançar é sofrer com quem sofre").
 (c) ref: só a referência abreviada. NUNCA transcreva o versículo.
 (d) subs: exatamente 2. Cada um com titulo (2 a 6 palavras), texto (até 8 palavras) e ref de apoio.
 (e) pratica: um passo de aplicação em uma linha, no imperativo, só nos tópicos que pedem. Sem numeração, sem "1º" (o sistema numera).
 (f) ligacao: uma frase curta que termina apontando para a chave do próximo tópico. No último tópico fica vazia. Aqui pode haver pergunta. Cada tópico precisa nascer do anterior.

9. REFERÊNCIAS: use abreviaturas assim: Gn, Êx, Lv, Nm, Dt, Js, Jz, Rt, 1 Sm, 2 Sm, 1 Rs, 2 Rs, 1 Cr, 2 Cr, Ed, Ne, Et, Jó, Sl, Pv, Ec, Ct, Is, Jr, Lm, Ez, Dn, Os, Jl, Am, Ob, Jn, Mq, Na, Hc, Sf, Ag, Zc, Ml, Mt, Mc, Lc, Jo, At, Rm, 1 Co, 2 Co, Gl, Ef, Fp, Cl, 1 Ts, 2 Ts, 1 Tm, 2 Tm, Tt, Fm, Hb, Tg, 1 Pe, 2 Pe, 1 Jo, 2 Jo, 3 Jo, Jd, Ap. Só use referência que você conhece bem e que realmente diz o que o sub-tópico afirma. Se não tiver certeza, troque por outra que conheça. Nunca invente.

10. PRÁTICAS: no total 3 ou 4 passos, em sequência lógica, espalhados nos tópicos certos. Seus verbos formam o resumo_verbos.

11. ORAÇÃO: se o texto traz uma oração, preencha oracao com os pedidos em sequência, na ordem da oração do texto, separados por " · ", em linguagem de "nós". Preencha oracao_de com o nome de quem orou. Se não há oração no texto, deixe os dois vazios.

12. FECHAMENTO: fechamento é uma frase que RESPONDE ao tema com a palavra-chave marcada com ** (ex.: "Quando a dor do outro chegar na minha casa: **AVANÇAR**."). resumo_verbos: 3 ou 4 verbos no infinitivo, separados por " · ", terminando com ponto.

13. APOIO: de 4 a 6 referências para o sermão inteiro, cada uma com ideia de 2 a 4 palavras.

14. MARCAÇÃO: o sinal ** só pode aparecer no gancho e no fechamento, uma vez em cada, na palavra-chave. Em nenhum outro campo.

15. CAMPOS EXTRAS (só nos tipos PALAVRAS TÔNICAS e 1 FOLHA; nos outros tipos ficam vazios; o campo verbo só existe no tipo 1 FOLHA): curiosidade = um fato curto (até 12 palavras) sobre o versículo ou o cenário, ligado ao tema; só use fato que você sabe ter certeza (lugar, nome, significado, época, costume do texto); na dúvida, deixe vazio. apoio_ref = um versículo de apoio de outro trecho da Bíblia, que você conhece bem e que realmente reforça a ideia do tópico. apoio_palavras = de 3 a 6 palavras que aparecem nesse versículo de apoio, na tradução Almeida, só para lembrar o versículo, sem aspas; na dúvida, deixe vazio.

TIPOS DE ESBOÇO (o pedido informa qual usar; o formato do JSON é o mesmo para todos):
- EXPOSITIVO: cubra a passagem do começo ao fim, na ordem, juntando versículos vizinhos. 5 a 8 tópicos (máximo 9).
- TEMÁTICO: parta do tema; o texto principal é a base e versículos de outros livros dão apoio. 3 a 5 tópicos; o ref de cada tópico pode ser de outro livro. 1 ou 2 partes bastam.
- TEXTUAL: tire do texto só as ideias principais, na ordem. 3 a 4 tópicos. 1 ou 2 partes bastam.
- LIMPO E OBJETIVO, PALAVRAS TÔNICAS e 1 FOLHA: seguem exatamente o que o pedido descrever e SUBSTITUEM as regras acima onde forem diferentes (por exemplo, campos que o pedido manda deixar vazios ficam vazios).

NÃO FAÇA: tese; apelo (o apelo é do pastor); transcrição de versículos; parágrafos longos; perguntas no gancho; quebra-gelo, piadas ou humor; jargão teológico; texto em markdown.

/* Folha para a Bíblia: 14 cm x 22 cm (área útil 13 x 21 cm). Ao imprimir, ajusta o tamanho para caber em UMA folha. */
function caberNaFolha() {
  if (modoEditor) { caberEditor(); return; }
  const sd = $('saida');
  if (!sd || sd.style.display === 'none') return;
  const ref = document.createElement('div');
  ref.style.cssText = 'position:absolute;visibility:hidden;height:0;width:100mm';
  document.body.appendChild(ref);
  const pxmm = ref.getBoundingClientRect().width / 100;
  ref.remove();
  const L = 130, A = 210;
  let z = 1.4;
  for (; z >= 0.35; z -= 0.02) {
    sd.style.zoom = z;
    sd.style.width = (L / z) + 'mm';
    if (sd.getBoundingClientRect().height <= A * pxmm) break;
  }
}
function soltarFolha() { if (modoEditor) { soltarEditor(); return; } const sd = $('saida'); if (sd) { sd.style.zoom = ''; sd.style.width = ''; } }
window.addEventListener('beforeprint', caberNaFolha);
window.addEventListener('afterprint', soltarFolha);

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}
function add(pai, tag, cls, txt) { const e = el(tag, cls, txt); pai.appendChild(e); return e; }
function tx(pai, t) { pai.appendChild(document.createTextNode(t)); }

/* Escreve texto; trechos entre ** viram destaque amarelo. Se a IA esquecer o **,
   destaca sozinho a palavra parecida com a palavra-chave (qual: 'primeiro' ou 'ultimo'). */
function rico(pai, txt, kw, qual) {
  txt = txt || '';
  if (txt.indexOf('**') >= 0) {
    txt.split(/\*\*(.+?)\*\*/).forEach((p, i) => {
      p = p.replace(/\*\*/g, '');
      if (!p) return;
      if (i % 2) add(pai, 'span', 'hl', p); else tx(pai, p);
    });
    return;
  }
  if (kw && qual) {
    const radical = kw.trim().toUpperCase().slice(0, Math.max(4, kw.trim().length - 3));
    const ms = [...txt.matchAll(/[\p{L}]+/gu)].filter(m => radical.length >= 4 && m[0].toUpperCase().startsWith(radical));
    if (ms.length) {
      const m = qual === 'ultimo' ? ms[ms.length - 1] : ms[0];
      tx(pai, txt.slice(0, m.index));
      add(pai, 'span', 'hl', m[0]);
      tx(pai, txt.slice(m.index + m[0].length));
      return;
    }
  }
  tx(pai, txt);
}

/* ---------- Limpeza e validação do que a IA devolve ---------- */
function normalizar(d) {
  if (!d || typeof d !== 'object') throw new FormatoErro('vazio');
  const s = v => (v === undefined || v === null) ? '' : String(v).trim();
  const semMarca = v => s(v).replace(/^[➜↓→•\-–\s]+/, '').replace(/^\d+\s*[º°]\s*[·.:\-–]?\s*/, '');
  const r = {
    tema: s(d.tema), palavra_chave: s(d.palavra_chave).toUpperCase(), contraponto: s(d.contraponto).toLowerCase(),
    referencia: s(d.referencia), introducao: s(d.introducao), gancho: s(d.gancho),
    ilustracao_titulo: s(d.ilustracao_titulo), ilustracao: s(d.ilustracao), abertura_corpo: s(d.abertura_corpo),
    fechamento: s(d.fechamento), resumo_verbos: s(d.resumo_verbos), oracao_de: s(d.oracao_de), oracao: s(d.oracao),
    partes: [], apoio: []
  };
  if (!r.ilustracao) r.ilustracao_titulo = '';
  if (!r.oracao) r.oracao_de = '';
  (Array.isArray(d.partes) ? d.partes : []).forEach(p => {
    const topicos = [];
    (Array.isArray(p && p.topicos) ? p.topicos : []).forEach(t => {
      if (!t || !s(t.chave)) return;
      const subs = (Array.isArray(t.subs) ? t.subs : []).slice(0, 2)
        .map(b => ({ titulo: s(b && b.titulo), texto: s(b && b.texto), ref: s(b && b.ref) }))
        .filter(b => b.titulo || b.texto);
      topicos.push({
        chave: s(t.chave).toUpperCase(), direcao: s(t.direcao), ref: s(t.ref), subs,
        pratica: semMarca(t.pratica), ligacao: semMarca(t.ligacao), verbo: s(t.verbo).toUpperCase(),
        curiosidade: s(t.curiosidade), apoio_ref: s(t.apoio_ref), apoio_palavras: s(t.apoio_palavras).replace(/^["“”]+|["“”]+$/g, '')
      });
    });
    if (topicos.length) {
      r.partes.push({
        titulo: s(p.titulo).replace(/^parte\s*\d+\s*[·:.\-–]?\s*/i, ''),
        nota: s(p.nota).replace(/^\(|\)$/g, ''), topicos
      });
    }
  });
  if (!r.partes.length) throw new FormatoErro('sem tópicos');
  const ult = r.partes[r.partes.length - 1].topicos;
  ult[ult.length - 1].ligacao = '';
  (Array.isArray(d.apoio) ? d.apoio : []).forEach(a => { if (a && s(a.ref)) r.apoio.push({ ref: s(a.ref), ideia: s(a.ideia) }); });
  return r;
}

/* ---------- Desenho do esboço ---------- */
function render(d, rotulo, modo) {
  if (modo === 'folha') { montarFolha(d); return; }
  const s = $('saida'); s.innerHTML = ''; sairEditor();
  const kw = d.palavra_chave;
  document.querySelector('.folha').classList.toggle('limpo', modo === 'limpo');
  if (modo === 'tonicas') {
    add(s, 'div', 'ref', d.referencia + ' · ' + rotulo);
    if (d.tema) {
      const f = add(s, 'div', 'fluxo');
      add(f, 'span', 't-tema', 'TEMA: ' + d.tema);
      if (kw) {
        add(f, 'b', '', '➜');
        const pc = add(f, 'span', 'pc t-pc', 'PALAVRA-CHAVE: ' + kw);
        if (d.contraponto) { tx(pc, ' '); add(pc, 'small', '', '(ou ' + d.contraponto + ')'); }
      }
    }
    let k = 0;
    d.partes.forEach(p => p.topicos.forEach(t => {
      k++;
      const box = add(s, 'div', 'top');
      add(box, 'div', 'num', String(k));
      const c = add(box, 'div');
      const l1 = add(c, 'div', 'linha1');
      add(l1, 'span', 'chave', t.chave);
      if (t.direcao) add(l1, 'span', 'dir t-tema', t.direcao);
      add(l1, 'span', 'vers', t.ref);
      if (t.curiosidade) add(c, 'div', 't-cur', 'Curiosidade: ' + t.curiosidade);
      if (t.apoio_ref) {
        const ap = add(c, 'div', 't-apoio');
        tx(ap, 'Apoio: ' + t.apoio_ref + ' ');
        if (t.apoio_palavras) add(ap, 'span', 't-azul', t.apoio_palavras);
      }
      if (t.ligacao) add(c, 'div', 't-lig', '↓ ' + t.ligacao);
    }));
    if (d.fechamento) {
      const fe = add(s, 'div', 'bloco fecho');
      add(fe, 'b', 't', 'Fechamento · o tema respondido');
      rico(fe, d.fechamento, kw, 'primeiro');
    }
    s.style.display = 'block';
    $('rodape').style.display = 'block';
    return;
  }
  add(s, 'div', 'ref', d.referencia + (rotulo ? ' · Esboço ' + rotulo.toLowerCase() : ''));
  const f = add(s, 'div', 'fluxo');
  add(f, 'span', '', 'TEMA: ' + d.tema);
  add(f, 'b', '', '➜');
  const pc = add(f, 'span', 'pc', 'PALAVRA-CHAVE: ' + kw);
  if (d.contraponto) { tx(pc, ' '); add(pc, 'small', '', '(ou ' + d.contraponto + ')'); }

  const intro = add(s, 'div', 'bloco');
  add(intro, 'b', 't', 'Introdução');
  rico(intro, d.introducao);
  if (d.gancho) {
    const g = add(intro, 'div', 'gancho');
    add(g, 'b', '', 'GANCHO: ');
    rico(g, d.gancho, kw, 'ultimo');
  }
  if (d.ilustracao) {
    const il = add(s, 'div', 'bloco det');
    add(il, 'b', 't', 'Ilustração' + (d.ilustracao_titulo ? ': ' + d.ilustracao_titulo : ''));
    rico(il, d.ilustracao);
  }
  if (d.abertura_corpo) add(s, 'div', 'quando', d.abertura_corpo);

  let n = 0, passo = 0;
  d.partes.forEach((p, i) => {
    add(s, 'div', 'grupo', 'Parte ' + (i + 1) + ' · ' + p.titulo + (p.nota ? ' (' + p.nota + ')' : ''));
    p.topicos.forEach(t => {
      n++;
      const box = add(s, 'div', 'top');
      add(box, 'div', 'num', String(n));
      const c = add(box, 'div');
      const l1 = add(c, 'div', 'linha1');
      add(l1, 'span', 'chave', t.chave);
      add(l1, 'span', 'dir', t.direcao);
      add(l1, 'span', 'vers', t.ref);
      if (t.subs.length) {
        const ol = add(c, 'ol', 'subs');
        t.subs.forEach(sb => {
          const li = add(ol, 'li');
          if (sb.titulo) add(li, 'b', '', sb.titulo);
          if (sb.texto) { const sp = add(li, 'span', 'det-i'); tx(sp, sb.titulo ? ' — ' : ''); rico(sp, sb.texto); }
          tx(li, ' ');
          if (sb.ref) add(li, 'span', 'sref', '(' + sb.ref + ')');
        });
      }
      if (t.pratica) { passo++; add(c, 'div', 'aplic det', '➜ ' + passo + 'º · ' + t.pratica); }
      if (t.ligacao) add(c, 'div', 'ponte det', '↓ ' + t.ligacao);
    });
  });

  const fe = add(s, 'div', 'bloco fecho');
  add(fe, 'b', 't', 'Fechamento · o tema respondido');
  rico(fe, d.fechamento, kw, 'primeiro');
  if (d.resumo_verbos) { add(fe, 'br'); add(fe, 'b', '', d.resumo_verbos); }
  if (d.oracao) {
    const o = add(fe, 'div', 'orac det');
    add(o, 'b', '', 'Momento de oração' + (d.oracao_de ? ' (como ' + d.oracao_de + ')' : '') + ': ');
    tx(o, d.oracao);
  }
  if (d.apoio.length) {
    const b = add(s, 'div', 'bloco base');
    add(b, 'b', 't', 'Apoio bíblico');
    d.apoio.forEach((a, i) => {
      if (i) tx(b, ' · ');
      add(b, 'b', '', a.ref);
      tx(b, ' ' + a.ideia);
    });
  }
  s.style.display = 'block';
  $('rodape').style.display = 'block';
}

    {verbo:'ORA', palavra:'RESGATASTE', frase:'é lembrar de onde Deus me tirou', lig:'Quem lembra o resgate... serve como COPEIRO', vref:'1Pe 2:10', vtxt:'agora sois povo de Deus'},
    {verbo:'AGE', palavra:'COPEIRO', frase:'é pôr o que Deus me deu a serviço', lig:'', vref:'Is 6:8', vtxt:'eis-me aqui, envia-me a mim'}
  ]
};
function edVazio() { return {verbo:'', palavra:'', frase:'', lig:'', vref:'', vtxt:''}; }
function edCopia(o) { return JSON.parse(JSON.stringify(o)); }
function edSalvar() { try { localStorage.setItem(ED_CHAVE, JSON.stringify(ED)); } catch (e) {} }
function edCarregar() {
  try {
    const t = localStorage.getItem(ED_CHAVE);
    if (t) { const o = JSON.parse(t); if (o && Array.isArray(o.itens) && o.itens.length) return o; }
  } catch (e) {}
  return edCopia(ED_EXEMPLO);
}
function paginaAjustar(on) {
  let st = $('pgstyle');
  if (!st) { st = document.createElement('style'); st.id = 'pgstyle'; document.head.appendChild(st); }
  st.textContent = on ? '@page { size: 14cm 22cm; margin: 5mm; }' : '';
}
function sairEditor() {
  modoEditor = false;
  const s = $('saida'); s.classList.remove('ed'); s.classList.remove('imp');
  paginaAjustar(false);
}
function edCampo(cls, ph, valor, aoMudar, tag) {
  const e = el(tag || 'span', cls, valor || '');
  e.setAttribute('contenteditable', 'true'); e.setAttribute('data-ph', ph);
  e.addEventListener('input', () => { aoMudar(e.textContent); edSalvar(); edMarcar(); });
  e.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); e.blur(); } });
  e.addEventListener('paste', ev => {
    ev.preventDefault();
    const t = (ev.clipboardData || window.clipboardData).getData('text').replace(/\s+/g, ' ');
    document.execCommand('insertText', false, t);
  });
  return e;
}
function edBtn(pai, txt, titulo, fn, cls) {
  const b = add(pai, 'button', cls || '', txt); b.type = 'button'; b.title = titulo; b.onclick = fn; return b;
}
function edAplicarTam() {
  const fs = ED.fs || 10, s = $('saida');
  s.style.setProperty('--edfss', (fs * 1.6) + 'px');
  s.style.setProperty('--edpt', fs + 'pt');
}
function edTam(d) { ED.fs = Math.max(6, Math.min(16, (ED.fs || 10) + d)); edSalvar(); edAplicarTam(); }

/* Converte o esboço gerado pela IA para a folha de 1 página (verbo + palavra forte) */
function montarFolha(d) {
  const kw = d.palavra_chave || '';
  const topicos = [];
  d.partes.forEach(p => p.topicos.forEach(t => topicos.push(t)));
  const titulo = (d.tema || '').replace(/^./, c => c.toUpperCase());
  const tema = kw ? (kw + (d.contraponto ? ' ou ' + d.contraponto.toUpperCase() : '')) : '';
  ED = {
    fs: 10,
    titulo: titulo,
    ref: d.referencia || '',
    tema: tema,
    fech: (d.fechamento || '').replace(/\*\*/g, ''),
    apelo: '',
    itens: topicos.map(t => ({
      verbo: t.verbo || '',
      palavra: t.chave,
      frase: (t.direcao || '').replace(/^[^\s]+\s+(?=é\s)/i, ''),
      lig: t.ligacao || '',
      vref: t.apoio_ref || '',
      vtxt: t.apoio_palavras || ''
    }))
  };
  edSalvar();
  abrirEditor(ED);
}

function abrirEditor(estado) {
  modoEditor = true;
  ED = estado || edCarregar();
  const s = $('saida'); s.innerHTML = ''; s.classList.add('ed');
  paginaAjustar(true);
  $('msg').className = 'msg'; $('msg').textContent = '';

  const barra = add(s, 'div', 'ed-barra');
  edBtn(barra, '🖨 Imprimir', 'Imprimir ou salvar em PDF', () => window.print(), 'ed-prin');
  edBtn(barra, '＋ Tópico', 'Acrescentar tópico', edAdd);
  edBtn(barra, 'A −', 'Letra menor', () => edTam(-0.5));
  edBtn(barra, 'A ＋', 'Letra maior', () => edTam(0.5));
  edBtn(barra, '💾 Salvar arquivo', 'Baixar o esboço como arquivo', edBaixar);
  edBtn(barra, '📂 Abrir arquivo', 'Abrir um esboço salvo', () => $('edabrir').click());
  edBtn(barra, '📄 Novo em branco', 'Começar outro tema', edNovo);
  const inp = add(s, 'input'); inp.type = 'file'; inp.id = 'edabrir'; inp.accept = '.json,application/json'; inp.style.display = 'none';
  inp.addEventListener('change', edAbrirArquivo);
  add(s, 'div', 'ed-dica', 'Toque em qualquer texto da folha para escrever. Tudo é salvo sozinho neste aparelho. Ao imprimir, o papel é 14 x 22 cm: escolha tamanho real (100%), sem ajustar à página.');

  const f = add(s, 'div', 'ed-folha'); f.id = 'edfolha';
  [['ed-titulo', 'Título do sermão', 'titulo', 'div'], ['ed-ref', 'Texto bíblico', 'ref', 'div'], ['ed-tema', 'Tema / ideia central', 'tema', 'div']].forEach(c => {
    f.appendChild(edCampo(c[0], c[1], ED[c[2]], v => { ED[c[2]] = v; }, c[3]));
  });
  add(f, 'div', 'ed-hr');
  const lista = add(f, 'div'); lista.id = 'edlista';
  add(f, 'div', 'ed-hr');
  const rod = add(f, 'div', 'ed-rodape');
  const p = add(rod, 'p'); add(p, 'b', '', 'FECHAMENTO: ');
  p.appendChild(edCampo('', 'Frase de fechamento', ED.fech, v => { ED.fech = v; }));
  const ap = add(rod, 'div', 'ed-apelo'); add(ap, 'span', '', 'APELO:');
  ap.appendChild(edCampo('ed-linha-apelo', '', ED.apelo, v => { ED.apelo = v; }));

  edRender(); edAplicarTam();
  s.style.display = 'block'; $('rodape').style.display = 'block';
}

function edRender() {
  const lista = $('edlista'); lista.innerHTML = '';
  ED.itens.forEach((it, i) => {
    const d = add(lista, 'div', 'ed-item');
    const ctl = add(d, 'div', 'ed-ctl');
    edBtn(ctl, '↑', 'Subir', () => edMover(i, -1));
    edBtn(ctl, '↓', 'Descer', () => edMover(i, 1));
    edBtn(ctl, '✕', 'Apagar tópico', () => edApagar(i));
    const l1 = add(d, 'div', 'ed-linha');
    add(l1, 'span', 'ed-n', String(i + 1));
    l1.appendChild(edCampo('ed-verbo', 'verbo', it.verbo, v => { it.verbo = v; }));
    l1.appendChild(edCampo('ed-palavra', 'PALAVRA', it.palavra, v => { it.palavra = v; }));
    add(l1, 'span', 'ed-traco');
    l1.appendChild(edCampo('', 'frase do ponto', it.frase, v => { it.frase = v; }));
    const l2 = add(d, 'div', 'ed-lig'); l2.setAttribute('data-v', 'lig');
    tx(l2, '↓ ');
    l2.appendChild(edCampo('', 'ligação com o próximo ponto', it.lig, v => { it.lig = v; }));
    const l3 = add(d, 'div', 'ed-apoio'); l3.setAttribute('data-v', 'apoio');
    l3.appendChild(edCampo('ed-vref', 'Livro 0:0', it.vref, v => { it.vref = v; }));
    tx(l3, ' – ');
    l3.appendChild(edCampo('', 'texto do versículo de apoio', it.vtxt, v => { it.vtxt = v; }));
  });
  edMarcar();
}
function edMarcar() {
  const itens = document.querySelectorAll('#edlista .ed-item');
  itens.forEach((d, i) => {
    const it = ED.itens[i]; if (!it) return;
    d.querySelector('[data-v="lig"]').classList.toggle('ed-vazio', !it.lig.trim());
    d.querySelector('[data-v="apoio"]').classList.toggle('ed-vazio', !(it.vref.trim() || it.vtxt.trim()));
  });
}
function edAdd() {
  ED.itens.push(edVazio()); edSalvar(); edRender();
  const cs = document.querySelectorAll('#edlista .ed-item'); const u = cs[cs.length - 1];
  if (u.scrollIntoView) u.scrollIntoView({ block: 'center' });
  const p = u.querySelector('.ed-verbo'); if (p) p.focus();
}
function edMover(i, d) {
  const j = i + d; if (j < 0 || j >= ED.itens.length) return;
  const t = ED.itens[i]; ED.itens[i] = ED.itens[j]; ED.itens[j] = t; edSalvar(); edRender();
}
function edApagar(i) {
  if (!confirm('Apagar o tópico ' + (i + 1) + '?')) return;
  ED.itens.splice(i, 1); if (!ED.itens.length) ED.itens.push(edVazio());
  edSalvar(); edRender();
}
function edNovo() {
  if (!confirm('Começar um esboço em branco? O que está na tela será apagado (salve o arquivo antes, se quiser guardar).')) return;
  ED = { fs: ED.fs || 10, titulo: '', ref: '', tema: '', fech: '', apelo: '', itens: [edVazio()] };
  edSalvar(); abrirEditor(ED);
}
function edExemplo() {
  if (!confirm('Voltar ao exemplo (Neemias)? O que está na tela será substituído.')) return;
  ED = edCopia(ED_EXEMPLO); edSalvar(); abrirEditor(ED);
}
function edBaixar() {
  const nome = (ED.titulo || 'esboco').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'esboco';
  const b = new Blob([JSON.stringify(ED, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nome + '.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function edAbrirArquivo(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || !Array.isArray(o.itens)) throw 0;
      o.itens = o.itens.map(x => { const v = edVazio(); for (const k in v) v[k] = String((x && x[k]) || ''); return v; });
      if (!o.itens.length) o.itens.push(edVazio());
      ['titulo', 'ref', 'tema', 'fech', 'apelo'].forEach(k => { o[k] = String(o[k] || ''); });
      o.fs = Number(o.fs) || 10;
      ED = o; edSalvar(); abrirEditor(ED);
    } catch (err) { alert('Este arquivo não é um esboço válido.'); }
  };
  r.readAsText(f); e.target.value = '';
}
/* Impressão: reduz a letra, se precisar, para caber em UMA folha de 14 x 22 cm */
function caberEditor() {
  const f = $('edfolha'), s = $('saida'); if (!f) return;
  s.classList.add('imp');
  const ref = document.createElement('div');
  ref.style.cssText = 'position:absolute;visibility:hidden;height:0;width:100mm';
  document.body.appendChild(ref);
  const pxmm = ref.getBoundingClientRect().width / 100; ref.remove();
  f.style.width = '130mm';
  let fs = ED.fs || 10;
  for (; fs >= 6; fs -= 0.25) {
    f.style.fontSize = fs + 'pt';
    if (f.getBoundingClientRect().height <= 208 * pxmm) break;
  }
}
function soltarEditor() {
  const f = $('edfolha'), s = $('saida');
  s.classList.remove('imp');
  if (f) { f.style.width = ''; f.style.fontSize = ''; }
}

/* ---------- Conversa com a IA ---------- */
function lerJSON(txt) {
  let t = (txt || '').trim().replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  try { return JSON.parse(t); }
  catch (e) { return JSON.parse(t.replace(/,\s*([}\]])/g, '$1')); }
}

function textoDaResposta(j) {
  if (j.promptFeedback && j.promptFeedback.blockReason) throw new FormatoErro('bloqueado');
  const cand = (j.candidates || [])[0] || {};
  const txt = (((cand.content || {}).parts) || []).map(p => p.text || '').join('');
  if (!txt) throw new FormatoErro('sem texto');
  if (cand.finishReason === 'MAX_TOKENS') throw new FormatoErro('cortado');
  return txt;
}

async function pedir(modelo, chave, corpo) {
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(modelo) + ':generateContent';
  let ultimo;
  for (let t = 0; t < 3; t++) {
    let r, j;
    try {
      r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': chave }, body: JSON.stringify(corpo) });
      j = await r.json().catch(() => ({}));
    } catch (e) { ultimo = new Error('REDE'); await esperar(1500 * (t + 1)); continue; }
    if (r.ok) return j;
    const err = new Error((j.error && j.error.message) || ('Erro ' + r.status));
    err.status = r.status;
    if ([500, 502, 503, 504].includes(r.status)) { ultimo = err; await esperar(2000 * (t + 1)); continue; }
    throw err;
  }
  throw ultimo;
}

/* tenta o modelo escolhido e, se ele não existir ou estourar o limite, os próximos */
async function chamar(chave, corpo, escolhido) {
  const lista = [escolhido, ...MODELOS].filter((m, i, a) => m && a.indexOf(m) === i);
  let falha;
  for (const m of lista) {
    try { return await pedir(m, chave, corpo); }
    catch (e) {
      if (e.status === 404 || e.status === 429 || /no longer available|new users|not found|not supported/i.test(e.message || '')) { falha = e; continue; }
      throw e;
    }
  }
  throw falha;
}

$('gerar').addEventListener('click', async () => {
  const tema = $('tema').value.trim();
  const texto = $('texto').value.trim();
  const passagem = $('passagem').value.trim();
  const chave = $('chave').value.trim();
  const modelo = $('modelo').value.trim() || MODELOS[0];
  const msg = $('msg');
  msg.className = 'msg'; msg.textContent = '';
  if (!texto) { msg.className = 'msg erro'; msg.textContent = 'Informe o texto bíblico.'; return; }
  if (!chave) { msg.className = 'msg erro'; msg.textContent = 'Cole a chave da API do Google AI Studio.'; return; }
  localStorage.setItem('esboco_api_key', chave);
  localStorage.setItem('esboco_modelo', modelo);

  const btn = $('gerar'); btn.disabled = true; msg.textContent = 'Gerando o esboço... (pode levar até 1 minuto)';
  try {
    const pedido = 'Texto bíblico: ' + texto +
      (passagem ? '\nTexto dos versículos (use como única fonte):\n' + passagem : '') +
      '\nTema: ' + (tema || '(crie um tema curto e forte)') +
      '\nTipo de esboço: ' + TIPOS[$('tipo').value].regra;
    const corpo = {
      systemInstruction: { parts: [{ text: INSTRUCAO }] },
      contents: [{ role: 'user', parts: [{ text: pedido }] }],
      generationConfig: { temperature: 0.7, responseMimeType: 'application/json', maxOutputTokens: 16384 }
    };
    let pronto = false;
    for (let tentativa = 0; tentativa < 2 && !pronto; tentativa++) {
      const j = await chamar(chave, corpo, modelo);
      try {
        render(normalizar(lerJSON(textoDaResposta(j))), TIPOS[$('tipo').value].nome, TIPOS[$('tipo').value].modo);
        pronto = true;
      } catch (e) {
        if (!(e instanceof FormatoErro || e instanceof SyntaxError)) throw e;
        if (tentativa === 1) throw e;
        msg.textContent = 'Ajustando o formato, tentando de novo...';
      }
    }
    msg.textContent = 'Esboço pronto. Confira os versículos de apoio na sua Bíblia.';
    $('saida').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    msg.className = 'msg erro';
    let m = e.message || String(e);
    if (m === 'REDE') m = 'Sem conexão com a internet. Confira o sinal e tente de novo.';
    else if (e instanceof FormatoErro && e.message === 'bloqueado') m = 'A IA recusou esse pedido. Tente reescrever o tema.';
    else if (e instanceof FormatoErro || e instanceof SyntaxError) m = 'A IA devolveu um formato inesperado. Clique em Gerar de novo.';
    else if (/API key not valid|API_KEY_INVALID|API key expired/i.test(m)) m = 'Chave da API inválida. Crie ou copie outra no Google AI Studio.';
    else if (e.status === 429 || /quota|RESOURCE_EXHAUSTED/i.test(m)) m = 'Limite de uso da chave atingido. Espere um pouco e tente de novo.';
    else if (e.status === 404 || /no longer available|new users|not found/i.test(m)) m = 'Esse modelo não está disponível. Troque o campo Modelo por gemini-3.8-flash.';
    else if ([500, 502, 503, 504].includes(e.status)) m = 'O servidor do Google está sobrecarregado. Tente de novo em um minuto.';
    msg.textContent = m;
  } finally {
    btn.disabled = false;
  }
});
