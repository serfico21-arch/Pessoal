<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Esboço de Sermão</title>
<style>
  *{box-sizing:border-box}
  body{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;max-width:720px;margin:0 auto;padding:16px;line-height:1.35}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:#555;margin-bottom:14px}
  label{display:block;font-weight:bold;margin:12px 0 4px}
  input,textarea{width:100%;font-size:17px;padding:10px;border:2px solid #111;border-radius:6px;font-family:inherit}
  textarea{min-height:90px}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  button{font-size:17px;font-weight:bold;padding:12px 14px;border:2px solid #111;background:#111;color:#fff;border-radius:6px;cursor:pointer}
  button.s{background:#fff;color:#111}
  button:disabled{opacity:.5}
  #gerar{width:100%;margin-top:14px;font-size:19px}
  #msg{margin-top:10px;font-weight:bold}
  .erro{color:#b00020}
  details{margin-top:14px;border:1px solid #bbb;border-radius:6px;padding:8px 10px}
  summary{cursor:pointer;font-weight:bold}
  .small{font-size:14px;color:#555;margin-top:4px}
  #saida{margin-top:22px;border-top:3px solid #111;padding-top:14px}
  #saida h1{font-size:26px}
  .tese{border:2px solid #111;padding:10px 12px;margin:14px 0 18px;font-size:18px;font-weight:bold}
  .b{border:2px dashed #111;padding:10px 12px;margin:0 0 14px}
  .b h2{font-size:15px;letter-spacing:1px;text-transform:uppercase;margin:0 0 6px;color:#555}
  .b p{font-size:19px;margin:6px 0}
  ol{padding-left:0;list-style:none;counter-reset:n}
  li{counter-increment:n;border-bottom:1px solid #ccc;padding:14px 0}
  li::before{content:counter(n) ".";font-size:24px;font-weight:bold;margin-right:8px}
  .k{font-size:28px;font-weight:bold;text-transform:uppercase}
  .d{font-size:20px;margin-left:34px;margin-top:4px}
  .r{font-size:15px;color:#555;margin-left:34px}
  .a{font-size:17px;margin-left:34px;margin-top:6px;padding-left:10px;border-left:3px solid #111}
  .fim{margin-top:20px;border:2px solid #111;padding:10px 12px;font-size:18px}
  .acoes{margin-top:18px}
  @media print{.nao-imprimir{display:none!important}body{padding:0}#saida{border-top:0;margin-top:0;padding-top:0}}
</style>
</head>
<body>

<div class="nao-imprimir">
  <h1>Gerador de Esboço de Sermão</h1>
  <div class="sub">Digite o tema ou o texto bíblico e receba o esboço no seu formato.</div>

  <label for="tema">Tema ou texto bíblico</label>
  <input id="tema" placeholder="Ex.: Salmos 92:10-15, chamados para frutificar">

  <label for="publico">Para quem é o culto? (opcional)</label>
  <input id="publico" placeholder="Ex.: seniors, jovens, famílias, culto de missões">

  <div class="row">
    <div>
      <label for="qtd">Quantos tópicos?</label>
      <input id="qtd" type="number" min="3" max="8" value="5">
    </div>
    <div>
      <label for="intro">Introdução?</label>
      <input id="intro" list="op" value="Sim">
      <datalist id="op"><option value="Sim"><option value="Não"></datalist>
    </div>
  </div>

  <details id="cfg">
    <summary>Configuração da IA (uma vez só)</summary>
    <label for="chave">Chave do Google AI Studio</label>
    <input id="chave" type="password" placeholder="Cole sua chave aqui" autocomplete="off">
    <div class="small">Fica salva só neste aparelho.</div>
    <label for="modelo">Modelo</label>
    <input id="modelo" placeholder="gemini-3.6-flash">
    <div class="small">Se der erro de modelo, o sistema tenta outros sozinho.</div>
  </details>

  <button id="gerar">Gerar esboço</button>
  <div id="msg"></div>
</div>

<div id="saida" hidden></div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var MODELOS = ['gemini-3.6-flash','gemini-2.5-flash','gemini-2.0-flash','gemini-flash-latest'];

  function guardar(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function ler(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}

  $('chave').value = ler('esb_chave');
  $('modelo').value = ler('esb_modelo');
  if(!$('chave').value) $('cfg').open = true;

  function esc(t){
    return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});
  }
  function msg(t,erro){var m=$('msg');m.textContent=t||'';m.className=erro?'erro':''}

  function montarPrompt(tema,publico,qtd,comIntro){
    return 'Você é um assistente de pastor evangélico brasileiro. Monte um esboço de sermão em português do Brasil, no estilo de prédica rápida: o pregador quase não lê, só passa os olhos.\n\n'+
    'TEMA OU TEXTO: '+tema+'\n'+
    (publico?'PÚBLICO: '+publico+'\n':'')+
    '\nREGRAS:\n'+
    '- Técnica: uma ÚNICA palavra-chave tirada de cada versículo ou trecho, para defender a tese.\n'+
    '- Se for um texto bíblico, siga a ordem dos versículos e use só o que o texto realmente diz.\n'+
    '- Se for só um tema, escolha os textos bíblicos de apoio e cite a referência de cada um (somente referências que existem).\n'+
    '- Exatamente '+qtd+' tópicos.\n'+
    '- "palavra": UMA palavra só.\n'+
    '- "direcao": 3 a 4 palavras, sem parágrafo.\n'+
    '- "argumento": no máximo 2 frases curtas, linguagem simples, com 1 ou 2 expressões-chave entre <b> e </b>. Se usar exemplo bíblico, que seja real e correto.\n'+
    '- "tese": uma frase forte e curta.\n'+
    '- "apelo": uma frase curta.\n'+
    (comIntro?'- "intro": 2 linhas contrastantes que prendam a atenção, cada uma com "rotulo" (ex.: "Mundo diz", "Deus diz") e "texto" curto.\n':'- "intro": lista vazia.\n')+
    '\nResponda SOMENTE com JSON neste formato, sem markdown:\n'+
    '{"titulo":"","texto_base":"","tese":"","intro":[{"rotulo":"","texto":""}],"topicos":[{"palavra":"","direcao":"","ref":"","argumento":""}],"apelo":""}';
  }

  function limparJSON(t){
    t = String(t||'').replace(/```json|```/g,'').trim();
    var a=t.indexOf('{'), b=t.lastIndexOf('}');
    if(a>=0 && b>a) t=t.slice(a,b+1);
    return JSON.parse(t);
  }

  async function chamar(modelo,chave,prompt){
    var url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(modelo)+':generateContent';
    var r = await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':chave},
      body:JSON.stringify({
        contents:[{role:'user',parts:[{text:prompt}]}],
        generationConfig:{temperature:0.6,responseMimeType:'application/json'}
      })
    });
    var dados = await r.json().catch(function(){return {}});
    if(!r.ok){
      var e = new Error((dados.error&&dados.error.message)||('Erro '+r.status));
      e.status = r.status; e.texto = e.message;
      throw e;
    }
    var parts = dados.candidates&&dados.candidates[0]&&dados.candidates[0].content&&dados.candidates[0].content.parts;
    var txt = (parts||[]).map(function(p){return p.text||''}).join('');
    if(!txt) throw new Error('A IA não devolveu texto. Tente de novo.');
    return limparJSON(txt);
  }

  function modeloIndisponivel(e){
    var t=(e.texto||'').toLowerCase();
    return e.status===404 || (e.status===400 && t.indexOf('model')>=0) || t.indexOf('no longer available')>=0 || t.indexOf('not found')>=0 || t.indexOf('new users')>=0;
  }

  function desenhar(d){
    var h='<h1>'+esc(d.titulo||'Esboço')+'</h1>';
    h+='<div class="sub">'+esc(d.texto_base||'')+'</div>';
    h+='<div class="tese">TESE: '+esc(d.tese)+'</div>';
    if(d.intro && d.intro.length){
      h+='<div class="b"><h2>Introdução</h2>';
      d.intro.forEach(function(i){h+='<p><b>'+esc(i.rotulo)+':</b> '+esc(i.texto)+'</p>'});
      h+='</div>';
    }
    h+='<ol>';
    (d.topicos||[]).forEach(function(t){
      // o argumento pode ter <b>; libera só essa tag
      var arg = esc(t.argumento).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');
      h+='<li><span class="k">'+esc(t.palavra)+'</span>'+
         '<div class="d">'+esc(t.direcao)+'</div>'+
         '<div class="r">'+esc(t.ref)+'</div>'+
         '<div class="a">'+arg+'</div></li>';
    });
    h+='</ol>';
    h+='<div class="fim"><b>APELO:</b> '+esc(d.apelo)+'</div>';
    h+='<div class="acoes nao-imprimir"><div class="row">'+
       '<button class="s" id="imprimir">Imprimir / PDF</button>'+
       '<button class="s" id="copiar">Copiar texto</button></div></div>';
    $('saida').innerHTML=h;
    $('saida').hidden=false;
    $('imprimir').onclick=function(){window.print()};
    $('copiar').onclick=function(){
      var linhas=[d.titulo,d.texto_base,'','TESE: '+d.tese,''];
      (d.intro||[]).forEach(function(i){linhas.push(i.rotulo+': '+i.texto)});
      if(d.intro&&d.intro.length)linhas.push('');
      (d.topicos||[]).forEach(function(t,n){
        linhas.push((n+1)+'. '+String(t.palavra).toUpperCase()+' - '+t.direcao+' ('+t.ref+')');
        linhas.push('   '+String(t.argumento).replace(/<\/?b>/g,''));
      });
      linhas.push('','APELO: '+d.apelo);
      var txt=linhas.join('\n');
      var ok=function(){$('copiar').textContent='Copiado!'};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok)}
      else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(ta)}
    };
    $('saida').scrollIntoView({behavior:'smooth'});
  }

  $('gerar').onclick=async function(){
    var tema=$('tema').value.trim();
    var chave=$('chave').value.trim();
    if(!tema){msg('Digite o tema ou o texto bíblico.',true);return}
    if(!chave){msg('Cole a chave do Google AI Studio na configuração.',true);$('cfg').open=true;return}
    guardar('esb_chave',chave);
    var escolhido=$('modelo').value.trim();
    guardar('esb_modelo',escolhido);

    var qtd=Math.max(3,Math.min(8,parseInt($('qtd').value,10)||5));
    var comIntro=$('intro').value.trim().toLowerCase().indexOf('n')!==0;
    var prompt=montarPrompt(tema,$('publico').value.trim(),qtd,comIntro);

    var lista=(escolhido?[escolhido]:[]).concat(MODELOS.filter(function(m){return m!==escolhido}));
    $('gerar').disabled=true;
    var ultimoErro=null;
    for(var i=0;i<lista.length;i++){
      msg('Montando o esboço...'+(i>0?' (tentando '+lista[i]+')':''));
      try{
        var d=await chamar(lista[i],chave,prompt);
        if(!d.topicos||!d.topicos.length) throw new Error('Esboço veio incompleto. Tente de novo.');
        desenhar(d);
        msg('');
        if(lista[i]!==escolhido){$('modelo').value=lista[i];guardar('esb_modelo',lista[i])}
        $('gerar').disabled=false;
        return;
      }catch(e){
        ultimoErro=e;
        if(!modeloIndisponivel(e)) break;
      }
    }
    var t=(ultimoErro&&ultimoErro.texto)||(ultimoErro&&ultimoErro.message)||'Erro desconhecido';
    if(ultimoErro&&ultimoErro.status===429) t='Limite de uso da chave atingido. Espere um pouco e tente de novo.';
    else if(ultimoErro&&(ultimoErro.status===401||ultimoErro.status===403)) t='A chave não foi aceita. Confira se colou inteira. Resposta do Google: '+((ultimoErro.texto||'').slice(0,220));
    msg(t,true);
    $('gerar').disabled=false;
  };
})();
</script>
</body>
</html>
