<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ligar postagem automática</title>
<meta name="robots" content="noindex">
<script type="text/javascript" src="https://me.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=JzcXG55ICJxvNqRgPVj5AN5HZfh1a50lA-yti3yjPOq8qAIYx_VnxOMYpoTEsQahUTJ9_HW2Gkw2_VSYwq1CM26bywn_UuhWN7xtIL4aIQPPrkhorhsP787uFDWXLNLi9eCOsSLrq-hgLJqslmoxItKjg6yPqQBepTK8CQY4qlCwuCGsVMyrOZ-SU0b9Q8aUPigis6KkNhncNSbddcC3yyKY-xSnD7LIVehu5TY2Ie5ht38bObS3A6pQ2nUTNWjbhIQ8dRe0yYTLGC4G2gk0YA" charset="UTF-8"></script><link rel="stylesheet" crossorigin="anonymous" href="https://me.kis.v2.scr.kaspersky-labs.com/E3E8934C-235A-4B0E-825A-35A08381A191/abn/main.css?attr=aHR0cHM6Ly8xNDUyNTYzMjg3OTQ2NzYwLmEubWV0YWFpdXNlcmNvbnRlbnQuY29tL2h0bWw_YXJ0aWZhY3RfdXVpZD05OTFlZDI1NC00NjNkLTQ5YzItOGZjYi1iYzc3YWY4YTcwYWQmZG93bmxvYWQ9Q29uZWN0YXItTWV0YS1GaW5hbC5odG1sJmV4dD0xNzk1ODEzMjAwJmhhc2g9UTVmcERBR3hMR0VQMnY1VFpBMzJZc19NN1NXTA"/><style>
:root{--bg:#f1f5fa;--c:#fff;--tx:#0d1b2e;--m:#4f5d75;--l:#d3dce8;--az:#1d6fb8;--ok:#0a7d3b;--okbg:#e5f6ec;--am:#9a5b00;--ambg:#fff4dd;--er:#b42318}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--tx);font:19px/1.5 system-ui,sans-serif}
header{background:#1E3A5F;color:#fff;padding:14px 16px}
main{max-width:760px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:16px;margin-bottom:14px}
.n{display:inline-flex;width:38px;height:38px;border-radius:50%;background:var(--az);color:#fff;font-weight:800;align-items:center;justify-content:center;margin-right:8px}
h2{font-size:20px;margin:0 0 10px;display:flex;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;border-radius:14px;border:0;background:var(--az);color:#fff;font:700 18px system-ui,sans-serif;cursor:pointer;margin-top:10px}
.btn.ok{background:var(--ok)}
label{display:block;font-weight:700;margin:12px 0 4px}
input,textarea,select{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid var(--l);border-radius:12px;background:var(--bg);color:var(--tx)}
.aviso{background:var(--ambg);border:1px solid var(--am);border-radius:12px;padding:12px;margin-top:10px}
.dica{background:var(--okbg);border:1px solid var(--ok);border-radius:12px;padding:12px;margin-top:10px}
.mut{color:var(--m);font-size:16px} .hide{display:none}
</style>
</head>
<body>
<main>
<div class="card"><p>Faça isto <b>uma vez só</b>. Depois, é só tocar em <b>📣 DIVULGAR</b> no Publicador.</p></div>

<div class="card"><h2><span class="n">5</span>Colar aqui e conectar</h2>
<label>ID do app</label><input id="app" inputmode="numeric" autocomplete="off" placeholder="1234567890123456" value="1169481185588897">
<label>Chave secreta do app</label><input id="sec" autocomplete="off" placeholder="letras e números" type="password">
<div class="dica"><b>Jeito fácil:</b> com ID e chave preenchidos, use Entrar com Facebook.</div>
<button class="btn" id="entrar">🔵 Entrar com Facebook</button>
<p class="mut">Se der Invalid Scopes, <a href="#" id="entrar2">clique aqui</a>.</p>
<label>Código grande (começa com EAA)</label><textarea id="tok" rows="3" autocomplete="off" placeholder="EAA..."></textarea>
<button class="btn" id="ir">🔌 Conectar</button>
<button class="btn" id="testar" style="background:#666">🔎 Testar este código</button>
<div id="msg"></div>
<div id="pag" class="hide"><label>Qual é a sua Página?</label><select id="sel"></select><button class="btn" id="usar">Usar esta Página</button></div>
</div>

<div class="card hide" id="fim"><h2><span class="n">6</span>Guardar a chave no GitHub</h2>
<button class="btn ok" id="cp">📋 Copiar a chave</button>
<textarea id="chave" rows="3" readonly style="margin-top:12px"></textarea>
</div>
</main>
<script>
(function(){
"use strict";
var G="https://graph.facebook.com/v20.0",paginas=[],VOLTA="https://serfico21-arch.github.io/Pessoal/conectar-meta.html";
function $(i){return document.getElementById(i)}
function msg(t,ok){$("msg").innerHTML='<div class="'+(ok?"dica":"aviso")+'">'+t+'</div>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function get(u){return fetch(u).then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error.message);return j})}

// CORREÇÃO AQUI: aceita EAA com -, _, . e pega sempre o último token válido
function pegaToken(v){
  v=String(v||"").trim();
  if(!v) return "";
  // remove quebras de linha e espaços duplicados
  v=v.replace(/\s+/g,"");
  // pega todos os tokens que começam com EAA
  var m=v.match(/EAA[A-Za-z0-9_\-\.]+/g);
  if(m && m.length){
    // retorna o mais longo / último (quando cola por cima do antigo)
    var best=m[m.length-1];
    for(var i=0;i<m.length;i++){ if(m[i].length>best.length) best=m[i]; }
    return best;
  }
  return v;
}

$("tok").addEventListener("paste",function(e){
  var c=(e.clipboardData||window.clipboardData);
  if(!c) return;
  var x=c.getData("text");
  if(!x) return;
  e.preventDefault();
  this.value=x.trim();
});

function conectar(){
  var a=$("app").value.replace(/\D/g,""),s=$("sec").value.replace(/\s/g,""),t=pegaToken($("tok").value);
  if(!t){msg("Cole o código grande (começa com EAA) ou use o botão Entrar com Facebook.");return}
  if(t.length<50){msg("Esse código parece curto demais. Copie de novo no Explorador, começando com EAA.");return}
  msg("⏳ Conectando…",true);
  var tem=!!(a&&s),q={grant_type:"fb_exchange_token",client_id:a,client_secret:s,fb_exchange_token:t},ID="id,name,access_token,instagram_business_account{id,username}";
  function post(u,d){return fetch(u,{method:"POST",body:new URLSearchParams(d)}).then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error.message);return j})}
  function confere(x){return get(G+"/debug_token?input_token="+encodeURIComponent(x)+"&access_token="+encodeURIComponent(a+"|"+s)).then(function(d){return d.data||{}})}
  function paginasDe(lt){return get(G+"/me/accounts?fields="+ID+"&limit=50&access_token="+encodeURIComponent(lt)).then(function(j){return j.data||[]},function(){return[]})}
  var pronto;
  if(tem){
    pronto=confere(t).then(function(d){
      if(d.is_valid===false) throw new Error("INVALIDO:"+(d.error&&d.error.message||"código inválido"));
      return d;
    },function(e){ throw new Error("CHAVE:"+e.message)})
    .then(function(d){
      if(d.type&&d.type!=="USER") return t;
      return post(G+"/oauth/access_token",q).catch(function(){return get(G+"/oauth/access_token?"+new URLSearchParams(q))}).then(function(j){return j.access_token||t},function(){return t})
    })
  }else{
    pronto=get(G+"/me?fields=id&access_token="+encodeURIComponent(t)).catch(function(e){throw new Error("SEM_CHAVE:"+e.message)})
  }
  pronto.then(paginasDe).then(function(l){
    paginas=l;
    if(!paginas.length){msg("O código foi aceito, mas não achei nenhuma Página. Toque em Entrar com Facebook de novo e marque sua Página e Instagram.");return}
    $("sel").innerHTML=paginas.map(function(p,i){return '<option value="'+i+'">'+esc(p.name)+(p.instagram_business_account?" + Instagram @"+esc(p.instagram_business_account.username||""):" (sem Instagram)")+'</option>'}).join("");
    var k=paginas.findIndex(function(p){return /costa|fcosta|rcm/i.test(p.name)}); if(k>-1) $("sel").value=k;
    $("pag").classList.remove("hide"); msg("✅ Conectou! Agora escolha sua Página.",true)
  }).catch(function(e){
    var m=e.message;
    if(/^CHAVE:/.test(m)){msg("O <b>ID ou Chave não conferem</b> ("+esc(m.slice(6))+").<br>1. Vá em Configurações do app > Básico<br>2. Copie o ID (só números)<br>3. Clique em Mostrar na Chave secreta, copie sem espaços<br>Se o erro ainda disser <b>input_token is required</b>, é porque o campo Código grande ficou vazio - cole o EAA de novo.");return}
    if(/^INVALIDO:/.test(m)){msg("A Meta diz que o código não vale: "+esc(m.slice(9))+"<br>Gere um novo token no Explorador (passo 4) - ele vence em 1 hora.");return}
    msg("Não deu certo: "+esc(m))
  })
}
$("ir").onclick=conectar;
$("testar").onclick=function(){
  var t=pegaToken($("tok").value);
  if(!t){msg("Cole o código grande primeiro.");return}
  window.open(G+"/me?fields=id,name&access_token="+encodeURIComponent(t),"_blank","noopener");
  msg("Abriu aba nova. Se aparecer seu nome, o código está bom.",true)
};
function PERM(velho){return "pages_show_list,pages_manage_posts,pages_read_engagement,instagram_basic,"+(velho?"instagram_content_publish":"instagram_manage_contents")+",business_management"}
function entrar(velho){
  var a=$("app").value.replace(/\D/g,"");
  if(!a){msg("Cole o ID do app.");return}
  try{sessionStorage.setItem("fc_login",JSON.stringify({app:a,sec:$("sec").value.replace(/\s/g,"")}))}catch(e){}
  var o={client_id:a,redirect_uri:VOLTA,response_type:"token",scope:PERM(velho)};
  location.href="https://www.facebook.com/v20.0/dialog/oauth?"+new URLSearchParams(o)
}
$("entrar").onclick=function(){entrar(false)};
$("entrar2").onclick=function(e){e.preventDefault();entrar(true)};
(function voltou(){
  var h=new URLSearchParams(location.hash.slice(1)),t=h.get("access_token"),erro=h.get("error_description");
  if(!t&&!erro) return;
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  var g={};try{g=JSON.parse(sessionStorage.getItem("fc_login")||"{}");}catch(e){}
  if(g.app) $("app").value=g.app; if(g.sec) $("sec").value=g.sec;
  if(!t){msg("Facebook não deixou entrar ("+esc(erro)+")");return}
  $("tok").value=t; conectar()
})();
$("usar").onclick=function(){
  var p=paginas[+$("sel").value]; if(!p) return;
  var c={token:p.access_token,page:p.id,ig:p.instagram_business_account?p.instagram_business_account.id:"",nome:"Sérgio Costa",creci:"CRECI-SP 294791-F",whats:"5511993509109"};
  $("chave").value=JSON.stringify(c); $("fim").classList.remove("hide");
  $("fim").scrollIntoView({behavior:"smooth"});
  $("tok").value=""; $("sec").value=""
};
$("cp").onclick=function(){navigator.clipboard.writeText($("chave").value).then(function(){msg("✅ Copiado! Cole no GitHub em META_CONFIG",true)})}
})();
</script>
</body>
</html>
