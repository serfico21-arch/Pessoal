<title>Conectar Meta - Facebook e Instagram</title>
<script>
/* A conexão com o Facebook e o Instagram agora fica DENTRO do index (janela "Ligar redes").
   Este arquivo só existe para links antigos (ex.: "Ligar agora"): ele leva para lá, saindo de qualquer moldura. */
(function () {
  var destino = "index.html#ligar-meta";
  try { if (window.top && window.top !== window && window.top.__liberarSaida) window.top.__liberarSaida(true); } catch (e) {}
  try { (window.top || window).location.replace(destino); } catch (e) { location.replace(destino); }
})();
</script>
