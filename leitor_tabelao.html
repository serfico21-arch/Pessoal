<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabelões + Simulador — FCosta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17212b;--mute:#5d6b79;--paper:#eef1f4;--card:#fff;--line:#d8dee5;--acc:#0b6e99;--acc-bg:#e3f1f8;--band:#17212b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Figtree,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.45}
header.top{background:var(--band);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px}
header.top .sp{flex:1}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:6px;font-weight:500}
button:hover,.btn:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{background:#095a7e;color:#fff}
:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
#drop{border:2px dashed #9fb0bf;border-radius:10px;padding:46px 20px;text-align:center;background:#f9fafb;color:var(--mute)}
#drop.over{border-color:var(--acc);background:var(--acc-bg);color:var(--acc)}
#drop strong{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
#status{margin:10px 0;color:var(--mute)}
#status.err{color:#b3261e}
.docs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.docs button{border-radius:6px 6px 0 0;border-bottom:none}
.docs button.on{background:var(--card);border-color:var(--ink);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:0}
.brand{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:150px;height:64px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mute);font-size:12px;text-align:center;cursor:pointer;padding:4px}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.brand input.nm{font:inherit;font-size:24px;font-weight:700;border:1px solid transparent;border-radius:6px;padding:2px 8px;margin-left:-8px;background:transparent;color:var(--ink);min-width:200px;width:min(420px,100%)}
.brand input.nm:hover,.brand input.nm:focus{border-color:var(--line);background:#fafbfc}
.brand .meta{color:var(--mute);font-size:13px;padding-left:2px}
.brand .sp{flex:1}
.tools{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools .vt{display:flex;gap:4px}
.tools .vt button{border-radius:6px}
.tools .vt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools input[type=search]{font:inherit;padding:7px 11px;border:1px solid var(--line);border-radius:6px;min-width:220px;flex:1;max-width:420px}
.body{padding:6px 18px 22px}
.pgl{margin:22px 0 4px;color:var(--mute);font-size:12px;font-weight:600}
section.sec{margin:16px 0 6px}
section.sec h3{margin:0 0 6px;font-size:16px;font-weight:700;padding-left:10px;border-left:4px solid var(--acc)}
.note{margin:6px 0;color:var(--mute)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 10px;border-bottom:1px solid #e8ecf0;text-align:left;vertical-align:top}
tr.hd th{background:var(--band);color:#fff;font-weight:600;font-size:12px;white-space:nowrap}
tbody tr:not(.hd):nth-child(even) td{background:#f7f9fb}
td.span{color:var(--mute);font-style:italic}
a.lk{color:var(--acc);font-weight:600;text-decoration:underline;text-underline-offset:2px}
a.lk:hover{background:var(--acc-bg)}
.pg{position:relative;margin:12px auto;max-width:1100px;border:1px solid var(--line);background:#fff}
.pg canvas{display:block;width:100%;height:auto}
.pg a.ov{position:absolute;background:rgba(11,110,153,.12);outline:1.5px solid rgba(11,110,153,.65);border-radius:2px}
.pg a.ov:hover{background:rgba(11,110,153,.3)}
.lt td.u{color:var(--mute);font-size:12px;word-break:break-all;max-width:420px}
.lt td.nolabel{color:var(--mute);font-style:italic}
.empty{padding:30px;text-align:center;color:var(--mute)}

.docs button.on.sim{background:var(--acc);color:#fff;border-color:var(--acc)}
.docs button.sim{border-color:var(--acc);color:var(--acc);font-weight:600}
button.sm{padding:3px 10px;font-size:12px;border-color:var(--acc);color:var(--acc);font-weight:600;white-space:nowrap}
button.sm:hover{background:var(--acc);color:#fff}
.sim{padding:6px 18px 24px}
.sc{margin:16px 0}
.sc>h3{margin:0 0 10px;font-size:16px;font-weight:700;padding-left:10px;border-left:4px solid var(--acc)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.g3,.g2{grid-template-columns:1fr}}
.fld label{display:block;font-size:12.5px;color:var(--mute);font-weight:600;margin-bottom:4px}
.fld input[type=text],.fld input[type=number]{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fafbfc}
.fld label.chk{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);padding:9px 0;font-size:14px}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.faixa{margin-top:12px;background:var(--acc-bg);border:1px solid #b9dcee;border-radius:6px;padding:8px 12px;font-weight:600}
.unitbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding:8px 12px;background:#f7f9fb;border:1px solid var(--line);border-radius:6px}
.unitbox .lbl{flex:1;min-width:200px}
.unitbox label{margin-right:10px;font-size:13px}
.pnl{border:1px solid var(--line);border-radius:8px;padding:14px}
.pnl.m{background:#eaf5fb;border-color:#b9dcee}.pnl.s{background:#f5f6f8}
.pnl h4{margin:0 0 10px;font-size:15px}
.inst{background:var(--band);color:#fff;border-radius:8px;text-align:center;padding:10px;margin-bottom:10px}
.inst small{display:block;font-size:11px;opacity:.8}.inst strong{font-size:26px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(0,0,0,.1);font-size:13.5px}
.ln:last-child{border-bottom:none}.ln b.wr{color:#b3261e}
.bad{background:#fdecea;color:#8a1c14;border-radius:6px;padding:10px 12px;font-weight:600}
.warn{margin-top:10px;background:#fff6e0;border:1px solid #f0d58a;border-radius:6px;padding:8px 12px;font-size:13px}
.eco{margin-top:12px;background:#e6f6ec;border:1px solid #bee7ce;border-radius:8px;text-align:center;padding:10px}
.eco b{display:block;font-size:22px;color:#1f8a4c}
.cap{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff}
.cap h4{margin:0 0 6px;font-size:14px}
.cta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.opt tr.ok td:nth-child(5) b{color:#1f8a4c}.opt tr.no td{color:#8b97a3}
.opt td.r,.opt th.r{text-align:right;white-space:nowrap}
.ru input{width:92px;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px}
.ru input.w{width:110px}
details.rg{border:1px solid var(--line);border-radius:8px;padding:6px 14px;margin:10px 0;background:#fff}
details.rg summary{cursor:pointer;font-weight:700;color:var(--acc);padding:6px 0}
.small{font-size:12.5px;color:var(--mute);line-height:1.55}
@media print{header.top,#drop,#status,.docs,.tools,.brand button{display:none!important}.panel{border:none}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <h1>Tabelões + Simulador de Financiamento</h1>
  <span class="sp"></span>
  <label class="btn pri" for="fi">Subir tabelão (PDF)</label>
  <input id="fi" type="file" accept="application/pdf" multiple hidden>
</header>
<main>
  <div id="drop"><strong>Arraste o tabelão aqui</strong>ou use o botão “Subir tabelão (PDF)”. Pode subir vários de uma vez.</div>
  <div id="status" role="status"></div>
  <div class="docs" id="docs"></div>
  <div id="panel"></div>
</main>
<input id="li" type="file" accept="image/*" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const ready=(async()=>{try{const r=await fetch(WORKER);pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(await r.blob());}catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc=WORKER;}})();

const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const k in(attrs||{})){if(k==='class')e.className=attrs[k];else if(k==='text')e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}kids.forEach(c=>c!=null&&e.append(c));return e;}
function safeUrl(u){try{const x=new URL(u);return['http:','https:','mailto:','tel:'].includes(x.protocol)?x.href:null;}catch(e){return null;}}
function linkEl(url,text,cls){return el('a',{href:url,target:'_blank',rel:'noopener noreferrer',class:cls||'lk',title:url,text});}

/* ---------- perfis (nome + logo) ---------- */
const KNOWN=['metrocasa','canopus','cyrela','mrv','tegra','plano&plano','vitacon','kazzas','tenda','direcional','even','living','eztec','cury','trisul','helbor','lavvi','vibra','vitta','today'];
function loadProfiles(){try{return JSON.parse(localStorage.getItem('tabelao_perfis')||'{}');}catch(e){return{};}}
function saveProfiles(p){try{localStorage.setItem('tabelao_perfis',JSON.stringify(p));}catch(e){setStatus('Não foi possível guardar o logo neste navegador.',true);}}
function detect(fileName,text){
  const f=fileName.toLowerCase();for(const k of KNOWN)if(f.includes(k))return k;
  const t=text.slice(0,500).toLowerCase();for(const k of KNOWN)if(t.includes(k))return k;
  return fileName.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').trim().toLowerCase();
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function resizeLogo(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const h=Math.min(160,im.height),w=im.width*h/im.height;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/png'));};im.onerror=rej;im.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}

/* ---------- leitura do PDF ---------- */
function toCells(line){
  const raw=line.items.sort((a,b)=>a.x-b.x),its=[];
  for(const it of raw){ // texto sobreposto (escondido sob o título): fica o menos repetido na página
    const L=its[its.length-1];
    if(L){const ov=Math.min(L.x+L.w,it.x+it.w)-Math.max(L.x,it.x);if(ov>.5*Math.min(L.w,it.w)){if(it.f<L.f||(it.f===L.f&&it.k>L.k))its[its.length-1]=it;continue;}}
    its.push(it);
  }
  const cells=[];let cur=null;
  for(const it of its){
    const gap=cur?it.x-cur.x1:0,thr=Math.max(3.5,it.h*1.1);
    if(cur&&gap<=thr){cur.t+=(gap>.8?' ':'')+it.s;cur.x1=Math.max(cur.x1,it.x+it.w);cur.y1=Math.max(cur.y1,it.y+it.h);cur.y0=Math.min(cur.y0,it.y);cur.k0=Math.min(cur.k0,it.k);cur.k1=Math.max(cur.k1,it.k);}
    else{cur={t:it.s,x0:it.x,x1:it.x+it.w,y0:it.y,y1:it.y+it.h,k0:it.k,k1:it.k};cells.push(cur);}
  }
  cells.forEach(c=>c.t=c.t.replace(/\s+/g,' ').trim());
  for(let i=0;i<cells.length-1;i++)if(cells[i].t==='R$'){cells[i].t='R$ '+cells[i+1].t;cells[i].x1=cells[i+1].x1;cells[i].k1=Math.max(cells[i].k1,cells[i+1].k1);cells[i].k0=Math.min(cells[i].k0,cells[i+1].k0);cells.splice(i+1,1);}
  return cells.filter(c=>c.t);
}
function attachLinks(cells,anns){
  for(const c of cells){
    const cx=(c.x0+c.x1)/2,cy=(c.y0+c.y1)/2;let best=null,ba=1e12;
    for(const a of anns){
      const[x0,y0,x1,y1]=a.rect,rx=(x0+x1)/2,ry=(y0+y1)/2;
      const in1=cx>=x0-2&&cx<=x1+2&&cy>=y0-2&&cy<=y1+2;
      const in2=rx>=c.x0-2&&rx<=c.x1+2&&ry>=c.y0-3&&ry<=c.y1+3;
      if(in1||in2){const ar=(x1-x0)*(y1-y0);if(ar<ba){ba=ar;best=a;}}
    }
    if(best){c.url=best.url;best.used=true;}
  }
}
async function parsePage(page){
  const tc=await page.getTextContent();
  const items=tc.items.map((i,k)=>({i,k})).filter(o=>o.i.str&&o.i.str.trim()).map(({i,k})=>({k,s:i.str.replace(/\s+/g,' '),x:i.transform[4],y:i.transform[5],w:i.width,h:Math.abs(i.height)||6}));
  const cnt={};items.forEach(i=>{cnt[i.s]=(cnt[i.s]||0)+1;});items.forEach(i=>{i.f=cnt[i.s];});
  items.sort((a,b)=>b.y-a.y||a.x-b.x);
  const lines=[];
  for(const it of items){const L=lines[lines.length-1];if(L&&Math.abs(L.y-it.y)<Math.max(1.5,it.h*.45))L.items.push(it);else lines.push({y:it.y,items:[it]});}
  const raw=await page.getAnnotations();
  const anns=raw.filter(a=>a.subtype==='Link'&&(a.url||a.unsafeUrl)).map(a=>{const r=a.rect;return{url:safeUrl(a.url||a.unsafeUrl),rect:[Math.min(r[0],r[2]),Math.min(r[1],r[3]),Math.max(r[0],r[2]),Math.max(r[1],r[3])],used:false};}).filter(a=>a.url);
  anns.forEach(a=>{const[x0,y0,x1,y1]=a.rect;a.label=items.filter(i=>{const cx=i.x+i.w/2,cy=i.y+i.h/2;return cx>=x0-2&&cx<=x1+2&&cy>=y0-3&&cy<=y1+3;}).sort((p,q)=>q.y-p.y||p.x-q.x).map(i=>i.s.trim()).join(' ').replace(/\s+/g,' ').trim();});
  const blocks=[];let cur=null,sec=null;let text='';
  for(const L of lines){
    const cells=toCells(L);if(!cells.length)continue;
    attachLinks(cells,anns);
    text+=cells.map(c=>c.t).join(' ')+'\n';
    const one=cells.length===1;
    if(one&&!cells[0].url&&/^(ZONA|REGI[ÃA]O|LAN[ÇC]AMENTOS)\b/i.test(cells[0].t)){blocks.push({type:'title',text:cells[0].t});cur=null;continue;}
    if(!one&&!cur){cur={type:'table',rows:[]};blocks.push(cur);}
    if(cur)cur.rows.push({cells,span:one&&(cells[0].t.length>45||cells[0].t[0]==='*')});
    else blocks.push({type:'note',cell:cells[0]});
  }
  return{blocks,anns,text};
}

/* ---------- renderização ---------- */
function columnsOf(rows){
  const iv=[];rows.forEach(r=>{if(!r.span)r.cells.forEach(c=>iv.push([c.x0,c.x1]));});
  iv.sort((a,b)=>a[0]-b[0]);const cols=[];
  for(const[a,b]of iv){const L=cols[cols.length-1];if(L&&a<L[1]-1)L[1]=Math.max(L[1],b);else cols.push([a,b]);}
  return cols;
}
function colIdx(c,cols){const cx=(c.x0+c.x1)/2;let k=cols.findIndex(([a,b])=>cx>=a-1&&cx<=b+1);if(k>=0)return k;let d=1e9;cols.forEach(([a,b],i)=>{const m=Math.abs(cx-(a+b)/2);if(m<d){d=m;k=i;}});return k;}
const PRICE_RE=/(\d{1,3}(?:\.\d{3})+,\d{2})/;
function analyze(rows){
  const cols=columnsOf(rows),n=cols.length;const head=Array(n).fill('');let prevHd=false;
  const info=rows.map(r=>{
    if(r.span){prevHd=false;return{r,span:true};}
    const slots=Array.from({length:n},()=>[]);
    r.cells.forEach(c=>slots[colIdx(c,cols)].push(c));
    const isHd=r.cells.some(c=>/^empreendimento$/i.test(c.t))||(prevHd&&!r.cells.some(c=>/\d/.test(c.t))&&r.cells.every(c=>c.t===c.t.toUpperCase())&&colIdx(r.cells[0],cols)>0);
    if(isHd){slots.forEach((s,i)=>{const t=s.map(c=>c.t).join(' ');if(t)head[i]+=(head[i]?' ':'')+t;});prevHd=true;return{r,slots,isHd};}
    prevHd=false;
    let tab=null,dsc=null;const parts=[],plain=[];
    slots.forEach((s,i)=>s.forEach(c=>{
      const h=head[i].toUpperCase();
      const m=c.t.match(PRICE_RE);
      if(m){
        if(/M2|M²/.test(h))return;
        const v=parseFloat(m[1].replace(/\./g,'').replace(',','.'));if(v<50000)return;
        if(/COM\s+DESCONTO|PROMOCIONAL/.test(h)){if(dsc==null)dsc=v;}else if(/PARTIR|TABELA/.test(h)){if(tab==null)tab=v;}else plain.push(v);
        return;
      }
      if(i===0||c.url||/%/.test(c.t)||/ENDERE|MESES|COMISS/.test(h)||/^-?R\$-?$/.test(c.t)||c.t==='-'||/^(R\.|Rua|Av\.|Al\.)\s/i.test(c.t))return;
      parts.push(/^\d$/.test(c.t)?c.t+' dorm':(/^\d+,\d{1,2}$/.test(c.t)?c.t+' m²':c.t));
    }));
    // sem cabeçalho (tabela continua na página seguinte): maior valor = tabela, menor = com desconto
    if(plain.length){plain.sort((a,b)=>b-a);if(tab==null)tab=plain[0];if(dsc==null&&plain.length>1)dsc=plain[plain.length-1];}
    const k0=Math.min(...r.cells.map(c=>c.k0));
    return{r,slots,isHd:false,tab,dsc,price:(dsc!=null?dsc:tab),desc:parts.join(' · ').slice(0,90),k0};
  });
  // nomes: células da 1ª coluna, juntando linhas quebradas (índices consecutivos no PDF)
  const cand=[];
  info.forEach(i=>{if(i.span||i.isHd)return;i.slots[0].forEach(c=>cand.push({t:c.t,k0:c.k0,k1:c.k1,y:c.y0}));});
  cand.sort((a,b)=>a.k0-b.k0);
  const names=[];
  cand.forEach(c=>{const L=names[names.length-1];if(L&&c.k0-L.k1<=1&&L.y-c.y<14){L.t+=' '+c.t;L.k1=c.k1;L.y=c.y;}else names.push({...c});});
  info.forEach(i=>{if(i.span||i.isHd)return;let nm='';for(const x of names){if(x.k0<=i.k0)nm=x.t;else break;}i.name=nm;});
  return{cols,n,info};
}
function renderTable(b,doc,zona){
  b.an=b.an||analyze(b.rows);const{n,info}=b.an;const tb=el('tbody');
  info.forEach(i=>{
    const tr=el('tr');tr.dataset.t=i.r.cells.map(c=>c.t).join(' ').toLowerCase();
    if(i.span){const td=el('td',{class:'span',colspan:n+1});i.r.cells.forEach(c=>td.append(c.url?linkEl(c.url,c.t):c.t));tr.append(td);tb.append(tr);return;}
    if(i.isHd)tr.className='hd';
    for(let k=0;k<n;k++){
      const td=el(i.isHd?'th':'td');
      i.slots[k].forEach((c,j)=>{if(j)td.append(' ');td.append(c.url?linkEl(c.url,c.t):c.t);});
      tr.append(td);
    }
    const last=el(i.isHd?'th':'td');
    if(i.isHd)last.textContent='Simular';
    else if(i.price!=null){const bt=el('button',{class:'sm',type:'button',text:'Simular'});bt.onclick=()=>selectUnit(doc,i);last.append(bt);}
    tr.append(last);tb.append(tr);
  });
  return el('div',{class:'tw'},el('table',{},tb));
}
function extractUnits(pages){
  const out=[];let zona='';
  pages.forEach(pg=>pg.blocks.forEach(b=>{
    if(b.type==='title'){zona=b.text;return;}
    if(b.type!=='table')return;
    b.an=b.an||analyze(b.rows);
    b.an.info.forEach(i=>{if(i.price!=null)out.push({nome:i.name,desc:i.desc,tab:i.tab,dsc:i.dsc,zona});});
  }));
  return out;
}
function renderTables(doc){
  const host=el('div');
  doc.pages.forEach((pg,pi)=>{

async function renderOriginal(doc,host){

async function loadFile(file){
  setStatus('Lendo '+file.name+'…');
  try{
    await ready;
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const pages=[];let all='';
    for(let p=1;p<=pdf.numPages;p++){const pg=await parsePage(await pdf.getPage(p));pages.push(pg);all+=pg.text+'\n';}
    const key=detect(file.name,all),prof=loadProfiles()[key]||{};
    const m=all.match(/DATA\s*REF\.?:?\s*(\d{2}\/\d{2}\/\d{4})/i);
    docs.push({fileName:file.name,pdf,pages,view:'tabela',ref:m?m[1]:'',brand:{key,nome:prof.nome||cap(key),logo:prof.logo||null}});
    active=docs.length-1;setStatus('');render();
  }catch(e){console.error(e);setStatus('Não consegui ler "'+file.name+'". Confira se é um PDF com texto (não imagem escaneada).',true);}
}

const ASSINATURA='FCosta Corretor e Avaliador de Imóveis · CRECI-SP 294791-F';
const brl=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0=v=>'R$ '+Math.round(isFinite(v)?v:0).toLocaleString('pt-BR');
const pct=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const clamp=(x,a,b)=>Math.min(Math.max(x,a),b);
const num=v=>{const x=parseFloat(v);return isFinite(x)?x:0;};

function defRules(){return{
  // Base: Portaria MCID nº 333/2026 (renda até R$ 13 mil; tetos 275/400/600 mil). Taxas e subsídio = referência editável.
  mcmv:[
    {nome:'Faixa 1',ate:3200,teto:275000,sub:55000,subFim:55000,tmin:4.25,tmax:4.75,nao:0.5},
    {nome:'Faixa 2',ate:5000,teto:275000,sub:30000,subFim:0,tmin:5.0,tmax:6.5,nao:0.5},
    {nome:'Faixa 3',ate:9600,teto:400000,sub:0,subFim:0,tmin:7.66,tmax:8.16,nao:0.5},
    {nome:'Faixa 4',ate:13000,teto:600000,sub:0,subFim:0,tmin:10,tmax:10,nao:0.5}],
  sbpe:[{cotaAte:50,taxa:10.49},{cotaAte:70,taxa:10.99},{cotaAte:80,taxa:11.49},{cotaAte:90,taxa:11.99}],
  subPct:20,extra:0,cotaMax:80,comp:30};}
function loadRules(){try{const r=JSON.parse(localStorage.getItem('tabelao_regras_v2')||'null');if(r&&r.mcmv&&r.sbpe)return Object.assign(defRules(),r);}catch(e){}return defRules();}
function saveRules(){try{localStorage.setItem('tabelao_regras_v2',JSON.stringify(rules));}catch(e){}}
let rules=loadRules();
const cli={nome:'',renda:5000,entrada:30000,anos:30,sis:'PRICE',cot:true,valor:300000,unit:null,pv:'dsc',soCabem:true};

function amort(L,taxa,n,sis){
  const i=Math.pow(1+taxa/100,1/12)-1;if(L<=0)return{p1:0,pn:0,total:0};
  if(sis==='PRICE'){const p=i===0?L/n:L*i/(1-Math.pow(1+i,-n));return{p1:p,pn:p,total:p*n};}
  const a=L/n;return{p1:a+L*i,pn:a+(L-a*(n-1))*i,total:L+i*L*(n+1)/2};
}
function maxLoan(P,taxa,n,sis){
  if(P<=0)return 0;const i=Math.pow(1+taxa/100,1/12)-1;
  if(sis==='PRICE')return i===0?P*n:P*(1-Math.pow(1+i,-n))/i;
  return P/(1/n+i);
}
function taxaSbpe(cota){for(const f of rules.sbpe)if(cota<=f.cotaAte)return f.taxa;return rules.sbpe[rules.sbpe.length-1].taxa;}
function simular(p){
  const R=rules,n=clamp(Math.round(p.anos)||30,5,35)*12,ent=clamp(p.entrada,0,p.valor),ex=R.extra,out={n,ent};
  const f=R.mcmv.find(x=>p.renda<=x.ate);
  const maxRenda=Math.max(...R.mcmv.map(x=>x.ate));
  if(!(p.renda>0))out.m={ok:false,motivo:'Informe a renda familiar para enquadrar no MCMV.'};
  else if(!f)out.m={ok:false,motivo:'Renda acima do limite do MCMV ('+brl0(maxRenda)+'). Use o SBPE.'};
  else if(p.valor>f.teto)out.m={ok:false,f,motivo:'Imóvel acima do teto da '+f.nome+' ('+brl0(f.teto)+'). Use o SBPE.'};
  else{
    const idx=R.mcmv.indexOf(f),de=idx>0?R.mcmv[idx-1].ate:0;
    const t=clamp((p.renda-de)/(f.ate-de),0,1);
    const taxa=f.tmin+(f.tmax-f.tmin)*t+(p.cot?0:f.nao);
    const sub=Math.min(f.sub+(f.subFim-f.sub)*t,p.valor*R.subPct/100);
    const fin=Math.max(p.valor-ent-sub,0);const a=amort(fin,taxa,n,p.sis);
    out.m={ok:true,f,taxa,sub,fin,cota:fin/p.valor*100,p1:a.p1+ex,pn:a.pn+ex,total:a.total+ex*n+ent,comp:(a.p1+ex)/p.renda*100};
  }
  const fin=Math.max(p.valor-ent,0),cota=p.valor>0?fin/p.valor*100:0,tx=taxaSbpe(cota),a=amort(fin,tx,n,p.sis);
  out.s={ok:true,taxa:tx,fin,cota,p1:a.p1+ex,pn:a.pn+ex,total:a.total+ex*n+ent,comp:p.renda>0?(a.p1+ex)/p.renda*100:0};
  // capacidade (parcela máxima = % da renda)
  const pmax=Math.max(p.renda*R.comp/100-ex,0);
  const cap={pmax};
  if(out.m&&out.m.f){const mm=out.m.f,tm=out.m.ok?out.m.taxa:mm.tmin+(p.cot?0:mm.nao);const sub=out.m.ok?out.m.sub:Math.min(mm.sub,p.valor*R.subPct/100);const L=maxLoan(pmax,tm,n,p.sis);cap.m={L,imovel:Math.min(L+ent+sub,mm.teto),taxa:tm,teto:mm.teto};}
  const ts=taxaSbpe(80),Ls=maxLoan(pmax,ts,n,p.sis);cap.s={L:Ls,imovel:Ls+ent,taxa:ts};
  out.cap=cap;
  const mOk=out.m.ok&&out.m.comp<=R.comp,sOk=out.s.comp<=R.comp;
  out.best=mOk?'MCMV':(sOk?'SBPE':null);
  return out;
}

  let last=null,lastP=null;

  function calc(){
    q('s-price').className=cli.sis==='PRICE'?'on':'';q('s-sac').className=cli.sis==='SAC'?'on':'';
    const p={renda:cli.renda,valor:cli.valor,entrada:cli.entrada,anos:cli.anos,sis:cli.sis,cot:cli.cot};

    q('s-clear').hidden=!u;pv.textContent='';
    if(u&&u.tab!=null&&u.dsc!=null){
      [['tab','Tabela '+brl0(u.tab)],['dsc','Com desconto '+brl0(u.dsc)]].forEach(([k,t])=>{
        const l=el('label'),i=el('input',{type:'radio',name:'s-pvr',value:k});i.checked=cli.pv===k;
        i.onchange=()=>{cli.pv=k;cli.valor=k==='tab'?u.tab:u.dsc;q('s-valor').value=cli.valor;calc();};
        l.append(i,' '+t);pv.append(l);
      });
    }
    // painéis
    const res=q('s-res');res.textContent='';
    res.append(prog('Minha Casa Minha Vida','m',r.m,p.sis),prog('SBPE (tradicional)','s',r.s,p.sis));
    const eco=q('s-eco');eco.textContent='';
    if(r.m.ok&&r.s.total>r.m.total)eco.append(el('div',{class:'eco'},'Economia escolhendo o MCMV (total pago)',el('b',{text:brl(r.s.total-r.m.total)})));
    const w=q('s-warn');w.textContent='';
    const av=[];
    if(r.m.ok&&r.m.comp>rules.comp)av.push('MCMV: parcela compromete '+r.m.comp.toFixed(1)+'% da renda (limite usual de '+rules.comp+'%).');
    if(r.s.comp>rules.comp&&p.renda>0)av.push('SBPE: parcela compromete '+r.s.comp.toFixed(1)+'% da renda (limite usual de '+rules.comp+'%).');
    if(r.s.cota>rules.cotaMax)av.push('Entrada baixa: o financiamento cobre '+r.s.cota.toFixed(0)+'% do imóvel e os bancos costumam financiar até '+rules.cotaMax+'%. Faltam cerca de '+brl0(p.valor*(1-rules.cotaMax/100)-r.ent)+' de entrada no SBPE.');
    if(av.length)w.append(el('div',{class:'warn'},...av.flatMap((t,i)=>i?[el('br'),t]:[t])));
    // capacidade
    const c=q('s-cap');c.textContent='';c.append(el('h4',{text:'Quanto este cliente consegue financiar ('+rules.comp+'% da renda)'}));
    if(!(p.renda>0))c.append(el('div',{class:'small',text:'Informe a renda para calcular.'}));
    else{
      c.append(lineEl('Parcela máxima',brl(r.cap.pmax)));
      if(r.cap.m)c.append(lineEl('MCMV: financiamento até '+brl0(r.cap.m.L),'imóvel até '+brl0(r.cap.m.imovel)+(r.cap.m.imovel>=r.cap.m.teto?' (teto da faixa)':'')));
      c.append(lineEl('SBPE: financiamento até '+brl0(r.cap.s.L),'imóvel até '+brl0(r.cap.s.imovel)));
    }
    options(p);
  }
  function lineEl(k,v,warn){return el('div',{class:'ln'},el('span',{text:k}),el('b',{class:warn?'wr':'',text:v}));}
  function prog(titulo,cls,r,sis){
    const box=el('div',{class:'pnl '+cls});box.append(el('h4',{text:titulo}));
    if(!r.ok){box.append(el('div',{class:'bad',text:r.motivo}));return box;}
    box.append(el('div',{class:'inst'},el('small',{text:sis==='SAC'?'1ª parcela':'Parcela mensal'}),el('strong',{text:brl(r.p1)})));
    if(sis==='SAC')box.append(lineEl('Última parcela',brl(r.pn)));
    if(r.f)box.append(lineEl('Faixa',r.f.nome),lineEl('Subsídio estimado',brl(r.sub)));
    else box.append(lineEl('Cota financiada',pct(r.cota)));
    box.append(lineEl('Taxa',pct(r.taxa)+' a.a.'),lineEl('Valor financiado',brl(r.fin)+(r.f?' ('+r.cota.toFixed(0)+'%)':'')),lineEl('Comprometimento da renda',r.comp.toFixed(1)+'%',r.comp>rules.comp),lineEl('Total pago ao final',brl(r.total)));
    return box;
  }
  function options(p){
    const units=[];docs.forEach(d=>(d.units||[]).forEach(u=>units.push({d,u,preco:u.dsc!=null?u.dsc:u.tab})));
    units.sort((a,b)=>a.preco-b.preco);
    const rows=[];let fit=0;
    units.forEach(x=>{const r=simular({...p,valor:x.preco});const ok=!!r.best;if(ok)fit++;if(!cli.soCabem||ok)rows.push({...x,r,ok});});
    const host=q('s-opt');host.textContent='';
    q('s-optn').textContent=units.length?fit+' de '+units.length+' unidades cabem':'';
    if(!units.length){host.append(el('div',{class:'empty',text:'Suba um tabelão (PDF) para listar as unidades que cabem no perfil deste cliente.'}));return;}
    if(!(p.renda>0)){host.append(el('div',{class:'empty',text:'Informe a renda do cliente para filtrar as opções.'}));return;}
    if(!rows.length){host.append(el('div',{class:'empty',text:'Nenhuma unidade cabe com essa renda e entrada. Desmarque o filtro para ver todas.'}));return;}
    const tb=el('tbody');
    rows.slice(0,300).forEach(x=>{
      const r=x.r,pr=r.best==='MCMV'?r.m:r.s;
      const tr=el('tr',{class:x.ok?'ok':'no'});
      tr.append(el('td',{text:x.d.brand.nome}),el('td',{text:x.u.nome}),el('td',{text:x.u.desc}),el('td',{class:'r',text:brl0(x.preco)+(x.u.dsc!=null?' *':'')}),
        el('td',{},el('b',{text:r.best||'Não cabe'})),el('td',{class:'r',text:brl(pr.p1)}),el('td',{class:'r',text:pr.comp.toFixed(1)+'%'}));
      const bt=el('button',{class:'sm',type:'button',text:'Simular'});bt.onclick=()=>selectUnit(x.d,{name:x.u.nome,desc:x.u.desc,tab:x.u.tab,dsc:x.u.dsc});
      tr.append(el('td',{},bt));tb.append(tr);
    });
    const head=el('tr',{class:'hd'},...['Construtora','Empreendimento','Unidade','Valor','Programa','Parcela','% da renda',''].map((t,i)=>el('th',{class:i>=3&&i!==4?'r':'',text:t})));
    host.append(el('div',{class:'tw opt'},el('table',{},el('thead',{},head),tb)),el('p',{class:'small',text:'* valor com desconto. Programa = melhor opção cuja parcela fica dentro de '+rules.comp+'% da renda. Estimativa: confirme disponibilidade e condições com a construtora e o banco.'}));
  }

  // regras editáveis
  function ruleInput(obj,key,cls,step){const i=el('input',{type:'number',step:step||'any',value:obj[key],class:cls||''});i.onchange=()=>{obj[key]=num(i.value);saveRules();calc();};return i;}
  function buildRules(){
    const rm=q('s-rm');rm.textContent='';
    rules.mcmv.forEach(f=>{const tr=el('tr');const n=el('input',{type:'text',value:f.nome,class:'w'});n.onchange=()=>{f.nome=n.value;saveRules();calc();};
      tr.append(el('td',{},n));['ate','teto','sub','subFim'].forEach(k=>tr.append(el('td',{},ruleInput(f,k,'w'))));['tmin','tmax','nao'].forEach(k=>tr.append(el('td',{},ruleInput(f,k,'',0.01))));rm.append(tr);});
    const rs=q('s-rs');rs.textContent='';
    rules.sbpe.forEach(f=>{const tr=el('tr');tr.append(el('td',{},ruleInput(f,'cotaAte')),el('td',{},ruleInput(f,'taxa','',0.01)));rs.append(tr);});
    const rg=q('s-rg');rg.textContent='';
    [['subPct','Subsídio limitado a (% do imóvel)'],['extra','Seguros + tarifa (R$/mês, 0 = desligado)'],['cotaMax','Cota máxima financiada (%)'],['comp','Parcela máxima (% da renda)']].forEach(([k,t])=>{
      const d=el('div',{class:'fld'},el('label',{text:t}));const i=ruleInput(rules,k);i.style.cssText='width:100%;font-size:15px;padding:8px 10px';d.append(i);rg.append(d);});
  }
  buildRules();

  q('s-nome').oninput=e=>{cli.nome=e.target.value;};
  q('s-renda').oninput=e=>{cli.renda=num(e.target.value);calc();};
  q('s-ent').oninput=e=>{cli.entrada=num(e.target.value);calc();};
  q('s-anos').oninput=e=>{cli.anos=num(e.target.value)||30;calc();};
  q('s-anos').onchange=e=>{cli.anos=clamp(Math.round(num(e.target.value))||30,5,35);e.target.value=cli.anos;calc();};
  q('s-valor').oninput=e=>{cli.valor=num(e.target.value);cli.unit=null;calc();};
  q('s-cot').onchange=e=>{cli.cot=e.target.checked;calc();};
  q('s-price').onclick=()=>{cli.sis='PRICE';calc();};
  q('s-sac').onclick=()=>{cli.sis='SAC';calc();};
  q('s-clear').onclick=()=>{cli.unit=null;calc();};
  q('s-fit').onchange=e=>{cli.soCabem=e.target.checked;calc();};
  q('s-reset').onclick=()=>{rules=defRules();saveRules();buildRules();calc();};
  q('s-copy').onclick=async()=>{const ok=await copyText(resumo(lastP,last));q('s-copied').textContent=ok?'Resumo copiado. É só colar no WhatsApp.':'Não consegui copiar. Selecione e copie manualmente.';setTimeout(()=>{q('s-copied').textContent='';},4000);};
  calc();
}
</script>
