<style>

    --border:#e2dcce;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--bg); color:var(--ink);
    padding:24px 14px 60px;
  }
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:1.5rem; text-align:center; margin-bottom:2px}
  .sub{text-align:center;color:var(--muted); font-size:.95rem; margin-bottom:22px}
  .rounds{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:26px;
  }
  .round-btn{
    padding:9px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card);
    cursor:pointer; font-family:inherit; font-size:.9rem; color:var(--ink);
  }
  .round-btn.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  .round-btn.done{border-color:var(--accent2)}
  .round-btn.done::after{content:" ✓"; color:var(--accent2)}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:20px 18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .qnum{font-weight:bold; color:var(--accent); margin-bottom:6px; font-size:.85rem}
  .qtext{font-size:1.05rem; margin-bottom:12px; line-height:1.4}
  label{
    display:block; padding:9px 12px; margin-bottom:7px; border:1px solid var(--border);
    border-radius:8px; cursor:pointer; font-size:.97rem; transition:background .15s;
  }
  label:hover{background:#faf8f3}
  label.correct{background:#e6f2e7; border-color:var(--ok); font-weight:bold}
  label.wrong{background:#f7e6e5; border-color:var(--bad)}
  input[type=radio]{margin-right:8px}
  .actions{text-align:center; margin:22px 0}
  button.primary{
    background:var(--accent); color:#fff; border:none; padding:12px 26px; border-radius:8px;
    font-size:1rem; cursor:pointer; font-family:inherit;
  }
  button.primary:disabled{opacity:.5; cursor:not-allowed}
  .score{
    text-align:center; font-size:1.15rem; margin:14px 0 20px; padding:14px; border-radius:10px;
    background:#fff; border:1px solid var(--border);
  }
  .score b{color:var(--accent)}
  .nav{display:flex; justify-content:space-between; margin-top:20px}
  .nav button{
    background:var(--card); border:1px solid var(--border); padding:9px 16px; border-radius:8px;
    cursor:pointer; font-family:inherit;
  }
  .overall{
    background:var(--accent2); color:#fff; border-radius:12px; padding:16px 18px; text-align:center;
    margin-bottom:22px; display:none;
  }
  .overall.show{display:block}
  footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:30px}
</style>
</head>

function buildNav(){
  const nav = document.getElementById('roundsNav');
  nav.innerHTML = '';
  rounds.forEach((r,i)=>{
    const b = document.createElement('button');
    b.className = 'round-btn' + (i===current?' active':'') + (corrected[i]?' done':'');
    b.textContent = 'Rodada ' + (i+1);
    b.onclick = () => { current = i; render(); };
    nav.appendChild(b);
  });
}

    const num = document.createElement('div');
    num.className = 'qnum';
    num.textContent = 'Questão ' + (qi+1) + ' de ' + rq.length;
    card.appendChild(num);
    const qt = document.createElement('div');
    qt.className = 'qtext';
    qt.textContent = item.q;
    card.appendChild(qt);
    item.o.forEach((opt,oi)=>{
      const lab = document.createElement('label');
      const inp = document.createElement('input');
      inp.type = 'radio';
      inp.name = 'r'+current+'q'+qi;
      inp.value = oi;
      if(answers[current][qi]===oi) inp.checked = true;
      inp.onchange = ()=>{ answers[current][qi]=oi; };
      lab.appendChild(inp);
      lab.appendChild(document.createTextNode(opt));
      if(corrected[current]){
        inp.disabled = true;
        if(oi===item.c) lab.classList.add('correct');
        else if(oi===answers[current][qi]) lab.classList.add('wrong');
      }
      card.appendChild(lab);
    });
    area.appendChild(card);
  });

  const actions = document.createElement('div');
  actions.className = 'actions';
  const btn = document.createElement('button');
  btn.className = 'primary';
  btn.textContent = corrected[current] ? 'Corrigida ✓' : 'Corrigir esta rodada';
  btn.disabled = corrected[current];
  btn.onclick = correctRound;
  actions.appendChild(btn);
  area.appendChild(actions);

  if(corrected[current]){
    const score = document.createElement('div');
    score.className = 'score';
    const right = rq.reduce((acc,item,qi)=> acc + (answers[current][qi]===item.c?1:0), 0);
    score.innerHTML = 'Você acertou <b>' + right + ' de ' + rq.length + '</b> nesta rodada.';
    area.insertBefore(score, area.firstChild);
  }

  updateOverall();
}

function correctRound(){
  const rq = rounds[current];
  const missing = answers[current].some(a=>a===null);
  if(missing && !confirm('Ainda há questões sem resposta nesta rodada. Corrigir mesmo assim?')) return;
  corrected[current] = true;
  render();
}

function updateOverall(){
  const done = corrected.some(c=>c);
  const box = document.getElementById('overall');
  if(!done){ box.classList.remove('show'); return; }
  let totalRight=0, totalDone=0;
  rounds.forEach((rq,ri)=>{
    if(corrected[ri]){
      totalDone += rq.length;
      rq.forEach((item,qi)=>{ if(answers[ri][qi]===item.c) totalRight++; });
    }
  });
  box.classList.add('show');
  box.innerHTML = 'Total corrigido até agora: <b>' + totalRight + ' / ' + totalDone + '</b> acertos' +
    (corrected.every(c=>c) ? ' — simulado completo!' : '');
}

function prevRound(){ if(current>0){ current--; render(); } }
function nextRound(){ if(current<rounds.length-1){ current++; render(); } }

render();
</script>
</body>
</html>
