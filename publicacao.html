<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sérgio Costa — Painel de Publicação</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--card:#0f1729;--line:rgba(148,163,184,.16);--tx:#eaf0ff;--mut:#8d9bbd;--cy:#22d3ee;--em:#34d399;--am:#fbbf24;--vi:#a78bfa;--ro:#fb7185;--sk:#60a5fa;--in:#0a1120;--inb:#223050;--wr:#fbbf24;--ok:#34d399;--ac:var(--em);--dock:92px;--hh:64px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6fb;--card:#fff;--line:rgba(15,23,42,.1);--tx:#0f172a;--mut:#5b6784;--cy:#0891b2;--em:#059669;--am:#d97706;--vi:#7c3aed;--ro:#e11d48;--sk:#2563eb;--in:#f1f5fb;--inb:rgba(15,23,42,.14);--wr:#b45309;--ok:#059669;}}
:root[data-theme="light"]{--bg:#f3f6fb;--card:#fff;--line:rgba(15,23,42,.1);--tx:#0f172a;--mut:#5b6784;--cy:#0891b2;--em:#059669;--am:#d97706;--vi:#7c3aed;--ro:#e11d48;--sk:#2563eb;--in:#f1f5fb;--inb:rgba(15,23,42,.14);--wr:#b45309;--ok:#059669;}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.45 'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;padding-left:var(--dock)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:35}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(700px 420px at 15% -8%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 65%),radial-gradient(600px 400px at 100% 0,color-mix(in srgb,var(--vi) 12%,transparent),transparent 60%)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:10px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--hh);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 28px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left}
.selo{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#000;flex:none;box-shadow:0 0 0 2px var(--ac)}
.selo img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{display:block;font:700 16px 'Sora',sans-serif}.brand small{font-size:11.5px;color:var(--mut)}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:19px}
.icon-btn:hover{border-color:var(--ac)}
.dock{position:fixed;z-index:40;left:0;top:0;bottom:0;width:var(--dock);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px)}
.dock button{width:70px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:16px;border:1px solid transparent;background:none;font:600 11.5px 'DM Sans',sans-serif;color:var(--mut);transition:.18s}
.dock button i{font-style:normal;font-size:22px;line-height:1}
.dock button:hover{color:var(--tx);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.dock button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent);border-color:color-mix(in srgb,var(--ac) 40%,transparent)}
main{max-width:1080px;margin:0 auto;padding:8px 28px 40px}
.mhead{display:flex;align-items:center;gap:14px;padding:20px 0 14px}.mhead h1{font:800 28px 'Sora',sans-serif;letter-spacing:-.02em}.mhead p{font-size:13px;color:var(--mut)}
.mh-ic{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;font-size:26px;background:var(--ac);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card p{margin-bottom:10px}h2{font:600 15px 'Sora',sans-serif;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font:700 24px 'JetBrains Mono',monospace;color:var(--ac)}
.stat span{font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{display:block;font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;font:500 16px 'DM Sans',sans-serif;color:var(--tx);background:var(--in);border:1px solid var(--inb);border-radius:11px;outline:0;transition:.15s}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.b,.g{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font:700 14px 'DM Sans',sans-serif;transition:.15s}
.b{border:0;background:linear-gradient(135deg,#34d399,#22d3ee);color:#04231b;box-shadow:0 8px 22px -8px rgba(52,211,153,.75)}
.b:hover{filter:brightness(1.1)}.b:active{transform:scale(.98)}
.g{border:1px solid var(--line);background:none;color:var(--tx);font-weight:600}.g:hover{border-color:var(--ac);color:var(--ac)}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{font:600 10px 'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.alto{color:var(--vi);border-color:currentColor}.tag.medio{color:var(--am);border-color:currentColor}.tag.baixo{color:var(--em);border-color:currentColor}
.item{padding:12px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
pre{white-space:pre-wrap;font:14px/1.5 'DM Sans',sans-serif;background:var(--in);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.done{opacity:.55}.warn{color:var(--wr);font-size:13px}.ok{color:var(--ok)}.mut{color:var(--mut);font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;margin:0;font:inherit;text-transform:none;letter-spacing:0;color:var(--tx)}.chk input{width:auto;min-height:0;margin-top:4px}
footer{text-align:center;font-size:12px;color:var(--mut);padding:24px 20px 40px;border-top:1px solid var(--line);margin:0 28px}
@media(max-width:899px){
:root{--hh:58px}
body{padding-left:0;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{padding:0 16px}.brand small{display:none}
.dock{top:auto;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:auto;flex-direction:row;justify-content:space-around;padding:6px;gap:2px;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--card) 90%,transparent);box-shadow:0 14px 40px -12px rgba(0,0,0,.5);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock button{flex:1 0 auto;width:auto;min-width:56px;padding:8px 4px;font-size:11px}
main{padding:4px 16px 24px}footer{margin:0 16px}.mhead h1{font-size:24px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

var S={imoveis:[],grupos:[],plan:[],cfg:{whats:"",limite:20,intervalo:3,porImovel:6},dias:{},lastPost:0},tab="hoje",sel={},edit="";
function safeUrl(u){u=(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u)){if(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u))u="https://"+u;else return""}return u}
function merge(o){if(!o||typeof o!=="object")return false;["imoveis","grupos","plan"].forEach(function(k){if(Array.isArray(o[k]))S[k]=o[k]});if(o.cfg&&typeof o.cfg==="object")S.cfg=Object.assign({},S.cfg,o.cfg);if(o.dias&&typeof o.dias==="object")S.dias=o.dias;if(typeof o.lastPost==="number")S.lastPost=o.lastPost;if(typeof o.bk==="number")S.bk=o.bk;return true}
function load(){try{var r=localStorage.getItem(KEY);if(r)merge(JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function hoje(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function brl(v){var n=parseFloat(v);return isNaN(n)?"":n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0})}
function livre(i){return !i.lockedUntil||i.lockedUntil<Date.now()}
function horas(i){return Math.ceil((i.lockedUntil-Date.now())/36e5)}
function byId(a,id){return a.filter(function(x){return x.id===id})[0]}

var ABERT=["🏡 Oportunidade em {bairro}!","Procurando imóvel em {bairro}? Olha essa!","Atenção, {cidade}! Imóvel disponível:","Saiu agora: {tipo} em {bairro}","Vale a visita: {tipo} em {bairro}","✨ Novidade na região de {bairro}","Quem busca {tipo} em {cidade} vai gostar:","📍 {bairro} – {tipo} esperando por você"];
var FECHA=["Chame no WhatsApp: {w}","Quer visitar? Fale comigo: {w}","Mais fotos e detalhes pelo WhatsApp {w}","Atendimento direto: {w}","Tire suas dúvidas agora: {w}","Agende sua visita: {w}","Prefere o Messenger? Me chame: {m}","WhatsApp {w} ou Messenger {m}","Clique e fale comigo agora: {l}","Toque aqui e me chame no WhatsApp: {l}","Mais imóveis em {s} | WhatsApp {w}","Veja outras opções em {s} ou chame no WhatsApp {w}"];
function fbUser(){return (S.cfg.fb||"SergioCostaRCM").replace(/^.*facebook\.com\//,"").replace(/[\/?].*$/,"")}
function siteU(){return (S.cfg.site||"fcostacorretor.com").trim().replace(/^https?:\/\//,"").replace(/\/$/,"")}
function wl(w){var d=(w||"").replace(/\D/g,"");return "https://wa.me/"+(d.length<=11?"55":"")+d}
function fill(t,i,w){return t.replace(/\{s\}/g,siteU()).replace(/\{l\}/g,wl(w)).replace(/\{m\}/g,"m.me/"+fbUser()).replace(/\{bairro\}/g,i.bairro||"sua região").replace(/\{cidade\}/g,i.cidade||"sua cidade").replace(/\{tipo\}/g,(i.tipo||"imóvel").toLowerCase()).replace(/\{w\}/g,w||"(inclua seu WhatsApp)")}
function texto(i,idx,v){
  var n=idx+(v||0)*3,w=S.cfg.whats||"(11) 99350-9109";
  var a=fill(ABERT[n%ABERT.length],i,w),f=fill(FECHA[(n*2+1)%FECHA.length],i,w);
  var l=[];l.push("🏷️ "+i.titulo);
  if(i.quartos)l.push("🛏️ "+i.quartos+" quarto(s)");
  if(i.preco)l.push("💰 "+brl(i.preco));
  if(i.bairro)l.push("📍 "+i.bairro+(i.cidade?" – "+i.cidade:""));
  var d=(i.descricao||"").trim();
  var corpo=l.join("\n")+(d?"\n\n"+d:"");
  var lay=n%3;
  if(lay===0)return a+"\n\n"+corpo+"\n\n"+f;
  if(lay===1)return a+"\n"+l.join(" | ")+(d?"\n\n"+d:"")+"\n\n"+f;
  return corpo+"\n\n"+a.replace(/^[^\wÀ-ú]+/,"")+" "+f;
}

function gerar(){
  var ids=Object.keys(sel).filter(function(k){return sel[k]}),n=S.cfg.porImovel,
  usados={},plan=[];
  var gr=S.grupos.slice().sort(function(a,b){return (a.last||0)-(b.last||0)||Math.random()-.5});
  ids.forEach(function(id,k){
    var c=0;
    for(var g=0;g<gr.length&&c<n;g++){
      if(usados[gr[g].id])continue;
      usados[gr[g].id]=1;plan.push({id:uid(),imovel:id,grupo:gr[g].id,idx:k*2+c,v:0,done:false});c++;
    }
  });
  S.plan=plan;sel={};save();render();if(plan.length<ids.length*n)alert("Você tem menos grupos cadastrados do que o necessário: o plano ficou com "+plan.length+" postagens.");
}

function copiar(t,btn){
  function ok(){var o=btn.textContent;btn.textContent="Copiado ✓";setTimeout(function(){btn.textContent=o},1200)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else fb();
  function fb(){var x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");ok()}catch(e){}x.remove()}
}

function vHoje(){

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-tab],[data-act]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;if(tab!=="imoveis")edit="";render();return}
  var a=t.dataset.act,id=t.dataset.id,p=id&&byId(S.plan,id);
  if(a==="gerar")gerar();
  else if(a==="limpar"){if(confirm("Descartar o plano atual?")){S.plan=[];save();render()}}
  else if(a==="copy"){copiar(texto(byId(S.imoveis,p.imovel),p.idx,p.v),t)}
  else if(a==="outro"){p.v++;save();render()}
  else if(a==="feito"){
    var cnt=S.dias[hoje()]||0;
    if(cnt>=S.cfg.limite&&!confirm("Você já atingiu o limite diário. Continuar mesmo assim aumenta o risco para a sua conta. Marcar como feito?"))return;
    if(Date.now()<S.lastPost+S.cfg.intervalo*60000&&!confirm("Você publicou há pouco tempo. Respeitar o intervalo reduz o risco de bloqueio. Marcar como feito agora?"))return;
    p.done=true;S.dias[hoje()]=cnt+1;S.lastPost=Date.now();
    var g=byId(S.grupos,p.grupo),im=byId(S.imoveis,p.imovel);
    if(g)g.last=Date.now();if(im)im.lockedUntil=Date.now()+48*36e5;
    save();render();
  }
  else if(a==="edimovel"){edit=id;render()}
  else if(a==="vendido"){var vi=byId(S.imoveis,id);vi.vendido=!vi.vendido;delete sel[id];S.plan=S.plan.filter(function(x){return x.done||x.imovel!==id});save();render()}
  else if(a==="lead"){var gg=byId(S.grupos,id);gg.leads=(gg.leads||0)+1;save();render()}
  else if(a==="liberar"){byId(S.imoveis,id).lockedUntil=0;save();render()}
  else if(a==="delimovel"){if(confirm("Excluir este imóvel?")){delete sel[id];S.imoveis=S.imoveis.filter(function(x){return x.id!==id});S.plan=S.plan.filter(function(x){return x.imovel!==id});save();render()}}
  else if(a==="delgr"){S.grupos=S.grupos.filter(function(x){return x.id!==id});S.plan=S.plan.filter(function(x){return x.grupo!==id});save();render()}
  else if(a==="impim"){
    document.getElementById("bulkim").value.split("\n").forEach(function(l){
      var q=l.split("|").map(function(x){return x.trim()});if(!q[0])return;
      var pr=parseFloat((q[1]||"").replace(/[^\d,]/g,"").replace(",","."))||0,pd=(q[5]||"").toLowerCase();
      if(pd==="médio")pd="medio";
      if(["baixo","medio","alto"].indexOf(pd)<0)pd=pr>=700000?"alto":pr>=300000?"medio":"baixo";
      S.imoveis.push({id:uid(),lockedUntil:0,titulo:q[0],preco:pr||"",bairro:q[2]||"",cidade:q[3]||"São Paulo",quartos:q[4]||"",padrao:pd,tipo:q[6]||"Casa",descricao:q[7]||""});
    });save();render();
  }
  else if(a==="addgr"){
    document.getElementById("bulk").value.split("\n").forEach(function(l){
      var q=l.split("|").map(function(x){return x.trim()});
      if(q[0])S.grupos.push({id:uid(),nome:q[0],url:q[1]||"",nicho:q[2]||"",last:0});
    });save();render();
  }
  else if(a==="cfg"){
    var c=S.cfg;c.whats=document.getElementById("c_whats").value.trim();
    c.limite=Math.max(1,+document.getElementById("c_limite").value||20);
    c.intervalo=Math.max(0,+document.getElementById("c_intervalo").value||0);
    c.porImovel=Math.min(20,Math.max(1,+document.getElementById("c_por").value||6));c.fb=document.getElementById("c_fb").value.trim();c.site=document.getElementById("c_site").value.trim();
    save();t.textContent="Salvo ✓";
  }
  else if(a==="exp"){S.bk=Date.now();save();copiar(JSON.stringify(S),t)}
  else if(a==="copyr"){var im=byId(S.imoveis,rsel);if(im)copiar(textoRede(im,+t.dataset.k),t)}
  else if(a==="copyq"){copiar(qr(+t.dataset.q),t)}
  else if(a==="copym"){copiar("https://m.me/"+fbUser(),t)}
  else if(a==="imp"){try{if(!merge(JSON.parse(document.getElementById("bk").value)))throw 0;save();render()}catch(e){alert("Backup inválido.")}}
});
