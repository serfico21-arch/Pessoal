/* ===== BOTÃO ÚNICO "DIVULGAR" (automático) =====
   Toque em DIVULGAR: o pedido vai para o Firebase (fcosta_publicacoes, auto:true).
   O robô do GitHub (.github/workflows/divulgar-auto.yml) pega a cada 5 minutos e
   posta na Página do Facebook e no Instagram (post + story). O resultado volta em
   divulgar/status.json. Para ligar o robô: conectar-meta.html (uma vez só). */
var ROBO=null,roboT=0;
function lerRobo(cb){fetch("https://api.github.com/repos/serfico21-arch/Pessoal/contents/divulgar/status.json?ref=main&t="+Date.now(),{headers:{Accept:"application/vnd.github.raw"},cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()})
 .catch(function(){return fetch("divulgar/status.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()})})
 .then(function(j){ROBO=j;roboT=Date.now();if(cb)cb()}).catch(function(){})}
function divulgar(){if(!cur)return;var b=$("bdiv");if(b){b.disabled=true;b.textContent="⏳ Enviando…"}
 fetch(DB+"/fcosta_publicacoes.json",{method:"POST",body:JSON.stringify({imovelId:cur.id,codigo:cur.codigo,titulo:cur.titulo,capa:cur.fotos[0]||"",link:cur.link,canal:"Automático: Facebook + Instagram",ferramenta:"publicador",auto:true,criado:new Date().toISOString()})})
 .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){S.auto[cur.id]={k:j.name,t:Date.now()};diaOk();S.dia.n++;save();toast("✅ Enviado! O robô vai postar em alguns minutos");render()})
 .catch(function(){toast("Não consegui enviar. Confira a internet e tente de novo");render()})}

function normUrl(u){u=String(u||"").trim().replace(/[),.;]+$/,"");if(!u)return"";if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u="https://"+u;
 u=u.replace(/^http:\/\//i,"https://").replace(/^https:\/\/(m|mbasic|web|touch|pt-br|business)\.facebook\.com/i,"https://www.facebook.com").replace(/^https:\/\/facebook\.com/i,"https://www.facebook.com");return u}
function chave(u){return String(u||"").toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/[?#].*$/,"").replace(/\/+$/,"")}
function nomeDe(u){var m=u.match(/groups\/([^/?#]+)/i)||u.match(/m\.me\/([^/?#]+)/i)||u.match(/facebook\.com\/([^/?#]+)/i)||u.match(/chat\.whatsapp\.com\/([^/?#]+)/i);return m?decodeURIComponent(m[1]).replace(/[._-]+/g," "):u.replace(/^https?:\/\//,"").slice(0,40)}
function addLinhas(tipo,txt){var n=0,lst=S.listas[tipo];String(txt||"").split(/\r?\n/).forEach(function(l){l=l.trim();if(!l)return;var item=null;
 if(tipo==="wac"){var dg=l.replace(/https?:\/\/\S+/g,"").match(/(\+?\d[\d\s().-]{7,}\d)/);var w=l.match(/wa\.me\/(\d+)/);var num=(w?w[1]:dg?dg[1]:"").replace(/\D/g,"");if(num.length<10)return;if(num.length<=11)num="55"+num;var nm=l.replace(/https?:\/\/\S+/g,"").replace(dg?dg[1]:"","").replace(/[-–:|,;]+\s*$/,"").trim()||("+"+num);item={nome:nm,url:"https://wa.me/"+num,tel:num}}
 else{var m=l.match(/(https?:\/\/\S+|(?:www\.|m\.|web\.)?facebook\.com\/\S+|fb\.com\/\S+|m\.me\/\S+|chat\.whatsapp\.com\/\S+)/i);if(!m)return;var u=normUrl(m[1]);var nm2=l.replace(m[1],"").replace(/^[\s\-–:|,;•*]+|[\s\-–:|,;•*]+$/g,"").trim();item={nome:nm2||nomeDe(u),url:u}}
 var k=chave(item.url);if(lst.some(function(x){return chave(x.url)===k}))return;item.id=uid();lst.push(item);n++});save();return n}
function migrar(manual){var n=0;function add(nome,url){if(!url)return;var u=normUrl(url),tp=/chat\.whatsapp\.com/i.test(u)?"wag":/m\.me\//i.test(u)?"msg":"fb";var k=chave(u);if(S.listas[tp].some(function(x){return chave(x.url)===k}))return;S.listas[tp].push({id:uid(),nome:nome||nomeDe(u),url:u});n++}
 try{var a=JSON.parse(localStorage.getItem("painel_corretor_v1")||"null");if(a&&Array.isArray(a.grupos))a.grupos.forEach(function(g){if(g)add(g.nome,g.url)});if(a&&a.cfg&&!manual){if(a.cfg.whats)S.cfg.whats=a.cfg.whats}}catch(e){}
 try{var b=JSON.parse(localStorage.getItem("pubfc")||"null");if(b&&Array.isArray(b.g))b.g.forEach(function(g){if(g)add(g.n,g.l)})}catch(e){}
 try{var c=JSON.parse(localStorage.getItem("fcosta_grupos_idx")||"null");if(Array.isArray(c))c.forEach(function(g){if(g)add(g.n||g.nome,g.l||g.url)})}catch(e){}
 S.mig=1;save();return n}

 +'<details><summary>"Ficar logado" – como funciona</summary><p>Você entra no Facebook, WhatsApp e Instagram <b>uma vez</b> no seu navegador ou celular, normalmente. Eles ficam logados sozinhos. Os seus grupos e contatos você cola <b>uma vez</b> na aba <b>Grupos e contatos</b> e eles ficam guardados neste aparelho. Se trocar de aparelho, use o backup em <b>Meus dados</b>.</p></details>'

 +'<details><summary>Dicas de tráfego orgânico (o que dá resultado)</summary><ul><li><b>Constância</b> vale mais que quantidade: todo dia um pouco.</li><li>No máximo <b>10 a 15 grupos por dia</b> e espere 2 a 3 minutos entre um e outro. Mais que isso o Facebook pode bloquear.</li><li>Não repita o mesmo imóvel no mesmo grupo antes de <b>7 dias</b>. O publicador avisa.</li><li>Post com <b>foto</b> alcança muito mais. Use "Baixar fotos" e coloque 3 a 5 fotos.</li><li><b>Responda rápido</b> quem comentar ou chamar. Comentário respondido faz o post aparecer para mais gente.</li><li>Melhores horários: <b>7h às 9h, 12h às 13h e 19h às 22h</b>.</li><li>Status do WhatsApp todo dia: seus contatos são seus maiores clientes.</li><li>Google Meu Negócio: 1 postagem por semana ajuda a aparecer no Google Maps.</li></ul></details>'
