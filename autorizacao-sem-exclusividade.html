<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autorização de Venda sem Exclusividade – FCosta Corretor</title>
<style>
:root{--tinta:#14213d;--papel:#fbfaf7;--verde:#1f6f4a;--verde2:#16553a;--linha:#cfcabd;--aviso:#fff4d6;--erro:#b3261e}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:#ecebe5;color:var(--tinta);font-family:Georgia,"Times New Roman",serif;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:1.45rem;line-height:1.2;margin:.2rem 0 .3rem}
h2{font-size:1.2rem;margin:1.4rem 0 .5rem;border-bottom:2px solid var(--tinta);padding-bottom:.2rem}
.card{background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:16px;margin:14px 0}
label{display:block;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:.9rem;margin:.9rem 0 .25rem}
input,select{width:100%;font-size:1.05rem;padding:.7rem;border:2px solid #9a968a;border-radius:8px;background:#fff;color:var(--tinta);font-family:Arial,Helvetica,sans-serif}
input:focus,select:focus,button:focus-visible{outline:3px solid #3b82f6;outline-offset:1px}
button{font-family:Arial,Helvetica,sans-serif;font-size:1.1rem;font-weight:700;border:0;border-radius:10px;padding:1rem 1.1rem;margin:.4rem 0;width:100%;cursor:pointer;background:var(--verde);color:#fff}
button.sec{background:#fff;color:var(--tinta);border:2px solid var(--tinta)}
button.perigo{background:#fff;color:var(--erro);border:2px solid var(--erro)}
button:disabled{opacity:.45}
.linha2{display:flex;gap:10px}.linha2>*{flex:1}
.nota{font-family:Arial,Helvetica,sans-serif;font-size:.85rem;color:#4b4a44}
.aviso{background:var(--aviso);border-left:6px solid #d9a400;padding:12px 14px;border-radius:6px;font-family:Arial,Helvetica,sans-serif}
.erro{color:var(--erro);font-family:Arial,Helvetica,sans-serif;font-weight:700;margin:.5rem 0}
#doc{background:#fff;border:1px solid var(--linha);padding:20px 18px;font-size:1rem;text-align:justify}
#doc h3{text-align:center;font-size:1.15rem;margin:.2rem 0 1rem}
#doc p{margin:.7rem 0}
.bloco-ass{margin-top:1.6rem;page-break-inside:avoid}
.ass{display:flex;flex-direction:column;align-items:center;margin:1.2rem 0}
.ass img{max-height:110px;max-width:90%;width:auto;height:auto}
.ass .espaco{height:90px}
.ass .traco{border-top:1.5px solid #000;width:90%;text-align:center;padding-top:4px;font-size:.9rem}
.padbox{position:relative;border:3px dashed var(--verde);border-radius:12px;background:#fff;height:190px;cursor:pointer;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.padbox.pequeno{height:140px}
.padbox img.prev{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;display:none}
.padbox.tem img.prev{display:block}
.padbox .dica{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3f5f50;font-family:Arial,sans-serif;font-size:1.2rem;font-weight:700;pointer-events:none;text-align:center;padding:10px}
.padbox.tem .dica{display:none}
.setas{margin:.4rem 0}
.ov{position:fixed;inset:0;z-index:99999;background:#fff;display:flex;flex-direction:column;touch-action:none;overscroll-behavior:contain;font-family:Arial,Helvetica,sans-serif;color:var(--tinta)}
.ov-top{padding:10px 14px;background:var(--tinta);color:#fff;font-size:1.05rem}
.ov-top small{display:block;font-size:.8rem;opacity:.9;margin-top:2px;line-height:1.3}
.ov-area{position:relative;flex:1;min-height:0;background:#fff}
.ov-area canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov-linha{position:absolute;left:4%;right:4%;bottom:30%;border-top:2px dashed #b9b9b9;pointer-events:none}
.ov-x{position:absolute;left:4%;bottom:calc(30% + 4px);color:#aaa;font-size:1.5rem;line-height:1;pointer-events:none}
.ov-dica{position:absolute;left:0;right:0;top:14%;text-align:center;color:#6b7a74;font-size:1.25rem;font-weight:700;pointer-events:none;padding:0 14px}
.ov.tem .ov-dica{display:none}
.ov-bot{display:flex;gap:8px;padding:10px;background:#ecebe5}
.ov-bot button{margin:0;padding:.9rem .4rem;font-size:1.05rem;flex:1}
.ov-bot #ovOk{flex:1.6}
a.btn{display:block;text-align:center;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:1.1rem;font-weight:700;border-radius:10px;padding:1rem 1.1rem;margin:.4rem 0;background:var(--verde);color:#fff}
a.btn.sec{background:#fff;color:var(--tinta);border:2px solid var(--tinta)}
textarea.lk{width:100%;font-size:.8rem;font-family:Arial,sans-serif;padding:8px;border:2px solid #9a968a;border-radius:8px;height:90px}
.zoom{display:flex;gap:8px}.zoom button{margin:0;padding:.6rem}
.check{display:flex;gap:12px;align-items:flex-start;font-family:Arial,sans-serif;font-weight:700;font-size:1.05rem;margin:1rem 0}
.check input{width:30px;height:30px;flex:none;margin-top:2px}
.oculto{display:none!important}
.lgpd{border:2px solid var(--tinta);padding:10px 12px;margin:.9rem 0;background:#f4f2ea}
#doc ul.docs{margin:.3rem 0 .3rem 0;padding-left:1.3rem;font-size:.92em;text-align:left}
#doc .cab-doc{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--tinta);padding-bottom:8px;margin-bottom:14px;text-align:left}
#doc .cab-doc img{height:64px;width:64px;flex:none}
#doc .cab-txt{flex:1;font-family:Arial,Helvetica,sans-serif;font-size:.78rem;line-height:1.35}
#doc .cab-txt b{display:block;font-size:.95rem}
#doc .cab-tit{font-family:Arial,Helvetica,sans-serif;font-size:.75rem;font-weight:700;text-align:right;text-transform:uppercase;line-height:1.3}
#doc .rod-doc{margin-top:1.4rem;border-top:2px solid var(--tinta);padding-top:6px;font-family:Arial,Helvetica,sans-serif;font-size:.72rem;line-height:1.45;text-align:center;color:#333}
.topo{display:flex;align-items:center;gap:14px}.topo img{height:76px}
.link-box{word-break:break-all;font-family:Arial,sans-serif;font-size:.8rem;background:#f1f0ea;padding:10px;border-radius:8px;margin:.6rem 0}
</style>
</head>

/* ---------- utilidades ---------- */
function extenso(n){
 if(!n)return 'zero';
 const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
 const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
 const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
 const t=x=>{if(x===100)return 'cem';const s=[];if(x>=100){s.push(c[Math.floor(x/100)]);x%=100}
  if(x>0){if(x<20)s.push(u[x]);else{let y=d[Math.floor(x/10)];if(x%10)y+=' e '+u[x%10];s.push(y)}}return s.join(' e ')};
 const mi=Math.floor(n/1e6),mil=Math.floor((n%1e6)/1000),r=n%1000,p=[];
 if(mi)p.push(t(mi)+(mi===1?' milhão':' milhões'));
 if(mil)p.push(mil===1?'mil':t(mil)+' mil');
 if(r)p.push(t(r));
 return p.join(' e ');
}
function maskCPF(v){v=v.replace(/\D/g,'').slice(0,11);return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
function maskMoney(v){v=v.replace(/\D/g,'');if(!v)return '';v=(parseInt(v,10)/100).toFixed(2);return v.replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.').replace(/\.(\d{2})$/,',$1').replace(/(\d)\.(\d{3},)/,'$1.$2')}
function maskMoney2(v){const n=v.replace(/\D/g,'');if(!n)return '';const num=parseInt(n,10)/100;return num.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}

/* ---------- máscaras automáticas (pontos, traços, parênteses) ---------- */
const NUM=['cpf','money','mat','iptu','cepnum'];
const modo=m=>NUM.indexOf(m)>=0?'inputmode="numeric"':'';
function numWA(x){const d=String(x==null?'':x).replace(/\D/g,'');if(d.length<10)return '';return (d.length>=12&&d.indexOf('55')===0)?d:'55'+d}
function maskRG(v){
 const m=v.match(/^([0-9.\-xX]*)([\s\S]*)$/);
 const n=m[1].replace(/[^0-9xX]/g,'').toUpperCase().replace(/X(?=.)/g,'').slice(0,9);
 let o=n;
 if(n.length>2)o=n.slice(0,2)+'.'+n.slice(2);
 if(n.length>5)o=n.slice(0,2)+'.'+n.slice(2,5)+'.'+n.slice(5);
 if(n.length>8)o=n.slice(0,2)+'.'+n.slice(2,5)+'.'+n.slice(5,8)+'-'+n.slice(8);
 let r=m[2];
 if(r&&n&&!/^\s/.test(r))r=' '+r;
 return o+r.toUpperCase();
}
function maskFone(v){
 let d=v.replace(/\D/g,'');
 if(d.length>11&&d.indexOf('55')===0)d=d.slice(2);
 d=d.slice(0,11);
 if(!d)return '';
 if(d.length<=2)return '('+d;
 if(d.length<=6)return '('+d.slice(0,2)+') '+d.slice(2);
 if(d.length<=10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);
 return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
}
function maskCEPnum(v){const d=v.replace(/\D/g,'').slice(0,8);return d.length>5?d.slice(0,5)+'-'+d.slice(5):d}
function maskCEP(v){return v.replace(/(^|[^\d])(\d{5})-?(\d{3})(?!\d)/g,'$1$2-$3')}
function maskMat(v){
 if(/[^\d.\s]/.test(v))return v;
 const d=v.replace(/\D/g,'').slice(0,32);
 if(!d||d.length>9)return d;
 return d.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}
function maskIPTU(v){
 if(/[^\d.\-\s]/.test(v))return v;
 const d=v.replace(/\D/g,'');
 if(d.length>11)return d;
 let o=d;
 if(d.length>3)o=d.slice(0,3)+'.'+d.slice(3);
 if(d.length>6)o=d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6);
 if(d.length>10)o=d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,10)+'-'+d.slice(10);
 return o;
}
const MASCARAS={cpf:maskCPF,money:maskMoney2,rg:maskRG,fone:maskFone,cep:maskCEP,cepnum:maskCEPnum,mat:maskMat,iptu:maskIPTU};
function posPorSig(txt,sig){
 if(sig<=0)return 0;
 let c=0;
 for(let p=0;p<txt.length;p++){if(/[0-9A-Za-z]/.test(txt[p])){c++;if(c===sig)return p+1}}
 return txt.length;
}

 let novo=fn(antes),mudou=novo!==antes;
 const apagou=!!(e&&e.inputType&&e.inputType.indexOf('delete')===0);

function rdp(p,tol){
 if(p.length<3)return p;
 const a=p[0],b=p[p.length-1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);
 let im=0,dm=-1;
 for(let i=1;i<p.length-1;i++){const d=L?Math.abs(dy*(p[i][0]-a[0])-dx*(p[i][1]-a[1]))/L:Math.hypot(p[i][0]-a[0],p[i][1]-a[1]);if(d>dm){dm=d;im=i}}

}
function compactarSig(tr,maxLen){

 const lw=Math.max(1.5,Math.min(8,Math.round(4*k*10)/10));
 let tol=1,res=null;
 for(let i=0;i<14;i++){
  const ss=tr.map(t=>{
   const q=[];t.forEach(p=>{const X=Math.round((p.x-x0)*k),Y=Math.round((p.y-y0)*k);if(!q.length||q[q.length-1][0]!==X||q[q.length-1][1]!==Y)q.push([X,Y])});
   const r=rdp(q,tol);return r.reduce((a,p)=>a.concat(p),[]);
  });
  res={w:Math.round(W*k),h:Math.round(H*k),l:lw,s:ss};
  if(JSON.stringify(res).length<=maxLen)return res;
  tol+=0.8;

}

/* ---------- tela do vendedor ---------- */
let tamanho=18;
function telaVendedor(d){
  let h=`<div class="card"><div class="topo"><img src="${LOGO}" alt="FCosta"><h1>Autorização de Venda ${EX?'com':'sem'} exclusividade</h1></div><div class="aviso"><b>PASSO 4 de 5: ler, assinar e devolver ao corretor.</b><br>1) Leia o documento inteiro, com calma.<br>2) No fim da página, toque no quadro e assine com o dedo.<br>3) Marque “Li e entendi” e toque em “Confirmar e assinar”.<br>4) Toque em “Enviar ao corretor” para devolver o documento assinado.<br>Depois, o corretor confere e envia o documento pronto para você (passo 5).</div>
 <div class="zoom"><button class="sec" id="menos" type="button">A−  Letra menor</button><button class="sec" id="mais" type="button">A+  Letra maior</button></div></div>
 <h2>Documento</h2><div id="doc">${contrato(d)}</div>
 <div class="card" id="areaAss">
 <h2>Escreva seu nome ou assine</h2><p>Toque no quadro abaixo. Vai abrir uma <b>tela grande</b> para você escrever o seu nome ou assinar com o dedo. Se quiser mais espaço, gire o celular de lado. Quando terminar, toque em “Concluir”.</p>
 ${htmlPad('padV',false,'Escreva seu nome ou assine aqui')}
 <button class="sec" id="limpaV" type="button">Apagar e escrever de novo</button>
 ${d.c_nome?`<h2>Cônjuge: ${esc(d.c_nome)}</h2><p>Toque no quadro abaixo para escrever o nome ou assinar.</p>${htmlPad('padC',false,'Escreva o nome ou assine aqui')}<button class="sec" id="limpaC" type="button">Apagar e escrever de novo</button>`:''}
 <label class="check" for="li"><input type="checkbox" id="li"><span>Li e entendi o documento e concordo com ele.</span></label>
 <div id="msg" class="erro"></div>
 <button id="assinar" type="button">Confirmar e assinar</button></div>
 <div id="fim" class="card oculto"></div>`;
 $('#app').innerHTML=h;
 const aplica=()=>{document.documentElement.style.fontSize=tamanho+'px'};
 $('#mais').onclick=()=>{tamanho=Math.min(28,tamanho+2);aplica()};
 $('#menos').onclick=()=>{tamanho=Math.max(14,tamanho-2);aplica()};
 const P={v:criarPad($('#padV'))};
 $('#limpaV').onclick=()=>P.v.limpar();
 if(d.c_nome){P.c=criarPad($('#padC'));$('#limpaC').onclick=()=>P.c.limpar()}
 $('#assinar').onclick=()=>assinar(d,P);
}
async function assinar(d,P){
 const m=$('#msg');
 if(P.v.vazio()){m.textContent='Falta escrever o nome ou assinar no quadro.';return}
 if(P.c&&P.c.vazio()){m.textContent='Falta o nome ou a assinatura do cônjuge no quadro.';return}
 if(!$('#li').checked){m.textContent='Marque a caixa “Li e entendi”.';return}
 m.textContent='';$('#assinar').disabled=true;$('#assinar').textContent='Gerando o documento...';
 const agora=new Date();
 const base={...d};delete base.k_ass;delete base.k_sig;delete base.criado;
 const cod=(await sha(JSON.stringify(base))).slice(0,16).toUpperCase();
 const carimbo=`Assinado eletronicamente pelo celular em ${fmtData(agora)} às ${fmtHora(agora)}. Código de verificação do conteúdo: ${cod}.`;
 const ass={vend:P.v.png(700),conj:P.c?P.c.png(700):null,data:fmtData(agora),carimbo};
 $('#doc').innerHTML=contrato(d,ass);
 $('#areaAss').classList.add('oculto');
 try{
  const blob=await gerarPDF(d);
  const nome='autorizacao-venda-'+d.v_nome.split(' ')[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')+'.pdf';
  const arq=new File([blob],nome,{type:'application/pdf'});
  const f=$('#fim');f.classList.remove('oculto');
  f.innerHTML=`<h2>Assinado com sucesso!</h2><p>Agora envie o documento assinado de volta ao corretor (PASSO 4 de 5). Ele vai conferir e te enviar o documento pronto (PASSO 5 de 5).</p><button id="env" type="button">Enviar ao corretor</button><button class="sec" id="bx" type="button">Baixar o PDF</button>`;
  const baixar=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click()};
  $('#bx').onclick=baixar;
  $('#env').onclick=async()=>{
   const texto='Autorização de venda assinada por '+d.v_nome+' (PASSO 4 de 5). Segue para a sua conferência.';
   try{
    if(navigator.canShare&&navigator.canShare({files:[arq]})){await navigator.share({files:[arq],title:'Autorização de venda assinada',text:texto});return}
   }catch(e){if(e.name==='AbortError')return}
   baixar();
   const tel=(d.k_tel||'').replace(/\D/g,'');
   alert('O PDF foi baixado. Vou abrir o WhatsApp: anexe o arquivo baixado na conversa com o corretor.');
   window.open('https://wa.me/'+numWA(tel)+'?text='+encodeURIComponent(texto+' Segue o PDF em anexo.'),'_blank');
  };
  f.scrollIntoView({behavior:'smooth'});
 }catch(e){
  $('#fim').classList.remove('oculto');
  $('#fim').innerHTML=`<h2>Assinado</h2><p>Não foi possível criar o PDF agora (verifique a internet). Toque abaixo para imprimir ou salvar como PDF.</p><button id="imp" type="button">Salvar / imprimir</button>`;
  $('#imp').onclick=()=>window.print();
 }
}
async function gerarPDF(d){
 const el=$('#doc'),clone=el.cloneNode(true);
 clone.querySelectorAll('.cab-doc,.rod-doc').forEach(x=>x.remove());
 const box=document.createElement('div');box.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff';
 clone.style.cssText='width:794px;padding:10px 48px 20px;font-size:15px;border:0;background:#fff';
 box.appendChild(clone);document.body.appendChild(box);
 const cv=await html2canvas(clone,{scale:2,backgroundColor:'#fff'});
 document.body.removeChild(box);
 const{jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4');
 const m=10,iw=190,top=30,areaH=244,pxMm=cv.width/iw,pageH=Math.floor(areaH*pxMm),total=Math.ceil(cv.height/pageH);
 const tit='AUTORIZAÇÃO DE VENDA '+(EX?'COM':'SEM')+' EXCLUSIVIDADE';
 const rod=[d.k_nome,d.k_creci,d.k_cnai].filter(Boolean).join(' | '),ctt=[d.k_tel&&'WhatsApp '+d.k_tel,d.k_email].filter(Boolean).join(' | ');
 const cabRod=(n)=>{
  pdf.setTextColor(20,33,61);pdf.setDrawColor(20,33,61);
  pdf.addImage(LOGO,'PNG',m,7,17,17,'logo');
  pdf.setFont('helvetica','bold');pdf.setFontSize(11);pdf.text('FCosta Corretor de Imóveis',m+21,12.5);
  pdf.setFont('helvetica','normal');pdf.setFontSize(8.5);pdf.text(d.k_nome||'',m+21,17);pdf.text([d.k_creci,d.k_cnai].filter(Boolean).join(' | '),m+21,21.5);
  pdf.setFont('helvetica','bold');pdf.setFontSize(8.5);pdf.text(tit,m+iw,14,{align:'right'});
  pdf.setLineWidth(0.5);pdf.line(m,26,m+iw,26);pdf.line(m,281,m+iw,281);
  pdf.setFont('helvetica','normal');pdf.setFontSize(7.5);pdf.text(rod,m,285.5);pdf.text(ctt,m,289.5);
  pdf.text('Página '+n+' de '+total,m+iw,285.5,{align:'right'});
 };
 let y=0,n=0;
 while(y<cv.height){const h=Math.min(pageH,cv.height-y),t=document.createElement('canvas');t.width=cv.width;t.height=h;
  t.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
  if(n)pdf.addPage();
  pdf.addImage(t.toDataURL('image/jpeg',0.92),'JPEG',m,top,iw,h/pxMm);y+=h;n++;cabRod(n)}
 return pdf.output('blob');
}
