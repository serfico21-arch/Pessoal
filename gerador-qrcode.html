<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --verde: #10b981;
  --verde-claro: #34d399;
  --verde-escuro: #047857;
  --escuro: #0f2922;
  --escuro2: #0a1f1a;
  --branco: #ffffff;
  --card-bg: rgba(16,185,129,0.07);
  --card-border: rgba(16,185,129,0.22);
  --card-hover-bg: rgba(16,185,129,0.16);
  --card-hover-border: rgba(16,185,129,0.5);
  --text-muted: rgba(255,255,255,0.45);
  --divider: rgba(16,185,129,0.14);
  --group-bg: rgba(16,185,129,0.04);
  --group-border: rgba(16,185,129,0.16);
  --danger: #f87171;
}
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; background: var(--escuro2); min-height: 100vh; color: #fff; }
header {
  background: var(--escuro); border-bottom: 2px solid var(--verde);
  padding: 1.4rem 2rem; display: flex; align-items: center; gap: 16px;
  position: sticky; top: 0; z-index: 100;
}
.logo {
  width: 50px; height: 50px; border-radius: 50%; background: var(--verde);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Sora', sans-serif; font-size: 19px; font-weight: 700; color: #fff;
  flex-shrink: 0; letter-spacing: -0.5px;
}
.header-info h1 { font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600; color: #fff; line-height: 1.2; }
.header-info p { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
.header-badge {
  margin-left: auto; background: rgba(16,185,129,0.15); border: 0.5px solid rgba(16,185,129,0.4);
  border-radius: 20px; padding: 5px 14px; font-size: 12px; color: var(--verde-claro); font-weight: 500; white-space: nowrap;
}
.voltar {
  margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--verde-claro);
  text-decoration: none; font-size: 12.5px; font-weight: 500;
}
main { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }
section { margin-bottom: 1.75rem; }
.section-label {
  font-size: 10.5px; font-weight: 500; letter-spacing: 0.11em; color: var(--text-muted);
  text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ''; flex: 1; height: 0.5px; background: var(--divider); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.card {
  background: var(--card-bg); border: 0.5px solid var(--card-border); border-radius: 12px;
  padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 7px;
  cursor: pointer; transition: background 0.18s, border-color 0.18s, transform 0.12s;
}
.card:hover { background: var(--card-hover-bg); border-color: var(--card-hover-border); transform: translateY(-2px); }
.card.destaque { background: rgba(16,185,129,0.13); border-color: rgba(16,185,129,0.42); }
.card:active { transform: scale(0.97); }
.card.aberto { background: var(--card-hover-bg); border-color: var(--card-hover-border); }
.card-icon { font-size: 22px; color: var(--verde); margin-bottom: 2px; display: block; }
.card-title { font-family: 'Sora', sans-serif; font-size: 13.5px; font-weight: 500; color: #fff; line-height: 1.3; }
.card-sub { font-size: 11.5px; color: var(--text-muted); font-weight: 400; line-height: 1.4; }

.painel {
  display: none; background: var(--group-bg); border: 1px solid var(--group-border);
  border-radius: 14px; padding: 18px; margin-top: 10px;
}
.painel.aberto { display: block; }
.campo { margin-bottom: 14px; }
.campo label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.campo input[type="text"], .campo input[type="number"], .campo textarea {
  width: 100%; background: rgba(255,255,255,0.05); border: 0.5px solid var(--card-border);
  border-radius: 8px; padding: 10px 12px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 13.5px;
}
.campo textarea { resize: vertical; min-height: 80px; }
.campo input[type="range"] { width: 100%; accent-color: var(--verde); }
.linha { display: flex; gap: 10px; flex-wrap: wrap; }
.linha .campo { flex: 1; min-width: 130px; }
.checks { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.checks label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #fff; cursor: pointer; }
.checks input { accent-color: var(--verde); }
.seg-toggle { display: flex; background: rgba(255,255,255,0.06); border: 0.5px solid var(--group-border); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 16px; }
.seg-toggle button { flex: 1; border: none; background: transparent; color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 500; padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s, color 0.15s; }
.seg-toggle button.ativo { background: var(--verde); color: #fff; }
.seg-toggle button:not(.ativo):hover { color: #fff; }
.senha-olho { position: relative; }
.senha-olho input { padding-right: 40px !important; }
.senha-olho button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 4px; }
.forca-senha { margin-top: 8px; }
.forca-barra { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
.forca-barra span { display: block; height: 100%; width: 0%; border-radius: 3px; transition: width 0.2s, background 0.2s; }
.forca-texto { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.btn {
  background: var(--verde); color: #fff; border: none; border-radius: 8px; padding: 10px 16px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s;
}
.btn:hover { background: var(--verde-escuro); }
.btn.secundario { background: rgba(255,255,255,0.08); }
.btn.secundario:hover { background: rgba(255,255,255,0.15); }
.btn.perigo { background: rgba(248,113,113,0.15); color: var(--danger); }
.btn.perigo:hover { background: rgba(248,113,113,0.28); }
.resultado {
  margin-top: 12px; background: rgba(16,185,129,0.1); border: 1px solid var(--card-border);
  border-radius: 8px; padding: 12px 14px; font-size: 13.5px; word-break: break-word;
}
.resultado.destaque { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 600; color: var(--verde-claro); }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.lista-cofre { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }

<header>

<main>
  <section>

        <label>Link do anúncio ou texto</label>
        <input type="text" id="qr-texto" placeholder="ex: https://fcostacorretor.com/imovel/123" />
      </div>
      <button class="btn" onclick="gerarQR()"><i class="ti ti-qrcode"></i>Gerar QR Code</button>

  </section>

<script>
/* ── QR CODE ───────────────────────────────────── */
function gerarQR() {
  const texto = document.getElementById('qr-texto').value.trim();
  if (!texto) { alert('Digite um link ou texto.'); return; }

  try {
    // typeNumber 0 = detecta automaticamente o tamanho necessário;
    // 'M' = nível médio de correção de erro (bom equilíbrio pra impressão)
    const qr = qrcode(0, 'M');
    qr.addData(texto);
    qr.make();

    const modulos = qr.getModuleCount();
    const tamanhoFinal = 512;
    const margemModulos = 2;
    const cellSize = tamanhoFinal / (modulos + margemModulos * 2);

    const canvas = document.getElementById('qrcanvas');
    canvas.width = tamanhoFinal;
    canvas.height = tamanhoFinal;
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, tamanhoFinal, tamanhoFinal);
    ctx.fillStyle = '#0a1f1a';
    for (let linha = 0; linha < modulos; linha++) {
      for (let coluna = 0; coluna < modulos; coluna++) {
        if (qr.isDark(linha, coluna)) {
          ctx.fillRect(
            (coluna + margemModulos) * cellSize,
            (linha + margemModulos) * cellSize,
            Math.ceil(cellSize),
            Math.ceil(cellSize)
          );
        }
      }
    }

    document.getElementById('acoes-qr').style.display = 'flex';
  } catch (erro) {
    alert('Não foi possível gerar o QR Code. Tente um texto mais curto.');
  }
}

function baixarQR() {
  const canvas = document.getElementById('qrcanvas');
  const link = document.createElement('a');
  link.download = 'qrcode-anuncio.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}


document.addEventListener("DOMContentLoaded",function(){});
</script>
