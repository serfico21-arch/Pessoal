<body><main><h1>Atualizar o banco da agenda</h1>
<ol><li>Toque no botão amarelo abaixo. Ele copia o comando.</li>
<li>Abra o <a href="https://supabase.com/dashboard/project/avvhnajfczdedlydkcrb/sql/new" target="_blank" rel="noopener">SQL Editor do Supabase</a>.</li>
<li>Clique na área branca e aperte <b>Ctrl + V</b> para colar.</li>
<li>Clique no botão verde <b>Run</b>. Deve aparecer "Success".</li></ol>
<p><button id="b">Copiar comando</button><span id="ok"></span></p>
<textarea id="t" readonly>-- Atualização: dica do código, troca do código pelo painel e bloqueio mais forte
alter table public.lojas_segredo add column if not exists dica text;
alter table public.lojas_segredo add column if not exists bloqueios int not null default 0;

create or replace function public._limpa_codigo(p text) returns text
language sql immutable set search_path = &#x27;&#x27; as $$
  select regexp_replace(upper(coalesce(p,&#x27;&#x27;)), &#x27;[^A-Z0-9]&#x27;, &#x27;&#x27;, &#x27;g&#x27;);
$$;

-- errou: depois de 5 erros bloqueia 15 min, depois 1h, 4h, 24h...
create or replace function public._errou(p_loja text) returns void
language sql security definer set search_path = &#x27;&#x27; as $$
  update public.lojas_segredo set
    erros = case when erros + 1 &gt;= 5 then 0 else erros + 1 end,
    bloqueios = case when erros + 1 &gt;= 5 then bloqueios + 1 else bloqueios end,
    bloqueado_ate = case when erros + 1 &gt;= 5
      then now() + (array[interval &#x27;15 minutes&#x27;, interval &#x27;1 hour&#x27;, interval &#x27;4 hours&#x27;])[least(bloqueios + 1, 3)]
                 * case when bloqueios &gt;= 3 then 6 else 1 end
      else bloqueado_ate end
  where loja_id = p_loja;
$$;

create or replace function public.adm_dica(p_loja text) returns text
language sql security definer set search_path = &#x27;&#x27; stable as $$
  select dica from public.lojas_segredo where loja_id = p_loja;
$$;

create or replace function public.adm_entrar(p_loja text, p_senha text) returns uuid
language plpgsql security definer set search_path = &#x27;&#x27; as $$
declare s public.lojas_segredo; v uuid;
begin
  select * into s from public.lojas_segredo where loja_id = p_loja for update;
  if s is null or s.senha_hash is null then raise exception &#x27;sem_senha&#x27;; end if;
  if s.bloqueado_ate is not null and s.bloqueado_ate &gt; now() then raise exception &#x27;bloqueado&#x27;; end if;
  if extensions.crypt(p_senha, s.senha_hash) &lt;&gt; s.senha_hash then
    perform public._errou(p_loja);
    return null;
  end if;
  update public.lojas_segredo set erros = 0, bloqueios = 0, bloqueado_ate = null where loja_id = p_loja;
  delete from public.sessoes where expira &lt; now();
  insert into public.sessoes(loja_id) values (p_loja) returning token into v;
  return v;
end $$;

create or replace function public.adm_nova_senha(p_loja text, p_codigo text, p_senha text) returns uuid
language plpgsql security definer set search_path = &#x27;&#x27; as $$
declare s public.lojas_segredo; v uuid; c text := public._limpa_codigo(p_codigo);
begin
  select * into s from public.lojas_segredo where loja_id = p_loja for update;
  if s is null then raise exception &#x27;loja&#x27;; end if;
  if s.bloqueado_ate is not null and s.bloqueado_ate &gt; now() then raise exception &#x27;bloqueado&#x27;; end if;
  if length(coalesce(p_senha,&#x27;&#x27;)) &lt; 4 then raise exception &#x27;senha_curta&#x27;; end if;
  if extensions.crypt(c, s.codigo_hash) &lt;&gt; s.codigo_hash
     and extensions.crypt(upper(trim(coalesce(p_codigo,&#x27;&#x27;))), s.codigo_hash) &lt;&gt; s.codigo_hash then
    perform public._errou(p_loja);
    raise exception &#x27;codigo&#x27;;
  end if;
  update public.lojas_segredo set senha_hash = extensions.crypt(p_senha, extensions.gen_salt(&#x27;bf&#x27;)),
    erros = 0, bloqueios = 0, bloqueado_ate = null where loja_id = p_loja;
  delete from public.sessoes where loja_id = p_loja;
  insert into public.sessoes(loja_id) values (p_loja) returning token into v;
  return v;
end $$;

-- o ADM troca o código de recuperação e a dica pelo painel
create or replace function public.adm_trocar_codigo(p_token uuid, p_codigo text, p_dica text) returns void
language plpgsql security definer set search_path = &#x27;&#x27; as $$
declare l text := public._sessao(p_token); c text := public._limpa_codigo(p_codigo);
begin
  if length(c) &lt; 4 then raise exception &#x27;codigo_curto&#x27;; end if;
  update public.lojas_segredo set codigo_hash = extensions.crypt(c, extensions.gen_salt(&#x27;bf&#x27;)),
    dica = nullif(left(trim(coalesce(p_dica,&#x27;&#x27;)),80),&#x27;&#x27;) where loja_id = l;
end $$;

revoke execute on function public._errou(text) from public, anon, authenticated;
</textarea>
