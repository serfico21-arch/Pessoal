  box.className=filled.length?"ok":"";box.innerHTML=h;
  [].forEach.call(box.querySelectorAll("select[data-p]"),function(s){s.onchange=function(){E.pessoas.forEach(function(p){if(p.cpf==s.getAttribute("data-p"))p.papel=s.value=="x"?"x":s.value});aplicar()}})}
 btn.onclick=function(){inp.value="";inp.click()};
 inp.onchange=function(){var fs=[].slice.call(inp.files||[]);if(!fs.length)return;nomes=fs.map(function(f){return f.name});textos="";
  var res=[],p=Promise.resolve();
  fs.forEach(function(f){p=p.then(function(){st("Abrindo "+f.name+"…");return lerArquivo(f,st)}).then(function(tx){textos+="=== "+f.name+" ===\n"+tx+"\n\n";var r=analisar(tx);if(!r.pessoas.length&&!r.imovel&&!r.preco)r.notas.push("Não achei dados úteis em "+f.name+(flat(tx).length<30?" (não consegui ler texto; se for foto, tente uma imagem mais nítida)":"")+".");res.push(r)})});
  p.then(function(){E=juntar(res);aplicar()}).catch(function(e){box.style.display="block";box.className="err";box.innerHTML="❌ "+esc(e.message||e)})};
}
var API={analisar:analisar,juntar:juntar,montar:montar,porExtenso:porExtenso,dataExt:dataExt,fmt:fmt,_cpfOk:cpfOk};
if(typeof module!=="undefined")module.exports=API;
