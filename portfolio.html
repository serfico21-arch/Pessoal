<!DOCTYPE html>
<html lang="pt-BR" class="pub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfólio de Imóveis — F. Costa</title>
<style>
:root{--or:#e8702a;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--bg:#f8f7f5}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--tx);background:#fff}
header{padding:16px 20px;border-bottom:3px solid var(--or);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:72px;height:72px;object-fit:contain;flex:none}
h1{font-family:Georgia,serif;margin:0;font-size:22px}
h1 small{display:block;font:12px system-ui;color:var(--or);margin-top:3px}
nav{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:600 14px system-ui;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--or);color:#fff;text-decoration:none;display:inline-block}
button.sec,.btn.sec{background:#fff;color:var(--tx);border:1px solid var(--bd)}
button.wa,.btn.wa{background:#1fa855}
main{max-width:1100px;margin:0 auto;padding:20px}
.v{display:none}.v.on{display:block}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
input,select,textarea{font:15px system-ui;padding:10px;border:1px solid var(--bd);border-radius:8px;width:100%;background:#fff}
.filtros input{flex:2;min-width:180px}.filtros select{flex:1;min-width:130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;transition:.15s}
.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.1);transform:translateY(-2px)}
.cap{aspect-ratio:4/3;background:#eee center/cover;position:relative}
.tag{position:absolute;top:10px;left:10px;background:var(--or);color:#fff;font:700 11px system-ui;padding:4px 9px;border-radius:20px}
.tag.x{left:auto;right:10px;background:#444}
.cb{padding:14px}
.cb h3{margin:0 0 4px;font-family:Georgia,serif;font-size:17px}
.loc{color:var(--mu);font-size:13px}
.pr{color:var(--or);font:700 20px Georgia,serif;margin:8px 0}
.sp{display:flex;gap:12px;font-size:13px;color:var(--mu);flex-wrap:wrap}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.pcap{aspect-ratio:3/4;background:#f3f3f3 center/contain no-repeat}
.vazio{text-align:center;color:var(--mu);padding:50px 10px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
label{font:600 12px system-ui;color:var(--mu);display:block;margin-bottom:4px}
.box{border:1px solid var(--bd);border-radius:12px;padding:18px;background:var(--bg);margin-bottom:22px}
.ths{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.th{position:relative;width:90px;height:68px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:6px;cursor:pointer}
.th b{position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;cursor:pointer}
.th em{position:absolute;bottom:2px;left:2px;background:var(--or);color:#fff;font:700 10px system-ui;padding:1px 5px;border-radius:4px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.row img{width:64px;height:48px;object-fit:cover;border-radius:6px;background:#eee}
.row div{flex:1;font-size:14px}.row small{color:var(--mu)}
.row button{padding:7px 10px;font-size:12px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;overflow:auto;padding:20px}
#modal.on{display:block}
.mc{background:#fff;max-width:760px;margin:0 auto;border-radius:14px;padding:18px;position:relative}
.mx{position:absolute;top:10px;right:10px;background:#fff;color:#333;border:1px solid var(--bd);padding:6px 11px}
#mimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#eee}
.mt{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.mt img{width:80px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;flex:none}
.mc p{white-space:pre-line;line-height:1.55}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:24px 10px;border-top:1px solid var(--bd)}
.pub .adm{display:none!important}
</style>
</head>

let D={cfg:{whats:'5511993509109',slogan:'Atendimento direto e transparente'},imoveis:[]};

if(PUB){D=JSON.parse(emb);document.documentElement.classList.add('pub')}
else{let s=null;try{s=localStorage.getItem(KEY)}catch(e){}

if(!D.panfletos){const sd=$('#seed').textContent.trim();D.panfletos=sd?(JSON.parse(sd).panfletos||[]):[]}

      </div></div>`).join(''):'<div class="vazio">Nenhum imóvel encontrado.</div>';
}

let ABA='imo';
function aba(a){ABA=a;$('#filtros').style.display=a=='imo'?'':'none';$('#grid').style.display=a=='imo'?'':'none';$('#grid2').style.display=a=='pan'?'':'none';$('#tImo').className=a=='imo'?'':'sec';$('#tPan').className=a=='pan'?'':'sec'}
function renderPan(){

}
function abrirPan(id){
  const p=D.panfletos.find(x=>x.id==id);if(!p)return;

  $('#modal').classList.add('on');
}

    <button class="sec" onclick="compartilhar('${i.id}')">Compartilhar</button></div></div>`;
  $('#modal').classList.add('on');
}
function fechar(){$('#modal').classList.remove('on')}
function compartilhar(id){
  const i=D.imoveis.find(x=>x.id==id);
  const url=location.href.split('#')[0]+'#'+i.cod;
  if(navigator.share)navigator.share({title:i.tit,url}).catch(()=>{});

}

function autoCod(){
  if(editId)return;
  const p=$('#f_fin').value=='venda'?'FCV':'FCL';
  const n=D.imoveis.filter(i=>i.cod.startsWith(p)).length+1;

  if(ba)it.push(`${ba} ${ba>1?'banheiros':'banheiro'}`);
  if(v)it.push(`${v} ${v>1?'vagas de garagem':'vaga de garagem'}`);
  let d=`${t} para ${fin}${b?` no bairro ${b}`:''}${c?`, em ${c}`:''}.`;
  if(it.length)d+=`\n\nO imóvel conta com ${it.length>1?it.slice(0,-1).join(', ')+' e '+it.slice(-1):it[0]}.`;
  d+=`\n\nAgende sua visita e conheça de perto. Atendimento direto com o corretor, com toda a documentação conferida.`;
  $('#f_desc').value=d;
}
function comprimir(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};im.src=fr.result};fr.readAsDataURL(file)})}
async function addFotos(inp){for(const f of inp.files)FT.push(await comprimir(f));inp.value='';thumbs()}
function thumbs(){$('#ths').innerHTML=FT.map((f,i)=>`<div class="th"><img src="${f}" onclick="capa(${i})"><b onclick="rmFoto(${i})">×</b>${i?'':'<em>capa</em>'}</div>`).join('')}
function capa(i){FT.unshift(FT.splice(i,1)[0]);thumbs()}
function rmFoto(i){FT.splice(i,1);thumbs()}
function limpar(){
  editId=null;FT=[];
  ['f_tit','f_bairro','f_preco','f_area','f_q','f_b','f_v','f_desc','f_video'].forEach(x=>$('#'+x).value='');
  $('#f_cid').value='São Paulo';$('#f_disp').checked=true;$('#f_fin').value='venda';
  $('#ftitulo').textContent='Novo imóvel';thumbs();autoCod();
}
function salvarImovel(){
  const tit=$('#f_tit').value.trim(),cod=$('#f_cod').value.trim();
  if(!tit||!cod){alert('Preencha título e código.');return}
  if(D.imoveis.some(i=>i.cod==cod&&i.id!=editId)){alert('Já existe imóvel com esse código.');return}
  const o={id:editId||Date.now().toString(36),cod,fin:$('#f_fin').value,tipo:$('#f_tipo').value,tit,
    bairro:$('#f_bairro').value.trim(),cid:$('#f_cid').value.trim(),preco:+$('#f_preco').value||0,
    area:+$('#f_area').value||0,q:+$('#f_q').value||0,b:+$('#f_b').value||0,v:+$('#f_v').value||0,
    desc:$('#f_desc').value,video:$('#f_video').value.trim(),fotos:[...FT],disp:$('#f_disp').checked};
  const k=D.imoveis.findIndex(i=>i.id==editId);
  if(k>=0)D.imoveis[k]=o;else D.imoveis.unshift(o);
  if(save()){limpar();renderAdm()}
}
function renderAdm(){
  $('#qtd').textContent=D.imoveis.length;
  $('#lista').innerHTML=D.imoveis.length?D.imoveis.map(i=>`<div class="row"><img src="${i.fotos[0]||''}"><div><b>${esc(i.cod)}</b> — ${esc(i.tit)}<br><small>${i.fin=='venda'?'Venda':'Locação'} · ${i.preco?brl(i.preco):'Sob consulta'}${i.disp===false?' · INDISPONÍVEL':''}</small></div><button class="sec" onclick="editar('${i.id}')">Editar</button><button class="sec" onclick="excluir('${i.id}')">Excluir</button></div>`).join(''):'<div class="vazio">Nenhum imóvel cadastrado ainda.</div>';
}
function editar(id){
  const i=D.imoveis.find(x=>x.id==id);if(!i)return;
  editId=id;FT=[...i.fotos];
  $('#f_fin').value=i.fin;$('#f_cod').value=i.cod;$('#f_tipo').value=i.tipo;$('#f_preco').value=i.preco||'';
  $('#f_tit').value=i.tit;$('#f_bairro').value=i.bairro;$('#f_cid').value=i.cid;$('#f_area').value=i.area;
  $('#f_q').value=i.q;$('#f_b').value=i.b;$('#f_v').value=i.v;$('#f_desc').value=i.desc;$('#f_video').value=i.video||'';$('#f_disp').checked=i.disp!==false;
  $('#ftitulo').textContent='Editando '+i.cod;thumbs();window.scrollTo(0,0);
}
function excluir(id){if(confirm('Excluir este imóvel?')){D.imoveis=D.imoveis.filter(i=>i.id!=id);save();renderAdm()}}
function salvarCfg(){D.cfg.whats=$('#c_whats').value.replace(/\D/g,'');D.cfg.slogan=$('#c_slogan').value;if(save())alert('Configurações salvas.')}

/* ---------- Exportar / backup ---------- */
function baixar(nome,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nome;a.click()}
function exportarHTML(){
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#dados').textContent=JSON.stringify(D).replace(/</g,'\\u003c');c.querySelector('#seed').textContent='';
  c.classList.add('pub');
  c.querySelector('#grid').innerHTML='';c.querySelector('#lista').innerHTML='';
  const m=c.querySelector('#modal');m.innerHTML='';m.className='';
  baixar('portfolio.html','<!DOCTYPE html>\n'+c.outerHTML,'text/html');
}
function exportarJSON(){baixar('backup-portfolio-fcosta.json',JSON.stringify(D),'application/json')}
function importarJSON(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.imoveis))throw 0;D=d;D.panfletos=D.panfletos||[];save();renderAdm();alert('Backup restaurado.')}catch(e){alert('Arquivo inválido.')}};
  r.readAsText(f);inp.value='';
}

/* ---------- Início ---------- */
['#ftipo'].forEach(s=>TIPOS.forEach(t=>$(s).insertAdjacentHTML('beforeend',`<option>${t}</option>`)));
TIPOS.forEach(t=>$('#f_tipo').insertAdjacentHTML('beforeend',`<option>${t}</option>`));
document.head.insertAdjacentHTML('beforeend','<link rel="icon" href="'+$('.logo').src+'">');
autoCod();renderPort();
if(location.hash){const i=D.imoveis.find(x=>x.cod==decodeURIComponent(location.hash.slice(1)));if(i)abrir(i.id);else{const p=D.panfletos.find(x=>x.cod==decodeURIComponent(location.hash.slice(1)));if(p){aba('pan');abrirPan(p.id)}}}
</script>
