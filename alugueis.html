<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Aluguéis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#EEF3F2;--card:#fff;--ink:#17262B;--mute:#5B6B70;--pri:#1F4E5F;--ok:#1E7A46;--okbg:#DDF1E4;--bad:#B3261E;--badbg:#FBE3E1;--wait:#8A5A00;--waitbg:#FCEFCF;--line:#CBD8D6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Atkinson Hyperlegible",Verdana,Arial,sans-serif}
header{background:var(--pri);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:26px}
header p{margin:2px 0 0;opacity:.85;font-size:15px}
main{max-width:720px;margin:0 auto;padding:16px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--pri);color:#fff;cursor:pointer;font-weight:700}
button.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
button.del{background:#fff;color:var(--bad);border:2px solid var(--bad)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #E0A526;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.t{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:400;margin:10px 0}
.t b{display:block;font-size:20px}.t small{color:var(--mute);font-size:16px}
.tag{padding:4px 10px;border-radius:99px;font-size:15px;font-weight:700;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.wait{background:var(--waitbg);color:var(--wait)}
h2{font-size:22px;margin:18px 0 6px}
.sum{font-size:20px;margin:8px 0}
.meses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meses button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:10px 4px;font-weight:400}
.meses button small{display:block;font-size:14px}
.meses .ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.meses .bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
label{display:block;margin:10px 0 4px;font-weight:700}
input,textarea{width:100%;font:inherit;padding:11px;border:2px solid var(--line);border-radius:10px;background:#fff}
.dl label{display:flex;gap:10px;align-items:center;font-weight:400;margin:6px 0}
.dl input{width:24px;height:24px}
dialog{border:0;border-radius:14px;padding:18px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
#recibo{display:none;position:fixed;inset:0;background:#fff;overflow:auto;padding:20px;z-index:9}
#recibo .paper{max-width:640px;margin:0 auto;border:2px solid #000;padding:28px;font-family:Georgia,serif;font-size:19px;line-height:1.7}
#recibo h1{text-align:center;font-size:26px;margin:0 0 18px}
.sig{margin-top:56px;text-align:center}.sig hr{border:0;border-top:1px solid #000;width:70%}
.muted{color:var(--mute);font-size:15px}
@media print{#app,#recibo .no{display:none!important}#recibo{position:static;padding:0}}
</style>
</head>
<body>
<div id="app">
<header><a href="index.html" style="color:#fff;font-size:15px;text-decoration:none">← Voltar ao painel</a><h1>Meus Aluguéis</h1><p>Locatários, recibos e documentos</p></header>
<main id="main"></main>
</div>

<dialog id="dlg">
<h2 id="dt" style="margin-top:0"></h2>
<label for="dd">Data do pagamento</label><input type="date" id="dd">
<label for="dv">Valor pago (R$)</label><input type="number" step="0.01" id="dv" inputmode="decimal">
<div class="row">
<button onclick="savePay(true)">Salvar e ver recibo</button>
<button class="sec" onclick="savePay(false)">Só salvar</button>
<button class="sec" id="ver" onclick="dlg.close();recibo(pay.id,pay.k)">Ver recibo</button>
<button class="del" id="undo" onclick="undoPay()">Desfazer pagamento</button>
<button class="sec" onclick="dlg.close()">Cancelar</button>
</div>
</dialog>

<div id="recibo"><div class="no"><p class="muted" style="margin:0 0 6px">Toque em Enviar e escolha o WhatsApp do locatário. Repita para o locador e para você (ou salve no Drive).</p><div class="row" style="margin-top:0"><button onclick="enviarRecibo('pdf')">Enviar PDF</button><button onclick="enviarRecibo('png')">Enviar imagem (PNG)</button><button class="sec" onclick="baixarRecibo('pdf')">Guardar PDF</button><button class="sec" onclick="baixarRecibo('png')">Guardar PNG</button><button class="sec" onclick="closeRecibo()">Fechar</button></div></div><div class="paper" id="paper"></div></div>

<script>
var K="alugueis_v1",DOCS=["Contrato assinado","RG","CPF","Comprovante de renda","Comprovante de residência","Documentos do fiador","Termo de vistoria","Fotos do imóvel"],
MES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"],
MESL=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],
db=load(),view="list",cur=null,year=new Date().getFullYear(),pay=null,dlg=document.getElementById("dlg");
function load(){try{var d=JSON.parse(localStorage.getItem(K));if(d&&d.t)return d}catch(e){}return{cfg:{},t:[]}}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert("Não foi possível salvar neste navegador.")}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function brl(n){return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function br(d){return d?d.split("-").reverse().join("/"):"—"}
function ym(y,m){return y+"-"+String(m+1).padStart(2,"0")}
function get(id){return db.t.find(function(t){return t.id===id})}
function recebedor(){return db.cfg.rec||"Sérgio Costa — Corretor de Imóveis, CRECI-SP 294791-F"}

/* valor por extenso */
var U=["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"],
D=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"],
C=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
function a999(n){if(n===100)return"cem";var p=[];if(n>=100){p.push(C[Math.floor(n/100)]);n%=100}if(n>0)p.push(n<20?U[n]:D[Math.floor(n/10)]+(n%10?" e "+U[n%10]:""));return p.join(" e ")}
function ext(n){if(n===0)return"zero";var m=Math.floor(n/1000),r=n%1000,s="";if(m)s=m===1?"mil":a999(m)+" mil";if(r)s+=(s?(r<100||r%100===0?" e ":" "):"")+a999(r);return s}
function extenso(v){var r=Math.floor(v),c=Math.round((v-r)*100),s=ext(r)+(r===1?" real":" reais");if(c)s+=" e "+ext(c)+(c===1?" centavo":" centavos");return s}

function render(){var m=document.getElementById("main");m.innerHTML=view==="list"?vList():view==="form"?vForm():vDetail();window.scrollTo(0,0)}

function vList(){
 var n=new Date(),k=ym(n.getFullYear(),n.getMonth()),pg=db.t.filter(function(t){return t.pag[k]}).length,h="";
 h+=aviso()+'<div class="row"><button onclick="novo()">+ Novo locatário</button></div>';
 if(!db.t.length)return h+'<div class="card">Nenhum locatário ainda. Toque em <b>Novo locatário</b> para começar.</div>'+rodape();
 var rec=0,esp=0;db.t.forEach(function(t){esp+=Number(t.valor);if(t.pag[k])rec+=t.pag[k].valor});
 h+='<p class="sum">Em '+MESL[n.getMonth()]+': <b>'+pg+' de '+db.t.length+'</b> pagos<br>Recebido: <b>'+brl(rec)+'</b> de '+brl(esp)+'</p>';
 db.t.forEach(function(t){
  var s=t.pag[k]?'<span class="tag ok">Pago</span>':n.getDate()>Number(t.venc)?'<span class="tag bad">Atrasado</span>':'<span class="tag wait">A vencer</span>';
  h+='<button class="t" onclick="abrir(\''+t.id+'\')"><span><b>'+esc(t.nome)+'</b><small>'+esc(t.end)+' • '+brl(t.valor)+' • dia '+esc(t.venc)+venceIn(t)+'</small></span>'+s+'</button>'});
 return h+rodape();
}
function rodape(){return '<h2>Cópia de segurança</h2><p class="muted">Os dados ficam só neste aparelho. Última cópia: <b>'+(db.cfg.bk?new Date(db.cfg.bk).toLocaleDateString("pt-BR"):"nunca")+'</b>. Envie a cópia para o seu WhatsApp, e-mail ou Drive e guarde lá.</p><div class="row"><button onclick="enviar()">Enviar cópia (WhatsApp, e-mail, Drive)</button><button class="sec" onclick="exportar()">Baixar cópia no aparelho</button><button class="sec" onclick="document.getElementById(\'imp\').click()">Restaurar cópia</button></div><h2>Outros</h2><div class="row"><button class="sec" onclick="planilha()">Baixar planilha (Excel)</button><button class="sec" onclick="cfg()">Meus dados no recibo</button></div><input type="file" id="imp" accept=".json" hidden onchange="importar(this)">'}
function aviso(){if(!db.t.length)return"";var d=db.cfg.bk?Math.floor((Date.now()-db.cfg.bk)/864e5):null;if(d!==null&&d<7)return"";return'<div class="card" style="border-color:var(--bad);background:var(--badbg)"><b>'+(d===null?"Você ainda não fez cópia de segurança.":"Sua última cópia foi há "+d+" dias.")+'</b><div class="row"><button onclick="enviar()">Enviar cópia agora</button></div></div>'}
function venceIn(t){if(t.fim){var d=Math.ceil((new Date(t.fim+"T00:00")-Date.now())/864e5);if(d<=60)return d<0?" • contrato vencido":" • contrato vence em "+d+" dias"}return""}

function vForm(){
 var t=cur?get(cur):{},f=function(id,l,v,ty,x){return'<label for="'+id+'">'+l+'</label><input id="'+id+'" type="'+(ty||"text")+'" value="'+esc(v)+'" '+(x||"")+'>'};
 return '<h2>'+(cur?"Editar locatário":"Novo locatário")+'</h2><form onsubmit="salvar(event)">'+
 f("nome","Nome do locatário",t.nome,"text","required")+f("tel","Telefone / WhatsApp",t.tel,"tel")+f("end","Endereço do imóvel",t.end,"text","required")+
 f("valor","Valor do aluguel (R$)",t.valor,"number",'step="0.01" required inputmode="decimal"')+f("venc","Dia do vencimento",t.venc,"number",'min="1" max="31" required')+
 f("link","Link da pasta de documentos (Google Drive)",t.link,"url")+f("lnome","Nome do locador (proprietário)",t.lnome)+f("ltel","WhatsApp do locador",t.ltel,"tel")+f("ini","Início do contrato",t.ini,"date")+f("fim","Fim do contrato",t.fim,"date")+
 '<label for="obs">Observações</label><textarea id="obs" rows="3">'+esc(t.obs)+'</textarea><div class="row"><button type="submit">Salvar</button><button type="button" class="sec" onclick="voltar()">Cancelar</button></div></form>';
}

function vDetail(){
 var t=get(cur),n=new Date(),h='<div class="row"><button class="sec" onclick="voltar()">← Voltar</button><button class="sec" onclick="editar()">Editar</button><button class="del" onclick="excluir()">Excluir</button></div>';
 h+='<div class="card"><b style="font-size:22px">'+esc(t.nome)+'</b><br>'+(t.tel?'<a href="tel:'+esc(t.tel)+'">'+esc(t.tel)+'</a><br>':'')+esc(t.end)+'<br>Aluguel: <b>'+brl(t.valor)+'</b>, vence dia <b>'+esc(t.venc)+'</b><br>Contrato: '+br(t.ini)+' a '+br(t.fim)+(t.obs?'<br><span class="muted">'+esc(t.obs)+'</span>':'')+'</div>';
 h+='<div class="row">'+(t.tel?'<button onclick="zap()">Lembrar no WhatsApp</button>':'')+(t.link?'<button class="sec" onclick="pasta()">Abrir pasta de documentos</button>':'')+'</div>';
 h+='<h2>Pagamentos</h2><div class="row" style="align-items:center"><button class="sec" onclick="ano(-1)">←</button><b style="font-size:22px">'+year+'</b><button class="sec" onclick="ano(1)">→</button></div><div class="meses">';
 for(var m=0;m<12;m++){
  var k=ym(year,m),p=t.pag[k],pass=year<n.getFullYear()||(year===n.getFullYear()&&(m<n.getMonth()||(m===n.getMonth()&&n.getDate()>Number(t.venc))));
  var c=p?"ok":pass?"bad":"";
  h+='<button class="'+c+'" onclick="pagar(\''+k+'\')">'+MES[m]+'<small>'+(p?"✓ "+br(p.data).slice(0,5):pass?"em aberto":"")+'</small></button>'}
 h+='</div><p class="muted">Toque no mês para registrar o pagamento.</p><h2>Recibos guardados</h2>';
 var ks=Object.keys(t.pag).sort().reverse();
 if(!ks.length)h+='<p class="muted">Nenhum recibo ainda. Registre um pagamento acima.</p>';
 ks.forEach(function(q){var r=t.pag[q],pt=q.split("-");h+='<button class="t" onclick="recibo(\''+t.id+'\',\''+q+'\')"><span><b>'+MESL[Number(pt[1])-1]+' de '+pt[0]+'</b><small>'+brl(r.valor)+' • pago em '+br(r.data)+'</small></span><span class="tag ok">Abrir recibo</span></button>'});
 h+='<h2>Documentos entregues</h2><div class="card dl">';
 DOCS.forEach(function(d,i){h+='<label><input type="checkbox" '+(t.docs[i]?"checked":"")+' onchange="doc('+i+',this.checked)">'+d+'</label>'});
 return h+'</div>';
}

function novo(){cur=null;view="form";render()}
function abrir(id){cur=id;view="detail";render()}
function voltar(){view=cur&&view==="form"&&get(cur)?"detail":"list";render()}
function editar(){view="form";render()}
function ano(d){year+=d;render()}
function v(id){return document.getElementById(id).value}
function salvar(e){e.preventDefault();
 var d={nome:v("nome").trim(),tel:v("tel"),end:v("end").trim(),valor:parseFloat(v("valor")),venc:v("venc"),ini:v("ini"),fim:v("fim"),obs:v("obs"),link:v("link").trim(),lnome:v("lnome").trim(),ltel:v("ltel")};
 if(cur){Object.assign(get(cur),d);view="detail"}else{d.id="t"+Date.now();d.pag={};d.docs={};db.t.push(d);cur=d.id;view="detail"}
 save();render()}
function excluir(){var t=get(cur);if(confirm("Excluir "+t.nome+" e todos os registros dele? Isso não pode ser desfeito.")){db.t=db.t.filter(function(x){return x.id!==cur});save();cur=null;view="list";render()}}
function doc(i,c){get(cur).docs[i]=c;save()}

function pagar(k){
 var t=get(cur),p=t.pag[k],pt=k.split("-");pay={id:cur,k:k};
 document.getElementById("dt").textContent=MESL[Number(pt[1])-1]+" de "+pt[0];
 document.getElementById("dd").value=p?p.data:new Date().toISOString().slice(0,10);
 document.getElementById("dv").value=p?p.valor:t.valor;
 document.getElementById("undo").style.display=p?"":"none";document.getElementById("ver").style.display=p?"":"none";
 dlg.showModal()}
function savePay(ver){
 var d=v("dd"),val=parseFloat(v("dv"));if(!d||!(val>0)){alert("Informe a data e o valor.");return}
 get(pay.id).pag[pay.k]={data:d,valor:val};save();dlg.close();render();if(ver)recibo(pay.id,pay.k)}
function undoPay(){if(confirm("Desfazer este pagamento?")){delete get(pay.id).pag[pay.k];save();dlg.close();render()}}

function recibo(id,k){
 var t=get(id),p=t.pag[k],pt=k.split("-"),dp=p.data.split("-");rinfo={id:id,k:k};
 document.getElementById("paper").innerHTML='<h1>RECIBO DE ALUGUEL</h1><p style="text-align:right"><b>'+brl(p.valor)+'</b></p>'+
 '<p>Recebi de <b>'+esc(t.nome)+'</b> a quantia de <b>'+brl(p.valor)+'</b> ('+extenso(p.valor)+'), referente ao aluguel do mês de <b>'+MESL[Number(pt[1])-1]+' de '+pt[0]+'</b>, do imóvel situado em <b>'+esc(t.end)+'</b>'+(t.lnome?', de propriedade de <b>'+esc(t.lnome)+'</b>':'')+'.</p>'+
 '<p>Pelo que firmo o presente recibo, dando plena quitação do valor recebido.</p><p>Data do pagamento: '+dp[2]+'/'+dp[1]+'/'+dp[0]+'</p>'+
 '<div class="sig"><hr>'+esc(recebedor())+'</div>';
 document.getElementById("recibo").style.display="block"}
function closeRecibo(){document.getElementById("recibo").style.display="none"}
var rinfo=null;
function slug(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/gi,"-").toLowerCase()}
async function arquivo(tipo){
 var t=get(rinfo.id),nome="recibo-"+slug(t.nome)+"-"+rinfo.k,c=await html2canvas(document.getElementById("paper"),{scale:2,backgroundColor:"#ffffff"});
 if(tipo==="png"){var b=await new Promise(function(r){c.toBlob(r,"image/png")});return new File([b],nome+".png",{type:"image/png"})}
 var pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),w=190;pdf.addImage(c.toDataURL("image/png"),"PNG",10,10,w,c.height*w/c.width);
 return new File([pdf.output("blob")],nome+".pdf",{type:"application/pdf"})}
async function enviarRecibo(tipo){try{var f=await arquivo(tipo);
 if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"Recibo de aluguel"});else{baixar(f,f.name);alert("Arquivo salvo no aparelho. Anexe no WhatsApp.")}}
 catch(e){if(e&&e.name==="AbortError")return;alert("Não foi possível gerar o arquivo. Verifique a internet e tente de novo.")}}
async function baixarRecibo(tipo){try{var f=await arquivo(tipo);baixar(f,f.name)}catch(e){alert("Não foi possível gerar o arquivo. Verifique a internet e tente de novo.")}}
function cfg(){var r=prompt("Texto que aparece abaixo da assinatura do recibo:",recebedor());if(r){db.cfg.rec=r;save()}}

function baixar(blob,nome){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;a.click()}
function marca(){db.cfg.bk=Date.now();save();render()}
function bkNome(){return"copia-alugueis-"+new Date().toISOString().slice(0,10)+".json"}
function exportar(){baixar(new Blob([JSON.stringify(db)],{type:"application/json"}),bkNome());marca()}
function enviar(){var f=new File([JSON.stringify(db)],bkNome(),{type:"application/json"});
 if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Cópia dos aluguéis"}).then(marca).catch(function(){})}
 else{alert("Este aparelho não envia direto. Vou baixar o arquivo; depois mande para o seu WhatsApp ou e-mail.");exportar()}}
function planilha(){var q=function(s){return'"'+String(s==null?"":s).replace(/"/g,'""')+'"'},r=[["Locatário","Telefone","Endereço","Aluguel","Vencimento","Início","Fim"].concat(MES.map(function(m){return m+"/"+year}))];
 db.t.forEach(function(t){r.push([t.nome,t.tel,t.end,t.valor,t.venc,br(t.ini),br(t.fim)].concat(MES.map(function(m,i){var p=t.pag[ym(year,i)];return p?br(p.data):""})))});
 baixar(new Blob(["\ufeff"+r.map(function(l){return l.map(q).join(";")}).join("\r\n")],{type:"text/csv"}),"alugueis-"+year+".csv")}
function zap(){var t=get(cur),n=(t.tel||"").replace(/\D/g,"");if(n.length<=11)n="55"+n;
 var msg="Olá, "+t.nome.split(" ")[0]+"! Passando para lembrar do aluguel de "+MESL[new Date().getMonth()]+", no valor de "+brl(t.valor)+", com vencimento no dia "+t.venc+". Qualquer dúvida, estou à disposição. Sérgio Costa";
 window.open("https://wa.me/"+n+"?text="+encodeURIComponent(msg),"_blank")}
function pasta(){window.open(get(cur).link,"_blank")}
function importar(i){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.t)throw 0;if(confirm("Substituir os dados atuais pela cópia?")){db=d;save();render()}}catch(e){alert("Arquivo de cópia inválido.")}};r.readAsText(f)}
render();
</script>
</body>
</html>
