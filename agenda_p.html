<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Agenda FCosta</title>
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#14213D;--muted:#6B7686;--line:#E4E8EE;--acc:#14213D;--blue:#2563EB;--shadow:0 1px 3px rgba(20,33,61,.08),0 6px 20px rgba(20,33,61,.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100vh;padding-bottom:110px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.top{background:var(--acc);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto}
.top h1{font-size:1.15rem;font-weight:800;flex:1}
.top h1 small{display:block;font-size:.68rem;font-weight:600;color:rgba(255,255,255,.65);margin-top:1px}
.ib{width:40px;height:40px;border-radius:12px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:1.3rem;font-weight:700}
.hojeb{border:none;background:#F6C453;color:#14213D;font-weight:800;border-radius:12px;padding:0 14px;height:40px;font-size:.85rem}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px}
.tabs{display:flex;background:#E4E8EE;border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:10px;font-weight:800;color:var(--muted);font-size:.88rem}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.chip.off{opacity:.4}
.cal{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:10px 8px 12px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow div{text-align:center;font-size:.68rem;font-weight:800;color:var(--muted);padding:4px 0 8px;text-transform:uppercase}
.d{aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;border:none;background:none;border-radius:12px;font-weight:700;font-size:.95rem;position:relative;margin:1px}
.d.fora{color:#B4BCC8}
.d.hoje span.n{background:var(--acc);color:#fff}
.d.sel{background:#E8EEFB;outline:2px solid var(--blue)}
.d span.n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:3px;margin-top:3px;height:6px}
.dots b{width:6px;height:6px;border-radius:50%;display:block}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px}
.sec h2{font-size:1rem;font-weight:800}
.sec span{font-size:.78rem;color:var(--muted);font-weight:600}
.ev{display:flex;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border-left:5px solid;cursor:pointer;width:100%;text-align:left;border-top:none;border-right:none;border-bottom:none}
.ev .h{min-width:48px;font-weight:800;font-size:.9rem}
.ev .h small{display:block;font-weight:600;color:var(--muted);font-size:.72rem}
.ev .t{font-weight:700;line-height:1.3}
.ev .t small{display:block;font-weight:500;color:var(--muted);margin-top:3px;font-size:.8rem}
.vazio{text-align:center;color:var(--muted);padding:26px 10px;background:#fff;border-radius:14px;font-size:.9rem}
.dh{font-size:.8rem;font-weight:800;color:var(--muted);text-transform:uppercase;margin:16px 2px 8px;letter-spacing:.3px}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:none;background:#F6C453;color:#14213D;font-size:2rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:30}
.ov{position:fixed;inset:0;background:rgba(20,33,61,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:1.05rem;margin-bottom:12px}
.f{margin-bottom:12px}
.f label{display:block;font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cores{display:flex;gap:8px;flex-wrap:wrap}
.cb{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.cb.on{box-shadow:0 0 0 3px var(--ink)}
.acts{display:flex;gap:8px;margin-top:6px}
.acts button{flex:1;padding:13px;border:none;border-radius:12px;font-weight:800}
.sv{background:var(--acc);color:#fff}.ca{background:#E9EDF2;color:var(--muted)}.dl{background:#FDECEC;color:#DC2626;flex:0 0 auto!important}
</style>
</head>
<body>
<div class="top"><div class="top-row">
  <button class="ib" onclick="mv(-1)" aria-label="Anterior">‹</button>
  <h1 id="tt">—<small id="ts"></small></h1>
  <button class="ib" onclick="mv(1)" aria-label="Próximo">›</button>
  <button class="hojeb" onclick="hojeGo()">Hoje</button>
</div></div>
<div class="wrap">
  <div class="tabs"><button id="tb-mes" class="on" onclick="setV('mes')">Mês</button><button id="tb-lista" onclick="setV('lista')">Próximos</button></div>
  <div class="chips" id="chips"></div>
  <div id="v-mes">
    <div class="cal"><div class="dow" id="dow"></div><div class="grid" id="grid"></div></div>
    <div class="sec"><h2 id="dtit"></h2><span id="dcnt"></span></div>
    <div id="dlist"></div>
  </div>
  <div id="v-lista" style="display:none"></div>
</div>
<button class="fab" onclick="novo()" aria-label="Novo evento">+</button>

<div class="ov" id="ov" onclick="if(event.target===this)fechar()">
 <div class="sheet">
  <h3 id="mh">Novo evento</h3>
  <div class="f"><label>Título</label><input id="m-t" placeholder="Ex.: Visita ao apartamento"/></div>
  <div class="two">
   <div class="f"><label>Data</label><input type="date" id="m-di"/></div>
   <div class="f"><label>Categoria</label><select id="m-cat"></select></div>
  </div>
  <div class="two">
   <div class="f"><label>Início</label><input type="time" id="m-hi"/></div>
   <div class="f"><label>Fim</label><input type="time" id="m-hf"/></div>
  </div>
  <div class="f"><label>Local</label><input id="m-loc" placeholder="Endereço ou local"/></div>
  <div class="f"><label>Anotações</label><textarea id="m-nota" rows="3" placeholder="Cliente, telefone, valor…"></textarea></div>
  <div class="f"><label>Cor (opcional)</label><div class="cores" id="cores"></div></div>
  <div class="acts"><button class="dl" id="m-del" onclick="excluir()">Excluir</button><button class="ca" onclick="fechar()">Cancelar</button><button class="sv" onclick="salvar()">Salvar</button></div>
 </div>
</div>

<script>
const CATS={visita:{n:"Visita",c:"#2563EB"},reuniao:{n:"Reunião",c:"#8B5CF6"},proposta:{n:"Proposta",c:"#F59E0B"},assinatura:{n:"Assinatura",c:"#10B981"},vistoria:{n:"Vistoria",c:"#EF4444"},pessoal:{n:"Pessoal",c:"#0EA5E9"},outro:{n:"Outro",c:"#6B7280"}};
const CORES=["#EF4444","#F97316","#EAB308","#22C55E","#10B981","#3B82F6","#6366F1","#8B5CF6","#EC4899","#14B8A6"];
const MES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DC=["D","S","T","Q","Q","S","S"],DL=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const p2=n=>String(n).padStart(2,"0"),ds=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const $=id=>document.getElementById(id),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cor=e=>e.cor||(CATS[e.cat]||{}).c||"#6B7280";
const hoje=new Date();hoje.setHours(0,0,0,0);
let evs=[],ref=new Date(hoje.getFullYear(),hoje.getMonth(),1),sel=ds(hoje),view="mes",filt=new Set(Object.keys(CATS)),cur=null,curCor=null;
try{evs=JSON.parse(localStorage.getItem("fcosta-ag2")||"[]")}catch(e){}
function save(){try{localStorage.setItem("fcosta-ag2",JSON.stringify(evs))}catch(e){}}
function vis(){return evs.filter(e=>filt.has(e.cat)||!CATS[e.cat])}
function ordena(a){return a.sort((x,y)=>x.di.localeCompare(y.di)||(x.hi||"").localeCompare(y.hi||""))}
function render(){
  $("tt").firstChild.nodeValue=view==="mes"?MES[ref.getMonth()]:"Próximos eventos";
  $("ts").textContent=view==="mes"?ref.getFullYear():"A partir de hoje";
  $("v-mes").style.display=view==="mes"?"block":"none";$("v-lista").style.display=view==="lista"?"block":"none";
  $("tb-mes").classList.toggle("on",view==="mes");$("tb-lista").classList.toggle("on",view==="lista");
  $("chips").innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="chip ${filt.has(k)?"":"off"}" onclick="tg('${k}')"><i style="background:${v.c}"></i>${v.n}</button>`).join("");
  if(view==="mes"){grade();dia()}else lista();
}
function tg(k){filt.has(k)?filt.delete(k):filt.add(k);render()}
function mv(n){if(view==="mes"){ref=new Date(ref.getFullYear(),ref.getMonth()+n,1);render()}}
function hojeGo(){ref=new Date(hoje.getFullYear(),hoje.getMonth(),1);sel=ds(hoje);setV("mes")}
function setV(v){view=v;render()}
function grade(){
  $("dow").innerHTML=DC.map(d=>`<div>${d}</div>`).join("");
  const a=ref.getFullYear(),m=ref.getMonth(),ini=new Date(a,m,1);ini.setDate(1-ini.getDay());
  const V=vis();let h="";
  for(let i=0;i<42;i++){const d=new Date(ini);d.setDate(ini.getDate()+i);if(i>=35&&d.getMonth()!==m)break;
    const s=ds(d),es=V.filter(e=>e.di===s),cl=["d"];if(d.getMonth()!==m)cl.push("fora");if(s===ds(hoje))cl.push("hoje");if(s===sel)cl.push("sel");
    const cs=[...new Set(es.map(cor))].slice(0,3);
    h+=`<button class="${cl.join(" ")}" onclick="pick('${s}')"><span class="n">${d.getDate()}</span><span class="dots">${cs.map(c=>`<b style="background:${c}"></b>`).join("")}</span></button>`}
  $("grid").innerHTML=h;
}
function pick(s){sel=s;const d=pd(s);if(d.getMonth()!==ref.getMonth())ref=new Date(d.getFullYear(),d.getMonth(),1);render()}
function card(e,comData){
  const hr=e.hi?e.hi+(e.hf?`<small>${e.hf}</small>`:""):"Dia<small>todo</small>";
  const ex=[e.loc?"📍 "+esc(e.loc):"",e.nota?esc(e.nota):""].filter(Boolean).join("<br>");
  return `<button class="ev" style="border-left-color:${cor(e)}" onclick="edit('${e.id}')"><div class="h">${hr}</div><div class="t">${esc(e.tit)}${(comData?`<small>${pd(e.di).getDate()}/${p2(pd(e.di).getMonth()+1)} · ${(CATS[e.cat]||{}).n||""}</small>`:"")}${ex?`<small>${ex}</small>`:""}</div></button>`}
function dia(){
  const d=pd(sel),es=ordena(vis().filter(e=>e.di===sel));
  $("dtit").textContent=(sel===ds(hoje)?"Hoje · ":"")+DL[d.getDay()]+", "+d.getDate()+" de "+MES[d.getMonth()].toLowerCase();
  $("dcnt").textContent=es.length?es.length+(es.length>1?" eventos":" evento"):"";
  $("dlist").innerHTML=es.length?es.map(e=>card(e)).join(""):`<div class="vazio">Nada marcado neste dia.<br>Toque no <b>+</b> para adicionar.</div>`;
}
function lista(){
  const es=ordena(vis().filter(e=>e.di>=ds(hoje))),box=$("v-lista");let h="",ult="";
  es.forEach(e=>{if(e.di!==ult){ult=e.di;const d=pd(e.di);h+=`<div class="dh">${e.di===ds(hoje)?"Hoje":DL[d.getDay()]} · ${d.getDate()} de ${MES[d.getMonth()].toLowerCase()}</div>`}h+=card(e,0)});
  box.innerHTML=h||`<div class="vazio">Nenhum evento próximo.</div>`;
}
function novo(){abrir(null,view==="mes"?sel:ds(hoje))}
function edit(id){abrir(evs.find(e=>e.id===id))}
function abrir(e,di){
  cur=e||null;curCor=e?e.cor||null:null;
  $("mh").textContent=e?"Editar evento":"Novo evento";
  $("m-cat").innerHTML=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("");
  $("m-t").value=e?e.tit:"";$("m-di").value=e?e.di:di;$("m-hi").value=e?e.hi||"":"";$("m-hf").value=e?e.hf||"":"";
  $("m-cat").value=e?e.cat:"visita";$("m-loc").value=e?e.loc||"":"";$("m-nota").value=e?e.nota||"":"";
  $("m-del").style.display=e?"block":"none";cores();$("ov").classList.add("on");
  if(!e)setTimeout(()=>$("m-t").focus(),150);
}
function cores(){$("cores").innerHTML=CORES.map(c=>`<button class="cb ${c===curCor?"on":""}" style="background:${c}" onclick="curCor=curCor==='${c}'?null:'${c}';cores()"></button>`).join("")}
function fechar(){$("ov").classList.remove("on")}
function salvar(){
  const t=$("m-t").value.trim(),di=$("m-di").value;
  if(!t){alert("Informe o título.");return}if(!di){alert("Informe a data.");return}
  let hi=$("m-hi").value,hf=$("m-hf").value;
  const o={tit:t,di,df:di,hi,hf,cat:$("m-cat").value,loc:$("m-loc").value.trim(),nota:$("m-nota").value.trim(),cor:curCor};
  if(cur)evs=evs.map(e=>e.id===cur.id?{...o,id:e.id}:e);else evs.push({...o,id:String(Date.now())});
  save();sel=di;const d=pd(di);ref=new Date(d.getFullYear(),d.getMonth(),1);fechar();render();
}
function excluir(){if(cur&&confirm("Excluir este evento?")){evs=evs.filter(e=>e.id!==cur.id);save();fechar();render()}}
render();
</script>
<!-- fc-voltar-painel -->
<style>#fc-voltar-painel{position:fixed!important;left:12px!important;bottom:calc(12px + env(safe-area-inset-bottom,0px))!important;z-index:2147483000!important;display:inline-flex!important;align-items:center!important;gap:8px!important;min-height:46px!important;padding:0 20px!important;border-radius:999px!important;background:#22d3ee!important;color:#06101c!important;border:2px solid #06101c!important;font:800 16px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;text-decoration:none!important;box-shadow:0 6px 20px rgba(0,0,0,.45)!important;-webkit-tap-highlight-color:transparent}#fc-voltar-painel:active{transform:scale(.96)}@media print{#fc-voltar-painel{display:none!important}}</style>
<a id="fc-voltar-painel" href="index.html" aria-label="Voltar para o painel">&#8592; Voltar ao painel</a>
<script>try{if(window.self!==window.top)document.getElementById('fc-voltar-painel').style.display='none'}catch(e){}</script>
<!-- /fc-voltar-painel -->
</body>
</html>
