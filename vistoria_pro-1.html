<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Vistoria — Sérgio Costa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --tinta: #101a29;
  --tinta2: #0a121e;
  --papel: #f3ead9;
  --latao: #c9a227;
  --latao-claro: #e6c358;
  --latao-fundo: #8f6f16;
  --card-bg: rgba(201,162,39,0.06);
  --card-border: rgba(201,162,39,0.20);
  --card-hover-bg: rgba(201,162,39,0.13);
  --text-muted: rgba(243,234,217,0.46);
  --text-soft: rgba(243,234,217,0.72);
  --divider: rgba(201,162,39,0.16);
  --group-bg: rgba(201,162,39,0.035);
  --group-border: rgba(201,162,39,0.14);
  --foco: #7fb8ff;
  --sucesso: #4a9d7d;
  --alerta: #d3654f;
}

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--tinta2);
  background-image: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,162,39,0.10), transparent 60%);
  min-height: 100vh;
  color: var(--papel);
  padding-bottom: 90px;
}
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; border-radius: 4px; }

/* ── HEADER ─────────────────────────────────── */
header {
  background: linear-gradient(180deg, var(--tinta) 0%, var(--tinta2) 100%);
  border-bottom: 1px solid var(--divider);
  padding: 1.25rem 1.5rem 1.1rem;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.selo {
  width: 46px; height: 46px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  background: radial-gradient(circle at 32% 28%, var(--latao-claro), var(--latao) 45%, var(--latao-fundo) 100%);
  box-shadow: 0 0 0 1px rgba(201,162,39,0.35), 0 4px 14px rgba(0,0,0,0.35);
}
.selo::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border: 1px dashed rgba(16,26,41,0.55);
}
.selo i { font-size: 19px; color: var(--tinta2); }
.header-info { flex: 1; min-width: 0; }
.header-info a.voltar {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; color: var(--text-muted);
  text-decoration: none; display: flex; align-items: center; gap: 3px;
  margin-bottom: 3px;
}
.header-info a.voltar:hover { color: var(--latao-claro); }
.header-info h1 {
  font-family: 'Fraunces', serif;
  font-size: 18px; font-weight: 600; color: var(--papel); line-height: 1.2;
}
.header-btn {
  flex-shrink: 0;
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  color: var(--latao-claro);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px;
}
.header-btn:hover { background: var(--card-hover-bg); }

/* ── MAIN ────────────────────────────────────── */
main { max-width: 620px; margin: 0 auto; padding: 1.5rem 1.25rem 2rem; }

.section-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px; font-weight: 500; letter-spacing: 0.1em;
  color: var(--text-muted); text-transform: uppercase;
  margin-bottom: 12px; padding-left: 12px; position: relative;
  display: flex; align-items: center; gap: 10px;
}
.section-label::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 16px; background: var(--latao); border-radius: 2px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--divider); }
.section-label .count { color: var(--latao-claro); opacity: 0.8; }

/* ── DADOS DO IMÓVEL ─────────────────────────── */
.dados-card {
  background: var(--group-bg);
  border: 1px solid var(--group-border);
  border-radius: 12px;
  padding: 16px 16px 14px;
  margin-bottom: 24px;
}
.campo { margin-bottom: 12px; }
.campo:last-child { margin-bottom: 0; }
.campo label {
  display: block; font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 5px;
}
.campo input {
  width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--card-border);
  color: var(--papel); font-size: 14px; font-family: 'Inter', sans-serif;
  padding: 4px 2px; outline: none; transition: border-color 0.15s;
}
.campo input:focus { border-color: var(--latao); }
.campo input::-webkit-calendar-picker-indicator { filter: invert(0.8) sepia(1) saturate(3) hue-rotate(5deg); }

/* ── AVISO API KEY ───────────────────────────── */
.aviso {
  display: flex; gap: 10px; align-items: flex-start;
  background: rgba(201,162,39,0.08); border: 1px solid rgba(201,162,39,0.25);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 20px;
  font-size: 12.5px; color: var(--text-soft); line-height: 1.5;
}
.aviso i { color: var(--latao-claro); font-size: 16px; margin-top: 1px; flex-shrink: 0; }
.aviso button { background: none; border: none; color: var(--latao-claro); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }

/* ── CÔMODOS ─────────────────────────────────── */
.room-empty {
  border: 2px dashed var(--group-border); border-radius: 12px;
  padding: 32px 16px; text-align: center; color: var(--text-muted); font-size: 13px;
  margin-bottom: 16px; line-height: 1.6;
}
.room-empty i { font-size: 22px; color: var(--text-muted); display: block; margin-bottom: 8px; }

.room-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-left: 3px solid var(--latao);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.room-card.completo { border-left-color: var(--sucesso); }

.room-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
.room-num {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  background: var(--latao); color: var(--tinta2); border-radius: 4px;
  padding: 2px 6px; flex-shrink: 0; margin-top: 3px; font-weight: 600;
}
.room-nome {
  flex: 1; background: transparent; border: none; border-bottom: 1px solid transparent;
  font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; color: var(--papel);
  outline: none; padding-bottom: 2px; min-width: 0;
}
.room-nome:focus { border-color: var(--latao); }
.room-nome::placeholder { color: var(--text-muted); font-weight: 500; }
.btn-remove-room {
  background: none; border: none; color: var(--text-muted); cursor: pointer;
  font-size: 16px; padding: 2px; flex-shrink: 0;
}
.btn-remove-room:hover { color: var(--alerta); }

.badges { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.badge {
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; text-transform: uppercase;
  letter-spacing: 0.04em; border-radius: 4px; padding: 3px 7px; font-weight: 500;
}
.badge.foto { background: rgba(211,101,79,0.15); color: #e08a76; }
.badge.narracao { background: rgba(201,162,39,0.15); color: var(--latao-claro); }

.photos-wrap { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.photo-thumb { position: relative; width: 62px; height: 62px; flex-shrink: 0; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid var(--card-border); }
.photo-thumb button {
  position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--alerta); color: white; border: none; font-size: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; line-height: 1;
}
.add-photo-btn {
  width: 62px; height: 62px; flex-shrink: 0; border-radius: 6px;
  border: 1.5px dashed var(--card-border); background: transparent; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer;
}
.add-photo-btn:hover { border-color: var(--latao); color: var(--latao-claro); }

.notes-wrap { position: relative; }
.room-notes {
  width: 100%; min-height: 68px; background: rgba(16,26,41,0.5);
  border: 1px solid var(--card-border); border-radius: 8px; color: var(--papel);
  font-family: 'Inter', sans-serif; font-size: 13.5px; padding: 10px 34px 10px 10px;
  resize: vertical; outline: none; line-height: 1.5;
}
.room-notes:focus { border-color: var(--latao); }
.room-notes::placeholder { color: var(--text-muted); }
.mic-hint { position: absolute; top: 10px; right: 10px; color: var(--text-muted); font-size: 14px; pointer-events: none; }

.btn-add-room {
  width: 100%; padding: 14px; border-radius: 10px;
  border: 2px dashed var(--group-border); background: transparent; color: var(--text-soft);
  font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 500; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-add-room:hover { border-color: var(--latao); color: var(--latao-claro); background: var(--card-bg); }

.erro-box {
  display: flex; gap: 8px; align-items: flex-start; background: rgba(211,101,79,0.1);
  border: 1px solid rgba(211,101,79,0.3); color: #e08a76; border-radius: 8px;
  padding: 10px 12px; font-size: 12.5px; margin-top: 14px; line-height: 1.5;
}

/* ── BARRA INFERIOR ──────────────────────────── */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: linear-gradient(0deg, var(--tinta2) 60%, transparent);
  padding-top: 20px;
}
.bottom-bar-inner {
  max-width: 620px; margin: 0 auto; background: var(--tinta);
  border-top: 1px solid var(--divider); padding: 12px 1.25rem;
  display: flex; gap: 10px;
}
.btn-icon-round {
  width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0;
  border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-soft);
  display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer;
}
.btn-icon-round:hover { border-color: var(--alerta); color: var(--alerta); }
.btn-gerar {
  flex: 1; border: none; border-radius: 10px; font-weight: 600; font-size: 14px;
  background: linear-gradient(135deg, var(--latao-claro), var(--latao));
  color: var(--tinta2); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-gerar:disabled { opacity: 0.6; cursor: not-allowed; }
.spin { animation: spin 0.8s linear infinite; display: inline-flex; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── CONFIGURAÇÕES (chave API) ───────────────── */
.settings-box {
  background: var(--group-bg); border: 1px solid var(--group-border); border-radius: 12px;
  padding: 18px; margin-bottom: 16px;
}
.settings-box h2 { font-family: 'Fraunces', serif; font-size: 15px; margin-bottom: 6px; color: var(--papel); }
.settings-box p { font-size: 12.5px; color: var(--text-soft); line-height: 1.6; margin-bottom: 12px; }
.settings-box input {
  width: 100%; background: rgba(16,26,41,0.6); border: 1px solid var(--card-border);
  border-radius: 6px; padding: 9px 10px; color: var(--papel); font-size: 13px; outline: none; margin-bottom: 10px;
}
.settings-box input:focus { border-color: var(--latao); }
.settings-box .fine { font-size: 11px; color: var(--text-muted); line-height: 1.6; }
.link-voltar {
  display: inline-flex; align-items: center; gap: 6px; color: var(--text-soft);
  text-decoration: none; font-size: 13px; font-weight: 500; margin-bottom: 18px;
}
.link-voltar:hover { color: var(--latao-claro); }

/* ── LAUDO / RELATÓRIO (documento "físico") ──── */
.report-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.btn-print {
  background: linear-gradient(135deg, var(--latao-claro), var(--latao)); color: var(--tinta2);
  border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; font-size: 13px;
  display: flex; align-items: center; gap: 7px; cursor: pointer;
}
.documento {
  background: var(--papel); color: var(--tinta2); border-radius: 10px;
  padding: 28px 24px; position: relative; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}
.doc-selo {
  position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, var(--latao-claro), var(--latao) 45%, var(--latao-fundo) 100%);
  display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
.doc-selo i { color: var(--tinta2); font-size: 17px; }
.doc-header { border-bottom: 2px solid var(--tinta); padding-bottom: 14px; margin-bottom: 18px; padding-right: 56px; }
.doc-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--latao-fundo); margin-bottom: 4px; }
.doc-header h1 { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 700; line-height: 1.25; }
.doc-meta { margin-top: 10px; font-size: 12.5px; color: rgba(16,26,41,0.65); display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.doc-meta .full { grid-column: 1 / -1; }
.doc-meta .responsavel { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: rgba(16,26,41,0.5); margin-top: 4px; }

.doc-item { padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid rgba(16,26,41,0.1); }
.doc-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.doc-item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.doc-item-num { font-family: 'IBM Plex Mono', monospace; font-size: 10px; background: var(--tinta); color: var(--latao-claro); border-radius: 4px; padding: 2px 6px; }
.doc-item-head h2 { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; }
.doc-fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 9px; }
.doc-fotos img { width: 100%; height: 88px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(16,26,41,0.12); }
.doc-item p { font-size: 13px; line-height: 1.65; color: rgba(16,26,41,0.85); }
.doc-footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid rgba(16,26,41,0.15); font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: rgba(16,26,41,0.4); text-align: center; }

@media print {
  body { background: white; padding-bottom: 0; }
  header, .no-print { display: none !important; }
  main { max-width: 100%; padding: 0; }
  .documento { box-shadow: none; border-radius: 0; }
}

@media (max-width: 420px) {
  .doc-fotos { grid-template-columns: repeat(2, 1fr); }
}
</style>

<body>
<div id="app"></div>

<script>
/* =========================================================
   VISTORIA DE IMÓVEL — Sérgio Costa
   App estático (sem build). Dados salvos em localStorage.
========================================================= */

const STORAGE_KEY = "vistoria-app-data";
const APIKEY_STORAGE = "vistoria-app-apikey";
const MODEL = "claude-sonnet-5";

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function emptyVistoria() {
  return {
    id: uid(),
    endereco: "",
    cliente: "",
    data: new Date().toISOString().slice(0, 10),
    corretor: "Sérgio Costa — CRECI-SP 29479-F / CNAI 52708 — WhatsApp 99350-9109",
    rooms: []
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return emptyVistoria();
}

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.vistoria)); }
    catch (e) { console.error("Erro ao salvar", e); }
  }, 500);
}

function compressImage(file, maxWidth = 900, quality = 0.55) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Falha ao ler a imagem"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Falha ao carregar a imagem"));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function askClaude(prompt, apiKey) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model: MODEL, max_tokens: 1000, messages: [{ role: "user", content: prompt }] })
  });
  if (!response.ok) throw new Error("Falha na chamada da API (" + response.status + ")");
  const data = await response.json();
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
}

const state = {
  vistoria: loadState(),
  view: "editor",
  generating: false,
  genStep: "",
  genError: "",
  apiKey: localStorage.getItem(APIKEY_STORAGE) || ""
};

function updateField(field, value) { state.vistoria[field] = value; scheduleSave(); }

function addRoom() {
  state.vistoria.rooms.push({ id: uid(), nome: "", notes: "", photos: [], laudo: "" });
  scheduleSave(); renderApp();
}
function removeRoom(id) { state.vistoria.rooms = state.vistoria.rooms.filter(r => r.id !== id); scheduleSave(); renderApp(); }
function updateRoomField(id, field, value) {
  const room = state.vistoria.rooms.find(r => r.id === id);
  if (room) room[field] = value;
  scheduleSave();
}
async function addPhotos(id, fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const compressed = await Promise.all(files.map(f => compressImage(f)));
  const room = state.vistoria.rooms.find(r => r.id === id);
  if (room) room.photos.push(...compressed);
  scheduleSave(); renderApp();
}
function removePhoto(roomId, idx) {
  const room = state.vistoria.rooms.find(r => r.id === roomId);
  if (room) room.photos.splice(idx, 1);
  scheduleSave(); renderApp();
}
function startNew() {
  if (!confirm("Isso vai apagar a vistoria atual deste dispositivo. Deseja continuar?")) return;
  state.vistoria = emptyVistoria();
  state.view = "editor";
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.vistoria));
  renderApp();
}
function saveApiKey(value) { state.apiKey = value.trim(); localStorage.setItem(APIKEY_STORAGE, state.apiKey); }

async function generateReport() {
  state.genError = "";
  if (state.vistoria.rooms.length === 0) { state.genError = "Adicione pelo menos um cômodo antes de gerar o laudo."; renderApp(); return; }
  state.generating = true; renderApp();

  const rooms = state.vistoria.rooms;
  for (let i = 0; i < rooms.length; i++) {
    const room = rooms[i];
    state.genStep = `Redigindo ${room.nome || "cômodo " + (i + 1)} (${i + 1}/${rooms.length})...`;
    renderApp();
    if (!room.notes || !room.notes.trim()) { room.laudo = "Nenhum vício ou observação relatada para este cômodo."; continue; }
    if (!state.apiKey) { room.laudo = room.notes; continue; }
    const prompt = `Você está ajudando um corretor de imóveis a redigir um laudo técnico de vistoria de imóvel.
Abaixo está a anotação bruta, ditada por voz durante a vistoria do cômodo "${room.nome || "sem nome"}", descrevendo vícios e defeitos encontrados:

"""
${room.notes}
"""

Reescreva isso como um parágrafo técnico, objetivo e profissional, em português do Brasil, no estilo de um laudo de vistoria imobiliária. Regras:
- Não invente nenhum defeito, medida ou detalhe que não esteja na anotação original.
- Corrija apenas a forma (gramática, clareza, terminologia técnica de vistoria), nunca o conteúdo.
- Seja conciso: no máximo 3-4 frases.
- Não use marcadores nem título, apenas o parágrafo corrido.
- Responda apenas com o parágrafo, sem nenhum texto adicional.`;
    try { room.laudo = (await askClaude(prompt, state.apiKey)) || room.notes; }
    catch (e) { room.laudo = room.notes; }
  }
  scheduleSave();
  state.generating = false; state.genStep = ""; state.view = "report";
  renderApp();
}

function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function totalPhotos() { return state.vistoria.rooms.reduce((n, r) => n + r.photos.length, 0); }

function renderApp() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (state.view === "editor") app.appendChild(renderEditor());
  else if (state.view === "report") app.appendChild(renderReport());
  else if (state.view === "settings") app.appendChild(renderSettings());
}

function renderEditor() {
  const v = state.vistoria;
  const frag = document.createDocumentFragment();

  const header = el(`
    <header>
      <div class="selo"><i class="ti ti-clipboard-check"></i></div>
      <div class="header-info">
        <a class="voltar" href="index.html"><i class="ti ti-chevron-left"></i> Painel</a>
        <h1>Vistoria de Imóvel</h1>
      </div>
      <button class="header-btn" id="btn-settings" title="Configurar IA"><i class="ti ti-key"></i></button>
    </header>
  `);
  header.querySelector("#btn-settings").onclick = () => { state.view = "settings"; renderApp(); };
  frag.appendChild(header);

  const main = el(`<main></main>`);

  const dados = el(`
    <div class="dados-card">
      <div class="campo"><label>Endereço do imóvel</label><input id="f-endereco" placeholder="Rua, número, bairro, cidade" value="${escapeHtml(v.endereco)}"></div>
      <div class="campo"><label>Cliente / proprietário</label><input id="f-cliente" placeholder="Nome do cliente" value="${escapeHtml(v.cliente)}"></div>
      <div class="campo"><label>Data da vistoria</label><input id="f-data" type="date" value="${escapeHtml(v.data)}"></div>
    </div>
  `);
  dados.querySelector("#f-endereco").oninput = e => updateField("endereco", e.target.value);
  dados.querySelector("#f-cliente").oninput = e => updateField("cliente", e.target.value);
  dados.querySelector("#f-data").oninput = e => updateField("data", e.target.value);
  main.appendChild(dados);

  if (!state.apiKey) {
    const aviso = el(`
      <div class="aviso">
        <i class="ti ti-key"></i>
        <span>Sem chave de API configurada — o laudo final vai usar o texto ditado sem o polimento da IA. <button id="link-settings">Configurar chave</button></span>
      </div>
    `);
    aviso.querySelector("#link-settings").onclick = () => { state.view = "settings"; renderApp(); };
    main.appendChild(aviso);
  }

  const label = el(`
    <div class="section-label">Cômodos <span class="count">${v.rooms.length} · ${totalPhotos()} fotos</span></div>
  `);
  main.appendChild(label);

  if (v.rooms.length === 0) {
    main.appendChild(el(`
      <div class="room-empty"><i class="ti ti-camera-check"></i>Nenhum cômodo ainda.<br>Adicione o primeiro para começar a vistoria.</div>
    `));
  }

  v.rooms.forEach((room, idx) => main.appendChild(renderRoomCard(room, idx)));

  const addBtn = el(`<button class="btn-add-room"><i class="ti ti-plus"></i> Adicionar cômodo</button>`);
  addBtn.onclick = addRoom;
  main.appendChild(addBtn);

  if (state.genError) {
    main.appendChild(el(`<div class="erro-box"><i class="ti ti-alert-triangle"></i><span>${escapeHtml(state.genError)}</span></div>`));
  }

  frag.appendChild(main);

  const bottom = el(`
    <div class="bottom-bar no-print">
      <div class="bottom-bar-inner">
        <button class="btn-icon-round" id="btn-new" title="Nova vistoria"><i class="ti ti-trash"></i></button>
        <button class="btn-gerar" id="btn-generate" ${state.generating ? "disabled" : ""}>
          ${state.generating
            ? `<span class="spin"><i class="ti ti-loader-2"></i></span> ${state.genStep || "Gerando..."}`
            : `<i class="ti ti-file-check"></i> Gerar laudo final (${totalPhotos()} fotos)`}
        </button>
      </div>
    </div>
  `);
  bottom.querySelector("#btn-new").onclick = startNew;
  bottom.querySelector("#btn-generate").onclick = generateReport;
  frag.appendChild(bottom);

  return frag;
}

function renderRoomCard(room, idx) {
  const hasPhotos = room.photos.length > 0;
  const hasNotes = room.notes && room.notes.trim().length > 0;
  const completo = hasPhotos && hasNotes;

  const card = el(`
    <div class="room-card ${completo ? "completo" : ""}">
      <div class="room-head">
        <span class="room-num">${String(idx + 1).padStart(2, "0")}</span>
        <input class="room-nome" placeholder="Nome do cômodo (ex: Cozinha)" value="${escapeHtml(room.nome)}">
        <button class="btn-remove-room"><i class="ti ti-x"></i></button>
      </div>
      ${!completo ? `
        <div class="badges">
          ${!hasPhotos ? `<span class="badge foto">sem foto</span>` : ""}
          ${!hasNotes ? `<span class="badge narracao">sem narração</span>` : ""}
        </div>` : ""}
      <div class="photos-wrap"></div>
      <div class="notes-wrap">
        <textarea class="room-notes" placeholder="Toque aqui e use o microfone do teclado para narrar os vícios deste cômodo...">${escapeHtml(room.notes)}</textarea>
        <i class="ti ti-microphone mic-hint"></i>
      </div>
    </div>
  `);

  card.querySelector(".room-nome").oninput = e => updateRoomField(room.id, "nome", e.target.value);
  card.querySelector(".room-notes").oninput = e => updateRoomField(room.id, "notes", e.target.value);
  card.querySelector(".btn-remove-room").onclick = () => removeRoom(room.id);

  const photosWrap = card.querySelector(".photos-wrap");
  room.photos.forEach((src, i) => {
    const thumb = el(`<div class="photo-thumb"><img src="${src}"><button><i class="ti ti-x"></i></button></div>`);
    thumb.querySelector("button").onclick = () => removePhoto(room.id, i);
    photosWrap.appendChild(thumb);
  });

  const addPhotoBtn = el(`<button class="add-photo-btn"><i class="ti ti-camera"></i></button>`);
  const fileInput = el(`<input type="file" accept="image/*" capture="environment" multiple style="display:none">`);
  addPhotoBtn.onclick = () => fileInput.click();
  fileInput.onchange = e => { addPhotos(room.id, e.target.files); e.target.value = ""; };
  photosWrap.appendChild(addPhotoBtn);
  photosWrap.appendChild(fileInput);

  return card;
}

function renderReport() {
  const v = state.vistoria;
  const frag = document.createDocumentFragment();

  const header = el(`
    <header>
      <div class="selo"><i class="ti ti-file-check"></i></div>
      <div class="header-info"><h1>Laudo de Vistoria</h1></div>
    </header>
  `);
  frag.appendChild(header);

  const main = el(`<main></main>`);
  const toolbar = el(`
    <div class="report-toolbar no-print">
      <a class="link-voltar" href="#" id="btn-back" style="margin-bottom:0;"><i class="ti ti-chevron-left"></i> Editar vistoria</a>
      <button class="btn-print" id="btn-print"><i class="ti ti-printer"></i> Salvar / imprimir</button>
    </div>
  `);
  toolbar.querySelector("#btn-back").onclick = (e) => { e.preventDefault(); state.view = "editor"; renderApp(); };
  toolbar.querySelector("#btn-print").onclick = () => window.print();
  main.appendChild(toolbar);

  const itemsHtml = v.rooms.map((room, idx) => `
    <div class="doc-item">
      <div class="doc-item-head">
        <span class="doc-item-num">${String(idx + 1).padStart(2, "0")}</span>
        <h2>${escapeHtml(room.nome || "Cômodo sem nome")}</h2>
      </div>
      ${room.photos.length ? `<div class="doc-fotos">${room.photos.map(src => `<img src="${src}">`).join("")}</div>` : ""}
      <p>${escapeHtml(room.laudo || room.notes || "Nenhuma observação registrada.")}</p>
    </div>
  `).join("");

  const doc = el(`
    <div class="documento">
      <div class="doc-selo"><i class="ti ti-stamp"></i></div>
      <div class="doc-header">
        <p class="doc-eyebrow">Laudo de vistoria</p>
        <h1>${escapeHtml(v.endereco || "Imóvel sem endereço informado")}</h1>
        <div class="doc-meta">
          ${v.cliente ? `<span class="full">Cliente: ${escapeHtml(v.cliente)}</span>` : ""}
          <span>Data: ${new Date(v.data + "T00:00:00").toLocaleDateString("pt-BR")}</span>
          <span>Cômodos: ${v.rooms.length}</span>
          <span class="full responsavel">${escapeHtml(v.corretor)}</span>
        </div>
      </div>
      ${itemsHtml}
      <div class="doc-footer">Laudo gerado a partir de narração em campo · texto revisado por IA a partir das observações do corretor</div>
    </div>
  `);
  main.appendChild(doc);
  frag.appendChild(main);
  return frag;
}

function renderSettings() {
  const frag = document.createDocumentFragment();
  const header = el(`
    <header>
      <div class="selo"><i class="ti ti-key"></i></div>
      <div class="header-info"><h1>Configurações</h1></div>
    </header>
  `);
  frag.appendChild(header);

  const main = el(`<main></main>`);
  const back = el(`<a class="link-voltar" href="#" id="btn-back"><i class="ti ti-chevron-left"></i> Voltar</a>`);
  back.onclick = (e) => { e.preventDefault(); state.view = "editor"; renderApp(); };
  main.appendChild(back);

  const box = el(`
    <div class="settings-box">
      <h2>Chave de API da Anthropic</h2>
      <p>Usada só neste navegador para melhorar o texto do laudo com IA. Fica guardada apenas no seu dispositivo (localStorage) — nunca é enviada ao GitHub ou a qualquer outro lugar além da Anthropic.</p>
      <input id="f-apikey" type="password" placeholder="sk-ant-..." value="${escapeHtml(state.apiKey)}">
      <p class="fine">Atenção: como este é um app estático (sem servidor próprio), a chave trafega direto do seu navegador até a Anthropic. Use uma chave pessoal e não compartilhe este dispositivo/link com ela salva.</p>
    </div>
  `);
  box.querySelector("#f-apikey").oninput = e => saveApiKey(e.target.value);
  main.appendChild(box);
  frag.appendChild(main);
  return frag;
}

renderApp();
</script>
</body>
</html>
