<style>

select,input,textarea{background:#0d0d0d;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;width:100%}
textarea{resize:vertical;min-height:130px;line-height:1.45;font-size:.88rem}
select{width:auto}
input:focus,textarea:focus,select:focus{outline:2px solid var(--y);outline-offset:0}

.mut{color:var(--mut);font-size:.82rem}

.lk .nm{font-weight:700;font-size:.85rem;display:block;margin-bottom:3px}

.man{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="hd"><a class="back" href="index.html">← Painel</a><h1>📣 Painel de <span>Divulgação</span></h1></div>

  <section id="v-arte" hidden></section>
  <section id="v-goo" hidden></section>

</main>

   +'<div class="row" style="margin-top:12px"><a class="btn p" target="_blank" rel="noopener" href="https://business.google.com/locations">⚙️ Gerenciar perfil</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q=FCosta+Corretor+Itaim+Paulista">🔎 Ver como cliente</a>'+(gmb.url?'<a class="btn" target="_blank" rel="noopener" href="'+esc(gmb.url)+'">📍 Abrir meu perfil</a>':'')+'</div></div>';
  o+='<div class="card"><h2>📝 Criar postagem</h2><div class="row" style="margin:8px 0">'+['Novidade','Oferta','Evento'].map(function(t){return '<button class="chip'+(gtipo===t?' on':'')+'" data-a="gtipo" data-v="'+t+'">'+t+'</button>';}).join('')+'</div>';
  if(P){var t=txtOf('google');o+='<textarea data-in="txt" data-c="google" rows="9">'+esc(t)+'</textarea><div class="cnt" id="cnt-google" style="text-align:right">'+t.length+'/1500</div><div class="row" style="margin-top:6px"><button class="btn p s" data-a="cp" data-c="google">📋 Copiar texto</button><button class="btn s" data-a="gart">🎨 Baixar arte 4:3</button><button class="btn s" data-a="cpl">🔗 Copiar link do botão</button><button class="btn s" data-a="mk" data-c="google">✅ Publicado</button></div><div class="hint">Passo a passo: 1) copie o texto · 2) baixe a arte · 3) abra “Gerenciar perfil” → Adicionar atualização · 4) cole, anexe a arte, botão “Saiba mais” com o link copiado.</div>';}
  else o+=sem();
  o+='</div>';
  o+='<div class="card"><h2>⭐ Pedir avaliação 5 estrelas</h2><div class="mut">Mais avaliações = mais cliques no seu perfil.</div>';
  o+=rl?'<div class="row" style="margin-top:8px"><button class="btn s p" data-a="cpv" data-v="'+esc(rl)+'">🔗 Copiar link de avaliação</button><img alt="QR avaliação" width="96" height="96" style="background:#fff;border-radius:8px;padding:4px" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=6&data='+encodeURIComponent(rl)+'"></div>':'<div class="hint">Informe o Place ID acima para gerar o link e o QR de avaliação.</div>';
  o+='<h3>Enviar por WhatsApp</h3><input data-in="tel" inputmode="tel" placeholder="Telefone do cliente com DDD" value="'+esc(tel)+'"><div class="row" style="margin-top:8px"><button class="btn g s" data-a="zapav">💬 Enviar pedido</button><button class="btn s" data-a="cpi" data-v="'+reg(reviewMsg())+'">📋 Copiar mensagem</button></div></div>';
  o+='<div class="card"><h2>💬 Respostas prontas a avaliações</h2>'+RESP.map(function(r){return '<div class="lk" style="grid-template-columns:1fr auto"><div><b style="font-size:.85rem">'+esc(r.n)+'</b><div class="mut">'+esc(r.t.slice(0,90))+'…</div></div><button class="btn s" data-a="cpi" data-v="'+reg(r.t)+'">Copiar</button></div>';}).join('')+'</div>';
  o+='<div class="card"><h2>✅ Checklist do perfil nota 10</h2>'+CHK_GMB.map(function(t,i){return '<label class="ck'+(chk[i]?' done':'')+'"><input type="checkbox" data-a="chk" data-v="'+i+'"'+(chk[i]?' checked':'')+'><span>'+esc(t)+'</span></label>';}).join('')+'</div>';
  return o;
}
function rPerf(){
  var keys=Object.keys(DEF);
  var o='<div class="card"><h2>🔗 Meus perfis e links</h2><div class="mut">Toque para abrir ou copiar. Você pode corrigir qualquer endereço (fica salvo neste aparelho).</div><div style="margin-top:8px">'+keys.map(function(k){var d=DEF[k],u=urlLink(k);
    return '<div class="lk"><span class="ic">'+d.ic+'</span><div><span class="nm">'+esc(d.n)+'</span><input data-in="link" data-k="'+k+'" value="'+esc(u)+'" placeholder="'+(k==='gmb'?'Cole o link do Google Meu Negócio':'https://…')+'"></div><div class="row"><button class="btn s" data-a="lo" data-v="'+k+'">Abrir</button><button class="btn s" data-a="lc" data-v="'+k+'">Copiar</button></div></div>';}).join('')
    +custom.map(function(c,i){return '<div class="lk"><span class="ic">⭐</span><div><span class="nm">'+esc(c.n)+'</span><input readonly value="'+esc(c.u)+'"></div><div class="row"><button class="btn s" data-a="co" data-v="'+i+'">Abrir</button><button class="btn s" data-a="cd" data-v="'+i+'">✕</button></div></div>';}).join('')
    +'</div><h3>Adicionar outra rede</h3><div class="row"><input id="cNome" placeholder="Nome (ex.: Kwai, Pinterest)" style="flex:1 1 140px"><input id="cUrl" placeholder="Link" style="flex:2 1 200px"><button class="btn s p" data-a="cadd">＋ Adicionar</button></div></div>';
  o+='<div class="card"><h2>🧾 Bios e textos padrão</h2><div class="mut">Mantenha o mesmo texto em todas as redes.</div>'+BIOS.map(function(b){return '<h3>'+esc(b.n)+'</h3><div class="mut" style="white-space:pre-line;color:#ddd">'+esc(b.t)+'</div><button class="btn s" style="margin-top:6px" data-a="cpi" data-v="'+reg(b.t)+'">📋 Copiar</button>';}).join('')+'</div>';
  o+='<div class="card"><h2>💬 Mensagens rápidas</h2>'+MSGS.map(function(b){return '<div class="lk" style="grid-template-columns:1fr auto"><div><b style="font-size:.85rem">'+esc(b.n)+'</b><div class="mut">'+esc(b.t.slice(0,80))+'…</div></div><button class="btn s" data-a="cpi" data-v="'+reg(b.t)+'">Copiar</button></div>';}).join('')+'</div>';
  return o;
}
function render(){
  CP=[];$('pbar').style.display=(tabAtual==='perf'||tabAtual==='hoje')?'none':'flex';
  var m={hoje:rHoje,pub:rPub,arte:rArte,goo:rGoo,perf:rPerf};
  $('v-'+tabAtual).innerHTML=m[tabAtual]();
  if(tabAtual==='arte'&&P)pintar();
  if(tabAtual==='hoje')$('pbar').style.display='none';
}
function pintar(){
  var cv=$('cv');if(!cv||!P)return;
  fotoAtual().then(function(img){var c=$('cv');if(!c)return;desenhar(c,P,A.fmt,img,A.extra);var m=$('artMsg');if(m)m.textContent=(!img&&(P.fotos.length||A.dev))?'Este servidor não liberou a foto para a arte. Use “Foto do aparelho”.':(!img?'Sem foto: a arte sai com fundo da marca. Use “Foto do aparelho” para incluir uma.':'');});
}
function showTab(t){
  tabAtual=t;['hoje','pub','arte','goo','perf'].forEach(function(k){$('v-'+k).hidden=(k!==t);});
  [].forEach.call(document.querySelectorAll('.tab'),function(b){b.classList.toggle('on',b.dataset.v===t);});
  render();window.scrollTo(0,0);
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b||b.tagName==='LABEL'||b.type==='checkbox')return;
  var a=b.dataset.a,v=b.dataset.v,c=b.dataset.c;
  switch(a){
  case 'tab':showTab(v);break;
  case 'reload':carregar();break;
  case 'manual':var mb=$('manBox');mb.style.display=mb.style.display==='none'?'block':'none';if(mb.style.display==='block'){manual();render();}break;
  case 'go':setP(v);showTab('pub');break;
  case 'tom':tom=v;variante=0;edits={};render();break;
  case 'outra':variante++;edits={};render();break;
  case 'cl':if(P)copiar(link(P,'direto'));break;
  case 'goarte':showTab('arte');break;
  case 'cp':copiar(txtOf(c));break;
  case 'sh':compartilhar(c);break;
  case 'op':if(c==='google'&&!gmb.url)toast('Dica: cole o link do seu perfil na aba Google');abrir(urlRede(c));break;
  case 'mk':marcar(c);break;
  case 'fmt':A.fmt=v;render();break;
  case 'foto':A.foto=+v;A.dev=null;render();break;
  case 'semdev':A.dev=null;render();break;
  case 'dl':artBlob(A.fmt).then(function(x){if(x)baixar(x,nomeArq(A.fmt));else toast('Não foi possível exportar. Use foto do aparelho.');});break;
  case 'ash':compartilharArte();break;
  case 'dlall':(function(){var ks=['feed','story','quad','gbp'],i=0;(function next(){if(i>=ks.length)return toast('✅ Artes baixadas');artBlob(ks[i]).then(function(x){if(x)baixar(x,nomeArq(ks[i]));i++;setTimeout(next,500);});})();})();break;
  case 'gtipo':gtipo=v;edits.google=null;delete edits.google;render();break;
  case 'gart':artBlob('gbp').then(function(x){if(x)baixar(x,nomeArq('gbp'));else toast('Não foi possível exportar. Use foto do aparelho na aba Artes.');});break;
  case 'cpl':if(P)copiar(link(P,'google'));break;
  case 'cpv':copiar(v);break;
  case 'cpi':copiar(CP[+v]);break;
  case 'zapav':var n=(tel||'').replace(/\D/g,'');if(n.length<10){toast('Digite o telefone com DDD');break;}abrir('https://wa.me/'+(n.length<=11?'55'+n:n)+'?text='+encodeURIComponent(reviewMsg()));break;
  case 'lo':var u=urlLink(v);if(!u){toast('Cole o link antes');break;}abrir(u);break;
  case 'lc':var u2=urlLink(v);if(!u2){toast('Cole o link antes');break;}copiar(u2);break;
  case 'co':abrir(custom[+v].u);break;
  case 'cd':if(confirm('Remover este link?')){custom.splice(+v,1);sv('custom',custom);render();}break;
  case 'cadd':var nm=$('cNome').value.trim(),ur=$('cUrl').value.trim();if(!nm||!/^https?:\/\//i.test(ur)){toast('Informe nome e link completo (https://…)');break;}custom.push({n:nm,u:ur});sv('custom',custom);render();break;
  }
});
function compartilharArte(){
  artBlob(A.fmt).then(function(b){
    if(!b)return toast('Não foi possível exportar. Use foto do aparelho.');
    var f=new File([b],nomeArq(A.fmt),{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:P.titulo}).catch(function(){});else{baixar(b,nomeArq(A.fmt));toast('Arte baixada');}
  });
}
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='devFoto'&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){A.dev=i;render();};i.src=r.result;};r.readAsDataURL(t.files[0]);return;}
  if(t.dataset.a==='rot'){var h=hojeKey();rot[h]=rot[h]||{};rot[h][t.dataset.v]=t.checked;var ks=Object.keys(rot).sort().slice(-14),n={};ks.forEach(function(k){n[k]=rot[k];});rot=n;sv('rot',rot);render();}
  if(t.dataset.a==='chk'){chk[t.dataset.v]=t.checked;sv('chk',chk);render();}
});
document.addEventListener('input',function(e){
  var t=e.target,i=t.dataset.in;
  if(t.id&&t.id.indexOf('m-')===0){manual();clearTimeout(input.m);input.m=setTimeout(render,400);return;}
  if(!i)return;
  if(i==='txt'){edits[t.dataset.c]=t.value;var c=CANAIS.filter(function(x){return x.k===t.dataset.c;})[0],el=$('cnt-'+t.dataset.c);if(el&&c){el.textContent=t.value.length+(c.max?'/'+c.max:'');el.classList.toggle('bad',!!(c.max&&t.value.length>c.max));}}
  else if(i==='extra'){A.extra=t.value;clearTimeout(input.t);input.t=setTimeout(pintar,200);}
  else if(i==='gurl'){gmb.url=t.value.trim();sv('gmb',gmb);}
  else if(i==='gpid'){gmb.placeId=t.value.trim();sv('gmb',gmb);}
  else if(i==='tel'){tel=t.value;}
  else if(i==='link'){var k=t.dataset.k;if(k==='gmb'){gmb.url=t.value.trim();sv('gmb',gmb);}else{links[k]=t.value.trim();sv('links',links);}}
});
function input(){}
document.addEventListener('focusout',function(e){if(e.target.dataset&&(e.target.dataset.in==='gpid'))render();});

carregar();render();
})();
</script>
</body>
</html>
