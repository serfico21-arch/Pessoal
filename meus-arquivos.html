<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Meus Arquivos — Painel do Corretor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<script>try{document.documentElement.setAttribute('data-theme',JSON.parse(localStorage.getItem('painel_tema2'))||'light')}catch(e){}</script>
<style>
:root{--bg:#1f2a3d;--card:#283550;--line:rgba(255,255,255,.13);--tx:#eef2fa;--mut:#b3bfd6;--in:#1d283b;--brand:#8ab4ff;--onbrand:#10203f;--em:#6fd8ae;--ro:#f5949f;--am:#f4cd7a}
[data-theme=light]{--bg:#f2f5fa;--card:#fff;--line:rgba(30,41,59,.1);--tx:#1e293b;--mut:#64748b;--in:#f3f6fb;--brand:#4c7ef3;--onbrand:#fff;--em:#2fa37a;--ro:#e0607a;--am:#d99a1c}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{font:15px/1.45 'DM Sans',sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;color:var(--tx);text-decoration:none;flex:none}
.top h1{font:700 21px 'Sora',sans-serif}.top small{display:block;color:var(--mut);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.drop{border:2px dashed var(--line);text-align:center;padding:22px 14px;transition:.15s}
.drop.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--card))}
.drop>i{font-size:34px;color:var(--brand)}.drop p{margin:6px 0 14px;color:var(--mut)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--in);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn.p{background:var(--brand);color:var(--onbrand);border-color:transparent}
.nota{font-size:12px;color:var(--mut);margin-top:10px}
.prog{margin-top:12px}.prog div{height:8px;border-radius:8px;background:var(--in);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--em);transition:width .2s}.prog span{font-size:12.5px;color:var(--mut)}
.bar{display:flex;gap:10px;align-items:center;margin:16px 0 10px;flex-wrap:wrap}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;flex:1;min-width:200px;font-weight:600}
.crumbs button{background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--brand)}.crumbs button:last-child{color:var(--tx)}.crumbs span{color:var(--mut)}
.busca{flex:1;min-width:160px;max-width:260px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--in);color:var(--tx);font:inherit}
.lista{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.it .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c,var(--brand)) 16%,transparent);color:var(--c,var(--brand));flex:none}
.it .tx{flex:1;min-width:0;background:none;border:0;text-align:left}
.it .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.it .tx small{color:var(--mut);font-size:12px}
.it .ac{display:flex;gap:6px;flex:none}
.it .ac button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--in);font-size:17px}
.it .ac .del{color:var(--ro)}
.vazio{text-align:center;color:var(--mut);padding:30px 10px}
.rod{margin-top:16px;font-size:12.5px;color:var(--mut);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html" aria-label="Voltar ao painel"><i class="ti ti-arrow-left"></i></a>
    <div><h1>Meus Arquivos</h1><small>Pastas e arquivos do PC, guardados na nuvem</small></div>
  </div>

  <div class="card drop" id="drop">
    <i class="ti ti-cloud-upload"></i>
    <p>Arraste pastas e arquivos para cá ou escolha abaixo</p>
    <div class="btns">
      <button class="btn p" id="bArq" type="button"><i class="ti ti-file-upload"></i>Subir arquivos</button>
      <button class="btn" id="bPasta" type="button"><i class="ti ti-folder-plus"></i>Subir pasta</button>
    </div>
    <div class="nota" id="nota">Os arquivos vão para a nuvem e aparecem em qualquer aparelho. Enviar de novo o mesmo nome na mesma pasta substitui o anterior.</div>
    <div class="prog" id="prog" hidden><div><i id="pb"></i></div><span id="pt"></span></div>
    <input type="file" id="inArq" multiple hidden />
    <input type="file" id="inPasta" webkitdirectory multiple hidden />
  </div>

  <div class="bar">
    <div class="crumbs" id="crumbs"></div>
    <input class="busca" id="busca" type="search" placeholder="Buscar arquivo…" aria-label="Buscar arquivo" />
  </div>
  <div class="lista" id="lista"></div>
  <div class="rod" id="rod"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  /* ====== CONFIGURAÇÃO — preencha estes 2 itens ====== */
  var CLOUD = 'dvtfxqw66';   // nome da nuvem no Cloudinary
  var PRESET = 'fcosta_pastas';           // nome do "upload preset" (modo Unsigned)
  var DB_URL = 'https://fcosta-31125-default-rtdb.firebaseio.com';           // ex.: https://SEU-PROJETO-default-rtdb.firebaseio.com
  var NO = 'meus_arquivos';  // nó do índice no Firebase
  /* =================================================== */

  var todos = [], cwd = '', q = '';
  var $ = function (i) { return document.getElementById(i); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function tam(n) { if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(0) + ' KB'; if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB'; return (n / 1073741824).toFixed(2) + ' GB'; }
  function aviso(t) { var e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(aviso.t); aviso.t = setTimeout(function () { e.hidden = true; }, 4200); }
  function limpa(p) { return String(p).replace(/\\/g, '/').replace(/^\/+|\/+$/g, ''); }

  /* ---------- índice no Firebase (REST) ---------- */
  function api(p, m, b) {
    return fetch(DB_URL.replace(/\/$/, '') + '/' + NO + p + '.json', { method: m || 'GET', body: b ? JSON.stringify(b) : undefined })
      .then(function (r) { if (!r.ok) throw new Error('db ' + r.status); return r.json(); });
  }
  function carregar() {
    return api('').then(function (o) {
      todos = Object.keys(o || {}).map(function (k) { var x = o[k]; x.id = k; return x; });
      desenhar();
    }).catch(function () {
      $('lista').innerHTML = '<div class="vazio">Não foi possível ler a lista. Confira o DB_URL e as regras do Firebase.</div>';
    });
  }

  /* ---------- envio para o Cloudinary ---------- */
  function subir(f, cb) {
    var fd = new FormData();
    fd.append('file', f); fd.append('upload_preset', PRESET);
    var x = new XMLHttpRequest();
    x.open('POST', 'https://api.cloudinary.com/v1_1/' + CLOUD + '/auto/upload');
    x.upload.onprogress = function (e) { if (e.lengthComputable) cb.p(e.loaded / e.total); };
    x.onload = function () {
      var r; try { r = JSON.parse(x.responseText); } catch (e) {}
      if (x.status === 200 && r && r.secure_url) cb.ok(r); else cb.er((r && r.error && r.error.message) || ('erro ' + x.status));
    };
    x.onerror = function () { cb.er('sem conexão'); };
    x.send(fd);
  }
  function removerCloud(rec) {
    if (!rec.token) return;
    var fd = new FormData(); fd.append('token', rec.token);
    fetch('https://api.cloudinary.com/v1_1/' + CLOUD + '/delete_by_token', { method: 'POST', body: fd }).catch(function () {});
  }
  function enviar(lista) {
    if (!lista.length) { aviso('Nenhum arquivo encontrado.'); return; }
    var pre = cwd ? cwd + '/' : '', i = 0, falhas = 0, total = lista.length, ultimo = '';
    lista.forEach(function (x) { x.path = pre + limpa(x.path); });
    $('prog').hidden = false;
    (function prox() {
      if (i >= total) {
        $('prog').hidden = true; carregar();
        aviso(falhas ? (total - falhas) + ' enviados, ' + falhas + ' falharam: ' + ultimo : total + ' arquivo(s) guardado(s) na nuvem');
        return;
      }
      var it = lista[i++], f = it.file;
      $('pt').textContent = 'Enviando ' + i + ' de ' + total + ': ' + f.name;
      $('pb').style.width = ((i - 1) / total * 100) + '%';
      subir(f, {
        p: function (v) { $('pb').style.width = ((i - 1 + v) / total * 100) + '%'; },
        ok: function (r) {
          var antigo = todos.filter(function (t) { return t.path === it.path; })[0];
          var rec = { path: it.path, name: f.name, size: f.size, type: f.type, mtime: f.lastModified || Date.now(), url: r.secure_url, token: r.delete_token || '' };
          api('', 'POST', rec).then(function (res) {
            rec.id = res.name;
            if (antigo) { removerCloud(antigo); api('/' + antigo.id, 'DELETE'); todos = todos.filter(function (t) { return t !== antigo; }); }
            todos.push(rec); prox();
          }).catch(function () { falhas++; ultimo = 'falha ao salvar a lista'; prox(); });
        },
        er: function (m) { falhas++; ultimo = m; prox(); }
      });
    })();
  }

  /* ---------- entrada: botões e arrastar ---------- */
  $('bArq').onclick = function () { $('inArq').click(); };
  $('bPasta').onclick = function () { $('inPasta').click(); };
  $('inArq').onchange = function (e) {
    var l = [].map.call(e.target.files, function (f) { return { file: f, path: f.name }; });
    e.target.value = ''; enviar(l);
  };
  $('inPasta').onchange = function (e) {
    var l = [].map.call(e.target.files, function (f) { return { file: f, path: f.webkitRelativePath || f.name }; });
    e.target.value = ''; enviar(l);
  };
  function lerEntrada(en, out) {
    return new Promise(function (ok) {
      if (en.isFile) {
        en.file(function (f) { out.push({ file: f, path: en.fullPath }); ok(); }, function () { ok(); });
      } else if (en.isDirectory) {
        var rd = en.createReader(), acc = [];
        (function lote() {
          rd.readEntries(function (es) {
            if (!es.length) { Promise.all(acc.map(function (e) { return lerEntrada(e, out); })).then(ok); return; }
            acc = acc.concat([].slice.call(es)); lote();
          }, function () { ok(); });
        })();
      } else ok();
    });
  }
  var dz = $('drop');
  ['dragenter', 'dragover'].forEach(function (n) { dz.addEventListener(n, function (e) { e.preventDefault(); dz.classList.add('on'); }); });
  ['dragleave', 'drop'].forEach(function (n) { dz.addEventListener(n, function (e) { e.preventDefault(); dz.classList.remove('on'); }); });
  dz.addEventListener('drop', function (e) {
    var its = [].slice.call(e.dataTransfer.items || []), ens = [], out = [];
    its.forEach(function (i) { var en = i.webkitGetAsEntry && i.webkitGetAsEntry(); if (en) ens.push(en); });
    if (!ens.length) { enviar([].map.call(e.dataTransfer.files, function (f) { return { file: f, path: f.name }; })); return; }
    Promise.all(ens.map(function (en) { return lerEntrada(en, out); })).then(function () { enviar(out); });
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });

  /* ---------- lista ---------- */
  function icone(n) {
    var e = (n.split('.').pop() || '').toLowerCase();
    if (e === 'pdf') return ['ti-file-type-pdf', 'var(--ro)'];
    if (/^(jpe?g|png|gif|webp|heic|bmp|svg)$/.test(e)) return ['ti-photo', 'var(--em)'];
    if (/^(docx?|odt|rtf|txt)$/.test(e)) return ['ti-file-text', 'var(--brand)'];
    if (/^(xlsx?|csv|ods)$/.test(e)) return ['ti-file-spreadsheet', 'var(--em)'];
    if (/^(zip|rar|7z)$/.test(e)) return ['ti-file-zip', 'var(--am)'];
    if (/^(mp4|mov|avi|mkv|webm)$/.test(e)) return ['ti-video', 'var(--am)'];
    return ['ti-file', 'var(--mut)'];
  }
  function desenhar() {
    var pre = cwd ? cwd + '/' : '', pastas = {}, arqs = [], h = '', busca = q.trim().toLowerCase();
    var partes = cwd ? cwd.split('/') : [], c = '<button data-a="ir" data-p="">Início</button>', acc = '';
    partes.forEach(function (p) { acc += (acc ? '/' : '') + p; c += '<span>/</span><button data-a="ir" data-p="' + esc(acc) + '">' + esc(p) + '</button>'; });
    $('crumbs').innerHTML = c;

    if (busca) {
      arqs = todos.filter(function (f) { return f.name.toLowerCase().indexOf(busca) > -1 || f.path.toLowerCase().indexOf(busca) > -1; });
    } else {
      todos.forEach(function (f) {
        if (f.path.indexOf(pre) !== 0) return;
        var r = f.path.slice(pre.length), i = r.indexOf('/');
        if (i > -1) { var n = r.slice(0, i); (pastas[n] = pastas[n] || { n: 0, s: 0 }); pastas[n].n++; pastas[n].s += f.size; }
        else arqs.push(f);
      });
    }
    Object.keys(pastas).sort(function (a, b) { return a.localeCompare(b, 'pt'); }).forEach(function (n) {
      var p = pastas[n], cam = pre + n;
      h += '<div class="it"><span class="ic" style="--c:var(--am)"><i class="ti ti-folder"></i></span>' +
        '<button class="tx" data-a="ir" data-p="' + esc(cam) + '"><b>' + esc(n) + '</b><small>' + p.n + ' arquivo(s) · ' + tam(p.s) + '</small></button>' +
        '<div class="ac"><button class="del" data-a="delpasta" data-p="' + esc(cam) + '" title="Apagar pasta" aria-label="Apagar pasta ' + esc(n) + '"><i class="ti ti-trash"></i></button></div></div>';
    });
    arqs.sort(function (a, b) { return a.name.localeCompare(b.name, 'pt'); }).forEach(function (f) {
      var ic = icone(f.name), onde = busca ? f.path.slice(0, f.path.lastIndexOf('/') + 1) : '';
      h += '<div class="it"><span class="ic" style="--c:' + ic[1] + '"><i class="ti ' + ic[0] + '"></i></span>' +
        '<button class="tx" data-a="abrir" data-p="' + esc(f.path) + '"><b>' + esc(f.name) + '</b><small>' + (onde ? esc(onde) + ' · ' : '') + tam(f.size) + ' · ' + new Date(f.mtime).toLocaleDateString('pt-BR') + '</small></button>' +
        '<div class="ac"><button data-a="baixar" data-p="' + esc(f.path) + '" title="Baixar" aria-label="Baixar ' + esc(f.name) + '"><i class="ti ti-download"></i></button>' +
        '<button class="del" data-a="del" data-p="' + esc(f.path) + '" title="Apagar" aria-label="Apagar ' + esc(f.name) + '"><i class="ti ti-trash"></i></button></div></div>';
    });
    $('lista').innerHTML = h || '<div class="vazio"><i class="ti ti-folder-open" style="font-size:36px"></i><p>' + (busca ? 'Nada encontrado.' : 'Esta pasta está vazia. Suba arquivos ou uma pasta acima.') + '</p></div>';
    var tot = todos.reduce(function (s, f) { return s + f.size; }, 0);
    $('rod').textContent = todos.length + ' arquivo(s) na nuvem · ' + tam(tot);
  }
  function achar(p) { return todos.filter(function (f) { return f.path === p; })[0]; }
  $('lista').addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.dataset.a, p = b.dataset.p, f;
    if (a === 'ir') { cwd = p; q = ''; $('busca').value = ''; desenhar(); }
    else if (a === 'abrir' && (f = achar(p))) { window.open(f.url, '_blank'); }
    else if (a === 'baixar' && (f = achar(p))) {
      fetch(f.url).then(function (r) { return r.blob(); }).then(function (bl) {
        var l = document.createElement('a'); l.href = URL.createObjectURL(bl); l.download = f.name; document.body.appendChild(l); l.click(); l.remove();
      }).catch(function () { window.open(f.url, '_blank'); });
    }
    else if (a === 'del' && (f = achar(p))) {
      if (confirm('Apagar "' + f.name + '"?')) { removerCloud(f); api('/' + f.id, 'DELETE').then(carregar); }
    }
    else if (a === 'delpasta') {
      var alvo = todos.filter(function (x) { return x.path.indexOf(p + '/') === 0; });
      if (confirm('Apagar a pasta "' + p.split('/').pop() + '" e seus ' + alvo.length + ' arquivo(s)?')) {
        Promise.all(alvo.map(function (x) { removerCloud(x); return api('/' + x.id, 'DELETE'); })).then(carregar);
      }
    }
  });
  $('crumbs').addEventListener('click', function (e) { var b = e.target.closest('[data-a]'); if (b) { cwd = b.dataset.p; q = ''; $('busca').value = ''; desenhar(); } });
  $('busca').addEventListener('input', function (e) { q = e.target.value; desenhar(); });

  /* ---------- início ---------- */
  if (!PRESET || !DB_URL) {
    $('bArq').disabled = $('bPasta').disabled = true;
    $('lista').innerHTML = '<div class="card"><b>Falta configurar (uma vez só)</b><ol style="margin:10px 0 0 18px;line-height:1.7">' +
      '<li>Cloudinary → Settings → Upload → <b>Add upload preset</b> → Signing mode: <b>Unsigned</b> (ative também "Return delete token"). Copie o nome e cole em <code>PRESET</code> no topo do script.</li>' +
      '<li>Firebase → Realtime Database → copie o endereço (https://…firebaseio.com) e cole em <code>DB_URL</code>.</li>' +
      '<li>No Firebase, em Regras, libere o nó <code>meus_arquivos</code> com <code>".read": true, ".write": true</code>.</li></ol></div>';
    return;
  }
  carregar();
})();
</script>
</body>
</html>
