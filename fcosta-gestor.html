async function saveProduct(id){
  const name = document.getElementById('mNome').value.trim();
  const brand = document.getElementById('mMarca').value.trim();
  const category = document.getElementById('mCat').value.trim();
  const supplierId = document.getElementById('mFornecedor').value;
  const barcode = document.getElementById('mBarcode').value.trim();
  const saleType = document.getElementById('mSaleType').value;
  const cost = parseFloat(document.getElementById('mCusto').value)||0;
  const price = parseFloat(document.getElementById('mPreco').value)||0;
  const stock = parseFloat(document.getElementById('mEstoque').value)||0;
  const minStock = parseFloat(document.getElementById('mMin').value)||0;
  const photoBase64 = document.getElementById('mFotoBase64').value || null;
  if(!name || price<=0){ showToast('Informe ao menos o nome e o preço de venda.'); return; }
  if(barcode && DB.products.some(p=>p.barcode===barcode && p.id!==id)){ showToast('Já existe um produto com esse código de barras.'); return; }
  const nomeNorm = normalizarBusca(name);
  const duplicado = DB.products.find(p=>normalizarBusca(p.name)===nomeNorm && p.id!==id);
  if(duplicado){
    showToast('❌ Não é permitido cadastro duplicado. Já existe um produto chamado "'+duplicado.name+'" (estoque atual: '+duplicado.stock+'). Se for o mesmo produto, cancele e use "Estoque → Entrada de Mercadoria" para somar a quantidade. Se for um produto diferente, mude o nome (ex: inclua marca, tamanho ou variação) antes de salvar.', 9000);
    return;
  }
  let novoProdutoCriado = null;
  if(id){
    const p = DB.products.find(x=>x.id===id);
    Object.assign(p, {name, brand, category, supplierId, barcode, saleType, cost, price, stock, minStock, photoBase64});
  }else{
    novoProdutoCriado = {id:uid(), name, brand, category, supplierId, barcode, saleType, cost, price, stock, minStock, photoBase64, createdAt:nowISO()};
    DB.products.push(novoProdutoCriado);
  }
  await saveKey(KEYS.products, DB.products);
  if(novoProdutoCriado && aguardandoNovoProdutoEntrada){
    aguardandoNovoProdutoEntrada = false;
    selecionarProdutoAoRenderizarMov = novoProdutoCriado.id;
    closeModal(); showToast('✅ Produto cadastrado! Agora é só informar a quantidade da entrada.'); renderContent();
    setTimeout(()=>{ const q=document.getElementById('movQtd'); if(q) q.focus(); }, 60);
  }else{
    closeModal(); showToast('Produto salvo com sucesso.'); renderContent();
  }
}
async function deleteProduct(id){
  if(!confirm('Tem certeza que deseja excluir este produto?')) return;
  DB.products = DB.products.filter(x=>x.id!==id);
  await saveKey(KEYS.products, DB.products);
  renderContent();
}
async function baixarProdutosJSON(){
  const lista = DB.products.map(p=>({
    name:p.name, brand:p.brand||'', category:p.category||'', barcode:p.barcode||'',
    saleType:p.saleType||'unidade', cost:p.cost||0, price:p.price||0, stock:p.stock||0, minStock:p.minStock||0
  }));
  await baixarArquivoJSON(lista, 'produtos-fcosta-'+todayISODate()+'.json');

}
function onImportarProdutosSelected(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let lista;
    try{
      lista = JSON.parse(e.target.result);
      if(!Array.isArray(lista)) throw new Error('não é uma lista');
    }catch(err){
      let parsedObj = null;
      try{ parsedObj = JSON.parse(e.target.result); }catch(e2){ /* ignora */ }
      if(parsedObj && typeof parsedObj==='object' && Array.isArray(parsedObj.products)){
        showToast('⚠️ Este arquivo é um BACKUP COMPLETO do sistema (não uma lista simples de produtos). Para importar só produtos, use um arquivo de produtos. Para restaurar esse backup completo, use o botão "⬆️ Restaurar backup (JSON)" em Configurações.', 9000);
      }else{
        showToast('Arquivo inválido: precisa ser uma lista de produtos em JSON.');
      }
      input.value=''; return;
    }
    if(!confirm('Isso vai importar '+lista.length+' produto(s), mesclando com o cadastro atual (atualiza pelo código de barras, sem apagar nada mais). Deseja continuar?')){
      input.value=''; return;
    }
    let novos=0, atualizados=0, ignorados=0;
    lista.forEach(item=>{
      const name = (item.name||item.nome||'').toString().trim();
      const price = parseFloat(item.price ?? item.preco);
      if(!name || !price || price<=0){ ignorados++; return; }
      const barcode = (item.barcode||item.codigo||'').toString().trim();
      const cost = parseFloat(item.cost ?? item.custo) || 0;
      const stock = parseFloat(item.stock ?? item.estoque) || 0;
      const category = (item.category||item.categoria||'').toString().trim();
      const brand = (item.brand||item.marca||'').toString().trim();
      const saleType = (item.saleType==='peso' || (item.und||'').toString().toUpperCase()==='KG') ? 'peso' : 'unidade';
      const existente = (barcode ? DB.products.find(p=>p.barcode===barcode) : null)
        || DB.products.find(p=>normalizarBusca(p.name)===normalizarBusca(name));
      if(existente){
        existente.cost = cost || existente.cost;
        existente.price = price;
        existente.stock = stock;
        if(category) existente.category = category;
        if(brand) existente.brand = brand;
        if(barcode) existente.barcode = existente.barcode || barcode;
        existente.saleType = saleType;
        atualizados++;
      }else{
        DB.products.push({
          id: uid(), name, brand, category, supplierId:'', barcode, saleType,
          cost, price, stock, minStock: parseFloat(item.minStock ?? item.estoqueMinimo) || 0,
          createdAt: nowISO()
        });
        novos++;
      }
    });
    await saveKey(KEYS.products, DB.products);
    showToast(`✅ Importação concluída: ${novos} novo(s), ${atualizados} atualizado(s)${ignorados?', '+ignorados+' ignorado(s) por dado incompleto':''}.`, 6000);
    input.value='';
    renderContent();
  };
  reader.readAsText(file);
}

  }) : todos;
  return '<div class="card">'
    + '<div class="flexbet"><div><h2>Clientes / Fiado</h2><div class="desc">'+todos.length+' cliente(s) cadastrado(s) — use para vendas fiado (a prazo) na Frente de Caixa</div></div>'

    + campoBusca('buscaClientesCad', filtroClientesCad, 'onFiltroClientesCad', '🔎 Buscar cliente por nome, CPF/CNPJ ou celular...')

      + clientes.map(function(c){
          return '<tr><td><strong>'+escapeHtml(c.name)+'</strong></td>'
          + '<td class="mono muted">'+escapeHtml(c.cpf||c.cnpj||'—')+'</td>'
          + '<td class="muted">'+escapeHtml(c.celular||c.telefone||'—')+'</td>'
          + '<td>'+(c.limiteCredito?brl(c.limiteCredito):'—')+'</td>'
          + '<td>'+(c.saldoDevedor>0 ? '<strong style="color:var(--vermelho)">'+brl(c.saldoDevedor)+'</strong>' : brl(0))+'</td>'
          + '<td class="right">'

          + (c.saldoDevedor>0?'<button class="btn btn-outline btn-sm" onclick="receberPagamentoModal(\''+c.id+'\')">Receber</button>':'')

        }).join('')

    + '</div>';
}

async function saveClient(id){
  const name = document.getElementById('clNome').value.trim();
  const cpf = document.getElementById('clCpf').value.trim();
  const cnpj = document.getElementById('clCnpj').value.trim();
  const celular = document.getElementById('clCelular').value.trim();
  const telefone = document.getElementById('clTelefone').value.trim();
  const email = document.getElementById('clEmail').value.trim();
  const endereco = document.getElementById('clEndereco').value.trim();
  const limiteCredito = parseFloat(document.getElementById('clLimite').value)||0;
  const observacoes = document.getElementById('clObs').value.trim();
  if(!name){ showToast('Informe o nome do cliente.'); return; }
  if(id){
    const c = DB.clients.find(function(x){return x.id===id;});
    Object.assign(c, {name:name, cpf:cpf, cnpj:cnpj, celular:celular, telefone:telefone, email:email, endereco:endereco, limiteCredito:limiteCredito, observacoes:observacoes});
  }else{
    DB.clients.push({id:uid(), name:name, cpf:cpf, cnpj:cnpj, celular:celular, telefone:telefone, email:email, endereco:endereco, limiteCredito:limiteCredito, observacoes:observacoes, saldoDevedor:0, createdAt:nowISO()});
  }
  await saveKey(KEYS.clients, DB.clients);
  closeModal(); showToast('Cliente salvo com sucesso.'); renderContent();
}
async function deleteClient(id){
  const c = DB.clients.find(function(x){return x.id===id;});
  if(c && c.saldoDevedor>0){ showToast('Este cliente tem saldo devedor em aberto. Quite o fiado antes de excluir.'); return; }
  if(!confirm('Tem certeza que deseja excluir este cliente?')) return;
  DB.clients = DB.clients.filter(function(x){return x.id!==id;});
  await saveKey(KEYS.clients, DB.clients);
  renderContent();
}
function receberPagamentoModal(clientId){
  const c = DB.clients.find(function(x){return x.id===clientId;});
  if(!c) return;
  document.getElementById('modalRoot').innerHTML =

    + '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'

async function confirmarRecebimento(clientId){
  const c = DB.clients.find(function(x){return x.id===clientId;});
  if(!c) return;
  const valor = parseFloat(document.getElementById('pgValor').value);
  const forma = document.getElementById('pgForma').value;
  if(!valor || valor<=0){ showToast('Informe um valor válido.'); return; }
  c.saldoDevedor = Math.max(0, c.saldoDevedor - valor);
  DB.lancamentos.push({id:uid(), type:'entrada', category:'Recebimento fiado', value:valor, paymentMethod:forma, description:'Pagamento de '+c.name+' ('+forma+')', clientId:clientId, operator:operatorName, date:nowISO()});
  await Promise.all([saveKey(KEYS.clients, DB.clients), saveKey(KEYS.lancamentos, DB.lancamentos)]);
  closeModal();
  showToast('✅ Pagamento de '+brl(valor)+' registrado! Novo saldo de '+c.name+': '+brl(c.saldoDevedor)+'. Já entrou no caixa e nos relatórios.');
  renderContent();
}
function verHistoricoFiadoModal(clientId){
  const c = DB.clients.find(function(x){return x.id===clientId;});
  if(!c) return;
  const vendas = DB.sales.filter(function(s){return s.clientId===clientId;}).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  const pagamentos = DB.lancamentos.filter(function(l){
    return l.category==='Recebimento fiado' && (l.clientId===clientId || (!l.clientId && l.description && l.description.indexOf(c.name)>-1));
  }).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  const totalComprado = vendas.reduce(function(a,s){return a+s.total;},0);
  const totalPago = pagamentos.reduce(function(a,l){return a+l.value;},0);
  const linhasVendas = vendas.length===0 ? '<div class="empty-state">Nenhuma venda fiado registrada para este cliente.</div>' :
    '<table><thead><tr><th>Data</th><th>Itens</th><th class="right">Valor</th></tr></thead><tbody>'
    + vendas.map(function(s){
        return '<tr><td class="muted">'+fmtDate(s.date)+'</td><td>'+s.items.map(function(i){return escapeHtml(i.name)+' x'+i.qty;}).join(', ')+'</td><td class="right">'+brl(s.total)+'</td></tr>';
      }).join('')
    + '</tbody></table>';
  const linhasPagamentos = pagamentos.length===0 ? '<div class="empty-state">Nenhum pagamento recebido ainda deste cliente.</div>' :
    '<table><thead><tr><th>Data</th><th>Forma</th><th class="right">Valor</th></tr></thead><tbody>'
    + pagamentos.map(function(l){
        return '<tr><td class="muted">'+new Date(l.date).toLocaleDateString('pt-BR')+'</td><td>'+escapeHtml(labelFormaPagamento(l.paymentMethod||'dinheiro'))+'</td><td class="right">'+brl(l.value)+'</td></tr>';
      }).join('')
    + '</tbody></table>';
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal wide">'
    + '<h3>📒 Histórico de fiado — '+escapeHtml(c.name)+'</h3>'
    + '<div class="stat-row" style="margin-bottom:14px;">'
    + '<div class="stat"><div class="lbl">Total comprado no fiado</div><div class="val" style="font-size:18px;">'+brl(totalComprado)+'</div></div>'
    + '<div class="stat"><div class="lbl">Total já pago</div><div class="val" style="font-size:18px;">'+brl(totalPago)+'</div></div>'
    + '<div class="stat '+(c.saldoDevedor>0?'bad':'')+'"><div class="lbl">Saldo devedor atual</div><div class="val" style="font-size:18px;">'+brl(c.saldoDevedor)+'</div></div>'
    + '</div>'
    + '<h4 style="margin:10px 0 6px;">Compras fiado</h4>' + linhasVendas
    + '<h4 style="margin:16px 0 6px;">Pagamentos recebidos</h4>' + linhasPagamentos
    + '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Fechar</button></div>'
    + '</div></div>';
}

async function saveFuncionario(id){
  const nome = document.getElementById('fnNome').value.trim();
  const cargo = document.getElementById('fnCargo').value.trim();
  const tipo = document.getElementById('fnTipo').value;
  const salario = parseFloat(document.getElementById('fnSalario').value)||0;
  const dataAdmissao = document.getElementById('fnAdmissao').value;
  const telefone = document.getElementById('fnTelefone').value.trim();
  const ativo = document.getElementById('fnAtivo').value==='1';
  const observacoes = document.getElementById('fnObs').value.trim();
  if(!nome){ showToast('Informe o nome.'); return; }
  if(id){
    const f = DB.employees.find(x=>x.id===id);
    Object.assign(f, {nome, cargo, tipo, salario, dataAdmissao, telefone, ativo, observacoes});
  }else{
    DB.employees.push({id:uid(), nome, cargo, tipo, salario, dataAdmissao, telefone, ativo, observacoes, createdAt:nowISO()});

function montarBackupJSON(){
  return {
    versao:1, exportadoEm: nowISO(),
    products:DB.products, movements:DB.movements, sales:DB.sales,
    caixaSessions:DB.caixaSessions, lancamentos:DB.lancamentos,
    suppliers:DB.suppliers, clients:DB.clients, employees:DB.employees, settings:DB.settings
  };
}
async function baixarArquivoJSON(obj, nomeArquivo){
  const conteudo = JSON.stringify(obj, null, 2);
  // Em navegadores compatíveis (Chrome/Edge no computador), abre o seletor nativo
  // para escolher/reaproveitar uma pasta (ex: uma pasta "JSON" de backups no PC).
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: nomeArquivo,
        types: [{ description:'Arquivo de Backup (JSON)', accept:{'application/json':['.json']} }]
      });
      const writable = await handle.createWritable();
      await writable.write(conteudo);
      await writable.close();
      return true;
    }catch(err){
      if(err && err.name==='AbortError') return false; // usuário cancelou de propósito
      // qualquer outro erro cai no método tradicional abaixo
    }
  }
  const blob = new Blob([conteudo], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return true;
}
async function baixarBackupJSON(){
  const ok = await baixarArquivoJSON(montarBackupJSON(), 'backup-completo-fcosta-'+todayISODate()+'.json');
  if(!ok) return;
  DB.settings.lastBackupAt = nowISO();
  await saveKey(KEYS.settings, DB.settings);
  showToast('Backup baixado com sucesso.');
  renderContent();
}
function csvEscape(val){
  const s = String(val??'');
  if(/[",\n;]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function toCSV(rows, columns){
  const header = columns.map(c=>csvEscape(c.label)).join(';');
  const lines = rows.map(r=>columns.map(c=>csvEscape(typeof c.value==='function'?c.value(r):r[c.key])).join(';'));
  return [header, ...lines].join('\r\n');
}

  ]));
  zip.file('Funcionarios.csv', toCSV(DB.employees, [

  ]));
  zip.file('Vendas.csv', toCSV(DB.sales, [
    {label:'Data', value:r=>fmtDate(r.date)}, {label:'Operador', key:'operator'},
    {label:'Cliente', key:'clientName'}, {label:'FormaPagamento', key:'payMethod'},

  ]));
  zip.file('Movimentacoes_Estoque.csv', toCSV(DB.movements, [

    {label:'Quantidade', key:'qty'}, {label:'Motivo', key:'reason'}, {label:'Operador', key:'operator'}
  ]));
  zip.file('Lancamentos_Financeiros.csv', toCSV(DB.lancamentos, [
    {label:'Data', value:r=>new Date(r.date).toLocaleDateString('pt-BR')}, {label:'Tipo', key:'type'},
    {label:'Categoria', key:'category'}, {label:'Descricao', key:'description'},

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tabelas-fcosta-'+todayISODate()+'.zip';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

function onBackupFileSelected(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let data;
    try{
      data = JSON.parse(e.target.result);
    }catch(err){
      showToast('Não foi possível ler o arquivo. Verifique se é um backup válido (.json).');
      input.value=''; return;
    }
    if(Array.isArray(data)){
      showToast('⚠️ Este arquivo é uma lista de PRODUTOS (não um backup completo). Para importar produtos, use o botão "⬆️ Importar Produtos (JSON)" na aba Cadastros → Produtos. Aqui em "Restaurar backup" use o arquivo baixado em "⬇️ Baixar backup completo (JSON)".', 9000);
      input.value=''; return;
    }
    if(!data || typeof data!=='object' || !Array.isArray(data.products)){
      showToast('Arquivo inválido: não parece ser um backup completo deste sistema.');
      input.value=''; return;
    }
    if(!confirm('Isso vai SUBSTITUIR todos os dados atuais (produtos, vendas, estoque, financeiro) pelos dados deste backup. Antes de continuar, vou baixar uma cópia de segurança dos dados ATUAIS, por precaução. Deseja continuar?')){ input.value=''; return; }
      // Rede de segurança: baixa uma cópia dos dados atuais ANTES de sobrescrever, para o caso de engano.
      await baixarArquivoJSON(montarBackupJSON(), 'seguranca-antes-de-restaurar-'+todayISODate()+'-'+Date.now()+'.json');
      DB.products = data.products||[];
      DB.movements = data.movements||[];
      DB.sales = data.sales||[];
      DB.caixaSessions = data.caixaSessions||[];
      DB.lancamentos = data.lancamentos||[];
      DB.suppliers = data.suppliers||[];
      DB.clients = data.clients||[];
      DB.employees = data.employees||[];
      DB.settings = data.settings||DB.settings;
      if(!DB.settings.operadores || !DB.settings.operadores.length) DB.settings.operadores=['Caixa 1'];
      await Promise.all([
        saveKey(KEYS.products, DB.products), saveKey(KEYS.movements, DB.movements),
        saveKey(KEYS.sales, DB.sales), saveKey(KEYS.caixaSessions, DB.caixaSessions),
        saveKey(KEYS.lancamentos, DB.lancamentos), saveKey(KEYS.suppliers, DB.suppliers),
        saveKey(KEYS.clients, DB.clients), saveKey(KEYS.employees, DB.employees), saveKey(KEYS.settings, DB.settings)
      ]);
      showToast('✅ Backup restaurado com sucesso! Uma cópia de segurança dos dados anteriores também foi baixada.', 6000);
      fillOperatorSelect(); renderContent();
    input.value='';
  };
  reader.readAsText(file);
}

async function saveUsuario(id){
  const nome = document.getElementById('uNome').value.trim();
  const usuario = document.getElementById('uUsuario').value.trim().toLowerCase();
  const papel = document.getElementById('uPapel').value;
  const senha = document.getElementById('uSenha').value;
  const pergunta = getPerguntaSegurancaValor('uPergunta');
  const resposta = document.getElementById('uResposta').value.trim();
  const dica = document.getElementById('uDica').value.trim();
  if(!nome || !usuario){ showToast('Preencha nome e usuário.'); return; }
  const dup = (DB.settings.usuarios||[]).find(u=>u.usuario===usuario && u.id!==id);
  if(dup){ showToast('Já existe um usuário com esse login.'); return; }
  if(id){
    const u = DB.settings.usuarios.find(x=>x.id===id);
    Object.assign(u, {nome, usuario, papel, pergunta, resposta, dica});
    if(senha) u.senha = senha;
  }else{
    if(!senha){ showToast('Defina uma senha para o novo usuário.'); return; }
    DB.settings.usuarios.push({id:uid(), nome, usuario, senha, papel, pergunta, resposta, dica});
  }
  await saveKey(KEYS.settings, DB.settings);
  closeModal(); showToast('Usuário salvo com sucesso.'); renderContent();
}
async function deleteUsuario(id){
  const usuarios = DB.settings.usuarios||[];
  const isUltimo = usuarios.length<=1;
  const msg = isUltimo
    ? 'Este é o ÚNICO usuário cadastrado. Se excluir, ninguém mais terá login para entrar em Cadastros e Relatórios (o sistema vai pedir para criar um usuário novo do zero, como no primeiro acesso). Deseja realmente excluir?'
    : 'Tem certeza que deseja excluir este usuário?';
  if(!confirm(msg)) return;
  DB.settings.usuarios = usuarios.filter(x=>x.id!==id);
  await saveKey(KEYS.settings, DB.settings);
  showToast('Usuário excluído.');
  renderContent();
}
function onLogoFileSelected(input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 2*1024*1024){ showToast('Imagem muito grande. Use um arquivo de até 2MB.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = async ()=>{
      // Converte para PNG num canvas: garante formato 100% compatível com a geração de PDF,
      // independente do formato original enviado (webp, heic, etc.).
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      DB.settings.logoBase64 = canvas.toDataURL('image/png');
      DB.settings.logoWidth = img.naturalWidth;
      DB.settings.logoHeight = img.naturalHeight;
      await saveKey(KEYS.settings, DB.settings);
      updateBrandMark();
      showToast('Logo atualizado com sucesso.');
      renderContent();
    };
    img.onerror = ()=>{ showToast('Não foi possível ler essa imagem. Tente outro arquivo (JPG ou PNG).'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value='';
}

  DB.settings.logoBase64 = null;

}

      <div class="modal wide help-modal">
        <div class="flexbet" style="margin-bottom:6px;">
          <h3>❓ Manual — Como funciona o sistema</h3>
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">Fechar ✕</button>
        </div>
        <p class="muted" style="margin-bottom:16px;">Toque em cada tópico para abrir a explicação. Pode deixar vários abertos ao mesmo tempo.</p>

        <details open>
          <summary>⚠️ IMPORTANTE: Importar Produtos × Restaurar Backup</summary>
          <div class="help-body">
            <p style="color:var(--vermelho); font-weight:700;">Esses são os dois botões mais importantes do sistema — e os mais fáceis de confundir. Leia com atenção antes de usar qualquer um dos dois.</p>

            <table style="margin:10px 0 16px;">
              <thead><tr><th></th><th>📦 Importar Produtos</th><th>💾 Restaurar Backup</th></tr></thead>
              <tbody>
                <tr><td><strong>Onde fica</strong></td><td>Cadastros → Produtos</td><td>Cadastros → Impressora, Senha &amp; Backup</td></tr>
                <tr><td><strong>O que o arquivo contém</strong></td><td>Só uma lista de mercadorias (nome, código de barras, preço, custo, estoque)</td><td>O sistema INTEIRO (produtos, clientes, fornecedores, vendas, caixa, financeiro, configurações)</td></tr>
                <tr><td><strong>O que acontece</strong></td><td><strong>Mescla:</strong> atualiza quem já existe (pelo código de barras) e acrescenta os novos</td><td><strong>Substitui tudo:</strong> apaga os dados atuais e coloca os do arquivo no lugar</td></tr>
                <tr><td><strong>Apaga alguma coisa?</strong></td><td>Nunca</td><td>Sim — tudo (por isso o sistema baixa uma cópia de segurança automática antes)</td></tr>
              </tbody>
            </table>

            <p><strong>🧠 Pra lembrar fácil, pense assim:</strong></p>
            <ul>
              <li><strong>Importar Produtos</strong> = chegou uma <strong>encomenda nova de mercadoria</strong> pra colocar na prateleira — você só acrescenta o que chegou, o resto da loja continua igual.</li>
              <li><strong>Restaurar Backup</strong> = você está <strong>trocando o mercado inteiro de lugar</strong> — tira tudo que tinha ali e bota uma cópia de outro dia no lugar.</li>
            </ul>

            <p><strong>📋 Exemplos práticos:</strong></p>
            <ul>
              <li>"Recebi uma tabela de preços atualizada do fornecedor" → <strong>Importar Produtos</strong></li>
              <li>"Fiz um relatório de estoque novo e quero atualizar os preços/quantidades" → <strong>Importar Produtos</strong></li>
              <li>"Quero levar o sistema inteiro pra outro computador" → <strong>Restaurar Backup</strong> (no computador novo)</li>
              <li>"Fiz besteira e quero voltar pro estado de ontem" → <strong>Restaurar Backup</strong> (usando o backup de ontem)</li>
              <li>"Só quero adicionar produtos novos, sem perder vendas e clientes" → <strong>Importar Produtos</strong>, nunca Restaurar Backup</li>
            </ul>

            <p class="muted">Se você usar o arquivo errado no botão errado, o sistema recusa e avisa "arquivo inválido" — ele não deixa misturar os dois por engano.</p>
          </div>
        </details>

        <details>
          <summary>🧾 Venda (Frente de Caixa)</summary>
          <div class="help-body">
            <p>É a tela principal para vender. Antes de vender, o <strong>caixa precisa estar aberto</strong> (aba Financeiro → Caixa do Dia).</p>
            <ul>
              <li><strong>Leitura do item:</strong> bipe o código de barras com o leitor, ou digite o nome do produto e aperte Enter. Aparece o código, nome, marca, fornecedor e a quantidade em estoque do produto lido.</li>
              <li><strong>Quantidade e Preço:</strong> preenche automático com o valor cadastrado, mas você pode ajustar antes de adicionar (útil pra itens por peso ou promoções).</li>
              <li><strong>Câmera:</strong> se não tiver leitor USB, dá pra ler o código de barras pela câmera do celular/notebook.</li>
              <li><strong>Pagamento:</strong> Dinheiro (mostra o troco automático), Cartão Crédito, Cartão Débito, Pix, Misto (divide o valor entre dinheiro/cartão/pix na mesma venda) ou Fiado (venda a prazo, precisa escolher um cliente cadastrado).</li>
              <li><strong>Finalizar Venda:</strong> baixa o estoque, registra a venda e abre a prévia do cupom na tela — você confere e clica em "Imprimir".</li>
              <li>Atalhos de teclado: <strong>F9</strong> finaliza a venda, <strong>ESC</strong> limpa o carrinho, <strong>F2</strong> liga/desliga a tela cheia (funciona em qualquer aba).</li>
            </ul>
          </div>
        </details>

        <details>
          <summary>📦 Estoque</summary>
          <div class="help-body">
            <ul>
              <li><strong>Consultar Produtos:</strong> ver preço e estoque de tudo, sem senha. Produtos com estoque no limite mínimo aparecem com aviso vermelho.</li>
              <li><strong>Entrada de Mercadoria:</strong> use quando chegar mercadoria nova (compra, devolução, ajuste) — aumenta o estoque.</li>
              <li><strong>Saída de Mercadoria:</strong> use para perdas, vencimentos, uso interno — diminui o estoque (fora das vendas normais).</li>
              <li><strong>Histórico:</strong> mostra todas as entradas e saídas já registradas, com data e quem fez.</li>
              <li><strong>Alerta de estoque mínimo:</strong> quando um produto cadastrado com "estoque mínimo" chega nesse limite, aparece um aviso vermelho na tela de Venda, no Estoque e um número vermelho no menu.</li>
            </ul>
          </div>
        </details>

        <details>
          <summary>💰 Financeiro</summary>
          <div class="help-body">
            <ul>
              <li><strong>Caixa do Dia:</strong> primeiro passo do dia — "Abrir Caixa" informando o dinheiro inicial (fundo de troco). No fim do dia, "Fechar Caixa" conferindo o dinheiro contado com o esperado pelo sistema.</li>
              <li><strong>Lançamentos:</strong> registre despesas (aluguel, salários, fornecedores...) ou receitas extras que não são vendas do caixa.</li>
              <li><strong>Histórico de Vendas:</strong> lista todas as vendas já feitas, com três botões por venda:
                <ul>
                  <li><strong>Reimprimir:</strong> abre o cupom daquela venda de novo.</li>
                  <li><strong>✏️ Pagamento:</strong> troca a forma de pagamento de uma venda já finalizada (ex: cliente pagou em débito e quer trocar pra Pix). Se envolver Fiado (de qualquer lado da troca), o saldo devedor do cliente é ajustado sozinho.</li>
                  <li><strong>Excluir:</strong> apaga a venda por engano — devolve a mercadoria pro estoque e, se era fiado, abate o saldo devedor do cliente automaticamente. Não pode ser desfeito.</li>
                </ul>
              </li>
              <li><strong>Cartão (sem separar):</strong> se aparecer essa linha nos resumos, são vendas de cartão registradas antes do sistema separar Crédito e Débito — é só dinheiro de cartão antigo, sem categoria específica.</li>
              <li><strong>Sessões de Caixa:</strong> histórico de todas as aberturas/fechamentos de caixa, com a diferença entre o esperado e o contado.</li>
            </ul>
          </div>
        </details>

        <details>
          <summary>📊 Relatórios</summary>
          <div class="help-body">
            <ul>
              <li><strong>Financeiro:</strong> vendas por forma de pagamento, lucro bruto e líquido, produtos mais vendidos e despesas por categoria — por dia, mês ou período escolhido.</li>
              <li><strong>Vendas por Operador:</strong> lista os produtos vendidos (código, descrição, quantidade, valores) filtrando por período e por operador — ou "Todos os operadores" de uma vez.</li>
              <li><strong>Fornecedores:</strong> quanto foi comprado de cada fornecedor no período, e um resumo geral de quantos produtos cada um fornece.</li>
              <li><strong>Mercadorias/Estoque:</strong> valor total parado em estoque, valor por categoria, e a situação de cada produto (estoque baixo ou OK).</li>
              <li>Tem um botão "🖨️ Imprimir relatório" em cada um, caso queira uma via em papel.</li>
              <li>Tem também um botão "⬇️ Baixar PDF" para salvar aquele relatório em arquivo, e um botão "⬇️ Baixar todos os relatórios (PDF)" no topo da aba, que baixa todos os relatórios num único PDF.</li>
              <li>Todos os PDFs saem com a <strong>logo e os dados da loja</strong> (nome, CNPJ, endereço, telefone) cadastrados em Cadastros → Dados da Loja, no cabeçalho.</li>
            </ul>
          </div>
        </details>

        <details>
          <summary>💳 Fiado (venda a prazo)</summary>
          <div class="help-body">
            <p>Pra vender fiado, o cliente precisa estar cadastrado em <strong>Cadastros → Clientes / Fiado</strong>.</p>
            <ul>
              <li>Quando você vende fiado, a mercadoria sai do estoque e o valor vai para o <strong>saldo devedor</strong> do cliente — o dinheiro não entra no caixa nessa hora.</li>
              <li>Você pode definir um <strong>limite de crédito</strong> por cliente; o sistema avisa se a venda ultrapassar esse limite.</li>
              <li>Quando o cliente vem pagar, use o botão <strong>"Receber"</strong> na lista de clientes — isso atualiza o saldo dele e já entra certinho no caixa e nos relatórios, sem contar a venda duas vezes.</li>
            </ul>
          </div>
        </details>

        <details>
          <summary>🔐 Cadastros e Relatórios (protegidos por login)</summary>
          <div class="help-body">
            <p>Essas são as únicas áreas que pedem usuário e senha — protegem as configurações e os números do negócio.</p>
            <ul>
              <li><strong>Dados da Loja:</strong> nome do mercado, CNPJ, endereço, telefone, mensagem do recibo e a logo que aparece no sistema, nos recibos e no cabeçalho dos relatórios em PDF.</li>
              <li><strong>Produtos:</strong> cadastro completo — nome, marca, categoria, código de barras, fornecedor, se é vendido por unidade ou por peso (Kg), preço de custo/venda e estoque (com estoque mínimo pra disparar o alerta).</li>
              <li><strong>Fornecedores:</strong> nome, contato, telefone, e-mail e endereço de cada fornecedor.</li>
              <li><strong>Clientes / Fiado:</strong> cadastro dos clientes que podem comprar fiado, com limite de crédito.</li>
              <li><strong>Funcionários:</strong> cadastro de funcionários com salário, e também do proprietário com o pró-labore. O botão "💰 Pagar" gera automaticamente um lançamento de saída em Financeiro (categoria Salários ou Pró-labore), já contando nos relatórios.</li>
              <li><strong>Operadores:</strong> nomes usados para identificar quem fez cada venda/movimentação (sem senha individual — é só pra atribuição, diferente dos Usuários).</li>
              <li><strong>Usuários:</strong> aqui sim tem usuário e senha de verdade — administradores e operadores que podem entrar em Cadastros e Relatórios. Configure uma pergunta de segurança em cada um. Dá pra excluir qualquer usuário, mesmo que seja o último — nesse caso o sistema avisa que vai pedir pra criar um administrador novo, do zero, na próxima vez que alguém tentar entrar.</li>
              <li><strong>Esqueci minha senha:</strong> na tela de login, tem o link "Esqueci minha senha" — responde a pergunta de segurança cadastrada e cria uma senha nova na hora, sem precisar de mim.</li>
              <li><strong>Impressora &amp; Backup:</strong> conectar impressora térmica Bluetooth, escolher a largura da bobina (58mm ou 80mm) e fazer backup/restauração dos dados.</li>
            </ul>
          </div>
        </details>

        <details>
          <summary>💾 Backup e Restauração (detalhes)</summary>
          <div class="help-body">
            <ul>
              <li><strong>Backup completo (JSON):</strong> baixa um arquivo com TUDO (produtos, clientes, fornecedores, vendas, estoque, financeiro). É o formato certo para restaurar aqui mesmo, se precisar trocar de aparelho ou recuperar dados.</li>
              <li><strong>Restaurar backup (JSON):</strong> escolhe o arquivo salvo e substitui os dados atuais. Use com cuidado — o sistema baixa uma cópia de segurança automática antes, mas mesmo assim não tem como desfazer a restauração em si.</li>
              <li><strong>Importar Produtos (JSON):</strong> em Cadastros → Produtos — mescla uma lista de produtos com o que já existe, sem apagar nada. Veja o tópico acima para a diferença completa.</li>
              <li><strong>Exportar Tabelas (CSV/ZIP):</strong> baixa cada tabela separada (Produtos, Clientes, Fornecedores, Vendas, Movimentações, Lançamentos) pra abrir no Excel ou levar pra outro sistema.</li>
              <li>Recomendo baixar o backup JSON periodicamente (ex: uma vez por semana) e guardar num pen-drive ou nuvem, por segurança.</li>
            </ul>
          </div>
        </details>

        <details>
          <summary>🖨️ Impressão de Recibos</summary>
          <div class="help-body">
            <ul>
              <li><strong>Prévia antes de imprimir:</strong> por padrão, assim que você finaliza uma venda, a prévia do cupom abre na tela — você confere os valores e clica em "🖨️ Imprimir" pra mandar pra impressora. Dá pra ligar/desligar a abertura automática da prévia em Cadastros → Impressora &amp; Backup.</li>
              <li><strong>Impressora térmica Bluetooth:</strong> conecte em Cadastros → Impressora, Senha & Backup pra tentar enviar direto pra impressora. Funciona em Chrome/Edge, e depende do modelo da impressora aceitar o pareamento.</li>
              <li><strong>Impressão pelo navegador:</strong> sempre disponível como alternativa — funciona com qualquer impressora instalada no computador ou celular, térmica ou comum.</li>
              <li>Dá pra reimprimir qualquer venda antiga em Financeiro → Histórico de Vendas, ou o último recibo direto na tela de Venda.</li>
              <li><strong>Cupom saindo cortado nas laterais?</strong> Primeiro confira em Cadastros → Impressora &amp; Backup se a "Largura da bobina" (58mm ou 80mm) bate com o papel de verdade que está na impressora. Se já estiver certo e mesmo assim cortar, o problema geralmente está no driver da impressora dentro do Windows: vá em Configurações → Impressoras e scanners → sua impressora → Preferências de impressão, e confira se o tamanho de papel configurado ali também está certo (às vezes vem de fábrica como A4 ou Carta por engano).</li>
            </ul>
          </div>
        </details>
      </div>
    </div>`;
}

  await loadAll();
  fillOperatorSelect();
  updateBrandMark();
  aplicarLarguraImpressao();
  renderNav();
  renderContent();
