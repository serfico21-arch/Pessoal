<style>
:root{
  --verde-900:#0d3b2e; --verde-800:#125a3f; --verde-700:#187a52; --verde-600:#1f9866;
  --creme:#f3f6f2; --creme-2:#e8ede5; --papel:#fefffd;
  --terracota:#f2c400; --terracota-esc:#c99f00; --ouro:#f5db3d;
  --tinta:#1b2320; --linha:#dbe3d8; --vermelho:#b2402f; --azul:#2b5b73;
  --sombra:0 10px 30px -12px rgba(13,59,46,0.35); --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0; height:100%; overflow:hidden;}
body{font-family:'Public Sans',sans-serif; background:radial-gradient(1200px 600px at 100% -10%, #0d3b2e 0%, transparent 60%), var(--creme); color:var(--tinta); min-height:100vh;}
h1,h2,h3,h4{font-family:'Fraunces',serif; margin:0; letter-spacing:-0.01em;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}
.mono{font-family:'JetBrains Mono',monospace;}

/* ---- layout base ---- */
.app{height:100vh; display:flex; flex-direction:column;}
.topbar{background:linear-gradient(155deg, var(--verde-800), var(--verde-900)); color:var(--creme); box-shadow:0 4px 18px -6px rgba(0,0,0,0.3); position:sticky; top:0; z-index:50; display:flex; flex-direction:column;}
.topbar-row{padding:14px 26px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
.topbar .brand{display:flex; align-items:center; gap:12px;}
.topbar .brand .mark{height:42px;min-width:42px;border-radius:9px;background:rgba(255,255,255,0.08); display:flex;align-items:center;justify-content:center;color:var(--ouro); font-family:'Fraunces',serif;font-weight:700; border:1px solid rgba(211,162,74,0.4); overflow:hidden; padding:2px;}
.topbar .brand .mark img{height:100%; width:auto; max-width:160px; object-fit:contain;}
.topbar .brand h1{font-size:18px; color:#fff;}
.topbar .brand span{display:block; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ouro); font-weight:700;}
.topbar .right-tools{display:flex; align-items:center; gap:10px;}
.gestor-tag-fixed{
  position:fixed; top:6px; right:10px; z-index:1000;
  font-size:9.5px; letter-spacing:0.12em; color:rgba(255,255,255,0.55); font-weight:700; text-transform:uppercase;
  pointer-events:none;
}
.test-env-link{
  position:fixed; bottom:6px; right:10px; z-index:1000;
  font-size:9.5px; letter-spacing:0.04em; color:rgba(27,35,32,0.35);
  text-decoration:none; font-weight:600; background:rgba(255,255,255,0.5);
  padding:2px 7px; border-radius:6px; transition:color .15s, background .15s;
}
.test-env-link:hover{color:rgba(27,35,32,0.75); background:rgba(255,255,255,0.85);}
.op-select{background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px 12px; border-radius:8px; font-size:12.5px; font-weight:600;}
.op-select option{color:#000;}
.nav{display:flex; gap:4px; background:var(--verde-700); padding:6px 20px; overflow-x:auto;}
.nav button{background:transparent; border:none; color:#cfe0d1; padding:10px 16px; border-radius:9px 9px 0 0; font-weight:700; font-size:13.5px; white-space:nowrap; opacity:0.75; border-bottom:3px solid transparent; display:flex; align-items:center; gap:6px;}
.nav button.active{opacity:1; color:#fff; background:rgba(255,255,255,0.08); border-bottom:3px solid var(--terracota);}
.nav-badge{background:var(--vermelho); color:#fff; font-size:10.5px; font-weight:800; padding:1px 6px; border-radius:20px; margin-left:2px;}
.alert-banner{background:#fbe6e1; border:1.5px solid var(--vermelho); border-radius:12px; padding:14px 18px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.alert-banner .txt{color:var(--vermelho); font-weight:700; font-size:13.5px;}
.pdv-bottom-alerts{position:fixed; left:0; right:0; bottom:0; z-index:85; box-shadow:0 -6px 16px -8px rgba(0,0,0,0.35);}
.pdv-alert-mini{display:flex; align-items:center; justify-content:center; gap:12px; padding:6px 18px; font-size:12.5px; font-weight:700; color:#fff; animation:pdvAlertPulse 1.8s ease-in-out infinite;}
.pdv-alert-mini.low{background:var(--vermelho);}
.pdv-alert-mini.backup{background:var(--terracota-esc);}
.pdv-alert-mini .txt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70vw;}
.pdv-alert-mini button{font-size:11px; padding:4px 12px; border-radius:7px; border:none; font-weight:700; background:#fff; cursor:pointer; flex-shrink:0;}
.pdv-alert-mini.low button{color:var(--vermelho);}
.pdv-alert-mini.backup button{color:var(--terracota-esc);}
@keyframes pdvAlertPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.18);}}
.content{padding:26px; max-width:1400px; margin:0 auto; width:100%; flex:1; overflow-y:auto; min-height:0;}
.card{background:var(--papel); border:1px solid var(--linha); border-radius:var(--radius); padding:22px; box-shadow:var(--sombra); margin-bottom:20px;}
.card h2{font-size:19px; color:var(--verde-900); margin-bottom:4px;}
.card .desc{color:#7a7160; font-size:13px; margin-bottom:18px;}
.grid2{display:grid; grid-template-columns:1.5fr 1fr; gap:20px;}
@media (max-width:940px){.grid2{grid-template-columns:1fr;}}
.subnav{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.subnav button{background:var(--creme-2); border:1px solid var(--linha); color:var(--verde-800); padding:8px 14px; border-radius:20px; font-size:13px; font-weight:700;}
.subnav button.active{background:var(--verde-800); color:#fff; border-color:var(--verde-800);}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; padding:10px 12px; color:#7a7160; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; border-bottom:2px solid var(--linha);}
td{padding:11px 12px; border-bottom:1px solid var(--linha); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.tag{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; display:inline-block;}
.tag-in{background:#e3efe1; color:#2f6b3a;} .tag-out{background:#fbe6e1; color:var(--vermelho);}
.tag-low{background:#fbe6e1; color:var(--vermelho);} .tag-ok{background:#e3efe1; color:#2f6b3a;}
.badge-role{font-size:10.5px; padding:2px 8px; border-radius:10px; font-weight:700; text-transform:uppercase; display:inline-block;}
.badge-admin{background:#e3efe1;color:#2f6b3a;}
.badge-caixa{background:#e8eef2;color:var(--azul);}
.muted{color:#8b8270; font-size:12.5px;} .right{text-align:right;} .center{text-align:center;}

.field{margin-bottom:16px;}
.field label{display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--verde-800); margin-bottom:6px;}
.field input, .field select{width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--linha); background:var(--creme); font-size:15px; color:var(--tinta); outline:none; transition:border-color .15s, background .15s;}
.field input:focus, .field select:focus{border-color:var(--terracota); background:#fff;}
.btn{border:none; border-radius:10px; padding:12px 20px; font-weight:700; font-size:14.5px; transition:transform .12s, box-shadow .12s, opacity .12s; display:inline-flex; align-items:center; justify-content:center; gap:8px;}
.btn:active{transform:scale(0.97);} .btn:disabled{opacity:0.4; cursor:not-allowed;}
.btn-primary{background:linear-gradient(155deg, var(--terracota), var(--terracota-esc)); color:var(--verde-900); box-shadow:0 6px 16px -6px rgba(201,159,0,0.5);}
.btn-primary:hover{opacity:0.94;}
.btn-dark{background:var(--verde-900); color:var(--creme);}
.btn-outline{background:transparent; border:1.5px solid var(--verde-700); color:var(--verde-800);}
.btn-outline:hover{background:var(--verde-700); color:#fff;}
.btn-ghost{background:transparent; color:var(--verde-800); border:1.5px solid var(--linha);}
.btn-danger{background:#fff; border:1.5px solid var(--vermelho); color:var(--vermelho);}
.btn-danger:hover{background:var(--vermelho); color:#fff;}
.btn-block{width:100%;} .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}
.errmsg{background:#fbe6e1; color:var(--vermelho); border:1px solid #eec3ba; padding:10px 14px; border-radius:9px; font-size:13px; margin-bottom:16px; font-weight:600;}
.linkbtn{background:none; border:none; color:var(--terracota-esc); font-weight:700; font-size:13px; text-decoration:underline; padding:0; cursor:pointer;}

/* ---- PDV ---- */
.scan-bar{display:flex; gap:10px; margin-bottom:16px;}
.scan-bar input{flex:1; padding:16px 18px; border-radius:12px; border:2px solid var(--verde-700); font-size:17px; background:#fff; font-family:'JetBrains Mono',monospace;}
.scan-bar input:focus{outline:none; border-color:var(--terracota); box-shadow:0 0 0 4px rgba(193,98,47,0.12);}
.scan-icn{background:var(--verde-800); color:#fff; border:none; border-radius:12px; padding:0 18px; font-size:20px;}
.venda-banner{
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(155deg, var(--verde-800), var(--verde-900));
  border-radius:14px; padding:16px 24px; margin-bottom:20px;
  box-shadow:var(--sombra);
}
.venda-banner h1{
  color:#fff; font-size:30px; font-weight:900; letter-spacing:0.08em; text-transform:uppercase;
}
.venda-banner .subt{color:rgba(255,255,255,0.65); font-size:11.5px; font-weight:600; letter-spacing:0.04em; margin-top:2px;}
.venda-banner .btn-ghost{color:#fff; border-color:rgba(255,255,255,0.35);}
.venda-form-card{border:2px solid var(--verde-700); background:linear-gradient(180deg,#fff,var(--creme) 220%);}

}
.pos-produto-row{display:flex; gap:10px; align-items:end; margin-bottom:4px;}
.pos-produto-row .btn-outline{height:52px; padding:0 16px; font-size:18px;}
.pos-grid{display:grid; grid-template-columns:1fr 360px; gap:18px; align-items:start;}

.pos-left{display:flex; flex-direction:column; gap:16px; min-width:0;}

.pos-items-card{flex:1; display:flex; flex-direction:column; min-height:0;}
.pos-items-card h2{display:flex; align-items:center; gap:8px;}
.cart-count-badge{background:var(--verde-800); color:#fff; font-size:11px; font-weight:800; border-radius:20px; padding:2px 10px;}
.cart-scroll{max-height:44vh; overflow-y:auto; padding-right:4px;}
.pos-payment-card{background:linear-gradient(180deg,#fff,var(--creme) 260%);}
.pos-payment-card .cart-total{margin-bottom:0;}
.total-hero{background:linear-gradient(155deg, var(--verde-900), var(--verde-800)); border-radius:14px; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; box-shadow:var(--sombra);}
.total-hero .lbl{color:rgba(255,255,255,0.6); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;}
.total-hero .qtd{color:var(--ouro); font-size:11.5px; font-weight:700; margin-top:2px;}
.total-hero .val{color:#fff; font-family:'Fraunces',serif; font-size:32px; font-weight:800;}
.prod-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; max-height:480px; overflow-y:auto; padding-right:4px;}
.prod-card{background:var(--creme-2); border:1px solid var(--linha); border-radius:12px; padding:14px; text-align:left; transition:transform .1s, box-shadow .1s;}
.prod-card:hover{transform:translateY(-2px); box-shadow:0 8px 16px -8px rgba(0,0,0,0.25); border-color:var(--terracota);}
.prod-card:disabled{opacity:0.4; cursor:not-allowed;}
.prod-card .nm{font-weight:700; font-size:13.5px; margin-bottom:6px; color:var(--verde-900); line-height:1.3;}
.prod-card .pr{color:var(--terracota-esc); font-weight:800; font-size:15px;}
.prod-card .st{font-size:11px; color:#8b8270; margin-top:4px;}
.cart-box{background:var(--papel); border:1px solid var(--linha); border-radius:var(--radius); padding:20px; position:sticky; top:150px;}
.cart-item{display:grid; grid-template-columns:32px 1.5fr 100px 78px 82px 30px; align-items:center; gap:8px; padding:10px 4px; border-bottom:1px solid var(--linha); border-radius:8px;}
.cart-item:nth-child(odd){background:rgba(232,237,229,0.45);}
.cart-item:hover{background:rgba(31,152,102,0.07);}
.cart-head{display:grid; grid-template-columns:32px 1.5fr 100px 78px 82px 30px; gap:8px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:#8b8270; font-weight:700; padding-bottom:6px; padding:0 4px 6px; border-bottom:2px solid var(--linha); margin-bottom:2px;}
.cart-item .ci-nm{font-size:12.5px; font-weight:600; line-height:1.25;}
.ci-thumb{width:28px; height:28px; border-radius:6px; object-fit:cover;}
.ci-thumb-empty{width:28px; height:28px; border-radius:6px; background:var(--creme-2); display:flex; align-items:center; justify-content:center; font-size:13px;}
.ci-input{width:100%; padding:6px 6px; border-radius:7px; border:1.5px solid var(--linha); background:var(--creme); font-size:12.5px; text-align:center;}
.ci-input:focus{outline:none; border-color:var(--terracota); background:#fff;}
.ci-price-input{font-weight:700;}
.qty-stepper{display:flex; align-items:center; justify-content:center; gap:4px;}
.qty-stepper .qbtn{width:22px;height:22px;border-radius:6px;border:1px solid var(--linha);background:var(--creme);font-weight:700; font-size:13px; line-height:1; flex-shrink:0; padding:0;}
.qty-stepper .qbtn:hover{background:var(--verde-700); color:#fff; border-color:var(--verde-700);}
.qty-stepper .qval{min-width:30px; text-align:center; font-weight:700; font-size:12.5px;}
.ci-tot{font-weight:700; text-align:right; font-size:13px; color:var(--verde-900);}
.ci-rm{background:none;border:none;color:var(--vermelho);font-size:15px;padding:0 2px;}
.ci-actions{display:flex; gap:3px; justify-content:flex-end;}
.cart-total{display:flex; justify-content:space-between; align-items:center; padding-top:14px; margin-top:8px; border-top:2px solid var(--verde-900);}
.cart-total .lbl{font-size:14px; font-weight:700; color:var(--verde-900);}
.cart-total .val{font-size:30px; font-weight:800; font-family:'Fraunces',serif; color:var(--terracota-esc);}
.paymethods{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:0 0 12px;}
.paymethods button{display:flex; flex-direction:row; align-items:center; justify-content:center; gap:5px; padding:8px 6px; border-radius:8px; border:1.5px solid var(--linha); background:var(--creme); font-size:11.5px; font-weight:700; color:var(--verde-800);}
.paymethods button .pm-ic{font-size:13px;}
.paymethods button.active{background:var(--verde-800); color:#fff; border-color:var(--verde-800); box-shadow:0 4px 12px -4px rgba(18,90,63,0.5);}
.troco-box{display:flex; align-items:center; justify-content:space-between; background:var(--verde-900); color:#fff; border-radius:12px; padding:14px 18px; margin-top:6px;}
.troco-box span{font-size:12px; letter-spacing:0.08em; font-weight:700; color:var(--ouro);}
.troco-box strong{font-family:'Fraunces',serif; font-size:26px; font-weight:800;}
.pos-actions-row{display:flex; gap:8px; margin-top:8px;}
.pos-actions-row .btn{flex:1;}
.kbd-hint{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
.kbd-hint span{background:var(--creme-2); border:1px solid var(--linha); border-radius:6px; padding:3px 8px; font-size:11px; color:var(--verde-800); font-family:'JetBrains Mono',monospace; font-weight:700;}

.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:20px;}
.stat{background:var(--papel); border:1px solid var(--linha); border-radius:12px; padding:16px; box-shadow:var(--sombra);}
.stat .lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:#8b8270; font-weight:700;}
.stat .val{font-family:'Fraunces',serif; font-size:23px; font-weight:700; color:var(--verde-900); margin-top:4px;}
.stat.accent .val{color:var(--terracota-esc);}
.stat.bad .val{color:var(--vermelho);}

.modal-bg{position:fixed; inset:0; background:rgba(22,40,31,0.55); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
.modal{background:var(--papel); border-radius:16px; padding:26px; width:100%; max-width:480px; box-shadow:var(--sombra); max-height:90vh; overflow-y:auto;}
.modal.wide{max-width:620px;}
.modal h3{color:var(--verde-900); margin-bottom:16px; font-size:18px;}
.modal-actions{display:flex; gap:10px; margin-top:20px;}
.modal-actions .btn{flex:1;}
.toast{position:fixed; bottom:24px; right:24px; background:var(--verde-900); color:#fff; padding:14px 20px; border-radius:10px; box-shadow:var(--sombra); z-index:400; font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:10px; max-width:320px;}
.help-modal{max-width:680px;}
.help-modal details{
  border:1.5px solid var(--linha); border-radius:12px; margin-bottom:10px; padding:12px 16px; background:var(--creme-2);
}
.help-modal summary{
  font-weight:700; font-size:14.5px; color:var(--verde-900); cursor:pointer; list-style:none;
}
.help-modal summary::-webkit-details-marker{display:none;}
.help-modal summary::before{content:'▸ '; color:var(--terracota-esc);}
.help-modal details[open] summary::before{content:'▾ ';}
.help-modal .help-body{padding-top:10px; font-size:13.5px; line-height:1.6; color:var(--tinta);}
.help-modal .help-body ul{margin:0; padding-left:20px;}
.help-modal .help-body li{margin-bottom:8px;}
.help-modal .help-body p{margin:0 0 8px;}
.prod-photo-row{display:flex; gap:14px; align-items:center; margin-bottom:16px;}

  width:80px; height:80px; border-radius:12px; background:var(--creme-2); border:1.5px dashed var(--linha);

}
.prod-photo-preview img{width:100%; height:100%; object-fit:cover;}
.prod-photo-preview span{font-size:11px; color:#a39a86; text-align:center;}
.prod-thumb{width:36px; height:36px; border-radius:8px; object-fit:cover; margin-right:8px; vertical-align:middle; flex-shrink:0;}
.prod-thumb-empty{width:36px; height:36px; border-radius:8px; background:var(--creme-2); display:inline-flex; align-items:center; justify-content:center; margin-right:8px; vertical-align:middle; flex-shrink:0; font-size:14px;}
.empty-state{text-align:center; padding:40px 20px; color:#a39a86;}
.flexbet{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.small-note{font-size:12px; color:#8b8270; margin-top:10px; line-height:1.5;}
.scan-feedback{margin-top:8px; padding:9px 13px; border-radius:9px; font-size:13.5px; display:none; align-items:center; gap:8px; flex-wrap:wrap;}

.scan-feedback.found{background:rgba(31,152,102,0.12); border:1px solid rgba(31,152,102,0.35); color:var(--verde-800);}
.scan-feedback.notfound{background:rgba(178,64,47,0.10); border:1px solid rgba(178,64,47,0.35); color:var(--vermelho);}

.scan-feedback .sf-meta b{font-weight:700;}
.scan-feedback .sf-meta .sf-baixo{color:var(--vermelho); font-weight:700;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--linha); border-radius:10px;}

.lock-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(245,219,61,0.18);color:var(--ouro);padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.bar-row .bar-lbl{width:90px; font-size:12px; color:var(--verde-800); font-weight:700; flex-shrink:0;}
.bar-track{flex:1; background:var(--creme-2); border-radius:6px; height:20px; overflow:hidden;}
.bar-fill{background:linear-gradient(90deg, var(--terracota), var(--ouro)); height:100%; border-radius:6px;}
.bar-val{width:100px; text-align:right; font-size:12.5px; font-weight:700; color:var(--verde-900); flex-shrink:0;}

#camVideo{width:100%; display:block;}
.cam-frame{position:absolute; inset:15% 10%; border:3px solid var(--terracota); border-radius:10px; box-shadow:0 0 0 2000px rgba(0,0,0,0.35);}

.cupom-preview{background:#fff; color:#000; font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.5; padding:14px; border:1px solid var(--linha); border-radius:8px; max-width:320px; margin:0 auto; max-height:60vh; overflow-y:auto;}
.cupom-preview .center{text-align:center;}
.cupom-preview .rstore-name{font-size:15px; font-weight:800; letter-spacing:0.03em;}
.cupom-preview .rfiscal-label{font-weight:700;}
.cupom-preview .rline{display:flex; justify-content:space-between; gap:6px;}
.cupom-preview .ritem-header{font-weight:700; text-transform:uppercase; font-size:11px;}
.cupom-preview .ritem{margin-bottom:4px;}
.cupom-preview .ritem-desc{font-weight:700;}
.cupom-preview .ritem-calc{font-size:11px; color:#333;}
.cupom-preview .rtotal-line{font-size:14px; margin:4px 0;}
.cupom-preview .rdash{border-top:1px dashed #999; margin:6px 0;}
.cupom-preview .rbarcode{height:34px; margin-top:8px; background:repeating-linear-gradient(90deg, #000 0px, #000 2px, transparent 2px, transparent 4px, #000 4px, #000 5px, transparent 5px, transparent 8px);}
.cupom-preview .rbarcode-num{font-size:10px; letter-spacing:0.2em; margin-top:2px; text-align:center;}

/* receipt (impressão) */
#receiptArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #receiptArea, #receiptArea *{visibility:visible;}
  #receiptArea{display:block !important; position:absolute; top:0; left:0; padding:2mm 1mm; font-family:'JetBrains Mono',monospace; color:#000; line-height:1.4; word-wrap:break-word;}
  #receiptArea .rstore-name{font-size:1.25em; font-weight:800; letter-spacing:0.03em;}
  #receiptArea .rfiscal-label{font-weight:700;}
  #receiptArea .rline{display:flex; justify-content:space-between; gap:6px;}
  #receiptArea .ritem-header{font-weight:700; text-transform:uppercase; font-size:0.9em;}
  #receiptArea .ritem{margin-bottom:3px;}
  #receiptArea .ritem-desc{font-weight:700;}
  #receiptArea .ritem-calc{font-size:0.95em; color:#333;}
  #receiptArea .rtotal-line{font-size:1.15em; margin:2px 0;}
  #receiptArea .rdash{border-top:1px dashed #000; margin:5px 0;}
  #receiptArea .rbarcode{
    height:34px; margin-top:8px;
    background:repeating-linear-gradient(90deg, #000 0px, #000 2px, transparent 2px, transparent 4px, #000 4px, #000 5px, transparent 5px, transparent 8px);
  }
  #receiptArea .rbarcode-num{font-size:0.9em; letter-spacing:0.2em; margin-top:2px;}
}

/* ---------------- Armazenamento (local, no próprio computador) ----------------
   Usa IndexedDB do navegador — funciona 100% offline, sem servidor e sem
   depender de nada externo. Se por algum motivo o IndexedDB não estiver
   disponível, cai automaticamente para localStorage como reserva. */
const DB_NOME = 'pinheiro_costa_pdv';
const DB_STORE = 'kv';
let _idbPromise = null;
function abrirIDB(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB indisponível')); return; }
    const req = indexedDB.open(DB_NOME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(DB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _idbPromise;
}
async function idbGet(key){
  const db = await abrirIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await abrirIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function loadKey(key, fallback){
  try{
    const val = await idbGet(key);
    if(val !== undefined && val !== null) return JSON.parse(val);
  }catch(e){ console.error('IndexedDB falhou ao ler, tentando localStorage', key, e); }
  try{
    const raw = localStorage.getItem(key);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* ignora */ }
  return fallback;
}
async function saveKey(key, value, tentativa){
  tentativa = tentativa || 1;
  try{
    await idbSet(key, JSON.stringify(value));
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* apenas reserva extra, ignora erro de espaço */ }
    limparAvisoSalvamento();
  }catch(e){
    console.error('Falha ao salvar', key, e, '— tentativa', tentativa);
    if(tentativa < 3){
      await new Promise(r=>setTimeout(r, 600*tentativa));
      return saveKey(key, value, tentativa+1);
    }
    // Reserva final: tenta gravar direto no localStorage antes de avisar o usuário
    try{
      localStorage.setItem(key, JSON.stringify(value));
      limparAvisoSalvamento();
      return;
    }catch(e2){ /* segue para o aviso abaixo */ }
    // Depois de 3 tentativas (e da reserva), avisa de forma persistente — isso não pode passar despercebido
    mostrarAvisoSalvamentoFalhou(key);
  }
}
let avisoSalvamentoAtivo = false;
function mostrarAvisoSalvamentoFalhou(key){
  avisoSalvamentoAtivo = true;
  showToast('🚨 Não consegui salvar os dados ("'+key+'"). Verifique se o navegador não está em modo anônimo/privado e se há espaço em disco. NÃO feche o sistema — tente de novo ou baixe um backup imediatamente.', 8000);
  renderNav();
}
function limparAvisoSalvamento(){
  if(avisoSalvamentoAtivo){ avisoSalvamentoAtivo = false; renderNav(); }
}
async function loadAll(){
  DB.products = await loadKey(KEYS.products, []);
  DB.movements = await loadKey(KEYS.movements, []);
  DB.sales = await loadKey(KEYS.sales, []);
  DB.caixaSessions = await loadKey(KEYS.caixaSessions, []);
  DB.lancamentos = await loadKey(KEYS.lancamentos, []);
  DB.suppliers = await loadKey(KEYS.suppliers, []);
  DB.clients = await loadKey(KEYS.clients, []);
  DB.employees = await loadKey(KEYS.employees, []);
  DB.settings = await loadKey(KEYS.settings, { password:null, operadores:['Caixa 1'], printer:{connected:false, name:null} });
  if(DB.settings.logoBase64===undefined) DB.settings.logoBase64 = DEFAULT_LOGO_B64;
  if(DB.settings.storeName===undefined) DB.settings.storeName = '';
  if(!DB.settings.operadores || !DB.settings.operadores.length) DB.settings.operadores=['Caixa 1'];
  // Migração: se existia a senha única antiga dos Cadastros e ainda não há usuários com login,
  // cria automaticamente um administrador para não travar o acesso de quem já usava o sistema.
  if(!DB.settings.usuarios){
    DB.settings.usuarios = DB.settings.password
      ? [{id:uid(), nome:'Administrador', usuario:'admin', senha:DB.settings.password, papel:'admin', pergunta:'', resposta:'', dica:''}]
      : [];
    await saveKey(KEYS.settings, DB.settings);
  }
  operatorName = DB.settings.operadores[0];
}

/* ---------------- Utilidades ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function brl(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function todayISODate(){ return toLocalDateStr(new Date()); }
function toLocalDateStr(d){
  d = (d instanceof Date) ? d : new Date(d);
  const off = d.getTimezoneOffset()*60000;
  return new Date(d.getTime() - off).toISOString().slice(0,10);
}
function showToast(msg, ms=3000){
  const root=document.getElementById('toastRoot');
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  root.appendChild(el); setTimeout(()=>el.remove(), ms);
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normalizarBusca(s){ return String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function campoBusca(id, valor, fnNome, placeholder, onEnterFn){
  return `<div class="field" style="margin-bottom:14px; max-width:420px;">
    <input type="text" id="${id}" value="${escapeHtml(valor)}" placeholder="${escapeHtml(placeholder||'🔎 Buscar por nome ou código...')}" oninput="${fnNome}(this.value)" autocomplete="off"
      ${onEnterFn?`onkeydown="if(event.key==='Enter'){event.preventDefault(); ${onEnterFn}(this);}"`:''}>
  </div>`;
}
function manterFocoBusca(id){
  setTimeout(()=>{ const el=document.getElementById(id); if(el){ el.focus(); const v=el.value; el.value=v; el.setSelectionRange(v.length, v.length); } }, 0);
}
function onFiltroProdutosCad(v){
  filtroProdutosCad=v;
  clearTimeout(_prodSearchTimer);
  _prodSearchTimer=setTimeout(()=>{ renderContent(); manterFocoBusca('buscaProdutosCad'); }, 180);
}
function onEnterBuscaProdutosCad(inputEl){
  const val = inputEl.value.trim();
  if(!val) return;
  clearTimeout(_prodSearchTimer);
  const porCodigo = DB.products.find(p=>p.barcode && p.barcode===val);
  if(porCodigo){ openProductModal(porCodigo.id); return; }
  filtroProdutosCad = val;
  renderContent();
  manterFocoBusca('buscaProdutosCad');

function getLowStockProducts(){

function renderLowStockBanner(){
  const low = getLowStockProducts();
  if(low.length===0) return '';
  const nomes = low.slice(0,5).map(p=>escapeHtml(p.name)+' ('+p.stock+(p.saleType==='peso'?'kg':' un.')+')').join(', ');
  const resto = low.length>5 ? ` e mais ${low.length-5}` : '';

  </div>`;

function diasDesdeUltimoBackup(){
  const last = DB.settings.lastBackupAt;
  if(!last) return null;
  return Math.floor((Date.now() - new Date(last).getTime()) / (1000*60*60*24));
}
function renderBackupReminderBanner(){
  const temDados = DB.products.length>0 || DB.sales.length>0;
  if(!temDados) return '';
  const dias = diasDesdeUltimoBackup();
  const nuncaFezBackup = dias===null;
  if(!nuncaFezBackup && dias<7) return '';
  return `<div class="alert-banner" style="background:#fff6df; border-color:var(--terracota-esc);">
    <div class="txt" style="color:var(--terracota-esc);">
      💾 ${nuncaFezBackup ? 'Você ainda não baixou nenhum backup dos dados.' : 'Faz '+dias+' dia(s) desde o último backup.'}
      Baixe um backup e guarde num pen-drive/nuvem por segurança — assim os dados nunca se perdem de vez.
    </div>
    <button class="btn btn-outline btn-sm" onclick="switchTab('cadastros')">Fazer backup agora</button>
  </div>`;
}
function renderVendaBottomAlerts(){
  let bars = '';
  const low = getLowStockProducts();
  if(low.length>0){
    const nomes = low.slice(0,3).map(p=>escapeHtml(p.name)).join(', ');
    const resto = low.length>3 ? ` +${low.length-3}` : '';
    bars += `<div class="pdv-alert-mini low">
      <span class="txt">⚠️ Estoque mínimo: ${nomes}${resto}</span>
      <button onclick="switchTab('estoque')">Ver estoque</button>
    </div>`;
  }
  const temDados = DB.products.length>0 || DB.sales.length>0;
  const dias = diasDesdeUltimoBackup();
  const nuncaFezBackup = dias===null;
  if(temDados && (nuncaFezBackup || dias>=7)){
    bars += `<div class="pdv-alert-mini backup">
      <span class="txt">💾 ${nuncaFezBackup ? 'Nenhum backup feito ainda' : 'Faz '+dias+' dia(s) sem backup'}</span>
      <button onclick="switchTab('cadastros')">Fazer backup</button>
    </div>`;
  }
  if(!bars) return '';
  return `<div class="pdv-bottom-alerts">${bars}</div>`;
}

const PERGUNTAS_SEGURANCA_PADRAO = [
  'Nome do seu primeiro animal de estimação?',
  'Nome de solteira da sua mãe?',
  'Em qual cidade você nasceu?',
  'Qual o nome da sua primeira escola?',
  'Qual o nome do seu melhor amigo de infância?',
  'Qual foi o modelo do seu primeiro carro?',
  'Qual é o seu prato favorito?',
  'Qual o nome do seu time de futebol do coração?'
];
function renderPerguntaSegurancaHTML(idPrefix, valorAtual){
  const val = (valorAtual||'').trim();
  const isPadrao = PERGUNTAS_SEGURANCA_PADRAO.includes(val);
  const isOutra = val && !isPadrao;
  return `
    <div class="field">
      <label>Pergunta de segurança (para recuperar a senha)</label>
      <select id="${idPrefix}Select" onchange="toggleOutraPergunta('${idPrefix}')">
        <option value="">Selecione uma pergunta...</option>
        ${PERGUNTAS_SEGURANCA_PADRAO.map(p=>`<option value="${escapeHtml(p)}" ${val===p?'selected':''}>${escapeHtml(p)}</option>`).join('')}
        <option value="__outra__" ${isOutra?'selected':''}>Outra (digite a sua)</option>
      </select>
    </div>
    <div class="field" id="${idPrefix}OutraBox" style="${isOutra?'':'display:none;'}">
      <label>Digite sua pergunta personalizada</label>
      <input id="${idPrefix}Outra" value="${isOutra?escapeHtml(val):''}" placeholder="Ex: Qual o nome da rua da sua infância?">
    </div>
  `;
}
function toggleOutraPergunta(idPrefix){
  const sel = document.getElementById(idPrefix+'Select');
  const box = document.getElementById(idPrefix+'OutraBox');
  if(!sel||!box) return;
  box.style.display = sel.value==='__outra__' ? '' : 'none';
}
function getPerguntaSegurancaValor(idPrefix){
  const sel = document.getElementById(idPrefix+'Select');
  if(!sel) return '';
  if(sel.value==='__outra__'){
    return (document.getElementById(idPrefix+'Outra')?.value||'').trim();
  }
  return sel.value;
}
function askCadastroPassword(){
  if(!DB.settings.usuarios || DB.settings.usuarios.length===0){
    document.getElementById('modalRoot').innerHTML = `
      <div class="modal-bg"><div class="modal">
        <h3>Criar administrador</h3>
        <p class="muted">Primeiro acesso às áreas protegidas (Cadastros e Relatórios). Crie o usuário administrador.</p>
        <div id="pwErr"></div>
        <div class="field"><label>Nome</label><input id="setupNome" placeholder="Seu nome"></div>
        <div class="field"><label>Usuário (login)</label><input id="setupUsuario" placeholder="Ex: admin"></div>
        <div class="field"><label>Senha</label><input type="password" id="newPw1" placeholder="Crie uma senha"></div>
        <div class="field"><label>Confirme a senha</label><input type="password" id="newPw2" placeholder="Repita a senha"></div>
        ${renderPerguntaSegurancaHTML('setupPergunta', '')}
        <div class="field"><label>Resposta secreta</label><input id="setupResposta" placeholder="Resposta que só você sabe"></div>
        <div class="field"><label>Dica da senha (opcional)</label><input id="setupDica" placeholder="Uma dica para lembrar a senha, se esquecer"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="setupCadastroPassword()">Criar e entrar</button>
        </div>
      </div></div>`;
    return;
  }
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg"><div class="modal">
      <h3>🔒 Área protegida</h3>
      <p class="muted">Digite seu usuário e senha para acessar Cadastros ou Relatórios.</p>
      <div id="pwErr"></div>
      <div class="field"><label>Usuário</label><input id="loginUsuario" placeholder="Usuário" onkeydown="if(event.key==='Enter')tryCadastroPassword()"></div>
      <div class="field"><label>Senha</label><input type="password" id="cadPw" placeholder="Senha" onkeydown="if(event.key==='Enter')tryCadastroPassword()"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="tryCadastroPassword()">Entrar</button>
      </div>
      <p style="text-align:center; margin-top:14px;"><button class="linkbtn" onclick="abrirEsqueciSenha()">Esqueci minha senha</button></p>
    </div></div>`;
}
async function setupCadastroPassword(){
  const nome=document.getElementById('setupNome').value.trim();
  const usuario=document.getElementById('setupUsuario').value.trim().toLowerCase();
  const p1=document.getElementById('newPw1').value, p2=document.getElementById('newPw2').value;
  const pergunta=getPerguntaSegurancaValor('setupPergunta');
  const resposta=document.getElementById('setupResposta').value.trim();
  const dica=document.getElementById('setupDica').value.trim();
  if(!nome || !usuario){ document.getElementById('pwErr').innerHTML='<div class="errmsg">Preencha nome e usuário.</div>'; return; }
  if(!p1 || p1.length<4){ document.getElementById('pwErr').innerHTML='<div class="errmsg">A senha deve ter ao menos 4 caracteres.</div>'; return; }
  if(p1!==p2){ document.getElementById('pwErr').innerHTML='<div class="errmsg">As senhas não coincidem.</div>'; return; }
  DB.settings.usuarios = [{id:uid(), nome, usuario, senha:p1, papel:'admin', pergunta, resposta, dica}];
  await saveKey(KEYS.settings, DB.settings);
  cadastrosUnlocked = true;
  closeModal();
  currentTab = tabAposLogin || 'cadastros'; tabAposLogin=null;
  renderNav(); renderContent();
}
function tryCadastroPassword(){
  const usuario = document.getElementById('loginUsuario').value.trim().toLowerCase();
  const p = document.getElementById('cadPw').value;
  const found = (DB.settings.usuarios||[]).find(u=>u.usuario===usuario && u.senha===p);
  if(!found){ document.getElementById('pwErr').innerHTML='<div class="errmsg">Usuário ou senha incorretos.</div>'; return; }
  cadastrosUnlocked = true;
  closeModal();
  currentTab = tabAposLogin || 'cadastros'; tabAposLogin=null;
  renderNav(); renderContent();
}
function lockCadastros(){ cadastrosUnlocked=false; currentTab='pdv'; renderNav(); renderContent(); showToast('Área protegida bloqueada.'); }

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg"><div class="modal">
      <h3>Esqueci minha senha</h3>
      <p class="muted">Informe seu usuário para recuperar o acesso pela pergunta de segurança.</p>

      <div class="field"><label>Usuário</label><input id="fsUsuario" placeholder="Seu usuário"></div>
      <div class="modal-actions">

        <button class="btn btn-primary" onclick="continuarEsqueciSenha()">Continuar</button>
      </div>
    </div></div>`;
}
function continuarEsqueciSenha(){
  const usuario = document.getElementById('fsUsuario').value.trim().toLowerCase();
  const found = (DB.settings.usuarios||[]).find(u=>u.usuario===usuario);
  if(!found){ document.getElementById('fsErr').innerHTML='<div class="errmsg">Usuário não encontrado.</div>'; return; }
  if(!found.pergunta || !found.resposta){
    document.getElementById('fsErr').innerHTML='<div class="errmsg">Este usuário não tem uma pergunta de segurança cadastrada. Peça para outro administrador redefinir sua senha em Cadastros → Usuários.</div>';
    return;
  }
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg"><div class="modal">
      <h3>Pergunta de segurança</h3>
      <p class="muted"><strong>${escapeHtml(found.pergunta)}</strong></p>
      <div id="fsErr2"></div>
      <div class="field"><label>Sua resposta</label><input id="fsResposta" placeholder="Digite a resposta"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="abrirEsqueciSenha()">Voltar</button>
        <button class="btn btn-primary" onclick="verificarRespostaSeguranca('${found.id}')">Verificar</button>
      </div>
    </div></div>`;
}
function verificarRespostaSeguranca(userId){
  const found = (DB.settings.usuarios||[]).find(u=>u.id===userId);
  const resposta = document.getElementById('fsResposta').value.trim().toLowerCase();
  if(!found || resposta!==(found.resposta||'').trim().toLowerCase()){
    document.getElementById('fsErr2').innerHTML='<div class="errmsg">Resposta incorreta.</div>';
    return;
  }
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg"><div class="modal">
      <h3>Criar nova senha</h3>
      <div id="fsErr3"></div>
      <div class="field"><label>Nova senha</label><input type="password" id="fsNovaSenha1" placeholder="Nova senha"></div>
      <div class="field"><label>Confirme a nova senha</label><input type="password" id="fsNovaSenha2" placeholder="Repita a nova senha"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarNovaSenhaRecuperada('${userId}')">Salvar nova senha</button>
      </div>
    </div></div>`;
}
async function salvarNovaSenhaRecuperada(userId){
  const found = (DB.settings.usuarios||[]).find(u=>u.id===userId);
  const p1 = document.getElementById('fsNovaSenha1').value;
  const p2 = document.getElementById('fsNovaSenha2').value;
  if(!p1 || p1.length<4){ document.getElementById('fsErr3').innerHTML='<div class="errmsg">A senha deve ter ao menos 4 caracteres.</div>'; return; }
  if(p1!==p2){ document.getElementById('fsErr3').innerHTML='<div class="errmsg">As senhas não coincidem.</div>'; return; }
  found.senha = p1;
  await saveKey(KEYS.settings, DB.settings);
  showToast('Senha redefinida com sucesso! Faça login novamente.');
  askCadastroPassword();
}

function adicionarItemVenda(){
  const nomeDigitado = document.getElementById('inputProduto').value.trim();
  let p = selectedProductId ? DB.products.find(x=>x.id===selectedProductId) : null;
  if(!p) p = buscarProdutoPorTexto(nomeDigitado);
  if(!p){ showToast('Produto não encontrado. Confira o nome ou o código de barras.'); return; }
  const qty = parseFloat(document.getElementById('inputQtd').value);
  const price = parseFloat(document.getElementById('inputPrecoUnit').value) || p.price;
  if(!qty || qty<=0){ showToast('Informe uma quantidade válida.'); return; }
  if(!price || price<=0){ showToast('Informe um preço válido.'); return; }
  const outrasQtd = cart.filter(l=>l.productId===p.id).reduce((s,l)=>s+l.qty,0);
  if(outrasQtd+qty > p.stock){ showToast('Estoque insuficiente para '+p.name+' (disponível: '+p.stock+')'); return; }
  const existing = cart.find(l=>l.productId===p.id && l.price===price);
  if(existing) existing.qty += qty;
  else cart.push({lineId:uid(), productId:p.id, name:p.name, price, cost:p.cost||0, qty, saleType:p.saleType||'unidade'});
  limparFormularioVenda();
  refreshCartUI();
}
function limparFormularioVenda(){
  selectedProductId = null;

  const qtdEl = document.getElementById('inputQtd');
  const precoEl = document.getElementById('inputPrecoUnit');
  const subEl = document.getElementById('subtotalFormVal');
  const fotoBox = document.getElementById('vendaFotoPreview');
  const fb = document.getElementById('scanFeedback');
  if(prodEl) prodEl.value='';
  if(qtdEl){ qtdEl.value=1; qtdEl.step='1'; qtdEl.min='1'; }
  if(precoEl) precoEl.value='';
  if(subEl) subEl.textContent = brl(0);

  if(fb){ fb.className = 'scan-feedback'; fb.innerHTML = ''; }
  if(prodEl) prodEl.focus();

function ajustarQtdItem(lineId, delta){
  const item = cart.find(l=>l.lineId===lineId);
  if(!item || item.saleType==='peso') return;
  const novaQtd = item.qty + delta;
  if(novaQtd<=0){ cart = cart.filter(l=>l.lineId!==lineId); refreshCartUI(); return; }
  const produto = DB.products.find(p=>p.id===item.productId);
  const outrasQtd = cart.filter(l=>l.productId===item.productId && l.lineId!==lineId).reduce((s,l)=>s+l.qty,0);
  if(produto && (outrasQtd+novaQtd) > produto.stock){ showToast('Estoque insuficiente para '+item.name+' (disponível: '+produto.stock+')'); return; }
  item.qty = novaQtd;
  refreshCartUI();
}
function refreshCartUI(){
  const cartEl = document.getElementById('cartItems');
  if(cartEl) cartEl.innerHTML = renderCartItems();
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const totEl = document.getElementById('cartTotalVal');
  if(totEl) totEl.textContent = brl(total);
  const dinheiroEl = document.getElementById('dinheiroBox');
  if(dinheiroEl) dinheiroEl.innerHTML = renderDinheiroBox();
  const finishBtn = document.querySelector('.btn-primary[onclick="finalizarVenda()"]');
  if(finishBtn) finishBtn.disabled = cart.length===0;
}
function removeLine(lineId){ cart = cart.filter(l=>l.lineId!==lineId); refreshCartUI(); }
function limparCarrinho(){ cart=[]; limparFormularioVenda(); refreshCartUI(); }
function setPay(m){ payMethod=m; renderContent(); }
function labelFormaPagamento(pm){
  return {dinheiro:'Dinheiro', cartao:'Cartão', cartaoCredito:'Cartão Crédito', cartaoDebito:'Cartão Débito', pix:'Pix', misto:'Misto', fiado:'Fiado'}[pm] || pm;
}
function somarPorFormaPagamento(vendas){
  const out = {dinheiro:0, cartao:0, cartaoCredito:0, cartaoDebito:0, pix:0, fiado:0, mistoCount:0};
  vendas.forEach(s=>{
    if(s.payMethod==='misto' && s.mistoBreakdown){
      out.dinheiro += s.mistoBreakdown.dinheiro||0;
      const cred = s.mistoBreakdown.cartaoCredito||0;
      const deb = s.mistoBreakdown.cartaoDebito||0;
      // compatibilidade com vendas antigas que só tinham "cartao" (sem separar crédito/débito)
      const cartaoAntigo = (cred===0 && deb===0) ? (s.mistoBreakdown.cartao||0) : 0;
      out.cartaoCredito += cred;
      out.cartaoDebito += deb;
      out.cartao += cred + deb + cartaoAntigo;
      out.pix += s.mistoBreakdown.pix||0;
      out.mistoCount++;
    } else if(s.payMethod==='cartaoCredito'){
      out.cartaoCredito += s.total; out.cartao += s.total;
    } else if(s.payMethod==='cartaoDebito'){
      out.cartaoDebito += s.total; out.cartao += s.total;
    } else if(s.payMethod==='cartao'){
      // compatibilidade com vendas antigas (antes da separação crédito/débito na venda direta)
      out.cartao += s.total;
    } else if(Object.prototype.hasOwnProperty.call(out, s.payMethod)){
      out[s.payMethod] += s.total;
    }
  });
  return out;
}
function calcTroco(){
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const inp = document.getElementById('valorRecebido');
  const trocoEl = document.getElementById('trocoVal');
  if(!inp||!trocoEl) return;
  const recebido = parseFloat(inp.value)||0;
  const troco = recebido-total;
  trocoEl.textContent = brl(troco>0?troco:0);
  trocoEl.style.color = troco<0 ? '#ff8a75' : '#fff';
}
function calcMisto(){
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const d = parseFloat(document.getElementById('mistoDinheiro')?.value)||0;
  const cCred = parseFloat(document.getElementById('mistoCartaoCredito')?.value)||0;
  const cDeb = parseFloat(document.getElementById('mistoCartaoDebito')?.value)||0;
  const p = parseFloat(document.getElementById('mistoPix')?.value)||0;
  const soma = d+cCred+cDeb+p;
  const diff = soma-total;
  const diffEl = document.getElementById('mistoDiffVal');
  if(!diffEl) return;
  if(Math.abs(diff)<0.005){ diffEl.textContent='Confere ✓'; diffEl.style.color='#8fe3a0'; }
  else if(diff>0){ diffEl.textContent='Sobrando '+brl(diff); diffEl.style.color='#ff8a75'; }
  else{ diffEl.textContent='Falta '+brl(-diff); diffEl.style.color='#ff8a75'; }
}
function focusScanInput(){

  if(el) setTimeout(()=>el.focus(), 50);
}
async function finalizarVenda(){
  const session = getOpenSession();
  if(!session){ showToast('Abra o caixa antes de vender.'); return; }
  if(cart.length===0) return;
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  let cliente = null;
  let valorRecebido = null, troco = null;
  let mistoBreakdown = null;
  if(payMethod==='dinheiro'){
    valorRecebido = parseFloat(document.getElementById('valorRecebido')?.value)||0;
    if(valorRecebido < total){ showToast('Valor recebido é menor que o total.'); return; }
    troco = valorRecebido - total;
  }
  if(payMethod==='misto'){
    const d = parseFloat(document.getElementById('mistoDinheiro')?.value)||0;
    const cCred = parseFloat(document.getElementById('mistoCartaoCredito')?.value)||0;
    const cDeb = parseFloat(document.getElementById('mistoCartaoDebito')?.value)||0;
    const p = parseFloat(document.getElementById('mistoPix')?.value)||0;
    const soma = d+cCred+cDeb+p;
    if(Math.abs(soma-total) > 0.01){
      showToast('A soma dos valores ('+brl(soma)+') não bate com o total da venda ('+brl(total)+').');
      return;
    }
    mistoBreakdown = {dinheiro:d, cartaoCredito:cCred, cartaoDebito:cDeb, cartao:cCred+cDeb, pix:p};
  }
  if(payMethod==='fiado'){
    if(!selectedClientId){ showToast('Selecione o cliente para venda fiado.'); return; }
    cliente = DB.clients.find(x=>x.id===selectedClientId);
    if(!cliente){ showToast('Cliente não encontrado.'); return; }
    if(cliente.limiteCredito>0 && (cliente.saldoDevedor+total) > cliente.limiteCredito){
      showToast('Limite de crédito excedido para '+cliente.name+' (limite: '+brl(cliente.limiteCredito)+').');
      return;
    }
  }
  const somaPorProduto = {};
  cart.forEach(i=>{ somaPorProduto[i.productId] = (somaPorProduto[i.productId]||0) + i.qty; });
  for(const productId in somaPorProduto){
    const p = DB.products.find(x=>x.id===productId);
    if(!p || p.stock < somaPorProduto[productId]){ showToast('Estoque insuficiente para '+(p?p.name:'produto')); return; }
  }
  Object.keys(somaPorProduto).forEach(productId=>{
    const p = DB.products.find(x=>x.id===productId);
    p.stock -= somaPorProduto[productId];
    DB.movements.push({id:uid(), productId:p.id, productName:p.name, type:'saida', qty:somaPorProduto[productId], reason:'Venda (PDV)', operator:operatorName, date:nowISO()});
  });
  const produtosAgoraBaixos = Object.keys(somaPorProduto)
    .map(id=>DB.products.find(x=>x.id===id))
    .filter(p=>p && p.stock<=(p.minStock||0));
  const sale = { id:uid(), date:nowISO(), operator:operatorName, items:cart.map(i=>({...i})), total, payMethod, sessionId:session.id, clientId: cliente?cliente.id:null, clientName: cliente?cliente.name:null, valorRecebido, troco, mistoBreakdown };
  DB.sales.push(sale);
  const saveOps = [saveKey(KEYS.products, DB.products), saveKey(KEYS.movements, DB.movements), saveKey(KEYS.sales, DB.sales)];
  if(cliente){ cliente.saldoDevedor = (cliente.saldoDevedor||0) + total; saveOps.push(saveKey(KEYS.clients, DB.clients)); }
  await Promise.all(saveOps);
  showToast(cliente ? '✅ Venda fiado de '+brl(total)+' registrada para '+cliente.name+'!' : '✅ Venda de '+brl(total)+' registrada!');
  if(produtosAgoraBaixos.length>0){
    showToast('⚠️ Estoque mínimo atingido: '+produtosAgoraBaixos.map(p=>p.name).join(', '), 5000);
  }
  selectedClientId = '';
  payMethod = 'dinheiro';
  await imprimirRecibo(sale);
  cart = [];
  renderContent();
  if(DB.settings.autoPrint!==false){
    abrirPreviewCupom(sale);
  }
}

/* ---- leitura de código de barras via câmera ---- */
let camStream = null;
async function openCameraScan(){
  if(!('BarcodeDetector' in window)){
    showToast('Este navegador não tem suporte nativo à câmera para leitura de código de barras. Use um leitor USB, que funciona digitando direto no campo de busca.');
    return;
  }
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeCameraScan()">
      <div class="modal">
        <h3>📷 Aponte para o código de barras</h3>
        <div id="camWrap"><video id="camVideo" autoplay playsinline muted></video><div class="cam-frame"></div></div>
        <div class="modal-actions"><button class="btn btn-ghost btn-block" onclick="closeCameraScan()">Cancelar</button></div>
      </div>
    </div>`;
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video = document.getElementById('camVideo');
    video.srcObject = camStream;
    const detector = new BarcodeDetector();
    const scanLoop = async ()=>{
      if(!camStream) return;
      try{
        const codes = await detector.detect(video);
        if(codes.length){
          const val = codes[0].rawValue;
          const p = DB.products.find(x=>x.barcode===val);
          closeCameraScan();
          if(p){
            document.getElementById('inputProduto').value = p.name;
            onProdutoDigitado();
            adicionarItemVenda();
            showToast('Produto lido: '+p.name);
          }
          else showToast('Nenhum produto cadastrado com esse código: '+val);
          return;
        }
      }catch(err){}
      if(camStream) requestAnimationFrame(scanLoop);
    };
    scanLoop();
  }catch(err){
    showToast('Não foi possível acessar a câmera. Verifique as permissões do navegador.');
    closeCameraScan();
  }
}
function closeCameraScan(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  closeModal();
}

    const device = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2'] });

    await saveKey(KEYS.settings, DB.settings);
    showToast('Impressora "'+DB.settings.printer.name+'" pareada. Ela será usada ao finalizar vendas.');

function onMovBuscaChange(){
  const val = document.getElementById('movBusca').value.trim();

  if(!val) return;
  const byBarcode = DB.products.find(p=>p.barcode===val);
  const byName = DB.products.find(p=>p.name===val);
  const target = byBarcode || byName;
  if(target){ sel.value = target.id; return; }
  const confirmou = confirm('Item não cadastrado: "'+val+'".\n\nDeseja cadastrar esse produto agora?');
  if(confirmou){
    const ehCodigoBarras = /^[0-9]{4,}$/.test(val);
    aguardandoNovoProdutoEntrada = true;
    openProductModal(null, ehCodigoBarras ? val : '', ehCodigoBarras ? '' : val);

    document.getElementById('movBusca').value='';

async function registrarMovimento(type){
  const productId = document.getElementById('movProduto').value;
  const qty = parseFloat(document.getElementById('movQtd').value);
  const reason = document.getElementById('movMotivo').value;
  const obs = document.getElementById('movObs').value.trim();
  const p = DB.products.find(x=>x.id===productId);
  if(!p){ showToast('Produto não encontrado. Atualize a página e tente novamente.'); return; }
  if(!qty || qty<=0){ showToast('Informe uma quantidade válida.'); return; }
  if(type==='saida' && p.stock < qty){ showToast('Estoque insuficiente para essa saída.'); return; }
  p.stock += (type==='entrada'? qty : -qty);
  let nfNumero = null, nfData = null, nfSeq = null;
  if(type==='entrada'){
    nfNumero = document.getElementById('movNfNumero').value.trim() || null;
    nfData = document.getElementById('movNfData').value || null;
    lastMovNfNumero = nfNumero || '';
    lastMovNfData = nfData || '';
    if(nfNumero){
      nfSeq = DB.movements.filter(m=>m.type==='entrada' && m.nfNumero===nfNumero).length + 1;
    }
  }
  DB.movements.push({id:uid(), productId:p.id, productName:p.name, type, qty, reason:obs?reason+' — '+obs:reason, operator:operatorName, date:nowISO(), nfNumero, nfData, nfSeq});
  await Promise.all([saveKey(KEYS.products, DB.products), saveKey(KEYS.movements, DB.movements)]);
  showToast(type==='entrada'?'Entrada registrada.':'Saída registrada.');
  renderContent();
}

      <div class="desc">Informe o valor inicial em dinheiro (fundo de troco) para liberar as vendas na Frente de Caixa.</div>
      <div class="field"><label>Valor inicial em dinheiro</label><input type="number" step="0.01" id="valorAbertura" placeholder="0,00"></div>
      <button class="btn btn-primary" onclick="abrirCaixa()">Abrir Caixa</button>
    </div>`;
  }
  const vendasSessao = DB.sales.filter(s=>s.sessionId===session.id);
  const somaFormas = somarPorFormaPagamento(vendasSessao);
  const totalDinheiro = somaFormas.dinheiro;
  const totalCartaoCredito = somaFormas.cartaoCredito;
  const totalCartaoDebito = somaFormas.cartaoDebito;
  const totalCartao = somaFormas.cartao;
  const totalCartaoSemSeparar = Math.max(0, totalCartao - totalCartaoCredito - totalCartaoDebito);
  const totalPix = somaFormas.pix;
  const totalFiado = vendasSessao.filter(s=>s.payMethod==='fiado').reduce((a,s)=>a+s.total,0);
  const totalGeral = totalDinheiro+totalCartao+totalPix+totalFiado;
  const lancSessao = DB.lancamentos.filter(l=>new Date(l.date) >= new Date(session.openedAt));
  const saidasFin = lancSessao.filter(l=>l.type==='saida' && (l.paymentMethod||'dinheiro')==='dinheiro').reduce((a,l)=>a+l.value,0);
  const entradasFin = lancSessao.filter(l=>l.type==='entrada' && (l.paymentMethod||'dinheiro')==='dinheiro').reduce((a,l)=>a+l.value,0);
  const recebimentosFiadoSessao = lancSessao.filter(l=>l.category==='Recebimento fiado').reduce((a,l)=>a+l.value,0);
  const esperadoDinheiro = session.valorAbertura + totalDinheiro + entradasFin - saidasFin;
  return `
  <div class="stat-row">
    <div class="stat"><div class="lbl">Aberto em</div><div class="val" style="font-size:15px;">${fmtDate(session.openedAt)}</div></div>
    <div class="stat"><div class="lbl">Fundo inicial</div><div class="val">${brl(session.valorAbertura)}</div></div>
    <div class="stat accent"><div class="lbl">Vendas na sessão</div><div class="val">${brl(totalGeral)}</div></div>
    <div class="stat"><div class="lbl">Nº de vendas</div><div class="val">${vendasSessao.length}</div></div>
  </div>
  <div class="card">
    <h2>Resumo por forma de pagamento</h2>
    <table><thead><tr><th>Forma</th><th class="right">Total</th></tr></thead>
      <tbody>
        <tr><td>Dinheiro</td><td class="right">${brl(totalDinheiro)}</td></tr>
        <tr><td>Cartão Crédito</td><td class="right">${brl(totalCartaoCredito)}</td></tr>
        <tr><td>Cartão Débito</td><td class="right">${brl(totalCartaoDebito)}</td></tr>
        ${totalCartaoSemSeparar>0.001?`<tr><td>Cartão (sem separar)</td><td class="right">${brl(totalCartaoSemSeparar)}</td></tr>`:''}
        <tr><td>Pix</td><td class="right">${brl(totalPix)}</td></tr>
        <tr><td>Fiado (a receber)</td><td class="right">${brl(totalFiado)}</td></tr>
      </tbody>
    </table>
    ${totalCartaoSemSeparar>0.001?`<div class="small-note">ℹ️ "Cartão (sem separar)" são vendas registradas como Cartão antes da separação em Crédito/Débito.</div>`:''}
    ${recebimentosFiadoSessao>0?`<div class="small-note">💰 Recebimentos de fiado nesta sessão: <strong>${brl(recebimentosFiadoSessao)}</strong> (já somados no resumo financeiro e nos relatórios)</div>`:''}
    ${somaFormas.mistoCount>0?`<div class="small-note">🔀 ${somaFormas.mistoCount} venda(s) com pagamento misto nesta sessão — valores já divididos acima entre dinheiro, cartão (crédito/débito) e pix.</div>`:''}
    <div class="small-note">Lançamentos em dinheiro na sessão: entradas ${brl(entradasFin)} · saídas ${brl(saidasFin)}</div>
    <div class="small-note">Valor esperado em dinheiro no caixa: <strong>${brl(esperadoDinheiro)}</strong> (fundo inicial + vendas em dinheiro + lançamentos em dinheiro)</div>
  </div>
  <div class="card">
    <h2>Fechar Caixa</h2>
    <div class="desc">Conte o dinheiro físico no caixa e informe o valor abaixo para conferência.</div>
    <div class="field"><label>Valor contado em dinheiro</label><input type="number" step="0.01" id="valorFechamento" placeholder="0,00"></div>
    <button class="btn btn-danger" onclick="fecharCaixa(${esperadoDinheiro})">Fechar Caixa</button>
  </div>`;
}
async function abrirCaixa(){
  const valor = parseFloat(document.getElementById('valorAbertura').value)||0;
  DB.caixaSessions.push({id:uid(), valorAbertura:valor, openedBy:operatorName, openedAt:nowISO(), closedAt:null});
  await saveKey(KEYS.caixaSessions, DB.caixaSessions);
  showToast('Caixa aberto com '+brl(valor)+'.');
  renderContent();
}
async function fecharCaixa(esperado){
  const contado = parseFloat(document.getElementById('valorFechamento').value);
  if(isNaN(contado)){ showToast('Informe o valor contado.'); return; }
  const session = getOpenSession();
  const diferenca = contado - esperado;
  session.closedAt = nowISO(); session.closedBy = operatorName;
  session.valorEsperado = esperado; session.valorContado = contado; session.diferenca = diferenca;
  await saveKey(KEYS.caixaSessions, DB.caixaSessions);
  showToast(diferenca===0 ? '✅ Caixa fechado, sem diferenças.' : `Caixa fechado. Diferença: ${brl(diferenca)}`);
  renderContent();
  abrirLembreteBackupFimDia();
}

async function salvarEdicaoFormaPagamento(id){
  const s = DB.sales.find(x=>x.id===id);
  if(!s){ showToast('Venda não encontrada.'); return; }
  const novaForma = document.getElementById('editPayMethod').value;
  const formaIgual = novaForma===s.payMethod && novaForma!=='fiado';
  if(formaIgual){ showToast('A forma de pagamento já é essa.'); closeModal(); return; }
  let novoClienteId = null, novoClienteNome = null;
  if(novaForma==='fiado'){
    const sel = document.getElementById('editPayCliente');
    if(!sel || !sel.value){ showToast('Selecione o cliente para fiado.'); return; }
    novoClienteId = sel.value;
    const cli = DB.clients.find(x=>x.id===novoClienteId);
    novoClienteNome = cli ? cli.name : null;
  }
  const saveOps = [];
  let clientesMudaram = false;
  // Se a venda ERA fiado, devolve (abate) o saldo do cliente antigo
  if(s.payMethod==='fiado' && s.clientId){
    const cliAntigo = DB.clients.find(x=>x.id===s.clientId);
    if(cliAntigo){ cliAntigo.saldoDevedor = Math.max(0, (cliAntigo.saldoDevedor||0) - s.total); clientesMudaram = true; }
  }
  // Se a NOVA forma é fiado, lança o valor no cliente novo
  if(novaForma==='fiado'){
    const cliNovo = DB.clients.find(x=>x.id===novoClienteId);
    if(cliNovo){ cliNovo.saldoDevedor = (cliNovo.saldoDevedor||0) + s.total; clientesMudaram = true; }
  }
  if(clientesMudaram) saveOps.push(saveKey(KEYS.clients, DB.clients));
  s.payMethod = novaForma;
  s.clientId = novaForma==='fiado' ? novoClienteId : null;
  s.clientName = novaForma==='fiado' ? novoClienteNome : null;
  s.mistoBreakdown = null;
  if(novaForma!=='dinheiro'){ s.valorRecebido = null; s.troco = null; }
  saveOps.push(saveKey(KEYS.sales, DB.sales));
  await Promise.all(saveOps);
  closeModal();
  showToast('✅ Forma de pagamento alterada para '+labelFormaPagamento(novaForma)+'.');
  renderContent();
}

function onEdicaoItemMudaQtd(idx, val){
  const q = parseFloat(val);
  if(!q || q<=0){ showToast('Quantidade inválida.'); renderEdicaoItensVendaModal(); return; }
  edicaoVendaItens[idx].qty = q;
  renderEdicaoItensVendaModal();
}
function onEdicaoItemMudaPreco(idx, val){
  const p = parseFloat(val);
  if(!p || p<=0){ showToast('Preço inválido.'); renderEdicaoItensVendaModal(); return; }
  edicaoVendaItens[idx].price = p;
  renderEdicaoItensVendaModal();
}
function removerItemEdicaoVenda(idx){
  edicaoVendaItens.splice(idx,1);
  renderEdicaoItensVendaModal();
}
function adicionarItemEdicaoVenda(){
  const productId = document.getElementById('edicaoNovoProduto').value;
  const qty = parseFloat(document.getElementById('edicaoNovaQtd').value);
  const p = DB.products.find(x=>x.id===productId);
  if(!p){ showToast('Produto não encontrado.'); return; }
  if(!qty || qty<=0){ showToast('Informe uma quantidade válida.'); return; }
  const existente = edicaoVendaItens.find(i=>i.productId===productId && i.price===p.price);
  if(existente) existente.qty += qty;
  else edicaoVendaItens.push({productId:p.id, name:p.name, price:p.price, cost:p.cost||0, qty, saleType:p.saleType||'unidade'});
  renderEdicaoItensVendaModal();
}
async function salvarEdicaoItensVenda(){
  const s = DB.sales.find(x=>x.id===edicaoVendaId);
  if(!s){ showToast('Venda não encontrada.'); return; }
  if(edicaoVendaItens.length===0){ showToast('A venda precisa ter pelo menos um item. Para apagar a venda inteira, use "Excluir".'); return; }
  for(const i of edicaoVendaItens){
    if(!i.qty || i.qty<=0 || !i.price || i.price<=0){ showToast('Há um item com quantidade ou preço inválido.'); return; }
  }
  const totalAntigoPreCheck = s.total;
  const novoTotalPreCheck = edicaoVendaItens.reduce((a,i)=>a+i.price*i.qty,0);
  if(s.payMethod==='fiado' && s.clientId){
    const clientePreCheck = DB.clients.find(x=>x.id===s.clientId);
    if(clientePreCheck && clientePreCheck.limiteCredito>0){
      const saldoSemEstaVenda = Math.max(0, (clientePreCheck.saldoDevedor||0) - totalAntigoPreCheck);
      if((saldoSemEstaVenda + novoTotalPreCheck) > clientePreCheck.limiteCredito){
        showToast('❌ Esse novo total ('+brl(novoTotalPreCheck)+') deixaria '+clientePreCheck.name+' acima do limite de crédito ('+brl(clientePreCheck.limiteCredito)+'). Reduza os itens, ou aumente o limite do cliente em Cadastros → Clientes.', 8000);
        return;
      }
    }
  }
  // 1) Devolve ao estoque os itens da venda ORIGINAL (estorno)
  const porProdutoAntigo = {};
  s.items.forEach(i=>{ porProdutoAntigo[i.productId] = (porProdutoAntigo[i.productId]||0) + i.qty; });
  const movimentosEstorno = [];
  Object.keys(porProdutoAntigo).forEach(productId=>{
    const p = DB.products.find(x=>x.id===productId);
    if(p){
      p.stock += porProdutoAntigo[productId];
      const mov = {id:uid(), productId:p.id, productName:p.name, type:'entrada', qty:porProdutoAntigo[productId], reason:'Estorno — edição de venda', operator:operatorName, date:nowISO()};
      DB.movements.push(mov);
      movimentosEstorno.push(mov);
    }
  });
  // 2) Confere se há estoque suficiente para os itens NOVOS (depois do estorno acima)
  const porProdutoNovo = {};
  edicaoVendaItens.forEach(i=>{ porProdutoNovo[i.productId] = (porProdutoNovo[i.productId]||0) + i.qty; });
  for(const productId in porProdutoNovo){
    const p = DB.products.find(x=>x.id===productId);
    if(!p || p.stock < porProdutoNovo[productId]){
      showToast('Estoque insuficiente para '+(p?p.name:'produto')+' — a edição foi cancelada e o estoque original não foi alterado.');
      // desfaz o estorno acima pra não deixar o estoque inconsistente
      Object.keys(porProdutoAntigo).forEach(productId2=>{
        const p2 = DB.products.find(x=>x.id===productId2);
        if(p2) p2.stock -= porProdutoAntigo[productId2];
      });
      DB.movements = DB.movements.filter(m=>movimentosEstorno.indexOf(m)===-1);
      return;
    }
  }
  // 3) Retira do estoque os itens NOVOS
  Object.keys(porProdutoNovo).forEach(productId=>{
    const p = DB.products.find(x=>x.id===productId);
    p.stock -= porProdutoNovo[productId];
    DB.movements.push({id:uid(), productId:p.id, productName:p.name, type:'saida', qty:porProdutoNovo[productId], reason:'Venda (PDV) — editada', operator:operatorName, date:nowISO()});
  });
  // 4) Recalcula o total e ajusta fiado / detalhes de pagamento que dependiam do valor antigo
  const totalAntigo = s.total;
  const novoTotal = edicaoVendaItens.reduce((a,i)=>a+i.price*i.qty,0);
  const saveOps = [saveKey(KEYS.products, DB.products), saveKey(KEYS.movements, DB.movements)];
  if(s.payMethod==='fiado' && s.clientId){
    const cliente = DB.clients.find(x=>x.id===s.clientId);
    if(cliente){
      cliente.saldoDevedor = Math.max(0, (cliente.saldoDevedor||0) - totalAntigo) + novoTotal;
      saveOps.push(saveKey(KEYS.clients, DB.clients));
    }
  }
  if(s.payMethod==='misto'){ s.mistoBreakdown = null; }
  if(s.payMethod==='dinheiro'){ s.valorRecebido = null; s.troco = null; }
  s.items = edicaoVendaItens.map(i=>({...i}));
  s.total = novoTotal;
  saveOps.push(saveKey(KEYS.sales, DB.sales));
  await Promise.all(saveOps);
  closeModal();
  showToast('✅ Itens da venda atualizados — de '+brl(totalAntigo)+' para '+brl(novoTotal)+'. Estoque e relatórios já refletem a mudança.', 6000);
  renderContent();
}
async function reimprimirVenda(id){
  const s = DB.sales.find(x=>x.id===id);
  if(!s) return;
  abrirPreviewCupom(s);
}
async function excluirVenda(id){
  const s = DB.sales.find(x=>x.id===id);
  if(!s){ showToast('Venda não encontrada.'); return; }
  const itensTxt = s.items.map(i=>i.name+' x'+i.qty).join(', ');
  let avisoFiado = '';
  if(s.payMethod==='fiado' && s.clientId){
    avisoFiado = '\n\nEssa venda era FIADO — o saldo devedor de '+(s.clientName||'cliente')+' também vai ser reduzido em '+brl(s.total)+'.';
  }
  const confirmMsg = 'Excluir esta venda de '+brl(s.total)+' ('+itensTxt+')?\n\n'
    + 'Isso vai apagar a venda do histórico e do financeiro, e devolver os itens ao estoque.'+avisoFiado+' Essa ação não pode ser desfeita. Deseja continuar?';
  if(!confirm(confirmMsg)) return;
  const saveOps = [];
  s.items.forEach(item=>{
    const p = DB.products.find(x=>x.id===item.productId);
    if(p){
      p.stock += item.qty;
      DB.movements.push({id:uid(), productId:p.id, productName:p.name, type:'entrada', qty:item.qty, reason:'Estorno — venda excluída', operator:operatorName, date:nowISO()});
    }
  });
  saveOps.push(saveKey(KEYS.products, DB.products), saveKey(KEYS.movements, DB.movements));
  if(s.payMethod==='fiado' && s.clientId){
    const c = DB.clients.find(x=>x.id===s.clientId);
    if(c){
      c.saldoDevedor = Math.max(0, (c.saldoDevedor||0) - s.total);
      saveOps.push(saveKey(KEYS.clients, DB.clients));
    }
  }
  DB.sales = DB.sales.filter(x=>x.id!==id);
  saveOps.push(saveKey(KEYS.sales, DB.sales));
  await Promise.all(saveOps);
  showToast('Venda excluída, itens devolvidos ao estoque'+(s.payMethod==='fiado'&&s.clientId?' e saldo devedor atualizado.':'.'));
  renderContent();
}

function periodoRange(){
  if(relPeriodo==='dia'){ const d=todayISODate(); return {ini:d, fim:d}; }
  if(relPeriodo==='mes'){
    const now = new Date(); const ini = toLocalDateStr(new Date(now.getFullYear(), now.getMonth(), 1));
    const fim = toLocalDateStr(new Date(now.getFullYear(), now.getMonth()+1, 0));
    return {ini, fim};
  }
  return {ini:relDataIni, fim:relDataFim};
}
function inRange(dateISO, ini, fim){
  const d = toLocalDateStr(dateISO);
  return d>=ini && d<=fim;
}

function onFiltroOperadorRelatorio(v){ relOperadorSelecionado=v; renderContent(); }
function itensAgrupadosPorProduto(vendas){
  const porProduto = {};
  vendas.forEach(s=>s.items.forEach(i=>{
    const key = i.productId || i.name;
    if(!porProduto[key]) porProduto[key] = {codigo:'', descricao:i.name, unid: i.saleType==='peso'?'KG':'UN', qtde:0, total:0};
    porProduto[key].qtde += i.qty;
    porProduto[key].total += i.price*i.qty;
    if(!porProduto[key].codigo){
      const p = DB.products.find(x=>x.id===i.productId);
      porProduto[key].codigo = p ? (p.barcode||'—') : '—';
    }
  }));
  return Object.values(porProduto).sort((a,b)=>a.descricao.localeCompare(b.descricao));
}

/* ================================================================
   EXPORTAÇÃO DE RELATÓRIOS EM PDF
   (HTML simples e independente do tema, com cores fixas e fonte do
   sistema — o html2canvas não renderiza bem variáveis CSS, gradientes
   e fontes externas do tema, o que fazia o PDF sair em branco)
   ================================================================ */
function nomeArquivoRelatorio(prefixo){
  return `${prefixo}-${todayISODate()}.pdf`;
}
function mostrarStatusPDF(msg){
  const el = document.getElementById('pdfStatusMsg');
  if(el) el.textContent = msg;
}
function pdfNovoDoc(){
  const { jsPDF } = window.jspdf;
  return new jsPDF({unit:'mm', format:'a4'});
}
function formatoImagemPDF(dataUrl){
  const m = /^data:image\/(\w+);base64,/.exec(dataUrl||'');
  const ext = m ? m[1].toLowerCase() : 'jpeg';
  if(ext==='jpg' || ext==='jpeg') return 'JPEG';
  if(ext==='png') return 'PNG';
  if(ext==='webp') return 'WEBP';
  return 'JPEG';
}
function pdfCabecalho(doc, titulo){
  const s = DB.settings;
  let xTexto = 14;
  let yLinhaBase = 21;
  if(s.logoBase64){
    try{
      const alturaLogo = 16;
      let largura = s.logoWidth && s.logoHeight ? (alturaLogo * s.logoWidth / s.logoHeight) : alturaLogo;
      largura = Math.max(8, Math.min(40, largura)); // evita logo excessivamente larga ou estreita distorcer o layout
      doc.addImage(s.logoBase64, formatoImagemPDF(s.logoBase64), 14, 8, largura, alturaLogo);
      xTexto = 14 + largura + 6;
    }catch(e){ /* se a imagem falhar, segue sem logo no PDF */ }
  }
  doc.setFontSize(13);
  doc.setTextColor(13,59,46);
  doc.setFont(undefined,'bold');
  doc.text(s.storeName || 'FCosta', xTexto, 13);
  doc.setFont(undefined,'normal');
  doc.setFontSize(9);
  doc.setTextColor(90,90,90);
  const linhaLoja = [s.cnpj?('CNPJ: '+s.cnpj):'', s.endereco||'', s.telefone?('Tel: '+s.telefone):''].filter(Boolean).join('  ·  ');
  if(linhaLoja) doc.text(linhaLoja, xTexto, 18);
  doc.setFontSize(14);
  doc.setTextColor(13,59,46);
  doc.text(titulo, xTexto, linhaLoja?25:22);
  yLinhaBase = (linhaLoja?28:25);
  doc.setDrawColor(13,59,46);
  doc.setLineWidth(0.5);
  doc.line(14, yLinhaBase, 196, yLinhaBase);
  doc.setTextColor(20,20,20);
  return yLinhaBase + 9;
}
function pdfSubtituloDoc(doc, y, txt){
  doc.setFontSize(12);
  doc.setTextColor(13,59,46);
  doc.text(txt, 14, y);
  doc.setTextColor(20,20,20);
  return y + 6;
}
function pdfTabelaIndicadores(doc, y, linhas){
  doc.autoTable({
    startY: y,
    head: [['Indicador','Valor']],
    body: linhas,
    theme:'grid',
    styles:{fontSize:10, cellPadding:3},
    headStyles:{fillColor:[13,59,46], textColor:255},
    margin:{left:14, right:14}
  });
  return doc.lastAutoTable.finalY + 10;
}
function pdfSemDados(doc, y, msg){
  doc.setFontSize(10); doc.setTextColor(120,120,120);
  doc.text(msg, 14, y);
  doc.setTextColor(20,20,20);
  return y + 8;
}
function gerarPDFFinanceiro(doc, yInicial){
  const {ini, fim} = periodoRange();
  const vendas = DB.sales.filter(s=>inRange(s.date, ini, fim));
  const lanc = DB.lancamentos.filter(l=>inRange(l.date, ini, fim));
  const totalVendas = vendas.reduce((a,s)=>a+s.total,0);
  const somaFormas = somarPorFormaPagamento(vendas);
  const totalFiado = vendas.filter(s=>s.payMethod==='fiado').reduce((a,s)=>a+s.total,0);
  const cogs = vendas.reduce((a,s)=>a + s.items.reduce((b,i)=>b+(i.cost||0)*i.qty,0), 0);
  const lucroBruto = totalVendas - cogs;
  const entradasFinSemFiado = lanc.filter(l=>l.type==='entrada' && l.category!=='Recebimento fiado').reduce((a,l)=>a+l.value,0);
  const saidasFin = lanc.filter(l=>l.type==='saida').reduce((a,l)=>a+l.value,0);
  const lucroLiquido = lucroBruto + entradasFinSemFiado - saidasFin;
  const porProduto = {};
  vendas.forEach(s=>s.items.forEach(i=>{
    porProduto[i.name] = porProduto[i.name] || {qty:0, total:0};
    porProduto[i.name].qty += i.qty; porProduto[i.name].total += i.price*i.qty;
  }));
  const top = Object.entries(porProduto).sort((a,b)=>b[1].qty-a[1].qty).slice(0,10);

  let y = pdfCabecalho(doc, 'Relatório Financeiro — período: '+ini+' a '+fim);
  y = pdfTabelaIndicadores(doc, y, [
    ['Total de vendas', brl(totalVendas)],
    ['Custo das mercadorias vendidas', brl(cogs)],
    ['Lucro bruto', brl(lucroBruto)],
    ['Lucro líquido (com lançamentos)', brl(lucroLiquido)]
  ]);
  y = pdfSubtituloDoc(doc, y, 'Vendas por forma de pagamento ('+vendas.length+' venda(s) no período)');
  const cartaoSemSepararPdf = Math.max(0, somaFormas.cartao - somaFormas.cartaoCredito - somaFormas.cartaoDebito);
  doc.autoTable({
    startY: y,
    head: [['Forma','Valor']],
    body: [
      ['Dinheiro', brl(somaFormas.dinheiro)],
      ['Cartão Crédito', brl(somaFormas.cartaoCredito)],
      ['Cartão Débito', brl(somaFormas.cartaoDebito)],
      ...(cartaoSemSepararPdf>0.001 ? [['Cartão (sem separar)', brl(cartaoSemSepararPdf)]] : []),
      ['Pix', brl(somaFormas.pix)],
      ['Fiado', brl(totalFiado)]
    ],
    theme:'grid', styles:{fontSize:10, cellPadding:3},
    headStyles:{fillColor:[24,122,82], textColor:255},
    margin:{left:14,right:14}
  });
  y = doc.lastAutoTable.finalY + 10;
  y = pdfSubtituloDoc(doc, y, 'Produtos mais vendidos');
  if(top.length){
    doc.autoTable({
      startY:y,
      head:[['Produto','Qtd.','Total']],
      body: top.map(([name,d])=>[name, String(d.qty), brl(d.total)]),
      theme:'grid', styles:{fontSize:9, cellPadding:2.5},
      headStyles:{fillColor:[24,122,82], textColor:255},
      margin:{left:14,right:14}
    });
    y = doc.lastAutoTable.finalY + 6;
  } else {
    y = pdfSemDados(doc, y, 'Sem vendas no período.');
  }
  return y;
}
function gerarPDFOperador(doc, yInicial){
  const {ini, fim} = periodoRange();
  const vendasPeriodo = DB.sales.filter(s=>inRange(s.date, ini, fim));
  const vendas = relOperadorSelecionado==='todos' ? vendasPeriodo : vendasPeriodo.filter(s=>s.operator===relOperadorSelecionado);
  const linhas = itensAgrupadosPorProduto(vendas);
  const totalBruto = linhas.reduce((a,l)=>a+l.total,0);
  const subtitulo = relOperadorSelecionado==='todos' ? 'Todos os operadores' : relOperadorSelecionado;
  let y = pdfCabecalho(doc, 'Vendas por Operador — período: '+ini+' a '+fim);
  y = pdfSubtituloDoc(doc, y, 'Operador: '+subtitulo+' ('+vendas.length+' venda(s))');
  if(linhas.length===0){
    y = pdfSemDados(doc, y, 'Nenhuma venda encontrada para esse período/operador.');
  }else{
    doc.autoTable({
      startY: y,
      head: [['Código','Descrição do produto','Unid','Qtde','Vr. Unit.','Desconto','Vr. Total']],
      body: linhas.map(l=>[l.codigo, l.descricao, l.unid, l.unid==='KG'?Number(l.qtde).toFixed(3):String(l.qtde), brl(l.total/l.qtde), brl(0), brl(l.total)]),
      theme:'grid', styles:{fontSize:9, cellPadding:2.5},
      headStyles:{fillColor:[24,122,82], textColor:255},
      margin:{left:14,right:14}
    });
    y = doc.lastAutoTable.finalY + 8;
    y = pdfTabelaIndicadores(doc, y, [['Total Bruto', brl(totalBruto)]]);
  }
  return y;
}

function gerarPDFMercadorias(doc, yInicial){

      ]),

function baixarRelatorioAtualPDF(){
  if(!window.jspdf){ showToast('❌ Biblioteca de PDF não carregou (sem internet?). Tente novamente.'); return; }
  const nomes = {financeiro:'relatorio-financeiro', operador:'relatorio-vendas-por-operador', fornecedores:'relatorio-fornecedores', mercadorias:'relatorio-mercadorias'};
  const geradores = {financeiro:gerarPDFFinanceiro, operador:gerarPDFOperador, fornecedores:gerarPDFFornecedores, mercadorias:gerarPDFMercadorias};
  const arquivo = nomeArquivoRelatorio(nomes[relSubTab] || 'relatorio');
  mostrarStatusPDF('⏳ Gerando PDF...');
  try{
    const doc = pdfNovoDoc();
    (geradores[relSubTab]||gerarPDFFinanceiro)(doc, 20);
    doc.save(arquivo);
    mostrarStatusPDF('');
    showToast('✅ PDF baixado: '+arquivo);
  }catch(err){
    console.error(err);
    mostrarStatusPDF('');
    showToast('❌ Erro ao gerar PDF: '+(err&&err.message?err.message:err));
  }
}
function baixarTodosRelatoriosPDF(){
  if(!window.jspdf){ showToast('❌ Biblioteca de PDF não carregou (sem internet?). Tente novamente.'); return; }
  mostrarStatusPDF('⏳ Gerando PDF com todos os relatórios...');
  try{
    const doc = pdfNovoDoc();
    gerarPDFFinanceiro(doc, 20);
    doc.addPage();
    gerarPDFOperador(doc, 20);
    doc.addPage();
    gerarPDFFornecedores(doc, 20);
    doc.addPage();
    gerarPDFMercadorias(doc, 20);
    const arquivo = nomeArquivoRelatorio('relatorios-completos');
    doc.save(arquivo);
    mostrarStatusPDF('');
    showToast('✅ PDF completo baixado: '+arquivo);
  }catch(err){
    console.error(err);
    mostrarStatusPDF('');
    showToast('❌ Erro ao gerar PDF: '+(err&&err.message?err.message:err));
  }
}

async function lerBarcodeCadastro(){
  if(!('BarcodeDetector' in window)){ showToast('Câmera de leitura não suportada neste navegador. Use o leitor USB ou digite manualmente.'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video = document.createElement('video'); video.srcObject=stream; video.play();
    const detector = new BarcodeDetector();
    const tryDetect = async ()=>{
      try{
        const codes = await detector.detect(video);
        if(codes.length){ document.getElementById('mBarcode').value = codes[0].rawValue; stream.getTracks().forEach(t=>t.stop()); showToast('Código lido!'); return; }
      }catch(e){}
      stream.getVideoTracks()[0].readyState==='live' && requestAnimationFrame(tryDetect);
    };
    tryDetect();
    setTimeout(()=>{ if(stream.getVideoTracks()[0].readyState==='live') stream.getTracks().forEach(t=>t.stop()); }, 8000);
  }catch(e){ showToast('Não foi possível acessar a câmera.'); }
}
function onProdutoFotoSelected(input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 2*1024*1024){ showToast('Imagem muito grande. Use um arquivo de até 2MB.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    document.getElementById('mFotoBase64').value = e.target.result;
    document.getElementById('prodFotoPreview').innerHTML = `<img src="${e.target.result}">`;
  };
  reader.readAsDataURL(file);
  input.value='';
}
