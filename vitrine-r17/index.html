<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espaço Barber Shop R-17 | Itaim Paulista</title>
<meta name="description" content="Barbearia no Jardim Kemel, Itaim Paulista. Corte, barba e estilo. Marque seu horário pelo WhatsApp.">
<meta property="og:title" content="Espaço Barber Shop R-17">
<meta property="og:description" content="Corte, barba e estilo no Itaim Paulista. Marque pelo WhatsApp.">
<meta property="og:image" content="logo.png">
<meta name="theme-color" content="#111111">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<!--
  ============================================================
  SITE VITRINE - FCOSTA Sistemas & Apps
  Para usar em outro cliente: troque só os dados do bloco
  "DADOS DO CLIENTE" lá embaixo (dentro do <script>) e o logo.png.
  Não precisa banco, nem painel. Um arquivo só.
  ============================================================
-->
<style>
:root{
  --fundo:#0e0e0e; --fundo2:#171717; --cartao:#1e1e1e;
  --texto:#f2ede4; --suave:#b9b2a6; --dourado:#e3c285; --vermelho:#c8323a;
  --zap:#25D366; --linha:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.05;margin:0}
.box{max-width:1100px;margin:0 auto;padding:0 16px}
.sec{padding:72px 0}
.sec.alt{background:var(--fundo2)}
.etq{display:block;color:var(--dourado);font-weight:800;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px}
.titulo{font-size:clamp(2rem,6vw,3rem);margin-bottom:24px}

/* topo */
.topo{position:sticky;top:0;z-index:20;background:rgba(14,14,14,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.topo .box{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none}
.marca img{width:44px;height:44px}
.marca b{font-family:Oswald,sans-serif;font-size:1.2rem;letter-spacing:.05em;text-transform:uppercase}
.menu{display:flex;gap:22px}
.menu a{text-decoration:none;font-size:.85rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.menu a:hover{color:var(--dourado)}
@media(max-width:760px){.menu{display:none}}

/* botão whatsapp */
.zap{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:var(--zap);color:#04210f;text-decoration:none;font-weight:800;font-size:1.1rem;text-transform:uppercase;letter-spacing:.03em;padding:18px 28px;border-radius:999px;border:0;cursor:pointer;box-shadow:0 12px 30px -10px rgba(37,211,102,.6)}
.zap:hover{filter:brightness(1.07)}
.zap svg{width:26px;height:26px;flex:none}

/* início */
.inicio{position:relative;min-height:88vh;display:flex;align-items:flex-end;background:#000 center/cover no-repeat}
.inicio::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.55) 50%,rgba(14,14,14,1) 100%)}
.inicio .box{position:relative;padding-bottom:64px;padding-top:120px}
.inicio img.logo{width:130px;height:130px;margin-bottom:20px}
.inicio h1{font-size:clamp(2.6rem,10vw,5.2rem)}
.inicio p{font-size:1.2rem;color:#e6e0d6;max-width:560px;margin:14px 0 28px}

/* sobre */
.sobre{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.sobre .foto{border-radius:16px;overflow:hidden;aspect-ratio:4/5;background:#222}
.sobre .foto img{width:100%;height:100%;object-fit:cover}
.sobre p{color:var(--suave);margin:0 0 14px}
.selos{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.selos span{border:1px solid var(--linha);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:600}
@media(max-width:760px){.sobre{grid-template-columns:1fr}}

/* serviços */
.servicos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.serv{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.serv h3{font-size:1.25rem;letter-spacing:.04em}
.serv small{display:block;color:var(--suave);font-size:.9rem;margin-top:4px}
.serv .preco{font-family:Oswald,sans-serif;font-size:1.5rem;color:var(--dourado);white-space:nowrap}
.aviso{color:var(--suave);font-size:.9rem;margin-top:18px}

/* galeria */
.galeria{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.galeria figure{margin:0;border-radius:12px;overflow:hidden;aspect-ratio:1;background:#222;position:relative}
.galeria img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.galeria figure:hover img{transform:scale(1.05)}
.galeria figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;font-size:.85rem;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.8))}
@media(max-width:760px){.galeria{grid-template-columns:repeat(2,1fr)}}

/* contato */
.contato{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.info{background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:24px}
.info h3{font-size:1.1rem;color:var(--dourado);margin:0 0 6px}
.info p{margin:0 0 18px;color:var(--texto)}
.horas{width:100%;border-collapse:collapse;margin-bottom:6px}
.horas td{padding:6px 0;border-bottom:1px solid var(--linha)}
.horas td:last-child{text-align:right;color:var(--suave)}
.mapa{border:0;width:100%;height:260px;border-radius:12px;margin-top:6px;filter:grayscale(.3)}
form{background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
label{font-weight:600;font-size:.95rem}
input,select,textarea{width:100%;margin-top:6px;background:#111;color:var(--texto);border:1px solid #3a3a3a;border-radius:10px;padding:14px;font:inherit;font-size:1rem}
textarea{min-height:90px;resize:vertical}
@media(max-width:760px){.contato{grid-template-columns:1fr}}

/* rodapé e botão fixo */
footer{border-top:1px solid var(--linha);padding:28px 0 110px;text-align:center;color:var(--suave);font-size:.85rem}
footer b{color:var(--texto)}
.fixo{position:fixed;right:16px;bottom:16px;z-index:30;width:62px;height:62px;padding:0;border-radius:50%}
.fixo svg{width:34px;height:34px}
</style>
</head>
<body>

<header class="topo">
  <div class="box">
    <a class="marca" href="#inicio"><img src="logo.png" alt=""><b id="t-nome"></b></a>
    <nav class="menu">
      <a href="#sobre">Sobre</a><a href="#servicos">Serviços</a><a href="#galeria">Galeria</a><a href="#contato">Contato</a>
    </nav>
  </div>
</header>

<section class="inicio" id="inicio">
  <div class="box">
    <img class="logo" src="logo.png" alt="Logo">
    <h1 id="i-nome"></h1>
    <p id="i-frase"></p>
    <a class="zap js-zap" href="#" target="_blank" rel="noopener"><span class="ico"></span>Marcar pelo WhatsApp</a>
  </div>
</section>

<section class="sec" id="sobre">
  <div class="box sobre">
    <div class="foto"><img id="s-foto" alt="Barbearia" loading="lazy"></div>
    <div>
      <span class="etq">Sobre nós</span>
      <h2 class="titulo" id="s-titulo"></h2>
      <div id="s-texto"></div>
      <div class="selos" id="s-selos"></div>
    </div>
  </div>
</section>

<section class="sec alt" id="servicos">
  <div class="box">
    <span class="etq">Serviços e preços</span>
    <h2 class="titulo">Tabela da casa</h2>
    <div class="servicos" id="lista-serv"></div>
    <p class="aviso">Preços podem mudar. Confirme pelo WhatsApp.</p>
  </div>
</section>

<section class="sec" id="galeria">
  <div class="box">
    <span class="etq">Nossos trabalhos</span>
    <h2 class="titulo">Galeria</h2>
    <div class="galeria" id="lista-fotos"></div>
  </div>
</section>

<section class="sec alt" id="contato">
  <div class="box">
    <span class="etq">Fale com a gente</span>
    <h2 class="titulo">Contato</h2>
    <div class="contato">
      <div class="info">
        <h3>Endereço</h3><p id="c-end"></p>
        <h3>WhatsApp</h3><p id="c-zap"></p>
        <h3>Horário</h3>
        <table class="horas" id="c-horas"></table>
        <iframe class="mapa" id="c-mapa" loading="lazy" title="Mapa"></iframe>
      </div>
      <form id="form">
        <label>Seu nome<input id="f-nome" required autocomplete="name"></label>
        <label>Serviço<select id="f-serv"></select></label>
        <label>Melhor dia e horário<input id="f-dia" placeholder="Ex.: sábado de manhã"></label>
        <label>Mensagem (opcional)<textarea id="f-msg"></textarea></label>
        <button class="zap" type="submit"><span class="ico"></span>Enviar pelo WhatsApp</button>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="box">
    <b id="r-nome"></b><br>
    <span id="r-end"></span><br><br>
    Site feito por FCOSTA Sistemas &amp; Apps
  </div>
</footer>

<a class="zap fixo js-zap" href="#" target="_blank" rel="noopener" aria-label="WhatsApp"><span class="ico"></span></a>

<script>
/* ============================================================
   DADOS DO CLIENTE  (troque aqui para outro cliente)
   ============================================================ */
const DADOS = {
  nome: "Espaço Barber Shop R-17",
  nomeCurto: "R-17",
  frase: "Corte, barba e estilo no Itaim Paulista. #MandandoAqueleCorte",
  whatsapp: "5511982544101",            // 55 + DDD + número, só números
  whatsappMostra: "(11) 98254-4101",
  endereco: "Rua Desembargador Flávio Torres, 230, Jardim Kemel, Itaim Paulista, São Paulo - SP",
  mensagemPadrao: "Olá! Vi o site e quero marcar um horário.",

  sobreTitulo: "Feito por quem ama o ofício",
  sobreTexto: [
    "No Espaço Barber Shop R-17 você é atendido pelo Rodrigo, o Rô, e pelo João.",
    "Ambiente tranquilo, atendimento com hora marcada e capricho em cada detalhe, do degradê à barba na toalha quente."
  ],
  selos: ["Hora marcada", "Degradê na régua", "Barba na navalha", "Corte infantil"],

  servicos: [
    ["Corte simples", "Máquina e tesoura", 35],
    ["Corte moderno", "Degradê, low fade, mid fade", 45],
    ["Corte infantil", "Até 12 anos", 30],
    ["Barba tradicional", "Navalha e toalha quente", 30],
    ["Aparar barba", "Máquina e alinhamento", 20],
    ["Corte + barba", "O combo completo", 70],
    ["Sobrancelha", "Design na navalha", 15]
  ],

  horario: [
    ["Segunda a sexta", "09:00 às 20:00"],
    ["Sábado", "08:00 às 18:00"],
    ["Domingo", "Fechado"]
  ],

  /* fotos: pode trocar por fotos do cliente, ex.: "img/foto1.jpg" */
  fotoCapa: "https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=1800&q=70",
  fotoSobre: "https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=1000&q=70",
  galeria: [
    ["https://images.unsplash.com/photo-1647140655214-e4a2d914971f?auto=format&fit=crop&w=800&q=70", "Corte na tesoura"],
    ["https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=800&q=70", "Ferramentas do ofício"],
    ["https://images.unsplash.com/photo-1517832606299-7ae9b720a186?auto=format&fit=crop&w=800&q=70", "Barba no capricho"],
    ["https://images.unsplash.com/photo-1675599193990-33d71150902b?auto=format&fit=crop&w=800&q=70", "Ambiente"],
    ["https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=800&q=70", "Cadeira da casa"],
    ["https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=800&q=70", "Corte + barba"]
  ]
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl = v => "R$ " + Number(v).toFixed(2).replace(".", ",");
const linkZap = txt => "https://wa.me/" + DADOS.whatsapp + "?text=" + encodeURIComponent(txt);
const ICONE = '<svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.4c-2.1 0-4.1-.6-5.9-1.6l-.4-.3-3.8 1.2 1.2-3.7-.3-.4c-1.2-1.8-1.8-3.8-1.8-5.9C5 9.9 9.9 5.2 16 5.2s11 4.8 11 10.6-4.9 10.6-11 10.6zm6-7.9c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.8.2-.2.3-.9 1.1-1.1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.7-1.6-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4 0-.6l-1-2.5c-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.4 1.4 3.6c.2.2 2.4 3.7 5.9 5.1 2.9 1.1 3.5.9 4.1.8.6-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.3-.7-.4z"/></svg>';

document.title = DADOS.nome;
$("t-nome").textContent = DADOS.nomeCurto;
$("i-nome").textContent = DADOS.nome;
$("i-frase").textContent = DADOS.frase;
document.querySelector(".inicio").style.backgroundImage = "url('" + DADOS.fotoCapa + "')";
$("s-foto").src = DADOS.fotoSobre;
$("s-titulo").textContent = DADOS.sobreTitulo;
$("s-texto").innerHTML = DADOS.sobreTexto.map(p => "<p>" + esc(p) + "</p>").join("");
$("s-selos").innerHTML = DADOS.selos.map(s => "<span>" + esc(s) + "</span>").join("");

$("lista-serv").innerHTML = DADOS.servicos.map(([n, d, p]) =>
  '<div class="serv"><div><h3>' + esc(n) + '</h3><small>' + esc(d) + '</small></div><span class="preco">' + brl(p) + '</span></div>').join("");

$("lista-fotos").innerHTML = DADOS.galeria.map(([src, leg]) =>
  '<figure><img src="' + esc(src) + '" alt="' + esc(leg) + '" loading="lazy"><figcaption>' + esc(leg) + '</figcaption></figure>').join("");

$("c-end").textContent = DADOS.endereco;
$("c-zap").textContent = DADOS.whatsappMostra;
$("c-horas").innerHTML = DADOS.horario.map(([d, h]) => "<tr><td>" + esc(d) + "</td><td>" + esc(h) + "</td></tr>").join("");
$("c-mapa").src = "https://maps.google.com/maps?q=" + encodeURIComponent(DADOS.endereco) + "&output=embed";
$("r-nome").textContent = DADOS.nome;
$("r-end").textContent = DADOS.endereco;

document.querySelectorAll(".ico").forEach(e => e.outerHTML = ICONE);
document.querySelectorAll(".js-zap").forEach(a => a.href = linkZap(DADOS.mensagemPadrao));

$("f-serv").innerHTML = '<option value="">Escolha (opcional)</option>' +
  DADOS.servicos.map(([n, , p]) => '<option>' + esc(n) + ' - ' + brl(p) + '</option>').join("");

$("form").addEventListener("submit", e => {
  e.preventDefault();
  let t = "Olá! Meu nome é " + $("f-nome").value.trim() + ".";
  if ($("f-serv").value) t += "\nServiço: " + $("f-serv").value;
  if ($("f-dia").value.trim()) t += "\nDia/horário: " + $("f-dia").value.trim();
  if ($("f-msg").value.trim()) t += "\n" + $("f-msg").value.trim();
  window.open(linkZap(t), "_blank");
});
</script>
</body>
</html>
