<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Construtoras FCOSTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Marca FCOSTA: preto e dourado. Tema claro único de propósito, para a tabela e a impressão ficarem legíveis. */
:root{--ink:#16130E;--mute:#5C5A55;--paper:#F1F1EF;--card:#fff;--line:#D9D7D1;--acc:#C99A2E;--acc-ink:#16130E;--acc-text:#7A5A0C;--acc-bg:#F4EAD0;--acc-line:#E4D3A5;--band:#16130E;--ok:#1F6B3A;--bad:#B3261E;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Trebuchet MS","Segoe UI",sans-serif;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button,.btn{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:600;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center}
button:hover,.btn:hover{border-color:var(--acc)}
.pri{background:var(--acc)!important;border-color:var(--acc)!important;color:var(--acc-ink)!important}
.pri:hover{filter:brightness(1.07)}
button.danger{background:#FDECEA;border-color:var(--bad);color:#8A1C14}
:focus-visible{outline:3px solid #8A6511;outline-offset:2px}
.top :focus-visible{outline-color:#E6BE5A}
input,select{font:inherit;color:var(--ink)}

/* topo */
.top{background:var(--band);color:#F1EEE6;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.ttl{min-width:0}
.creci{font-size:13px;font-weight:600;letter-spacing:.02em;color:#C9C4B8;margin-bottom:2px}
.top h1{font-size:clamp(20px,4vw,26px);font-weight:700}
.sp{flex:1}
.nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 max(10px,env(safe-area-inset-left,0px));overflow-x:auto}
.nav button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:12px 16px;color:var(--mute);min-height:50px;white-space:nowrap}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--acc)}
.nav .n{background:var(--acc-bg);border-radius:999px;font-size:12px;padding:1px 8px;color:var(--acc-text)}
main{max-width:1280px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 60px}
#status{margin:0 0 12px;color:var(--mute);min-height:1.2em}
#status.err{color:var(--bad);font-weight:600}
#overlay{position:fixed;inset:0;background:rgba(22,19,14,.78);color:#fff;display:none;align-items:center;justify-content:center;font:700 26px "Bricolage Grotesque",sans-serif;z-index:50;text-align:center;padding:24px}
body.drag #overlay{display:flex}

/* biblioteca */
.drop{border:2px dashed #BDB7A7;border-radius:12px;padding:54px 20px;text-align:center;background:#FAFAF8;display:flex;flex-direction:column;align-items:center;gap:12px}
.drop strong{font:700 22px "Bricolage Grotesque",sans-serif}
.drop p{color:var(--mute);max-width:52ch}
.keep{background:#fff;border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:16px 18px;display:flex;gap:14px 22px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.keep .tx{flex:1 1 320px;min-width:0}
.keep h3{font-size:17px;margin-bottom:4px}
.keep .ac{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chk2{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.chk2 input{width:20px;height:20px;accent-color:#8A6511}
.warnbox{background:#FFF6E0;border:1px solid #F0D58A;border-radius:8px;padding:10px 14px;margin-bottom:14px}
.lib-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
.lib-h h2{font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;gap:12px;align-items:center;min-width:0}
.card-t{min-width:0}
.card-t h3{font-size:18px;overflow-wrap:anywhere}
.card-t .small{overflow-wrap:anywhere}
.thumb{width:56px;height:56px;flex:none;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;overflow:hidden;background:#fff;font:700 22px "Bricolage Grotesque",sans-serif;color:var(--acc-text)}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.card-m{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:15px}
.badge{border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.badge.new{background:#E6F6EC;color:var(--ok)}
.badge.old{background:#FFF0CF;color:#7A4B00}
.card-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.card-a .pri{flex:1 1 140px}

/* painel + leitor */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0}
.brand{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:140px;height:60px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mute);font-size:12px;text-align:center;cursor:pointer;padding:4px}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.brand input.nm{font:700 24px "Bricolage Grotesque",sans-serif;border:1px solid transparent;border-radius:6px;padding:2px 8px;margin-left:-8px;background:transparent;min-width:180px;width:min(420px,100%)}
.brand input.nm:hover,.brand input.nm:focus{border-color:var(--line);background:#FAFAF8}
.brand .meta{color:var(--mute);font-size:14px;padding-left:2px;overflow-wrap:anywhere}
.tools{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools .vt{display:flex;gap:4px;flex-wrap:wrap}
.vt button.on,.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools input[type=search],.tools input[type=number],.tools select{padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;min-height:42px}
.tools input[type=search]{min-width:200px;flex:1 1 240px;max-width:460px}
.tools select{max-width:260px}
.tools input[type=number]{width:200px}
.body{padding:6px 18px 22px}
.pgl{margin:22px 0 4px;color:var(--mute);font-size:13px;font-weight:700}
section.sec{margin:16px 0 6px}
section.sec h3{margin:0 0 6px;font-size:17px;padding-left:10px;border-left:4px solid var(--acc)}
.note{margin:6px 0;color:var(--mute)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:7px 10px;border-bottom:1px solid #E8E6E0;text-align:left;vertical-align:top}
tr.hd th{background:var(--band);color:#fff;font-weight:600;font-size:12px;white-space:nowrap}
tbody tr:not(.hd):nth-child(even) td{background:#F8F8F6}
td.span{color:var(--mute);font-style:italic}
a.lk{color:var(--acc-text);font-weight:700;text-decoration:underline;text-underline-offset:2px}
a.lk:hover{background:var(--acc-bg)}
.pg{position:relative;margin:12px auto;max-width:1100px;border:1px solid var(--line);background:#fff}
.pg canvas{display:block;width:100%;height:auto}
.pg a.ov{position:absolute;background:rgba(201,154,46,.16);outline:1.5px solid rgba(138,101,17,.7);border-radius:2px}
.pg a.ov:hover{background:rgba(201,154,46,.38)}
.lt td.u{color:var(--mute);font-size:12px;word-break:break-all;max-width:420px}
.lt td.nolabel{color:var(--mute);font-style:italic}
.empty{padding:30px;text-align:center;color:var(--mute)}
.r{text-align:right;white-space:nowrap}
button.sm{padding:3px 10px;font-size:13px;min-height:32px;border-color:var(--acc-text);color:var(--acc-text);white-space:nowrap}
button.sm:hover{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.small{font-size:14px;color:var(--mute);line-height:1.55}

/* simulador */
.sim{padding:6px 18px 24px}
.sc{margin:18px 0}
.sc>h3{margin:0 0 10px;font-size:18px;padding-left:10px;border-left:4px solid var(--acc)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:760px){.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.fld{min-width:0}
.fld label{display:block;font-size:14px;color:var(--mute);font-weight:600;margin-bottom:4px}
.fld input[type=text],.fld input[type=number]{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#FAFAF8}
.fld label.chk{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink);padding:9px 0;font-size:15px}
.fld label.chk input{width:20px;height:20px;accent-color:#8A6511}
.seg{display:flex;gap:6px}.seg button{flex:1}
.faixa{margin-top:12px;background:var(--acc-bg);border:1px solid var(--acc-line);border-radius:8px;padding:9px 13px;font-weight:600}
.unitbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding:9px 13px;background:#F8F8F6;border:1px solid var(--line);border-radius:8px}
.unitbox .lbl{flex:1;min-width:200px}
.unitbox label{margin-right:10px;font-size:14px}
.pnl{border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.pnl.m{background:var(--acc-bg);border-color:var(--acc-line)}.pnl.s{background:#F6F6F4}
.pnl h4{margin:0 0 10px;font-size:16px}
.inst{background:var(--band);color:#fff;border-radius:8px;text-align:center;padding:10px;margin-bottom:10px}
.inst small{display:block;font-size:12px;opacity:.85}.inst strong{font-size:28px;color:#E6BE5A;font-family:"Bricolage Grotesque",sans-serif}
.ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(0,0,0,.12);font-size:15px}
.ln:last-child{border-bottom:none}.ln b.wr{color:var(--bad)}
.bad{background:#FDECEA;color:#8A1C14;border-radius:8px;padding:10px 12px;font-weight:600}
.warn{margin-top:10px;background:#FFF6E0;border:1px solid #F0D58A;border-radius:8px;padding:9px 13px;font-size:14px}
.eco{margin-top:12px;background:#E6F6EC;border:1px solid #BEE7CE;border-radius:10px;text-align:center;padding:10px}
.eco b{display:block;font-size:22px;color:var(--ok)}
.cap{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.cap h4{margin:0 0 6px;font-size:15px}
.cta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.opt tr.ok td:nth-child(5) b{color:var(--ok)}.opt tr.no td{color:#8B97A3}
.ru input{width:92px;padding:5px 7px;border:1.5px solid var(--line);border-radius:6px}
.ru input.w{width:112px}
details.rg{border:1px solid var(--line);border-radius:10px;padding:6px 14px;margin:10px 0;background:#fff}
details.rg summary{cursor:pointer;font-weight:700;color:var(--acc-text);padding:8px 0}
.foot{max-width:1280px;margin:0 auto;padding:0 16px 30px;color:var(--mute);font-size:13px;text-align:center}

/* construtoras, empreendimentos, e-books */
.etabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 10px;background:#FAFAF8}
.etabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--mute);white-space:nowrap;min-height:46px}
.etabs button:hover{color:var(--ink)}
.etabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--acc);background:#fff}
.etabs .n{background:var(--acc-bg);border-radius:999px;font-size:12px;padding:1px 8px;color:var(--acc-text);margin-left:4px}
.addbar{padding:10px 18px;border-bottom:1px solid var(--line);background:#fff}
.addf{display:flex;gap:8px;flex-wrap:wrap}
.addf input{flex:1 1 240px;max-width:420px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;min-height:42px;background:#fff}
.fh{display:flex;gap:12px 18px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin:16px 0 8px}
.fh h2{font-size:22px}
.fh input.nm{font:700 22px "Bricolage Grotesque",sans-serif;border:1px solid transparent;border-radius:6px;padding:2px 8px;margin-left:-8px;background:transparent;min-width:180px;width:min(420px,100%)}
.fh input.nm:hover,.fh input.nm:focus{border-color:var(--line);background:#FAFAF8}
.fh .acts{display:flex;gap:8px;flex-wrap:wrap}
.sh{font-size:17px;margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--acc)}
.mvl{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
.mvl select{flex:1;min-width:0;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.thumb.bk{font-size:15px;color:var(--ink);background:var(--acc-bg);border-color:var(--acc-line)}
.empty.s{padding:16px;border:1px dashed var(--line);border-radius:8px;background:#FAFAF8}
.sitebar{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);background:#fff}
.sitebar .url{flex:1 1 200px;min-width:0;color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.sitebar .addf{flex:1 1 320px}
.sitebar .addf input{max-width:560px}
@media print{.etabs,.addbar,.sitebar,.fh .acts{display:none!important}}
@media print{.top,.nav,#overlay,#status,.tools,.brand button,.foot,.keep{display:none!important}.panel{border:none}body{background:#fff}}
.shm{position:fixed;inset:0;background:rgba(22,19,14,.7);z-index:60;display:flex;justify-content:center;padding:16px;overflow:auto}
.shb{background:#fff;border-radius:12px;width:min(760px,100%);padding:18px;display:flex;flex-direction:column;gap:14px;margin:auto}
.shb h2{font-size:22px}
.shb .fld input[type=text]{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#FAFAF8}
.shb .fld select{width:100%;margin-top:8px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;min-height:42px}
.shg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-height:44vh;overflow:auto;padding:2px;margin-top:8px}
.sht{position:relative;display:block;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#fff}
.sht img{display:block;width:100%;height:auto}
.sht span{position:absolute;left:4px;bottom:4px;background:rgba(22,19,14,.78);color:#fff;font-size:12px;border-radius:999px;padding:0 7px}
.sht input{position:absolute;right:4px;top:4px;width:22px;height:22px;accent-color:#8A6511}
.shr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media print{.shm{display:none!important}}
.upbox{display:flex;gap:12px 18px;flex-wrap:wrap;align-items:center;justify-content:space-between;border:2px dashed #BDB7A7;border-radius:12px;padding:14px 16px;background:#FAFAF8;margin-bottom:12px}
.upbox.over{border-color:var(--acc);background:var(--acc-bg)}
.del{border-color:#B3261E;color:#8A1C14}
.upbox strong{font:700 17px "Bricolage Grotesque",sans-serif}
.guia{margin:10px 0 6px;border:1px solid var(--acc-line);background:var(--acc-bg);border-radius:8px;padding:8px 12px}
.guia summary{cursor:pointer;font-weight:700;color:var(--acc-text)}
.guia ul{margin:8px 0 2px;padding-left:18px}.guia li{margin:5px 0;line-height:1.4}
.guia .aviso{margin:8px 0 2px;font-size:.92em}
</style>
</head>

/* ---------- leitura do PDF ---------- */
function toCells(line){
  const raw=line.items.sort((a,b)=>a.x-b.x),its=[];
  for(const it of raw){ // texto sobreposto (escondido sob o título): fica o menos repetido na página
    const L=its[its.length-1];
    if(L){const ov=Math.min(L.x+L.w,it.x+it.w)-Math.max(L.x,it.x);if(ov>.5*Math.min(L.w,it.w)){if(it.f<L.f||(it.f===L.f&&it.k>L.k))its[its.length-1]=it;continue;}}
    its.push(it);
  }
  const cells=[];let cur=null;
  for(const it of its){
    const gap=cur?it.x-cur.x1:0,thr=Math.max(3.5,it.h*1.1);
    if(cur&&gap<=thr){cur.t+=(gap>.8?' ':'')+it.s;cur.x1=Math.max(cur.x1,it.x+it.w);cur.y1=Math.max(cur.y1,it.y+it.h);cur.y0=Math.min(cur.y0,it.y);cur.k0=Math.min(cur.k0,it.k);cur.k1=Math.max(cur.k1,it.k);}
    else{cur={t:it.s,x0:it.x,x1:it.x+it.w,y0:it.y,y1:it.y+it.h,k0:it.k,k1:it.k};cells.push(cur);}
  }
  cells.forEach(c=>c.t=c.t.replace(/\s+/g,' ').trim());
  for(let i=0;i<cells.length-1;i++)if(cells[i].t==='R$'){cells[i].t='R$ '+cells[i+1].t;cells[i].x1=cells[i+1].x1;cells[i].k1=Math.max(cells[i].k1,cells[i+1].k1);cells[i].k0=Math.min(cells[i].k0,cells[i+1].k0);cells.splice(i+1,1);}
  return cells.filter(c=>c.t);
}
function attachLinks(cells,anns){
  for(const c of cells){
    const cx=(c.x0+c.x1)/2,cy=(c.y0+c.y1)/2;let best=null,ba=1e12;
    for(const a of anns){
      const[x0,y0,x1,y1]=a.rect,rx=(x0+x1)/2,ry=(y0+y1)/2;
      const in1=cx>=x0-2&&cx<=x1+2&&cy>=y0-2&&cy<=y1+2;
      const in2=rx>=c.x0-2&&rx<=c.x1+2&&ry>=c.y0-3&&ry<=c.y1+3;
      if(in1||in2){const ar=(x1-x0)*(y1-y0);if(ar<ba){ba=ar;best=a;}}
    }
    if(best){c.url=best.url;best.used=true;}
  }
}
async function parsePage(page){
  const tc=await page.getTextContent();
  const items=tc.items.map((i,k)=>({i,k})).filter(o=>o.i.str&&o.i.str.trim()).map(({i,k})=>({k,s:i.str.replace(/\s+/g,' '),x:i.transform[4],y:i.transform[5],w:i.width,h:Math.abs(i.height)||6}));
  const cnt={};items.forEach(i=>{cnt[i.s]=(cnt[i.s]||0)+1;});items.forEach(i=>{i.f=cnt[i.s];});
  items.sort((a,b)=>b.y-a.y||a.x-b.x);
  const lines=[];
  for(const it of items){const L=lines[lines.length-1];if(L&&Math.abs(L.y-it.y)<Math.max(1.5,it.h*.45))L.items.push(it);else lines.push({y:it.y,items:[it]});}
  const raw=await page.getAnnotations();
  const anns=raw.filter(a=>a.subtype==='Link'&&(a.url||a.unsafeUrl)).map(a=>{const r=a.rect;return{url:safeUrl(a.url||a.unsafeUrl),rect:[Math.min(r[0],r[2]),Math.min(r[1],r[3]),Math.max(r[0],r[2]),Math.max(r[1],r[3])],used:false};}).filter(a=>a.url);
  anns.forEach(a=>{const[x0,y0,x1,y1]=a.rect;a.label=items.filter(i=>{const cx=i.x+i.w/2,cy=i.y+i.h/2;return cx>=x0-2&&cx<=x1+2&&cy>=y0-3&&cy<=y1+3;}).sort((p,q)=>q.y-p.y||p.x-q.x).map(i=>i.s.trim()).join(' ').replace(/\s+/g,' ').trim();});
  const blocks=[];let cur=null,sec=null;let text='';
  for(const L of lines){
    const cells=toCells(L);if(!cells.length)continue;
    attachLinks(cells,anns);
    text+=cells.map(c=>c.t).join(' ')+'\n';
    const one=cells.length===1;
    if(one&&!cells[0].url&&/^(ZONA|REGI[ÃA]O|LAN[ÇC]AMENTOS)\b/i.test(cells[0].t)){blocks.push({type:'title',text:cells[0].t});cur=null;continue;}
    if(!one&&!cur){cur={type:'table',rows:[]};blocks.push(cur);}
    if(cur)cur.rows.push({cells,span:one&&(cells[0].t.length>45||cells[0].t[0]==='*')});
    else blocks.push({type:'note',cell:cells[0]});
  }
  return{blocks,anns,text};
}

/* ---------- renderização ---------- */
function columnsOf(rows){
  const iv=[];rows.forEach(r=>{if(!r.span)r.cells.forEach(c=>iv.push([c.x0,c.x1]));});
  iv.sort((a,b)=>a[0]-b[0]);const cols=[];
  for(const[a,b]of iv){const L=cols[cols.length-1];if(L&&a<L[1]-1)L[1]=Math.max(L[1],b);else cols.push([a,b]);}
  return cols;
}
function colIdx(c,cols){const cx=(c.x0+c.x1)/2;let k=cols.findIndex(([a,b])=>cx>=a-1&&cx<=b+1);if(k>=0)return k;let d=1e9;cols.forEach(([a,b],i)=>{const m=Math.abs(cx-(a+b)/2);if(m<d){d=m;k=i;}});return k;}
const PRICE_RE=/(\d{1,3}(?:\.\d{3})+,\d{2})/;
function analyze(rows){
  const cols=columnsOf(rows),n=cols.length;const head=Array(n).fill('');let prevHd=false;
  const info=rows.map(r=>{
    if(r.span){prevHd=false;return{r,span:true};}
    const slots=Array.from({length:n},()=>[]);
    r.cells.forEach(c=>slots[colIdx(c,cols)].push(c));
    const isHd=r.cells.some(c=>/^empreendimento$/i.test(c.t))||(prevHd&&!r.cells.some(c=>/\d/.test(c.t))&&r.cells.every(c=>c.t===c.t.toUpperCase())&&colIdx(r.cells[0],cols)>0);
    if(isHd){slots.forEach((s,i)=>{const t=s.map(c=>c.t).join(' ');if(t)head[i]+=(head[i]?' ':'')+t;});prevHd=true;return{r,slots,isHd};}
    prevHd=false;
    let tab=null,dsc=null,addr='';const parts=[],plain=[];
    slots.forEach((s,i)=>s.forEach(c=>{
      const h=head[i].toUpperCase();
      const m=c.t.match(PRICE_RE);
      if(m){
        if(/M2|M²/.test(h))return;
        const v=parseFloat(m[1].replace(/\./g,'').replace(',','.'));if(v<50000)return;
        if(/COM\s+DESCONTO|PROMOCIONAL/.test(h)){if(dsc==null)dsc=v;}else if(/PARTIR|TABELA/.test(h)){if(tab==null)tab=v;}else plain.push(v);
        return;
      }
      if(/ENDERE/.test(h)&&i>0&&c.t.length>5){addr+=(addr?' ':'')+c.t;return;}
      if(i===0||c.url||/%/.test(c.t)||/ENDERE|MESES|COMISS/.test(h)||/^-?R\$-?$/.test(c.t)||c.t==='-'||/^(R\.|Rua|Av\.|Al\.)\s/i.test(c.t))return;
      parts.push(/^\d$/.test(c.t)?c.t+' dorm':(/^\d+,\d{1,2}$/.test(c.t)?c.t+' m²':c.t));
    }));
    // sem cabeçalho (tabela continua na página seguinte): maior valor = tabela, menor = com desconto
    if(plain.length){plain.sort((a,b)=>b-a);if(tab==null)tab=plain[0];if(dsc==null&&plain.length>1)dsc=plain[plain.length-1];}
    const k0=Math.min(...r.cells.map(c=>c.k0));
    return{r,slots,isHd:false,tab,dsc,price:(dsc!=null?dsc:tab),desc:parts.join(' · ').slice(0,90),k0,addr};
  });
  // nomes: células da 1ª coluna, juntando linhas quebradas (índices consecutivos no PDF)
  const cand=[];
  info.forEach(i=>{if(i.span||i.isHd)return;i.slots[0].forEach(c=>cand.push({t:c.t,k0:c.k0,k1:c.k1,y:c.y0}));});
  cand.sort((a,b)=>a.k0-b.k0);
  const names=[];
  cand.forEach(c=>{const L=names[names.length-1];if(L&&c.k0-L.k1<=1&&L.y-c.y<14){L.t+=' '+c.t;L.k1=c.k1;L.y=c.y;}else names.push({...c});});
  info.forEach(i=>{if(i.span||i.isHd)return;let nm='';for(const x of names){if(x.k0<=i.k0)nm=x.t;else break;}i.name=nm;});
  return{cols,n,info};
}
function renderTable(b,doc,zona){

/* ---- tabela de financiamento da Caixa (não é tabela de imóveis) ---- */
function isCaixaDoc(pages){
  try{return pages.some(pg=>pg.blocks.some(b=>(b.type==='note'&&b.cell&&/SIMULA[ÇC][ÃA]O\s+CAIXA/i.test(b.cell.t))||(b.type==='table'&&b.rows.some(r=>/Tx\.?\s*Juros/i.test(r.cells.map(c=>c.t).join(' '))))));}catch(e){return false;}
}
const MONEY_RE=/R\$\s*(-|\d{1,3}(?:\.\d{3})*,\d{2})/g;
function brlNum(t){return t==='-'?0:parseFloat(String(t).replace(/\./g,'').replace(',','.'));}
function extractCaixa(pages){
  const out={ref:'',mcmv:[],sbpe:[],notes:[]};let notas=false,buf=[];
  pages.forEach(pg=>pg.blocks.forEach(b=>{
    if(b.type!=='table')return;
    b.rows.forEach(r=>{
      const t=r.cells.map(c=>c.t).join(' ');
      const ref=t.match(/Atualizado:\s*([A-Za-zçÇ]+\/\d{4})/i);if(ref&&!out.ref)out.ref=ref[1];
      if(/^\s*I\.\s/.test(t))notas=true;
      if(notas){buf.push(t);return;}
      const tx=t.match(/(\d{1,2},\d{2})\s*%/);if(!tx)return;
      const m=[...t.matchAll(MONEY_RE)].map(x=>brlNum(x[1]));
      if(m.length<4)return;
      const taxa=brlNum(tx[1]);
      if(taxa>=11&&m.length>=5)out.sbpe.push({renda:m[0],taxa,price:m[1],pPrice:m[2],sac:m[3],pSac:m[4]});
      else out.mcmv.push({renda:m[0],taxa,c:m[1],s:m[2],parcela:m[3],subSem:m[4]||0,subCom:m[5]||0});
    });
  }));
  out.notes=buf.join(' ').split(/\s(?=(?:I{1,3}|IV|V)\.\s)/).map(x=>x.trim()).filter(Boolean);
  return out;
}
function caixaData(){
  const list=docs.filter(d=>isCaixaDoc(d.pages)).sort((a,b)=>(b.added||0)-(a.added||0));
  for(const d of list){if(!d.cx)d.cx=extractCaixa(d.pages);if(d.cx.mcmv.length)return d.cx;}
  return null;
}
/* ---- tabelão "oportunidades" (zona, projeto, endereço, tipologia, valores, renda mínima, entrega) ---- */
function parsePrecos(txt){
  const out=[];const re=/(STUDIO|\d\s*DORM(?:\s*[+_]\s*OFFICE)?|DUPLEX\s*\d?D?)?\s*R\$\s*([\d.,]+)\s*(MIL)?/gi;let m;
  while((m=re.exec(txt))){
    const lab=(m[1]||'').replace(/\s+/g,' ').replace('_','+').trim().toUpperCase();let raw=m[2].replace(/[.,]+$/,''),v;
    if(m[3])v=parseFloat(raw.replace(/\./g,'').replace(',','.'))*1000;
    else if(/^\d{3}\.\d{4}$/.test(raw))v=parseInt(raw.slice(0,3))*1000;
    else if(/,\d{2}$/.test(raw))v=parseFloat(raw.replace(/\./g,'').replace(',','.'));
    else v=parseFloat(raw.replace(/\./g,''));
    if(isFinite(v)&&v>=1000)out.push({lab,v});
  }
  return out;
}
function extractOport(b){
  const rows=b.rows;let head=null;
  for(const r of rows){const t=r.cells.map(c=>c.t.toUpperCase());if(t.includes('PROJETO')&&t.includes('VALORES')){head=r.cells;break;}}
  if(!head)return null;
  const cc=c=>(c.x0+c.x1)/2,hd={};
  head.forEach(c=>{hd[c.t.toUpperCase()]=cc(c);});
  const cols=['ZONA','PROJETO','ENDEREÇO','STATUS','TIPOLOGIA','M²','VALORES','RENDA MÍNIMA'].filter(k=>hd[k]!=null);
  const hx=cols.map(k=>[k,hd[k]]);
  const entX=(rows.flatMap(r=>r.cells).find(c=>/^ENTREGA$/i.test(c.t))||{}).x0;
  const colOf=c=>{const x=cc(c);if(entX&&Math.abs(c.x0-entX)<30&&/^[a-zç]{3}\/\d{2}$/i.test(c.t))return'ENTREGA';let best=null,d=1e9;hx.forEach(([k,h])=>{const dd=Math.abs(x-h);if(dd<d){d=dd;best=k;}});return best;};
  const anchors=rows.filter(r=>r.cells.some(c=>/^ZONA\s/i.test(c.t)&&c.x0<head[0].x0+25));
  if(!anchors.length)return null;
  const ys=anchors.map(r=>r.cells[0].y0);
  const units=[];
  anchors.forEach((a,i)=>{
    const y=ys[i],hi=i>0?(ys[i-1]+y)/2:y+10,lo=i<anchors.length-1?(y+ys[i+1])/2:-1e9;
    const band=rows.filter(r=>{const yy=r.cells[0].y0;return yy<=hi&&yy>lo&&r!==undefined;});
    const g={};
    band.forEach(r=>r.cells.forEach(c=>{const k=colOf(c);if(!k)return;(g[k]=g[k]||[]).push(c);}));
    const txt=k=>(g[k]||[]).sort((p,q)=>q.y0-p.y0||p.x0-q.x0).map(c=>c.t).join(' ').replace(/\s+/g,' ').trim();
    const proj=txt('PROJETO');if(!proj)return;
    const tip=txt('TIPOLOGIA'),m2=txt('M²'),val=txt('VALORES'),ren=txt('RENDA MÍNIMA'),ent=txt('ENTREGA'),zona=txt('ZONA'),end=txt('ENDEREÇO');
    let pr=parsePrecos(val);if(!pr.length)return;
    const rn=parsePrecos(ren.replace(/R\$\s*(\d{4})\b/g,'R$ $1,00')).map(x=>x.v);
    const partes=tip.split(/\s+e\s+/i).map(x=>x.trim()).filter(Boolean);
    pr.forEach((p,j)=>{
      let rotulo=p.lab||(pr.length>1&&partes.length===pr.length?partes[j]:'');
      let rmin=rn.length===pr.length?rn[j]:(rn.length?Math.min(...rn):null);
      const ay=(ent.match(/\/(\d{2})$/)||[])[1];const susp=ay&&(2000+(+ay))<new Date().getFullYear();
      const pedacos=[rotulo||tip,m2,ent?('entrega '+ent+(susp?' (data estranha: confira)':'')):'',rmin?('renda mín. R$ '+rmin.toLocaleString('pt-BR')):''].filter(Boolean);
      units.push({nome:proj,desc:pedacos.join(' · ').slice(0,110),tab:p.v,dsc:null,zona,addr:end,rendaMin:rmin||null,entrega:ent});
    });
  });
  return units.length?units:null;
}
function extractUnits(pages){
  if(isCaixaDoc(pages))return[];
  for(const pg of pages)for(const b of pg.blocks){if(b.type==='table'){const o=extractOport(b);if(o)return o;}}
  const out=[];let zona='';
  pages.forEach(pg=>pg.blocks.forEach(b=>{
    if(b.type==='title'){zona=b.text;return;}
    if(b.type!=='table')return;
    b.an=b.an||analyze(b.rows);
    b.an.info.forEach(i=>{if(i.price!=null)out.push({nome:i.name,desc:i.desc,tab:i.tab,dsc:i.dsc,zona,addr:i.addr});});
  }));
  // linha cujo "nome" é só um valor em reais (ex.: R$ 1.500,00) é renda de tabela de financiamento, não imóvel
  return out.filter(u=>!/^R\$\s*[\d.]+(?:,\d{1,2})?$/i.test(String(u.nome||'').trim()));
}

function cleanPages(pages){return pages.map(p=>({blocks:p.blocks.map(b=>b.type==='table'?{type:'table',rows:b.rows}:b),anns:p.anns.map(a=>({url:a.url,rect:a.rect,label:a.label}))}));}
function record(d){return{id:d.id,kind:'tabelao',key:d.brand.key,emp:d.emp||'',fileName:d.fileName,added:d.added,ref:d.ref,pages:cleanPages(d.pages),bytes:d.bytes||null};}
function bookRecord(b){return{id:b.id,kind:'ebook',key:b.brand.key,emp:b.emp||'',fileName:b.fileName,added:b.added,bytes:b.bytes||null};}
function hydrate(r){
  const d={id:r.id,fileName:r.fileName,added:r.added||Date.now(),ref:r.ref||'',pages:r.pages,bytes:r.bytes||null,view:'tabela',emp:r.emp||'',brand:brandOf(r.key)};
  try{d.units=extractUnits(d.pages);}catch(e){console.error(e);d.units=[];}
  return d;
}
function hydrateBook(r){return{id:r.id,kind:'ebook',fileName:r.fileName,added:r.added||Date.now(),emp:r.emp||'',bytes:r.bytes||null,brand:brandOf(r.key)};}

function brandOf(key){const p=loadProfiles()[key]||{};const k=String(key||'').toLowerCase().replace(/[^a-z0-9]/g,'');return{key,nome:p.nome||cap(key||''),logo:p.logo||LOGO_PADRAO[k]||null};}
function ensureBrand(key,nome){const p=loadProfiles();p[key]=Object.assign(p[key]||{},{pasta:true});if(nome&&!p[key].nome)p[key].nome=nome;saveProfiles(p);}
function setBrandName(key,nome){docs.concat(books).forEach(x=>{if(x.brand.key===key)x.brand.nome=nome;});const p=loadProfiles();p[key]=Object.assign(p[key]||{},{nome});saveProfiles(p);}
function setBrandLogo(key,logo){docs.concat(books).forEach(x=>{if(x.brand.key===key)x.brand.logo=logo;});const p=loadProfiles();p[key]=p[key]||{};if(logo)p[key].logo=logo;else delete p[key].logo;saveProfiles(p);}
function brandKeys(){const s=new Set(),P=loadProfiles();Object.keys(P).forEach(k=>{if(P[k]&&P[k].pasta)s.add(k);});docs.concat(books).forEach(x=>s.add(x.brand.key));return[...s];}
function empsOf(key){const P=loadProfiles()[key]||{},s=new Set(P.emps||[]);docs.concat(books).forEach(x=>{if(x.brand.key===key&&x.emp)s.add(x.emp);});return[...s].sort((a,b)=>a.localeCompare(b,'pt-BR'));}
function addEmp(key,nome){
  nome=(nome||'').trim();if(!nome)return null;
  const ex=empsOf(key).find(e=>e.toLowerCase()===nome.toLowerCase());if(ex)return ex;
  const p=loadProfiles();p[key]=Object.assign(p[key]||{},{pasta:true});p[key].emps=(p[key].emps||[]).concat(nome);saveProfiles(p);return nome;
}
function guessEmp(key,fileName){const f=norm(fileName);let best='';empsOf(key).forEach(e=>{if(norm(e).length>=3&&f.includes(norm(e))&&e.length>best.length)best=e;});return best;}
async function persistItem(x){try{await dbPut(x.kind==='ebook'?bookRecord(x):record(x));}catch(e){console.error(e);persistOK=false;}}
function allUnits(){
  const seen=new Set(),out=[];
  docs.slice().sort((a,b)=>(b.emp?1:0)-(a.emp?1:0)).forEach(d=>(d.units||[]).forEach(u=>{
    const k=[d.brand.key,u.nome,u.desc,u.tab,u.dsc].join('|');if(seen.has(k))return;seen.add(k);
    out.push({d,u,preco:u.dsc!=null?u.dsc:u.tab});
  }));
  return out;
}
function curCtx(){
  if(view==='con'&&conKey)return{key:conKey,emp:empTab};
  if(view==='reader'){const d=docs.find(x=>x.id===openId);if(d)return{key:d.brand.key,emp:d.emp||''};}
  return null;
}
async function ensurePdfjs(){if(!window.pdfjsLib)return false;await ready;return true;}
async function getPdf(doc){
  if(doc.pdf)return doc.pdf;
  if(!doc.bytes)throw new Error('semPdf');
  if(!(await ensurePdfjs()))throw new Error('semLeitor');
  doc.pdf=await pdfjsLib.getDocument({data:new Uint8Array(doc.bytes.slice(0))}).promise;
  return doc.pdf;
}

/* ---------- páginas originais com links (usa o PDF guardado) ---------- */
async function renderOriginal(doc,host){
  host.append(el('div',{class:'empty',text:'Carregando páginas…'}));
  try{
    const pdf=await getPdf(doc);
    const frag=document.createDocumentFragment();
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p),vp=page.getViewport({scale:2});
      const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      const w=el('div',{class:'pg'});w.append(cv);
      (doc.pages[p-1].anns||[]).forEach(a=>{
        const[x1,y1,x2,y2]=vp.convertToViewportRectangle(a.rect);
        const l=Math.min(x1,x2),t=Math.min(y1,y2),wd=Math.abs(x2-x1),ht=Math.abs(y2-y1);
        const o=linkEl(a.url,'','ov');o.title=(a.label?a.label+' — ':'')+a.url;o.setAttribute('aria-label',a.label||a.url);
        o.style.cssText=`left:${l/vp.width*100}%;top:${t/vp.height*100}%;width:${wd/vp.width*100}%;height:${ht/vp.height*100}%`;
        w.append(o);
      });
      frag.append(w);
    }
    host.textContent='';host.append(frag);
  }catch(e){
    host.textContent='';
    const msg=e&&e.message==='semPdf'?'Este tabelão foi salvo sem o PDF original. A aba Tabela e a aba Todos os links continuam funcionando.':'Não consegui abrir o PDF original. Ele precisa de internet para carregar o leitor. A aba Tabela funciona sem internet.';
    host.append(el('div',{class:'empty',text:msg}));
  }
}

/* ---------- subir e salvar ---------- */
async function loadFile(file,ctx){
  setStatus('Lendo '+file.name+'…');
  try{
    if(!(await ensurePdfjs())){setStatus('Não consegui carregar o leitor de PDF. Confira a internet e tente de novo.',true);return false;}
    const bytes=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(bytes.slice(0))}).promise;
    const pages=[];let all='';
    for(let p=1;p<=pdf.numPages;p++){const pg=await parsePage(await pdf.getPage(p));pages.push(pg);all+=pg.text+'\n';}
    const key=ctx&&ctx.key?ctx.key:detect(file.name,all);
    const emp=ctx&&ctx.key?(ctx.emp||''):guessEmp(key,file.name);
    ensureBrand(key,cap(key));
    const m=all.match(/DATA\s*REF\.?:?\s*(\d{2}\/\d{2}\/\d{4})/i);
    const d={id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),fileName:file.name,added:Date.now(),ref:m?m[1]:'',pages,bytes,pdf,view:'tabela',emp,brand:brandOf(key)};
    d.units=extractUnits(d.pages);
    const old=docs.findIndex(x=>x.fileName===file.name&&x.brand.key===key&&(x.emp||'')===emp);let replaced=false;
    if(old>=0){const o=docs[old];docs.splice(old,1);try{await dbDel(o.id);}catch(e){}addRemoved(o.id);replaced=true;}
    docs.push(d);
    let saved=true;
    try{await dbPut(record(d));}catch(e){console.error(e);saved=false;persistOK=false;}
    const onde=d.brand.nome+' › '+(emp||'Construtora mãe');
    let msg='Tabelão '+(replaced?'atualizado':'adicionado')+' em '+onde+(saved?' e salvo neste navegador.':'. Este navegador não deixou salvar: use "Baixar página com os tabelões dentro".');
    if(isCaixaDoc(d.pages))msg+=' Reconheci como TABELA DE FINANCIAMENTO DA CAIXA (renda × valor financiado): ela não lista imóveis. Veja os valores dela na aba Simulador.';
    else if(!d.units.length)msg+=' Não achei preços neste PDF. A aba Tabela mostra o que foi lido.';
    setStatus(msg,!saved);
    return{key,emp};
  }catch(e){console.error(e);setStatus('Não consegui ler "'+file.name+'". Confira se é um PDF com texto (não imagem escaneada).',true);return false;}
}
async function loadBook(file,ctx){
  try{
    const bytes=await file.arrayBuffer();
    const key=ctx.key,emp=ctx.emp||'';
    ensureBrand(key,cap(key));
    const old=books.findIndex(x=>x.fileName===file.name&&x.brand.key===key&&(x.emp||'')===emp);let replaced=false;
    if(old>=0){const o=books[old];books.splice(old,1);try{await dbDel(o.id);}catch(e){}addRemoved(o.id);replaced=true;}
    const b={id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind:'ebook',fileName:file.name,added:Date.now(),emp,bytes,brand:brandOf(key)};
    books.push(b);
    let saved=true;
    try{await dbPut(bookRecord(b));}catch(e){console.error(e);saved=false;persistOK=false;}
    setStatus('E-book '+(replaced?'atualizado':'adicionado')+' em '+b.brand.nome+' › '+(emp||'Construtora mãe')+(saved?' e salvo neste navegador.':'. Este navegador não deixou salvar: use "Baixar página com os tabelões dentro".'),!saved);
    return true;
  }catch(e){console.error(e);setStatus('Não consegui ler "'+file.name+'".',true);return false;}
}
const isPdf=f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name);
async function loadMany(files){
  const ctx=curCtx();let last=null;
  for(const f of files)if(isPdf(f)){const r=await loadFile(f,ctx);if(r)last=r;}
  if(last){conKey=last.key;empTab=last.emp;go('con');}
}
async function loadBooks(files){
  const ctx=curCtx();if(!ctx){setStatus('Abra uma construtora para subir o e-book.',true);return;}
  let any=false;
  for(const f of files)if(isPdf(f)){if(await loadBook(f,ctx))any=true;}
  if(any){conKey=ctx.key;empTab=ctx.emp||'';go('con');}
}
async function removeDoc(d){
  try{await dbDel(d.id);}catch(e){}
  addRemoved(d.id);
  const i=docs.indexOf(d);if(i>=0)docs.splice(i,1);
  setStatus('Tabelão excluído.');
  go('con');
}
async function removeBook(b){
  try{await dbDel(b.id);}catch(e){}
  addRemoved(b.id);
  const i=books.indexOf(b);if(i>=0)books.splice(i,1);
  setStatus('Book excluído.');
  go('con');
}
async function renameEmp(key,old,nv){
  nv=(nv||'').trim();
  if(!nv||nv===old){render();return;}
  if(empsOf(key).some(e=>e!==old&&e.toLowerCase()===nv.toLowerCase())){setStatus('Já existe um empreendimento com esse nome.',true);render();return;}
  const p=loadProfiles();p[key]=p[key]||{};p[key].emps=(p[key].emps||[]).filter(e=>e!==old).concat(nv);saveProfiles(p);
  for(const x of docs.concat(books))if(x.brand.key===key&&(x.emp||'')===old){x.emp=nv;await persistItem(x);}
  empTab=nv;setStatus('Empreendimento renomeado para "'+nv+'".');render();
}
async function removeEmp(key,emp){

function parsePages(t){

}

const ASSINATURA='FCOSTA Corretor e Avaliador de Imóveis · CRECI-SP 294791-F · CNAI 52708';
const brl=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0=v=>'R$ '+Math.round(isFinite(v)?v:0).toLocaleString('pt-BR');
const pct=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const clamp=(x,a,b)=>Math.min(Math.max(x,a),b);

function defRules(){return{
  // Base: Portaria MCID nº 333/2026 (renda até R$ 13 mil; tetos 275/400/600 mil). Taxas e subsídio = referência editável.
  mcmv:[
    {nome:'Faixa 1',ate:3200,teto:275000,sub:55000,subFim:55000,tmin:4.25,tmax:4.75,nao:0.5},
    {nome:'Faixa 2',ate:5000,teto:275000,sub:30000,subFim:0,tmin:5.0,tmax:6.5,nao:0.5},
    {nome:'Faixa 3',ate:9600,teto:400000,sub:0,subFim:0,tmin:7.66,tmax:8.16,nao:0.5},
    {nome:'Faixa 4',ate:13000,teto:600000,sub:0,subFim:0,tmin:10,tmax:10,nao:0.5}],
  sbpe:[{cotaAte:50,taxa:10.49},{cotaAte:70,taxa:10.99},{cotaAte:80,taxa:11.49},{cotaAte:90,taxa:11.99}],
  subPct:20,extra:0,cotaMax:80,comp:30};}
function loadRules(){try{const r=JSON.parse(localStorage.getItem('tabelao_regras_v2')||'null');if(r&&r.mcmv&&r.sbpe)return Object.assign(defRules(),r);}catch(e){}return defRules();}
function saveRules(){try{localStorage.setItem('tabelao_regras_v2',JSON.stringify(rules));}catch(e){}}
let rules=loadRules();
const cli=Object.assign({nome:'',renda:5000,entrada:30000,anos:30,sis:'PRICE',cot:true,valor:300000,unit:null,pv:'dsc',soCabem:true},(()=>{try{return JSON.parse(localStorage.getItem('fcosta_cliente')||'{}')||{};}catch(e){return{};}})());
function saveCli(){try{localStorage.setItem('fcosta_cliente',JSON.stringify(cli));}catch(e){}}

function amort(L,taxa,n,sis){
  const i=Math.pow(1+taxa/100,1/12)-1;if(L<=0)return{p1:0,pn:0,total:0};
  if(sis==='PRICE'){const p=i===0?L/n:L*i/(1-Math.pow(1+i,-n));return{p1:p,pn:p,total:p*n};}
  const a=L/n;return{p1:a+L*i,pn:a+(L-a*(n-1))*i,total:L+i*L*(n+1)/2};
}
function maxLoan(P,taxa,n,sis){
  if(P<=0)return 0;const i=Math.pow(1+taxa/100,1/12)-1;
  if(sis==='PRICE')return i===0?P*n:P*(1-Math.pow(1+i,-n))/i;
  return P/(1/n+i);
}
function taxaSbpe(cota){for(const f of rules.sbpe)if(cota<=f.cotaAte)return f.taxa;return rules.sbpe[rules.sbpe.length-1].taxa;}
function simular(p){
  const R=rules,n=clamp(Math.round(p.anos)||30,5,35)*12,ent=clamp(p.entrada,0,p.valor),ex=R.extra,out={n,ent};
  const f=R.mcmv.find(x=>p.renda<=x.ate);
  const maxRenda=Math.max(...R.mcmv.map(x=>x.ate));
  if(!(p.renda>0))out.m={ok:false,motivo:'Informe a renda familiar para enquadrar no MCMV.'};
  else if(!f)out.m={ok:false,motivo:'Renda acima do limite do MCMV ('+brl0(maxRenda)+'). Use o SBPE.'};
  else if(p.valor>f.teto)out.m={ok:false,f,motivo:'Imóvel acima do teto da '+f.nome+' ('+brl0(f.teto)+'). Use o SBPE.'};
  else{
    const idx=R.mcmv.indexOf(f),de=idx>0?R.mcmv[idx-1].ate:0;
    const t=clamp((p.renda-de)/(f.ate-de),0,1);
    const taxa=f.tmin+(f.tmax-f.tmin)*t+(p.cot?0:f.nao);
    const sub=Math.min(f.sub+(f.subFim-f.sub)*t,p.valor*R.subPct/100);
    const fin=Math.max(p.valor-ent-sub,0);const a=amort(fin,taxa,n,p.sis);
    out.m={ok:true,f,taxa,sub,fin,cota:fin/p.valor*100,p1:a.p1+ex,pn:a.pn+ex,total:a.total+ex*n+ent,comp:(a.p1+ex)/p.renda*100};
  }
  const fin=Math.max(p.valor-ent,0),cota=p.valor>0?fin/p.valor*100:0,tx=taxaSbpe(cota),a=amort(fin,tx,n,p.sis);
  out.s={ok:true,taxa:tx,fin,cota,p1:a.p1+ex,pn:a.pn+ex,total:a.total+ex*n+ent,comp:p.renda>0?(a.p1+ex)/p.renda*100:0};
  // capacidade (parcela máxima = % da renda)
  const pmax=Math.max(p.renda*R.comp/100-ex,0);
  const cap={pmax};
  if(out.m&&out.m.f){const mm=out.m.f,tm=out.m.ok?out.m.taxa:mm.tmin+(p.cot?0:mm.nao);const sub=out.m.ok?out.m.sub:Math.min(mm.sub,p.valor*R.subPct/100);const L=maxLoan(pmax,tm,n,p.sis);cap.m={L,imovel:Math.min(L+ent+sub,mm.teto),taxa:tm,teto:mm.teto};}
  const ts=taxaSbpe(80),Ls=maxLoan(pmax,ts,n,p.sis);cap.s={L:Ls,imovel:Ls+ent,taxa:ts};
  out.cap=cap;
  const mOk=out.m.ok&&out.m.comp<=R.comp,sOk=out.s.comp<=R.comp;
  out.best=mOk?'MCMV':(sOk?'SBPE':null);
  return out;
}

function resumo(p,r){

  L.push('*Simulação de financiamento*');
  L.push('*'+nm+'*'+(cli.unit&&cli.unit.desc?' ('+cli.unit.desc+')':''));
  if(cli.nome)L.push('Cliente: '+cli.nome);
  L.push('Valor do imóvel: '+brl(p.valor));
  L.push('Entrada: '+brl(r.ent)+' | Prazo: '+(r.n/12)+' anos | '+(p.sis==='PRICE'?'PRICE (parcela fixa)':'SAC (parcela decrescente)'));
  L.push('Renda familiar: '+brl(p.renda));
  L.push('');
  if(r.m.ok){L.push('*MCMV – '+r.m.f.nome+'* ('+pct(r.m.taxa)+' a.a.)');L.push('Subsídio estimado: '+brl(r.m.sub));L.push((p.sis==='SAC'?'1ª parcela: ':'Parcela: ')+'*'+brl(r.m.p1)+'*'+(p.sis==='SAC'?' (última: '+brl(r.m.pn)+')':''));}
  else L.push('MCMV: não se aplica ('+r.m.motivo+')');
  L.push('');
  L.push('*SBPE* ('+pct(r.s.taxa)+' a.a.)');
  L.push((p.sis==='SAC'?'1ª parcela: ':'Parcela: ')+'*'+brl(r.s.p1)+'*'+(p.sis==='SAC'?' (última: '+brl(r.s.pn)+')':''));
  L.push('');
  L.push('_Simulação estimada, sujeita à análise de crédito e às condições vigentes do banco. Pode não incluir seguros e tarifas._');
  L.push(ASSINATURA);
  return L.join('\n');
}

function renderSim(panel){
  const wrap=el('div',{class:'panel'});wrap.innerHTML=SIM_HTML;panel.append(wrap);
  const q=id=>wrap.querySelector('#'+id);
  q('s-nome').value=cli.nome;q('s-renda').value=cli.renda||'';q('s-ent').value=cli.entrada||'';q('s-anos').value=cli.anos;q('s-cot').checked=cli.cot;q('s-valor').value=cli.valor||'';q('s-fit').checked=cli.soCabem;
  let last=null,lastP=null;

  function calc(){saveCli();
    q('s-price').className=cli.sis==='PRICE'?'on':'';q('s-sac').className=cli.sis==='SAC'?'on':'';
    const p={renda:cli.renda,valor:cli.valor,entrada:cli.entrada,anos:cli.anos,sis:cli.sis,cot:cli.cot};
    const r=simular(p);last=r;lastP=p;
    // faixa
    const f=r.m.f,fx=q('s-faixa');
    fx.textContent=f?(f.nome+' · renda até '+brl0(f.ate)+' · teto do imóvel '+brl0(f.teto)+(r.m.ok?' · taxa '+pct(r.m.taxa)+' a.a. · subsídio estimado '+brl0(r.m.sub):'')):(p.renda>0?'Renda fora das faixas do MCMV':'Informe a renda para enquadrar a faixa do MCMV');
    // imóvel selecionado
    const u=cli.unit,ub=q('s-unit'),pv=q('s-pv');
    ub.textContent=u?(u.c+' — '+u.nome+(u.desc?' ('+u.desc+')':'')):'Valor digitado manualmente. Use “Simular” nas tabelas para puxar um imóvel.';
    q('s-clear').hidden=!u;pv.textContent='';

function pedirToque(data){
  // navigator.share exige um toque recente; depois de montar um PDF grande o toque "vence". Pede um novo toque.
  return new Promise(res=>{
    const ov=el('div',{class:'shm',role:'dialog','aria-modal':'true','aria-label':'Compartilhar'});
    const bx=el('div',{class:'shb'});ov.append(bx);
    const fim=r=>{ov.remove();res(r);};
    const go=el('button',{type:'button',class:'pri',text:'Compartilhar agora'});
    const dl=el('button',{type:'button',text:'Só baixar o arquivo'});
    const cx=el('button',{type:'button',text:'Cancelar'});
    go.onclick=()=>{navigator.share(data).then(()=>fim('ok')).catch(e=>fim(e&&e.name==='AbortError'?'cancel':'download'));};
    dl.onclick=()=>fim('download');cx.onclick=()=>fim('cancel');
    bx.append(el('h2',{text:'PDF pronto'}),el('p',{class:'small',text:'Toque para abrir o compartilhamento (WhatsApp, e-mail…).'}),el('div',{class:'shr'},go,dl,cx));
    document.body.append(ov);
  });
}
async function shareBook(b,titulo,onMsg,sel){
  if(!b||!b.bytes)return'Este book foi salvo sem o arquivo. Suba o PDF de novo.';
  let blob=null,comDados=true;
  try{blob=await bookComDados(b,onMsg,sel);}catch(e){console.error(e);blob=null;}
  if(!blob){comDados=false;if(sel&&sel.length)return'Não consegui montar o PDF só com as páginas escolhidas (precisa de internet). Tente de novo com internet para não enviar o tabelão inteiro.';blob=new Blob([b.bytes],{type:'application/pdf'});}
  const base=fixMoji(b.fileName||'book.pdf').replace(/\.pdf$/i,'').replace(/[\\\/:*?"<>|]+/g,'-');
  const nome=base+(comDados?' - FCOSTA':'')+'.pdf';
  const file=new File([blob],nome,{type:'application/pdf'});
  const aviso=comDados?'':' (sem os seus dados: precisei da internet para montar o PDF e não consegui)';
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:titulo||nome,text:titulo||nome});return'Book compartilhado'+(comDados?' com a sua logo e o Fale comigo.':'.'+aviso);}
    catch(e){if(e&&e.name==='AbortError')return'Compartilhamento cancelado.';
      const r=await pedirToque({files:[file],title:titulo||nome,text:titulo||nome});
      if(r==='ok')return'Book compartilhado'+(comDados?' com a sua logo e o Fale comigo.':'.'+aviso);
      if(r==='cancel')return'Compartilhamento cancelado.';}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  return'Book baixado ('+(blob.size/1048576).toFixed(1).replace('.',',')+' MB)'+(comDados?' com a sua logo e o Fale comigo.':'.'+aviso)+' É só anexar no WhatsApp.';
}
function upBox(id,titulo,desc,btn,fn){
  const b=el('div',{class:'upbox'},el('div',{},el('strong',{text:titulo}),el('p',{class:'small',text:desc})),el('label',{class:'btn pri',for:id,text:btn}));
  ['dragenter','dragover'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();b.classList.add('over');}));

}

  let recs=[];
  try{recs=await dbAll();}catch(e){persistOK=false;recs=[];}

  }
  recs.sort((a,b)=>(a.added||0)-(b.added||0));
  recs.forEach(r=>{try{if(r.kind==='ebook')books.push(hydrateBook(r));else docs.push(hydrate(r));}catch(e){console.error(e);}});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  render();
}
init();

</script>
</body>
</html>
