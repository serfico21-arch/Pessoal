<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bloco de Notas — Sérgio Costa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --verde: #10b981;
  --verde-claro: #059669;
  --verde-escuro: #047857;
  --escuro: #0f2922;
  --escuro2: #f4f8f6;
  --branco: #ffffff;
  --card-bg: #ffffff;
  --card-border: rgba(16,185,129,0.18);
  --card-hover-border: rgba(16,185,129,0.45);
  --text-muted: #6b7c76;
  --divider: rgba(16,185,129,0.16);
  --danger: #ef4444;
}
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; background: var(--escuro2); min-height: 100vh; color: var(--escuro); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--verde-escuro); outline-offset: 2px; border-radius: 4px; }

header {
  background: var(--branco); border-bottom: 2px solid var(--verde);
  padding: 1.4rem 2rem; display: flex; align-items: center; gap: 16px;
  position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(15,41,34,0.05);
}
.voltar {
  display: flex; align-items: center; gap: 6px; color: var(--verde-claro);
  text-decoration: none; font-size: 12.5px; font-weight: 500; flex-shrink: 0;
  border: 1px solid var(--card-border); border-radius: 20px; padding: 7px 13px;
  transition: border-color 0.15s, background 0.15s;
}
.voltar:hover { border-color: var(--card-hover-border); background: rgba(16,185,129,0.06); }
.header-info h1 { font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600; color: var(--escuro); line-height: 1.2; }
.header-info p { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

main { max-width: 720px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

.compositor {
  background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px;
  padding: 16px; margin-bottom: 2rem; box-shadow: 0 1px 3px rgba(15,41,34,0.05);
}
.compositor textarea {
  width: 100%; min-height: 84px; resize: vertical; background: transparent;
  border: none; color: var(--escuro); font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.55;
}
.compositor textarea:focus { outline: none; }
.compositor textarea::placeholder { color: var(--text-muted); }
.compositor-rodape {
  display: flex; justify-content: flex-end; align-items: center; gap: 10px;
  margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--divider);
}
.contagem { font-size: 11px; color: var(--text-muted); margin-right: auto; }
button.salvar {
  background: var(--verde); border: none; color: #fff; font-weight: 600;
  font-size: 12.5px; font-family: 'DM Sans', sans-serif; border-radius: 20px; padding: 9px 18px;
  cursor: pointer; transition: background 0.15s, transform 0.1s;
  display: inline-flex; align-items: center; gap: 6px;
}
button.salvar:hover { background: var(--verde-escuro); }
button.salvar:active { transform: scale(0.96); }

.section-label {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.11em; color: var(--text-muted);
  text-transform: uppercase; margin-bottom: 12px; padding-left: 2px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ''; flex: 1; height: 0.5px; background: var(--divider); }

.lista { display: flex; flex-direction: column; gap: 10px; }
.nota {
  background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px;
  padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start;
  animation: fadeUp 0.25s ease both; box-shadow: 0 1px 3px rgba(15,41,34,0.04);
}
.nota-corpo { flex: 1; }
.nota-texto { font-size: 13.5px; line-height: 1.6; color: var(--escuro); white-space: pre-wrap; word-break: break-word; }
.nota-data { font-size: 11px; color: var(--text-muted); margin-top: 8px; display: flex; align-items: center; gap: 5px; }
.nota-excluir {
  flex-shrink: 0; background: rgba(239,68,68,0.06); border: 1px solid var(--card-border);
  color: var(--text-muted); border-radius: 8px; width: 32px; height: 32px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.nota-excluir:hover { color: var(--danger); border-color: var(--danger); background: rgba(239,68,68,0.12); }

.vazio { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 13px; }
.vazio i { display: block; font-size: 28px; margin-bottom: 10px; color: var(--card-border); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

footer {
  text-align: center; padding: 1.75rem 1.5rem 2rem; font-size: 11.5px;
  color: var(--text-muted); border-top: 0.5px solid var(--divider);
}
footer .selo-mini {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--verde); margin: 0 8px 1px; vertical-align: middle;
}
footer strong { color: var(--verde-claro); font-weight: 600; }
</style>
</head>
<body>

<header>
  <a class="voltar" href="index.html"><i class="ti ti-arrow-left"></i>Painel</a>
  <div class="header-info">
    <h1>Bloco de Notas</h1>
    <p>Anotações rápidas, salvas neste navegador</p>
  </div>
</header>

<main>
  <div class="compositor">
    <textarea id="campo-nota" placeholder="Escreva uma anotação rápida — um lembrete, uma ideia, algo para não esquecer..." maxlength="600"></textarea>
    <div class="compositor-rodape">
      <span class="contagem" id="contagem">0 / 600</span>
      <button class="salvar" id="btn-salvar"><i class="ti ti-plus"></i>Salvar nota</button>
    </div>
  </div>

  <div class="section-label">Suas notas</div>
  <div class="lista" id="lista-notas"></div>
  <div class="vazio" id="estado-vazio" hidden>
    <i class="ti ti-notes"></i>
    Nenhuma nota ainda. Escreva algo acima para começar.
  </div>
</main>

<footer>
  <strong>FCosta</strong> · Sérgio Fernandes da Costa<span class="selo-mini"></span>CRECI-SP 294791-F · CNAI 52708
</footer>

<script>
const CHAVE = 'fcosta_notas_pessoais';
const campo = document.getElementById('campo-nota');
const contagem = document.getElementById('contagem');
const lista = document.getElementById('lista-notas');
const vazio = document.getElementById('estado-vazio');
const btnSalvar = document.getElementById('btn-salvar');

function carregar() {
  try { return JSON.parse(localStorage.getItem(CHAVE)) || []; }
  catch { return []; }
}
function salvar(notas) { localStorage.setItem(CHAVE, JSON.stringify(notas)); }

function formatarData(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) + ' às ' +
    d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function renderizar() {
  const notas = carregar();
  lista.innerHTML = '';
  vazio.hidden = notas.length > 0;
  notas.slice().reverse().forEach(nota => {
    const el = document.createElement('div');
    el.className = 'nota';
    el.innerHTML = `
      <div class="nota-corpo">
        <div class="nota-texto"></div>
        <div class="nota-data"><i class="ti ti-clock" style="font-size:11px;"></i>${formatarData(nota.data)}</div>
      </div>
      <button class="nota-excluir" title="Excluir" aria-label="Excluir nota"><i class="ti ti-trash"></i></button>
    `;
    el.querySelector('.nota-texto').textContent = nota.texto;
    el.querySelector('.nota-excluir').addEventListener('click', () => {
      if (!confirm('Excluir esta nota? Essa ação não pode ser desfeita.')) return;
      const atuais = carregar().filter(n => n.id !== nota.id);
      salvar(atuais);
      renderizar();
    });
    lista.appendChild(el);
  });
}

campo.addEventListener('input', () => {
  contagem.textContent = `${campo.value.length} / 600`;
});

function adicionarNota() {
  const texto = campo.value.trim();
  if (!texto) return;
  const notas = carregar();
  notas.push({ id: Date.now(), texto, data: new Date().toISOString() });
  salvar(notas);
  campo.value = '';
  contagem.textContent = '0 / 600';
  renderizar();
}

btnSalvar.addEventListener('click', adicionarNota);
campo.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) adicionarNota();
});

renderizar();
</script>

</body>
</html>
